  /* ========= 9 ========= */
  { id:'yirminci-yy-osmanli', ad:'20. Y\u00fczy\u0131l Osmanl\u0131 Devleti', soru:'1\u20132 soru', durum:'hazir',
    ozet:'Trablusgarp, Balkanlar, I. D\u00fcnya Sava\u015f\u0131 ve Mondros. Cephe adlar\u0131n\u0131 ezberle.',
    bloklar:[
      { t:'zaman', b:'1908\'den Sevr\'e', z:[
        { y:'1908', o:'II. Me\u015frutiyet', d:'\u0130ttihat ve Terakki bask\u0131s\u0131yla Kanun-i Esasi yeniden y\u00fcr\u00fcrl\u00fc\u011fe girdi. **Bulgaristan ba\u011f\u0131ms\u0131zl\u0131\u011f\u0131n\u0131 ilan etti, Avusturya Bosna-Hersek\'i ilhak etti, Girit Yunanistan\'a kat\u0131ld\u0131\u011f\u0131n\u0131 a\u00e7\u0131klad\u0131.**' },
        { y:'1909', o:'31 Mart Olay\u0131', d:'**Hareket Ordusu** \u0130stanbul\'a girdi, II. Abd\u00fclhamid tahttan indirildi. Mustafa Kemal orduda kurmay ba\u015fkan\u0131 olarak yer ald\u0131.' },
        { y:'1911\u201312', o:'Trablusgarp Sava\u015f\u0131', d:'\u0130talya\'ya kar\u015f\u0131. **U\u015fi Antla\u015fmas\u0131 1912**: Kuzey Afrika\'daki **son toprak** kaybedildi; Rodos ve 12 Ada ge\u00e7ici olarak \u0130talya\'da kald\u0131.' },
        { y:'1912\u201313', o:'I. Balkan Sava\u015f\u0131', d:'A\u011f\u0131r yenilgi. **Londra Antla\u015fmas\u0131 1913** \u2014 Edirne d\u00e2hil geni\u015f topraklar kaybedildi. **Arnavutluk ba\u011f\u0131ms\u0131z oldu** (Osmanl\u0131\'dan ayr\u0131lan son Balkan devleti).' },
        { y:'1913', o:'II. Balkan Sava\u015f\u0131', d:'Balkan devletleri kendi aras\u0131nda b\u00f6l\u00fc\u015femedi. **Edirne ve K\u0131rklareli geri al\u0131nd\u0131.** B\u00fckre\u015f, \u0130stanbul (Bulgaristan) ve Atina (Yunanistan) antla\u015fmalar\u0131.' },
        { y:'1914\u201318', o:'I. D\u00fcnya Sava\u015f\u0131', d:'Osmanl\u0131 **Almanya saf\u0131nda** sava\u015fa girdi. Cepheler i\u00e7in a\u015fa\u011f\u0131daki tabloya bak.' },
        { y:'30 Ekim 1918', o:'Mondros Ate\u015fkes Antla\u015fmas\u0131', d:'**7. madde**: \u0130tilaf Devletleri g\u00fcvenliklerini tehdit g\u00f6ren yerleri i\u015fgal edebilecek. **24. madde**: Alt\u0131 vilayette kar\u0131\u015f\u0131kl\u0131k \u00e7\u0131karsa i\u015fgal. Fiilen **i\u015fgalin hukuki dayana\u011f\u0131**.' },
        { y:'10 A\u011fustos 1920', o:'Sevr Antla\u015fmas\u0131', d:'Osmanl\u0131\'y\u0131 payla\u015fan antla\u015fma. **Mebusan Meclisi onaylamad\u0131\u011f\u0131 i\u00e7in hukuken y\u00fcr\u00fcrl\u00fc\u011fe girmedi**; TBMM hi\u00e7 tan\u0131mad\u0131.' }
      ]},
      { t:'tablo', b:'I. D\u00fcnya Sava\u015f\u0131 cepheleri', h:['Cephe t\u00fcr\u00fc','Cepheler'], r:[
        ['**Taarruz cepheleri**','**Kafkas** (Sar\u0131kam\u0131\u015f Harek\u00e2t\u0131 1914-15 \u2014 a\u011f\u0131r kay\u0131p) \u00b7 **Kanal** (S\u00fcvey\u015f, ba\u015far\u0131s\u0131z)'],
        ['**Savunma cepheleri**','**\u00c7anakkale 1915** (tek kesin zafer) \u00b7 **Irak** (Kut\'\u00fcl Amare 1916 \u2014 \u0130ngilizler teslim oldu) \u00b7 **Suriye-Filistin** \u00b7 **Hicaz-Yemen**'],
        ['**M\u00fcttefike yard\u0131m**','**Gali\u00e7ya \u00b7 Romanya \u00b7 Makedonya** \u2014 Osmanl\u0131 topra\u011f\u0131 d\u0131\u015f\u0131ndaki cepheler']
      ]},
      { t:'kod', b:'Haf\u0131za kodu', x:'**\u00c7anakkale\'nin \u00fc\u00e7 sonucu:** \u2460 Rusya\'ya yard\u0131m ula\u015famad\u0131 \u2192 **Rus \u0130htilali h\u0131zland\u0131** \u2461 Sava\u015f uzad\u0131 \u2462 **Mustafa Kemal \u00fcn kazand\u0131**. Bu \u00fc\u00e7l\u00fc neredeyse her y\u0131l sorulur.' },
      { t:'tuzak', i:[
        '**Trablusgarp Sava\u015f\u0131\'nda Osmanl\u0131 donanma g\u00f6nderemedi**; Mustafa Kemal ve Enver Bey gibi subaylar gizlice gidip yerel halk\u0131 \u00f6rg\u00fctledi.',
        '**I. Balkan Sava\u015f\u0131 kay\u0131p, II. Balkan Sava\u015f\u0131 kazan\u00e7t\u0131r.** Edirne II. Balkan Sava\u015f\u0131\'nda geri al\u0131nm\u0131\u015ft\u0131r.',
        '**Sevr Antla\u015fmas\u0131 hukuken y\u00fcr\u00fcrl\u00fc\u011fe girmemi\u015ftir**; Osmanl\u0131 Mebusan Meclisi da\u011f\u0131t\u0131lm\u0131\u015f oldu\u011fu i\u00e7in onaylanamam\u0131\u015ft\u0131r.',
        '**Mondros bir ate\u015fkes, Sevr bir bar\u0131\u015f antla\u015fmas\u0131d\u0131r.** \u0130kisi kar\u0131\u015ft\u0131r\u0131l\u0131r.',
        '**Kut\'\u00fcl Amare bir zaferdir** ama sava\u015f\u0131n genel seyrini de\u011fi\u015ftirmemi\u015ftir; \u00c7anakkale ile kar\u0131\u015ft\u0131rma.',
        '**Osmanl\u0131 I. D\u00fcnya Sava\u015f\u0131\'na Goeben ve Breslau gemilerinin** Karadeniz\'de Rus limanlar\u0131n\u0131 bombalamas\u0131yla fiilen girmi\u015ftir.'
      ]},
      { t:'test', s:[
        { q:'Osmanl\u0131 Devleti\'nin Kuzey Afrika\'daki son topra\u011f\u0131n\u0131 kaybetti\u011fi antla\u015fma hangisidir?',
          c:['U\u015fi Antla\u015fmas\u0131','Londra Antla\u015fmas\u0131','B\u00fckre\u015f Antla\u015fmas\u0131','Atina Antla\u015fmas\u0131'], d:0,
          a:'1912 U\u015fi Antla\u015fmas\u0131 ile Trablusgarp ve Bingazi \u0130talya\'ya b\u0131rak\u0131lm\u0131\u015f, Osmanl\u0131\'n\u0131n Kuzey Afrika\'daki varl\u0131\u011f\u0131 sona ermi\u015ftir.' },
        { q:'I. D\u00fcnya Sava\u015f\u0131\'nda Osmanl\u0131 Devleti\'nin taarruz amac\u0131yla a\u00e7t\u0131\u011f\u0131 cepheler a\u015fa\u011f\u0131dakilerden hangisinde birlikte verilmi\u015ftir?',
          c:['\u00c7anakkale \u2013 Irak','Kafkas \u2013 Kanal','Gali\u00e7ya \u2013 Romanya','Suriye \u2013 Hicaz'], d:1,
          a:'Kafkas ve Kanal cepheleri Osmanl\u0131\'n\u0131n taarruz amac\u0131yla a\u00e7t\u0131\u011f\u0131 cephelerdir. \u00c7anakkale, Irak, Suriye ve Hicaz savunma; Gali\u00e7ya ve Romanya ise m\u00fcttefike yard\u0131m cepheleridir.' },
        { q:'Mondros Ate\u015fkes Antla\u015fmas\u0131\'n\u0131n hangi maddesi i\u015fgallere hukuki zemin haz\u0131rlam\u0131\u015ft\u0131r?',
          c:['Bo\u011fazlar\u0131n a\u00e7\u0131lmas\u0131','Ordunun terhisi','G\u00fcvenli\u011fi tehdit eden yerlerin i\u015fgal edilebilmesi','Haberle\u015fmenin denetlenmesi'], d:2,
          a:'7. madde, \u0130tilaf Devletleri\'ne g\u00fcvenliklerini tehdit g\u00f6ren herhangi bir stratejik noktay\u0131 i\u015fgal etme hakk\u0131 vermi\u015f ve i\u015fgallerin dayana\u011f\u0131 olmu\u015ftur.' }
      ]}
    ]},

  /* ========= 10 ========= */
  { id:'osmanli-kultur', ad:'Osmanl\u0131 K\u00fclt\u00fcr ve Medeniyeti', soru:'1\u20134 soru', durum:'hazir',
    ozet:'Divan \u00fcyeleri, toprak sistemi ve ordu. Kavram tablosu ezberlenirse soru garanti.',
    bloklar:[
      { t:'tablo', b:'Divan-\u0131 H\u00fcmayun \u00fcyeleri', h:['\u00dcye','G\u00f6revi'], r:[
        ['**Veziriazam (Sadrazam)**','Padi\u015fah\u0131n mutlak vekili; **padi\u015fah m\u00fchr\u00fcn\u00fc** ta\u015f\u0131r. Divana ba\u015fkanl\u0131k eder.'],
        ['**Kazasker**','Adalet ve e\u011fitim i\u015fleri; kad\u0131 ve m\u00fcderris atamalar\u0131.'],
        ['**Defterdar**','**Maliye**den sorumlu.'],
        ['**Ni\u015fanc\u0131**','Padi\u015fah tu\u011fras\u0131n\u0131 \u00e7eker; **tapu-kadastro** ve yaz\u0131\u015fmalar.'],
        ['**Kaptan-\u0131 Derya**','Donanma komutan\u0131 (Divan\'a sonradan kat\u0131ld\u0131).'],
        ['**\u015eeyh\u00fclislam**','Divan **\u00fcyesi de\u011fildir**; kararlar\u0131n dine uygunlu\u011funu bildiren **fetva** makam\u0131d\u0131r.']
      ]},
      { t:'tablo', b:'Toprak ve ordu d\u00fczeni', h:['Sistem','Ayr\u0131nt\u0131'], r:[
        ['**Miri arazi**','M\u00fclkiyeti **devlete** ait topraklar; en b\u00fcy\u00fck b\u00f6l\u00fcm.'],
        ['**Dirlik**','**Has** (100.000 ak\u00e7e \u00fcst\u00fc) \u00b7 **Zeamet** (20.000-100.000) \u00b7 **T\u0131mar** (3.000-20.000 ak\u00e7e)'],
        ['**Kap\u0131kulu askerleri**','**Dev\u015firme** k\u00f6kenli, **maa\u015fl\u0131 (ulufe)**, \u0130stanbul\'da. Yeni\u00e7eri, cebeci, top\u00e7u, kap\u0131kulu sipahisi.'],
        ['**Eyalet askerleri**','**T\u0131marl\u0131 sipahiler** \u2014 maa\u015f almaz, dirlik geliriyle **cebel\u00fc** besler. Ordunun en kalabal\u0131k b\u00f6l\u00fcm\u00fc.'],
        ['**Dev\u015firme sistemi**','Hristiyan ailelerden al\u0131nan \u00e7ocuklar\u0131n **Enderun**\'da yeti\u015ftirilmesi.']
      ]},
      { t:'ozet', b:'Di\u011fer temel kavramlar', i:[
        '**Millet sistemi**: Osmanl\u0131\'da gruplar **din esas\u0131na** g\u00f6re \u00f6rg\u00fctlenirdi; her cemaat kendi hukukunu i\u00e7 i\u015flerinde uygulard\u0131.',
        '**Lonca**: esnaf ve zanaatk\u00e2r birli\u011fi. **Narh** = devletin koydu\u011fu azami fiyat. **Gedik** = i\u015f yeri a\u00e7ma izni.',
        '**Enderun**: sarayda devlet adam\u0131 yeti\u015ftiren okul. **S\u0131byan mektebi** ilk\u00f6\u011fretim, **medrese** y\u00fcksek\u00f6\u011fretimdir.',
        '**\u015eer\'i hukuk** (din\u00ee) ve **\u00f6rfi hukuk** (padi\u015fah kanunlar\u0131) birlikte uygulan\u0131rd\u0131.',
        '**Ta\u015fra y\u00f6netimi**: Eyalet \u2192 Sancak \u2192 Kaza \u2192 K\u00f6y. Sancak beyi, kad\u0131 ve suba\u015f\u0131 temel g\u00f6revlilerdir.',
        '**Kad\u0131**: hem yarg\u0131 hem belediye ve m\u00fclk\u00ee g\u00f6revleri olan, **kazasker taraf\u0131ndan atanan** g\u00f6revli.'
      ]},
      { t:'kod', b:'Haf\u0131za kodu', x:'**Divan\'\u0131n d\u00f6rt asl\u0131: Vezir\u2013Kazasker\u2013Defterdar\u2013Ni\u015fanc\u0131.** Kaptan-\u0131 Derya sonradan kat\u0131l\u0131r, **\u015eeyh\u00fclislam \u00fcye de\u011fildir**. "Divan \u00fcyesi olmayan hangisidir?" sorusunun cevab\u0131 hep \u015eeyh\u00fclislam\'d\u0131r.' },
      { t:'tuzak', i:[
        '**\u015eeyh\u00fclislam Divan \u00fcyesi de\u011fildir.** Fetva verir ama oylamaya kat\u0131lmaz. En s\u0131k sorulan ayr\u0131nt\u0131d\u0131r.',
        '**Divan bir parlamento de\u011fildir**; kararlar\u0131 padi\u015fah\u0131n onay\u0131yla y\u00fcr\u00fcrl\u00fc\u011fe girer. Dan\u0131\u015fma organ\u0131d\u0131r.',
        '**T\u0131marl\u0131 sipahiler maa\u015f almaz**, kap\u0131kullar\u0131 \u00fc\u00e7 ayda bir **ulufe** al\u0131r. Bu ayr\u0131m sorulur.',
        '**Dev\u015firme sistemi yaln\u0131zca Hristiyan** tebaadan \u00e7ocuk al\u0131r; tek \u00e7ocuklu aileden ve \u015fehirden al\u0131nmazd\u0131.',
        '**Miri arazi sat\u0131lamaz ve miras b\u0131rak\u0131lamaz**; k\u00f6yl\u00fc topra\u011f\u0131 i\u015fleme hakk\u0131na sahiptir, m\u00fclkiyetine de\u011fil.',
        '**Kad\u0131 hem h\u00e2kim hem yerel y\u00f6neticidir**; g\u00fcn\u00fcm\u00fczdeki bir\u00e7ok g\u00f6revi tek elde toplar.'
      ]},
      { t:'test', s:[
        { q:'A\u015fa\u011f\u0131dakilerden hangisi Divan-\u0131 H\u00fcmayun\'un asli \u00fcyelerinden **de\u011fildir**?',
          c:['Veziriazam','Kazasker','\u015eeyh\u00fclislam','Defterdar'], d:2,
          a:'\u015eeyh\u00fclislam Divan \u00fcyesi de\u011fildir; al\u0131nan kararlar\u0131n dine uygunlu\u011fu konusunda fetva veren makamd\u0131r.' },
        { q:'Osmanl\u0131 ordusunda maa\u015f almay\u0131p dirlik gelirinden asker besleyen s\u0131n\u0131f hangisidir?',
          c:['Yeni\u00e7eriler','T\u0131marl\u0131 sipahiler','Cebeciler','Top\u00e7ular'], d:1,
          a:'T\u0131marl\u0131 sipahiler kendilerine verilen dirli\u011fin gelirinden "cebel\u00fc" ad\u0131 verilen askerleri besler, hazineden maa\u015f almazlard\u0131. Kap\u0131kulu askerleri ise ulufe al\u0131rd\u0131.' },
        { q:'Osmanl\u0131 Devleti\'nde tapu-kadastro i\u015flerini y\u00fcr\u00fcten ve padi\u015fah tu\u011fras\u0131n\u0131 \u00e7eken divan \u00fcyesi kimdir?',
          c:['Ni\u015fanc\u0131','Defterdar','Kazasker','Reis\u00fclk\u00fcttap'], d:0,
          a:'Ni\u015fanc\u0131, padi\u015fah ad\u0131na tu\u011fra \u00e7eker, arazi kay\u0131tlar\u0131n\u0131 (tahrir defterleri) tutar ve devletin d\u0131\u015f yaz\u0131\u015fmalar\u0131n\u0131 d\u00fczenlerdi.' }
      ]}
    ]},

  /* ========= 11 ========= */
  { id:'milli-mucadele', ad:'Mill\u00ee M\u00fccadele D\u00f6nemi', soru:'3\u20134 soru', durum:'hazir',
    ozet:'Dersin kalbi. Genelge\u2013kongre\u2013antla\u015fma s\u0131ras\u0131 ve her birinin "ilk"i sorulur.',
    bloklar:[
      { t:'zaman', b:'1919\u20131923 zaman \u015feridi', z:[
        { y:'19 May\u0131s 1919', o:'Mustafa Kemal Samsun\'a \u00e7\u0131kt\u0131', d:'Mill\u00ee M\u00fccadele\'nin fiil\u00ee ba\u015flang\u0131c\u0131.' },
        { y:'22 Haziran 1919', o:'Amasya Genelgesi', d:'**Mill\u00ee M\u00fccadele\'nin ama\u00e7, gerek\u00e7e ve y\u00f6ntemi ilk kez** a\u00e7\u0131kland\u0131. *"Milletin istiklalini yine milletin azim ve karar\u0131 kurtaracakt\u0131r."* **\u0130htilal beyannamesi** niteli\u011findedir.' },
        { y:'23 Temmuz \u2013 7 A\u011fustos 1919', o:'Erzurum Kongresi', d:'**Toplan\u0131\u015f\u0131 b\u00f6lgesel, kararlar\u0131 mill\u00eedir.** \u0130lk kez **manda ve himaye reddedildi**, **mill\u00ee s\u0131n\u0131rlar**dan s\u00f6z edildi, **Temsil Heyeti** kuruldu.' },
        { y:'4 \u2013 11 Eyl\u00fcl 1919', o:'Sivas Kongresi', d:'**Toplan\u0131\u015f\u0131 ve kararlar\u0131 mill\u00eedir.** T\u00fcm cemiyetler **Anadolu ve Rumeli M\u00fcdafaa-i Hukuk Cemiyeti** ad\u0131yla birle\u015fti; Temsil Heyeti **t\u00fcm yurdu** temsil eder h\u00e2le geldi.' },
        { y:'20 \u2013 22 Ekim 1919', o:'Amasya G\u00f6r\u00fc\u015fmeleri', d:'**\u0130stanbul H\u00fck\u00fcmeti Temsil Heyeti\'ni hukuken tan\u0131d\u0131.**' },
        { y:'28 Ocak 1920', o:'Misak-\u0131 Mill\u00ee', d:'Son Osmanl\u0131 Mebusan Meclisi\'nde kabul edildi. **Mill\u00ee s\u0131n\u0131rlar ve tam ba\u011f\u0131ms\u0131zl\u0131k** belgesi.' },
        { y:'16 Mart 1920', o:'\u0130stanbul\'un i\u015fgali', d:'Meclis da\u011f\u0131t\u0131ld\u0131 \u2192 Ankara\'da yeni meclis toplanmas\u0131n\u0131n yolu a\u00e7\u0131ld\u0131.' },
        { y:'23 Nisan 1920', o:'TBMM a\u00e7\u0131ld\u0131', d:'**G\u00fc\u00e7ler birli\u011fi** ilkesi; "Meclisin \u00fcst\u00fcnde g\u00fc\u00e7 yoktur". Yeni T\u00fcrk devletinin temeli.' },
        { y:'3 Aral\u0131k 1920', o:'G\u00fcmr\u00fc Antla\u015fmas\u0131', d:'Ermenistan ile. **TBMM\'nin ilk siyasi ve asker\u00ee ba\u015far\u0131s\u0131; imzalad\u0131\u011f\u0131 ilk antla\u015fma.**' },
        { y:'6 \u2013 10 Ocak 1921', o:'I. \u0130n\u00f6n\u00fc Sava\u015f\u0131', d:'**TBMM ordusunun ilk zaferi.** Sonu\u00e7lar\u0131: **Te\u015fkilat-\u0131 Esasiye (20 Ocak 1921)**, **Londra Konferans\u0131**, **Moskova Antla\u015fmas\u0131 (16 Mart 1921)**.' },
        { y:'23 Mart \u2013 1 Nisan 1921', o:'II. \u0130n\u00f6n\u00fc Sava\u015f\u0131', d:'\u0130talyanlar Anadolu\'yu bo\u015faltmaya ba\u015flad\u0131; TBMM\'ye g\u00fcven artt\u0131.' },
        { y:'Temmuz 1921', o:'K\u00fctahya \u2013 Eski\u015fehir Sava\u015flar\u0131', d:'**Yenilgi.** Ordu Sakarya\'n\u0131n do\u011fusuna \u00e7ekildi; Meclis\'te Mustafa Kemal\'e **Ba\u015fkomutanl\u0131k** verildi (5 A\u011fustos 1921).' },
        { y:'23 A\u011fustos \u2013 13 Eyl\u00fcl 1921', o:'Sakarya Meydan Muharebesi', d:'**1683 Viyana\'dan beri s\u00fcren geri \u00e7ekili\u015fin sonu.** Mustafa Kemal\'e **Gazi** unvan\u0131 ve **Mare\u015fal** r\u00fctbesi. Sonu\u00e7lar\u0131: **Kars (13 Ekim 1921)** ve **Ankara Antla\u015fmas\u0131 (20 Ekim 1921 \u2013 Fransa)**.' },
        { y:'26 \u2013 30 A\u011fustos 1922', o:'B\u00fcy\u00fck Taarruz', d:'**30 A\u011fustos Ba\u015fkomutanl\u0131k Meydan Muharebesi** ile Yunan ordusu bozguna u\u011frad\u0131; 9 Eyl\u00fcl\'de \u0130zmir\'e girildi.' },
        { y:'11 Ekim 1922', o:'Mudanya Ate\u015fkes Antla\u015fmas\u0131', d:'Do\u011fu Trakya **sava\u015fs\u0131z** kurtar\u0131ld\u0131; Kurtulu\u015f Sava\u015f\u0131\'n\u0131n **asker\u00ee safhas\u0131** bitti.' },
        { y:'24 Temmuz 1923', o:'Lozan Bar\u0131\u015f Antla\u015fmas\u0131', d:'Yeni T\u00fcrk Devleti **uluslararas\u0131 alanda tan\u0131nd\u0131**. Kapit\u00fclasyonlar kald\u0131r\u0131ld\u0131.' }
      ]},
      { t:'tablo', b:'Erzurum ve Sivas Kongreleri fark\u0131', h:['\u00d6l\u00e7\u00fct','Erzurum','Sivas'], r:[
        ['Toplan\u0131\u015f','**B\u00f6lgesel**','**Mill\u00ee**'],
        ['Kararlar','**Mill\u00ee**','**Mill\u00ee**'],
        ['Temsil Heyeti','Kuruldu \u2014 **yaln\u0131z Do\u011fu Anadolu**\'yu temsil','**T\u00fcm yurdu** temsil eder h\u00e2le geldi'],
        ['Manda\u2013himaye','**\u0130lk kez reddedildi**','**Kesin olarak reddedildi**'],
        ['Cemiyetler','\u2014','T\u00fcm\u00fc **tek \u00e7at\u0131** alt\u0131nda birle\u015ftirildi']
      ]},
      { t:'kod', b:'Haf\u0131za kodu', x:'**"A-E-S-A-M":** **A**masya Genelgesi \u2192 **E**rzurum \u2192 **S**ivas \u2192 **A**masya G\u00f6r\u00fc\u015fmeleri \u2192 **M**isak-\u0131 Mill\u00ee. S\u0131ra sorusu gelirse bu be\u015f harf yeter.' },
      { t:'tuzak', i:[
        '**Amasya Genelgesi bir genelge, Misak-\u0131 Mill\u00ee bir karard\u0131r.** Amasya "ne yap\u0131lacak"\u0131, Misak-\u0131 Mill\u00ee "s\u0131n\u0131rlar ne olacak"\u0131 s\u00f6yler.',
        '**Manda ve himaye ilk kez Erzurum\'da reddedildi**, kesin olarak Sivas\'ta reddedildi. "\u0130lk" ve "kesin" ayr\u0131m\u0131na dikkat.',
        '**G\u00fcmr\u00fc, TBMM\'nin imzalad\u0131\u011f\u0131 ilk antla\u015fmad\u0131r.** Ancak TBMM\'yi tan\u0131yan **ilk \u0130tilaf devleti Fransa**\'d\u0131r (Ankara Antla\u015fmas\u0131 1921).',
        '**Sakarya bir meydan muharebesidir**, B\u00fcy\u00fck Taarruz ise bir taarruz harek\u00e2t\u0131d\u0131r. Sakarya\'da savunma, B\u00fcy\u00fck Taarruz\'da sald\u0131r\u0131 vard\u0131r.',
        '**Mudanya bir ate\u015fkestir, Lozan bir bar\u0131\u015f antla\u015fmas\u0131d\u0131r.** Do\u011fu Trakya Mudanya ile **sava\u015f\u0131lmadan** al\u0131nm\u0131\u015ft\u0131r.',
        '**Lozan\'da \u00e7\u00f6z\u00fclemeyen konular**: Musul, Hatay, Bo\u011fazlar, n\u00fcfus m\u00fcbadelesinin baz\u0131 ayr\u0131nt\u0131lar\u0131, yabanc\u0131 okullar. Bunlar Atat\u00fcrk d\u00f6neminde ayr\u0131 ayr\u0131 \u00e7\u00f6z\u00fclm\u00fc\u015ft\u00fcr.',
        '**TBMM\'de g\u00fc\u00e7ler birli\u011fi** vard\u0131r; yasama, y\u00fcr\u00fctme ve yarg\u0131 Meclis\'te toplanm\u0131\u015ft\u0131r. Bu, ola\u011fan\u00fcst\u00fc ko\u015fullar\u0131n gere\u011fidir.'
      ]},
      { t:'test', s:[
        { q:'Mill\u00ee M\u00fccadele\'nin amac\u0131, gerek\u00e7esi ve y\u00f6nteminin ilk kez a\u00e7\u0131kland\u0131\u011f\u0131 belge hangisidir?',
          c:['Amasya Genelgesi','Erzurum Kongresi kararlar\u0131','Misak-\u0131 Mill\u00ee','Sivas Kongresi kararlar\u0131'], d:0,
          a:'22 Haziran 1919 tarihli Amasya Genelgesi, Mill\u00ee M\u00fccadele\'nin amac\u0131n\u0131, gerek\u00e7esini ve y\u00f6ntemini ilk kez ortaya koyan ihtilal beyannamesi niteli\u011findedir.' },
        { q:'Manda ve himaye fikri ilk kez hangi kongrede reddedilmi\u015ftir?',
          c:['Sivas Kongresi','Erzurum Kongresi','Bal\u0131kesir Kongresi','Ala\u015fehir Kongresi'], d:1,
          a:'Manda ve himaye ilk kez Erzurum Kongresi\'nde reddedilmi\u015f, Sivas Kongresi\'nde ise kesin olarak karara ba\u011flanm\u0131\u015ft\u0131r.' },
        { q:'TBMM H\u00fck\u00fcmeti\'ni resmen tan\u0131yan ilk \u0130tilaf Devleti hangisidir ve bu hangi antla\u015fma ile olmu\u015ftur?',
          c:['\u0130ngiltere \u2013 Mudanya','Fransa \u2013 Ankara Antla\u015fmas\u0131','\u0130talya \u2013 Londra Konferans\u0131','Rusya \u2013 Moskova Antla\u015fmas\u0131'], d:1,
          a:'20 Ekim 1921 Ankara Antla\u015fmas\u0131 ile Fransa, TBMM H\u00fck\u00fcmeti\'ni resmen tan\u0131yan ilk \u0130tilaf Devleti olmu\u015ftur. Rusya bir \u0130tilaf Devleti de\u011fildir.' },
        { q:'Do\u011fu Trakya\'n\u0131n sava\u015f\u0131lmadan geri al\u0131nmas\u0131n\u0131 sa\u011flayan antla\u015fma hangisidir?',
          c:['Lozan Antla\u015fmas\u0131','Mudanya Ate\u015fkes Antla\u015fmas\u0131','Ankara Antla\u015fmas\u0131','Kars Antla\u015fmas\u0131'], d:1,
          a:'11 Ekim 1922 Mudanya Ate\u015fkes Antla\u015fmas\u0131 ile Do\u011fu Trakya sava\u015f\u0131lmadan TBMM y\u00f6netimine b\u0131rak\u0131lm\u0131\u015ft\u0131r.' }
      ]}
    ]},

  /* ========= 12 ========= */
  { id:'inkilap', ad:'\u0130nk\u0131lap Tarihi', soru:'3\u20135 soru', durum:'hazir',
    ozet:'Tarih\u2013ink\u0131lap e\u015fle\u015ftirmesi. Be\u015f ba\u015fl\u0131k alt\u0131nda topla: siyasi, hukuk, e\u011fitim, toplum, ekonomi.',
    bloklar:[
      { t:'zaman', b:'Siyasi ink\u0131laplar', z:[
        { y:'1 Kas\u0131m 1922', o:'Saltanat\u0131n kald\u0131r\u0131lmas\u0131', d:'Osmanl\u0131 Devleti hukuken sona erdi. **Lozan\'a iki h\u00fck\u00fcmetin \u00e7a\u011fr\u0131lmas\u0131** bu karar\u0131 h\u0131zland\u0131rd\u0131.' },
        { y:'13 Ekim 1923', o:'Ankara ba\u015fkent oldu', d:'G\u00fcvenlik ve merkez\u00ee konum gerek\u00e7esiyle.' },
        { y:'29 Ekim 1923', o:'Cumhuriyetin ilan\u0131', d:'Devletin ad\u0131 ve rejimi belirlendi; **kabine sistemine** ge\u00e7ildi. \u0130lk cumhurba\u015fkan\u0131 Mustafa Kemal, ilk ba\u015fbakan \u0130smet Pa\u015fa.' },
        { y:'3 Mart 1924', o:'Halifeli\u011fin kald\u0131r\u0131lmas\u0131', d:'Ayn\u0131 g\u00fcn **Tevhid-i Tedrisat Kanunu** kabul edildi ve **\u015eer\'iye ve Evkaf Vek\u00e2leti** kald\u0131r\u0131ld\u0131. **Laikli\u011fe giden en \u00f6nemli ad\u0131m.**' },
        { y:'1924 \u00b7 1930', o:'\u00c7ok partili hayat denemeleri', d:'**Terakkiperver Cumhuriyet F\u0131rkas\u0131 (1924)** \u2014 \u015eeyh Sait \u0130syan\u0131 sonras\u0131 kapat\u0131ld\u0131. **Serbest Cumhuriyet F\u0131rkas\u0131 (1930)** \u2014 kendini feshetti.' }
      ]},
      { t:'tablo', b:'\u0130nk\u0131laplar \u2014 alan alan', h:['Alan','\u0130nk\u0131lap ve y\u0131l'], r:[
        ['**Hukuk**','**Medeni Kanun 1926** (\u0130svi\u00e7re) \u00b7 Ceza Kanunu (\u0130talya) \u00b7 Bor\u00e7lar (\u0130svi\u00e7re) \u00b7 Ticaret (Almanya) \u00b7 **1924 Anayasas\u0131**'],
        ['**E\u011fitim**','**Tevhid-i Tedrisat 1924** (\u00f6\u011fretim birli\u011fi) \u00b7 **Harf \u0130nk\u0131lab\u0131 1 Kas\u0131m 1928** \u00b7 **Millet Mektepleri 1928** \u00b7 **TTK 1931** \u00b7 **TDK 1932** \u00b7 \u00dcniversite Reformu 1933'],
        ['**Toplum**','**\u015eapka Kanunu 1925** \u00b7 **Tekke, zaviye ve t\u00fcrbelerin kapat\u0131lmas\u0131 1925** \u00b7 **Takvim, saat ve \u00f6l\u00e7\u00fcler 1925-1931** \u00b7 **Soyad\u0131 Kanunu 1934**'],
        ['**Kad\u0131n haklar\u0131**','**1930** belediye se\u00e7imleri \u00b7 **1933** muhtarl\u0131k \u00b7 **5 Aral\u0131k 1934** milletvekili se\u00e7me ve se\u00e7ilme'],
        ['**Ekonomi**','**\u0130zmir \u0130ktisat Kongresi 1923** \u00b7 **A\u015far vergisinin kald\u0131r\u0131lmas\u0131 1925** \u00b7 **Kabotaj Kanunu 1 Temmuz 1926** \u00b7 Te\u015fvik-i Sanayi 1927 \u00b7 **I. Be\u015f Y\u0131ll\u0131k Sanayi Plan\u0131 1934** \u00b7 S\u00fcmerbank 1933, Etibank 1935']
      ]},
      { t:'kod', b:'Haf\u0131za kodu', x:'**3 Mart 1924 = \u00fc\u00e7 karar bir g\u00fcnde:** Halifelik kald\u0131r\u0131ld\u0131 + Tevhid-i Tedrisat + \u015eer\'iye ve Evkaf Vek\u00e2leti kald\u0131r\u0131ld\u0131. Tek tarih, \u00fc\u00e7 cevap.' },
      { t:'tuzak', i:[
        '**Laiklik 1937\'de anayasaya girmi\u015ftir**, ancak laikle\u015fme s\u00fcreci 1924\'te halifeli\u011fin kald\u0131r\u0131lmas\u0131yla h\u0131zlanm\u0131\u015ft\u0131r. "Devletin dini \u0130slam\'d\u0131r" ifadesi **1928\'de** anayasadan \u00e7\u0131kar\u0131lm\u0131\u015ft\u0131r.',
        '**Medeni Kanun \u0130svi\u00e7re\'den** al\u0131nm\u0131\u015ft\u0131r; kad\u0131n-erkek e\u015fitli\u011fi, tek e\u015flilik ve resm\u00ee nik\u00e2h bu kanunla gelmi\u015ftir.',
        '**Kad\u0131nlara milletvekili se\u00e7me-se\u00e7ilme hakk\u0131 1934**\'te verilmi\u015ftir; belediye (1930) ve muhtarl\u0131k (1933) daha \u00f6ncedir. S\u0131ra sorulur.',
        '**Kabotaj Kanunu (1926)** T\u00fcrk kara sular\u0131nda ta\u015f\u0131mac\u0131l\u0131k hakk\u0131n\u0131 **yaln\u0131zca T\u00fcrk gemilerine** vermi\u015ftir; ekonomik ba\u011f\u0131ms\u0131zl\u0131k ad\u0131m\u0131d\u0131r.',
        '**A\u015far vergisi 1925\'te kald\u0131r\u0131ld\u0131** \u2014 k\u00f6yl\u00fcn\u00fcn en a\u011f\u0131r y\u00fck\u00fcyd\u00fc; kald\u0131r\u0131lmas\u0131 \u0130zmir \u0130ktisat Kongresi kararlar\u0131n\u0131n uygulanmas\u0131d\u0131r.',
        '**Harf \u0130nk\u0131lab\u0131 1928, dil \u00e7al\u0131\u015fmalar\u0131 (TDK) 1932**\'dir. \u0130kisi ayr\u0131 ink\u0131lapt\u0131r.',
        '**TCF ve SCF kapat\u0131lm\u0131\u015ft\u0131r ama farkl\u0131 sebeplerle**: TCF \u015eeyh Sait \u0130syan\u0131 sonras\u0131nda kapat\u0131ld\u0131, SCF kendini feshetti.'
      ]},
      { t:'test', s:[
        { q:'3 Mart 1924\'te a\u015fa\u011f\u0131dakilerden hangisi ger\u00e7ekle\u015f**memi\u015f**tir?',
          c:['Halifeli\u011fin kald\u0131r\u0131lmas\u0131','Tevhid-i Tedrisat Kanunu\'nun kabul\u00fc','\u015eer\'iye ve Evkaf Vek\u00e2leti\'nin kald\u0131r\u0131lmas\u0131','Soyad\u0131 Kanunu\'nun kabul\u00fc'], d:3,
          a:'Soyad\u0131 Kanunu 21 Haziran 1934\'te kabul edilmi\u015ftir. Di\u011fer \u00fc\u00e7 karar 3 Mart 1924\'te ayn\u0131 g\u00fcn al\u0131nm\u0131\u015ft\u0131r.' },
        { q:'T\u00fcrk kara sular\u0131nda y\u00fck ve yolcu ta\u015f\u0131ma hakk\u0131n\u0131 yaln\u0131zca T\u00fcrk gemilerine veren kanun hangisidir?',
          c:['Te\u015fvik-i Sanayi Kanunu','Kabotaj Kanunu','Tevhid-i Tedrisat Kanunu','Takrir-i S\u00fck\u00fbn Kanunu'], d:1,
          a:'1 Temmuz 1926\'da y\u00fcr\u00fcrl\u00fc\u011fe giren Kabotaj Kanunu ekonomik ba\u011f\u0131ms\u0131zl\u0131k yolunda \u00f6nemli bir ad\u0131md\u0131r ve her y\u0131l Denizcilik Bayram\u0131 olarak kutlan\u0131r.' },
        { q:'T\u00fcrk kad\u0131nlar\u0131na milletvekili se\u00e7me ve se\u00e7ilme hakk\u0131 hangi y\u0131l verilmi\u015ftir?',
          c:['1926','1930','1933','1934'], d:3,
          a:'5 Aral\u0131k 1934\'te anayasa de\u011fi\u015fikli\u011fiyle verilmi\u015ftir. Belediye se\u00e7imlerine kat\u0131lma hakk\u0131 1930, muhtarl\u0131k hakk\u0131 ise 1933\'te tan\u0131nm\u0131\u015ft\u0131.' },
        { q:'T\u00fcrk Medeni Kanunu hangi \u00fclkenin kanunlar\u0131 \u00f6rnek al\u0131narak haz\u0131rlanm\u0131\u015ft\u0131r?',
          c:['\u0130talya','Almanya','\u0130svi\u00e7re','Fransa'], d:2,
          a:'1926\'da kabul edilen T\u00fcrk Medeni Kanunu \u0130svi\u00e7re Medeni Kanunu esas al\u0131narak haz\u0131rlanm\u0131\u015ft\u0131r. Ceza Kanunu \u0130talya\'dan, Ticaret Kanunu Almanya\'dan al\u0131nm\u0131\u015ft\u0131r.' }
      ]}
    ]},

  /* ========= 13 ========= */
  { id:'ataturk-politika', ad:'Atat\u00fcrk D\u00f6nemi \u0130\u00e7 ve D\u0131\u015f Politika', soru:'1\u20135 soru', durum:'hazir',
    ozet:'Lozan\'da \u00e7\u00f6z\u00fclemeyenlerin \u00e7\u00f6z\u00fcld\u00fc\u011f\u00fc d\u00f6nem. Antla\u015fma\u2013konu e\u015fle\u015ftirmesi sorulur.',
    bloklar:[
      { t:'zaman', b:'\u0130\u00e7 politika', z:[
        { y:'13 \u015eubat 1925', o:'\u015eeyh Sait \u0130syan\u0131', d:'**Takrir-i S\u00fck\u00fbn Kanunu (4 Mart 1925)** \u00e7\u0131kar\u0131ld\u0131, \u0130stiklal Mahkemeleri yeniden kuruldu, **TCF kapat\u0131ld\u0131**.' },
        { y:'Haziran 1926', o:'\u0130zmir Suikast\u0131 giri\u015fimi', d:'Mustafa Kemal\'e y\u00f6nelik suikast plan\u0131 ortaya \u00e7\u0131kar\u0131ld\u0131.' },
        { y:'12 A\u011fustos 1930', o:'Serbest Cumhuriyet F\u0131rkas\u0131', d:'Fethi Okyar taraf\u0131ndan kuruldu; ayn\u0131 y\u0131l kendini feshetti.' },
        { y:'23 Aral\u0131k 1930', o:'Menemen Olay\u0131', d:'Aste\u011fmen Kubilay \u015fehit edildi; rejime y\u00f6nelik gerici tepkinin s\u00fcrd\u00fc\u011f\u00fcn\u00fc g\u00f6sterdi.' }
      ]},
      { t:'tablo', b:'D\u0131\u015f politika \u2014 sorun ve \u00e7\u00f6z\u00fcm', h:['Sorun','\u00c7\u00f6z\u00fcm','Y\u0131l'], r:[
        ['**Musul**','**Ankara Antla\u015fmas\u0131** \u2014 Musul Irak\'a (\u0130ngiliz mandas\u0131) b\u0131rak\u0131ld\u0131','1926'],
        ['**N\u00fcfus m\u00fcbadelesi**','Yunanistan ile anla\u015fmazl\u0131k, **dostluk antla\u015fmas\u0131** ile \u00e7\u00f6z\u00fcld\u00fc','1930'],
        ['**Uluslararas\u0131 tan\u0131nma**','**Milletler Cemiyeti**\'ne \u00fcyelik (davet \u00fczerine)','1932'],
        ['**Balkan g\u00fcvenli\u011fi**','**Balkan Antant\u0131** \u2014 T\u00fcrkiye, Yunanistan, Romanya, Yugoslavya','1934'],
        ['**Bo\u011fazlar**','**Montr\u00f6 Bo\u011fazlar S\u00f6zle\u015fmesi** \u2014 Bo\u011fazlar \u00fczerindeki **egemenlik T\u00fcrkiye\'ye** ge\u00e7ti','1936'],
        ['**Do\u011fu s\u0131n\u0131r\u0131 g\u00fcvenli\u011fi**','**Sadabat Pakt\u0131** \u2014 T\u00fcrkiye, \u0130ran, Irak, Afganistan','1937'],
        ['**Hatay**','Ba\u011f\u0131ms\u0131z devlet, ard\u0131ndan **T\u00fcrkiye\'ye kat\u0131lma**','1938 / 1939']
      ]},
      { t:'kod', b:'Haf\u0131za kodu', x:'**Bat\u0131 i\u00e7in Balkan Antant\u0131 (1934), Do\u011fu i\u00e7in Sadabat Pakt\u0131 (1937).** Aradaki \u00fc\u00e7 y\u0131l ve d\u00f6rt \u00fclke say\u0131s\u0131 ikisinde de ayn\u0131d\u0131r \u2014 kar\u0131\u015ft\u0131rmamak i\u00e7in "B bat\u0131da, S do\u011fuda" de.' },
      { t:'tuzak', i:[
        '**Hatay 1939\'da T\u00fcrkiye\'ye kat\u0131lm\u0131\u015ft\u0131r**, yani **Atat\u00fcrk\'\u00fcn \u00f6l\u00fcm\u00fcnden sonra**. Ancak s\u00fcrecin tamam\u0131 onun d\u00f6neminde y\u00fcr\u00fct\u00fclm\u00fc\u015ft\u00fcr.',
        '**Montr\u00f6 ile Bo\u011fazlar Komisyonu kald\u0131r\u0131ld\u0131** ve Bo\u011fazlarda tam T\u00fcrk egemenli\u011fi sa\u011fland\u0131. Lozan\'da bu konu T\u00fcrkiye lehine tam \u00e7\u00f6z\u00fclememi\u015fti.',
        '**T\u00fcrkiye Milletler Cemiyeti\'ne davet edilerek** \u00fcye olmu\u015ftur (1932); ba\u015fvuru yaparak de\u011fil.',
        '**Musul kaybedilmi\u015ftir.** "Atat\u00fcrk d\u00f6neminde \u00e7\u00f6z\u00fclen sorunlar" denince Musul da say\u0131l\u0131r ama sonu\u00e7 T\u00fcrkiye lehine de\u011fildir.',
        '**Balkan Antant\u0131 ve Sadabat Pakt\u0131 savunma ama\u00e7l\u0131d\u0131r**; sald\u0131r\u0131 ittifak\u0131 de\u011fildir. \u0130kisi de "yurtta sulh, cihanda sulh" ilkesinin \u00fcr\u00fcn\u00fcd\u00fcr.',
        '**Takrir-i S\u00fck\u00fbn Kanunu ola\u011fan\u00fcst\u00fc bir yetki kanunudur**; \u015eeyh Sait \u0130syan\u0131 \u00fczerine \u00e7\u0131kar\u0131lm\u0131\u015f ve 1929\'a kadar y\u00fcr\u00fcrl\u00fckte kalm\u0131\u015ft\u0131r.'
      ]},
      { t:'test', s:[
        { q:'Bo\u011fazlar \u00fczerinde T\u00fcrkiye\'nin tam egemenli\u011fini sa\u011flayan s\u00f6zle\u015fme hangisidir?',
          c:['Lozan Antla\u015fmas\u0131','Montr\u00f6 Bo\u011fazlar S\u00f6zle\u015fmesi','Ankara Antla\u015fmas\u0131','Balkan Antant\u0131'], d:1,
          a:'20 Temmuz 1936 tarihli Montr\u00f6 Bo\u011fazlar S\u00f6zle\u015fmesi ile Bo\u011fazlar Komisyonu kald\u0131r\u0131lm\u0131\u015f, Bo\u011fazlar \u00fczerindeki egemenlik t\u00fcm\u00fcyle T\u00fcrkiye\'ye ge\u00e7mi\u015ftir.' },
        { q:'T\u00fcrkiye, \u0130ran, Irak ve Afganistan aras\u0131nda 1937\'de imzalanan ve do\u011fu s\u0131n\u0131rlar\u0131n\u0131n g\u00fcvenli\u011fini ama\u00e7layan pakt hangisidir?',
          c:['Balkan Antant\u0131','Sadabat Pakt\u0131','Ba\u011fdat Pakt\u0131','Montr\u00f6 S\u00f6zle\u015fmesi'], d:1,
          a:'Sadabat Pakt\u0131 1937\'de imzalanm\u0131\u015f, do\u011fu s\u0131n\u0131rlar\u0131nda g\u00fcvenlik ve i\u015f birli\u011fi ama\u00e7lanm\u0131\u015ft\u0131r. Balkan Antant\u0131 (1934) ise bat\u0131 s\u0131n\u0131rlar\u0131 i\u00e7indir.' },
        { q:'\u015eeyh Sait \u0130syan\u0131 sonras\u0131nda \u00e7\u0131kar\u0131lan ve h\u00fck\u00fcmete ola\u011fan\u00fcst\u00fc yetkiler veren kanun hangisidir?',
          c:['H\u0131yanet-i Vataniye Kanunu','Takrir-i S\u00fck\u00fbn Kanunu','Tevhid-i Tedrisat Kanunu','Te\u015fvik-i Sanayi Kanunu'], d:1,
          a:'4 Mart 1925\'te \u00e7\u0131kar\u0131lan Takrir-i S\u00fck\u00fbn Kanunu ile h\u00fck\u00fcmete ola\u011fan\u00fcst\u00fc yetkiler verilmi\u015f, \u0130stiklal Mahkemeleri yeniden faaliyete ge\u00e7irilmi\u015ftir.' }
      ]}
    ]},

  /* ========= 14 ========= */
  { id:'cagdas-tarih', ad:'\u00c7a\u011fda\u015f T\u00fcrk ve D\u00fcnya Tarihi', soru:'1\u20134 soru', durum:'hazir',

function el(tag, attrs){
  var n = document.createElementNS(NS, tag);

}

  var n = document.createElement(tag);

/* **kalin** -> <strong> */
function md(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
}
function haversine(a1,o1,a2,o2){
  var R=6371, r=Math.PI/180;
  var dA=(a2-a1)*r, dO=(o2-o1)*r;
  var s=Math.sin(dA/2)*Math.sin(dA/2)+Math.cos(a1*r)*Math.cos(a2*r)*Math.sin(dO/2)*Math.sin(dO/2);
  return 2*R*Math.asin(Math.sqrt(s));
}

/* --- bolge sozde-katmanini uret --- */
function bolgeKatmani(){
  var srt = ['Marmara','Ege','Akdeniz','\u0130\u00e7 Anadolu','Karadeniz','Do\u011fu Anadolu','G\u00fcneydo\u011fu Anadolu'];
  var map = {};
  TRMAP.iller.forEach(function(i){ (map[i.bolge] = map[i.bolge] || []).push(i); });
  var gruplar = srt.filter(function(b){ return map[b]; }).map(function(b, ix){
    var iller = map[b];
    return {
      ad: b + ' B\u00f6lgesi',
      renk: BRENK[ix % BRENK.length],
      not: BNOT[b] || '',
      bolgeAdi: b,
      n: iller.map(function(i){
        return { n:i.ad, lat:(2588.6 - i.ly)/61.03, lon:(i.lx + 1171.9)/47.44,
                 i:b + ' B\u00f6lgesi \u00b7 plaka ' + i.p, il:[i.p], _il:true };
      })
    };
  });
  return { ad:'Co\u011frafi b\u00f6lgeler', ipucu:'B\u00f6lgeye t\u0131kla, illeri renklensin. Alt b\u00f6lgeler ve s\u0131n\u0131r illeri s\u0131k sorulur.', gruplar:gruplar, _bolge:true };
}

  arac('+','Yak\u0131nla\u015ft\u0131r', function(){ zoom(1.4, 500, 211); });
  arac('\u2212','Uzakla\u015ft\u0131r',  function(){ zoom(1/1.4, 500, 211); });
  arac('\u27f2','S\u0131f\u0131rla',     function(){ T={k:1,x:0,y:0}; uygula(); });

  /* -- SVG -- */
  var svg = el('svg', { viewBox: TRMAP.viewBox, xmlns: NS });

  svg.setAttribute('aria-label', kat.ad + ' haritas\u0131');
  var gZoom = el('g');
  var gIl   = el('g'), gCizgi = el('g'), gIsaret = el('g'), gAd = el('g'), gCevap = el('g');

  gZoom.appendChild(gIsaret); gZoom.appendChild(gCevap);

  stage.insertBefore(svg, tip);

  /* iller */
  var ilYol = {};
  TRMAP.iller.forEach(function(i){
    var p = el('path', { d:i.d, 'class':'il' });
    p.dataset.p = i.p;
    p.addEventListener('mousemove', function(e){ tipGoster(e, '<b>' + i.ad + '</b>' + i.bolge + ' B\u00f6lgesi'); });
    p.addEventListener('mouseleave', tipGizle);
    if(kat._bolge){
      p.style.cursor = 'pointer';
      p.onclick = function(){
        var gi = kat.gruplar.findIndex(function(g){ return g.bolgeAdi === i.bolge; });
        if(gi >= 0){ sec(gi, null); }
      };
    }
    ilYol[i.p] = p; gIl.appendChild(p);
  });

  /* -- cizim -- */
  function ciz(){
    gCizgi.textContent = ''; gIsaret.textContent = ''; gAd.textContent = '';

    /* il vurgulari */
    for(var p in ilYol){ ilYol[p].classList.remove('hl'); ilYol[p].style.fill = ''; }
    if(secili){
      var s = secili.nokta || null, g = kat.gruplar[secili.gi];
      var plakalar = s && s.il ? s.il : null;
      if(!s && kat._bolge){ plakalar = g.n.map(function(x){ return x.il[0]; }); }
      if(plakalar) plakalar.forEach(function(pl){
        if(ilYol[pl]){ ilYol[pl].style.fill = 'var(' + (RENK[g.renk]||'--acc') + ')'; ilYol[pl].classList.add('rg'); }
      });
    }

    /* akarsu polyline'lari */
    if(kat.cizgiler) kat.cizgiler.forEach(function(c, ci){
      var d = c.yol.map(function(pt, ix){
        return (ix ? 'L' : 'M') + TRMAP.x(pt[1]).toFixed(1) + ' ' + TRMAP.y(pt[0]).toFixed(1);
      }).join(' ');
      var path = el('path', { d:d, 'class':'riv' });
      path.style.stroke = 'var(' + (RENK[c.renk]||'--akarsu') + ')';
      if(secili && secili.cizgi === ci) path.classList.add('sec');
      path.style.cursor = 'pointer';
      path.addEventListener('mousemove', function(e){ tipGoster(e, '<b>' + c.n + '</b>' + c.bilgi); });
      path.addEventListener('mouseleave', tipGizle);
      path.onclick = function(){ secili = { cizgi:ci }; ciz(); yan(true); };
      gCizgi.appendChild(path);
      if(etiket || (secili && secili.cizgi === ci)){
        var mid = c.yol[Math.floor(c.yol.length/2)];
        var t = el('text', { x:TRMAP.x(mid[1]), y:TRMAP.y(mid[0]) - 3, 'class':'mk' });
        t.setAttribute('text-anchor','middle'); t.textContent = c.n;
        t.style.font = '600 7px Archivo, sans-serif'; t.style.fill = 'var(--akarsu)';
        t.style.paintOrder = 'stroke'; t.style.stroke = 'var(--card)'; t.style.strokeWidth = '2.6px';
        gAd.appendChild(t);
      }
    });

    /* nokta isaretleri */
    kat.gruplar.forEach(function(g, gi){
      if(!acikGrup[gi]) return;
      g.n.forEach(function(n, ni){
        var cx = TRMAP.x(n.lon), cy = TRMAP.y(n.lat);
        var isSec = secili && secili.gi === gi && secili.ni === ni;
        var gr = el('g', { 'class':'mk' + (isSec ? ' sec' : '') });
        var c = el('circle', { cx:cx.toFixed(1), cy:cy.toFixed(1), r: isSec ? 5.4 : 3.6 });
        c.style.fill = 'var(' + (RENK[g.renk]||'--acc') + ')';
        gr.appendChild(c);
        if(etiket || isSec){
          var t = el('text', { x:cx.toFixed(1), y:(cy - 6.5).toFixed(1) });
          t.setAttribute('text-anchor','middle'); t.textContent = n.n;
          gr.appendChild(t);
        }
        gr.addEventListener('mousemove', function(e){ tipGoster(e, '<b>' + n.n + '</b>' + (n.i||'')); });
        gr.addEventListener('mouseleave', tipGizle);
        gr.onclick = function(ev){ ev.stopPropagation(); sec(gi, ni); };
        gIsaret.appendChild(gr);
      });
    });
  }

  /* -- yan panel -- */
  function yan(kaydir){
    side.textContent = '';
    if(kat.ipucu) side.appendChild(Object.assign(h('div','mnote'), { innerHTML: md(kat.ipucu) }));

    if(kat.cizgiler){
      side.appendChild(h('div','mgh','Akarsular'));
      kat.cizgiler.forEach(function(c, ci){
        var it = h('div','mit' + (secili && secili.cizgi === ci ? ' sec' : ''));
        it.appendChild(h('b', null, c.n));
        it.appendChild(Object.assign(h('span'), { innerHTML: md(c.bilgi) }));
        it.onclick = function(){ secili = { cizgi:ci }; ciz(); yan(); };
        side.appendChild(it);
        if(secili && secili.cizgi === ci && kaydir) setTimeout(function(){ it.scrollIntoView({block:'nearest'}); }, 0);
      });
    }

    kat.gruplar.forEach(function(g, gi){
      if(!acikGrup[gi]) return;
      side.appendChild(h('div','mgh', g.ad));
      if(g.not) side.appendChild(Object.assign(h('div','mnote'), { innerHTML: md(g.not) }));
      g.n.forEach(function(n, ni){
        var sel = secili && secili.gi === gi && secili.ni === ni;
        var it = h('div','mit' + (sel ? ' sec' : ''));
        it.appendChild(h('b', null, n.n));
        if(n.i) it.appendChild(Object.assign(h('span'), { innerHTML: md(n.i) }));
        it.onclick = function(){ sec(gi, ni); };
        side.appendChild(it);
        if(sel && kaydir) setTimeout(function(){ it.scrollIntoView({block:'nearest'}); }, 0);
      });
    });
  }

  function sec(gi, ni){
    var n = ni == null ? null : kat.gruplar[gi].n[ni];
    secili = { gi:gi, ni:ni, nokta:n };
    ciz(); yan(true);
    if(n) altBilgi(kat.gruplar[gi], n);
    else altBilgi(kat.gruplar[gi], null);
  }

  function altBilgi(g, n){
    foot.textContent = '';
    if(sinav) return sinavCubuk();
    if(!n && !g){ foot.appendChild(Object.assign(h('span'), { innerHTML:'<b>' + kat.ad + '</b> \u2014 i\u015farete veya listeye t\u0131kla' })); return; }
    var s = h('span');
    s.innerHTML = n ? ('<b>' + n.n + '</b> ' + md(n.i || '')) : ('<b>' + g.ad + '</b> ' + md(g.not || ''));
    foot.appendChild(s);
    if(n && n.il && n.il.length && !g.bolgeAdi){
      var adlar = n.il.map(function(p){
        var i = TRMAP.iller.find(function(x){ return x.p === p; }); return i ? i.ad : p;
      }).join(', ');
      foot.appendChild(Object.assign(h('span'), { innerHTML:'\u0130ller: <b>' + adlar + '</b>' }));
    }
  }

  /* -- ipucu balonu -- */
  function tipGoster(e, html){
    var r = stage.getBoundingClientRect();
    tip.innerHTML = html; tip.classList.add('gor');
    var x = e.clientX - r.left + 13, y = e.clientY - r.top + 13;
    if(x + 260 > r.width) x = e.clientX - r.left - tip.offsetWidth - 10;
    if(y + tip.offsetHeight > r.height) y = r.height - tip.offsetHeight - 6;
    tip.style.left = Math.max(4, x) + 'px'; tip.style.top = Math.max(4, y) + 'px';
  }
  function tipGizle(){ tip.classList.remove('gor'); }

  /* -- yakinlastir / kaydir -- */
  function uygula(){ gZoom.setAttribute('transform','translate(' + T.x + ',' + T.y + ') scale(' + T.k + ')'); }
  function zoom(f, px, py){
    var k2 = Math.min(9, Math.max(1, T.k * f));
    f = k2 / T.k;
    T.x = px - (px - T.x) * f; T.y = py - (py - T.y) * f; T.k = k2;
    if(T.k === 1){ T.x = 0; T.y = 0; }
    uygula();
  }
  function svgNokta(e){
    var r = svg.getBoundingClientRect(), vb = TRMAP.viewBox.split(' ');
    return { x:(e.clientX - r.left) / r.width * (+vb[2]), y:(e.clientY - r.top) / r.height * (+vb[3]) };
  }
  stage.addEventListener('wheel', function(e){
    e.preventDefault(); var p = svgNokta(e); zoom(e.deltaY < 0 ? 1.22 : 1/1.22, p.x, p.y);
  }, { passive:false });

  var sur = null;
  stage.addEventListener('pointerdown', function(e){
    if(e.button) return;
    sur = { x:e.clientX, y:e.clientY, tx:T.x, ty:T.y, tasi:false };
    stage.setPointerCapture(e.pointerId); stage.classList.add('drag');
  });
  stage.addEventListener('pointermove', function(e){
    if(!sur) return;
    var r = svg.getBoundingClientRect(), vb = TRMAP.viewBox.split(' ');
    var sc = (+vb[2]) / r.width;
    var dx = (e.clientX - sur.x) * sc, dy = (e.clientY - sur.y) * sc;
    if(Math.abs(dx) + Math.abs(dy) > 2) sur.tasi = true;
    T.x = sur.tx + dx; T.y = sur.ty + dy; uygula();
  });
  stage.addEventListener('pointerup', function(e){
    var tasindi = sur && sur.tasi; sur = null; stage.classList.remove('drag');
    if(sinav && !tasindi) sinavTahmin(e);
  });
  stage.addEventListener('pointercancel', function(){ sur = null; stage.classList.remove('drag'); });

  /* -- SINAV MODU -- */
  function havuz(){
    var a = [];
    kat.gruplar.forEach(function(g, gi){
      if(!acikGrup[gi]) return;
      g.n.forEach(function(n, ni){ if(!n._il || kat._bolge) a.push({ gi:gi, ni:ni, n:n, g:g }); });
    });
    return a;
  }
  function sinavBasla(){
    var hv = havuz();
    if(hv.length < 3){ alert('S\u0131nav modu i\u00e7in en az 3 i\u015faret gerekli. Bir katman grubu a\u00e7.'); return; }
    sinav = { kalan:hv.slice(), puan:0, tur:0, toplam:Math.min(10, hv.length), gecmis:[] };
    bSinav.classList.add('on'); secili = null; gCevap.textContent = '';
    sinavSonraki();
  }
  function sinavBitir(){
    sinav = null; bSinav.classList.remove('on'); gCevap.textContent = '';
    var f = h('div','mfoot'); wrap.replaceChild(f, foot); foot = f;
    secili = null; altBilgi(null, null); ciz(); yan();
  }
  function sinavSonraki(){
    gCevap.textContent = '';
    sinav.cevaplandi = false;
    if(sinav.tur >= sinav.toplam){
      var ort = Math.round(sinav.puan / sinav.toplam);
      foot.textContent = '';
      var q = h('div','qbar');
      q.appendChild(Object.assign(h('div','qq'), { innerHTML:'Bitti \u2014 <b>' + sinav.toplam + '</b> soruda ortalama sapma <b>' + ort + ' km</b>' }));
      var b1 = h('button','mchip on','Tekrar'); b1.onclick = sinavBasla;
      var b2 = h('button','mchip','\u00c7\u0131k'); b2.onclick = sinavBitir;
      q.appendChild(b1); q.appendChild(b2);
      wrap.replaceChild(q, foot); foot = q;
      return;
    }
    var ix = Math.floor(Math.random() * sinav.kalan.length);
    sinav.soru = sinav.kalan.splice(ix, 1)[0];
    sinav.tur++;
    sinavCubuk();
  }
  function sinavCubuk(sonuc){
    var q = h('div','qbar');
    q.appendChild(Object.assign(h('div','qq'), { innerHTML: 'Haritada bul: <b>' + sinav.soru.n.n + '</b>' }));
    q.appendChild(h('div','qs', sinav.tur + ' / ' + sinav.toplam));
    if(sonuc){
      var sn = h('div','qr ' + sonuc.sinif, sonuc.metin);
      q.appendChild(sn);
      var nx = h('button','mchip on', sinav.tur >= sinav.toplam ? 'Sonucu g\u00f6r' : 'S\u0131radaki');
      nx.onclick = sinavSonraki; q.appendChild(nx);
    }
    var cik = h('button','mchip','\u00c7\u0131k'); cik.onclick = sinavBitir; q.appendChild(cik);
    wrap.replaceChild(q, foot); foot = q;
  }
  function sinavTahmin(e){
    if(!sinav || !sinav.soru || sinav.cevaplandi) return;
    var p = svgNokta(e);
    var mx = (p.x - T.x) / T.k, my = (p.y - T.y) / T.k;
    var lon = (mx + 1171.9) / 47.44, lat = (2588.6 - my) / 61.03;
    var d = Math.round(haversine(lat, lon, sinav.soru.n.lat, sinav.soru.n.lon));
    sinav.puan += d; sinav.cevaplandi = true;

    var sinif = d < 60 ? 'iyi' : d < 160 ? 'orta' : 'kotu';
    var metin = d < 60 ? d + ' km \u00b7 tam isabet' : d < 160 ? d + ' km \u00b7 yak\u0131n' : d + ' km \u00b7 uzak';

    /* dogru yeri goster */
    gCevap.textContent = '';
    var tx = TRMAP.x(sinav.soru.n.lon), ty = TRMAP.y(sinav.soru.n.lat);
    var ln = el('line', { x1:mx, y1:my, x2:tx, y2:ty });
    ln.style.stroke = 'var(--ink3)'; ln.style.strokeWidth = 1; ln.style.strokeDasharray = '3 3';
    gCevap.appendChild(ln);
    var c1 = el('circle', { cx:mx, cy:my, r:3 }); c1.style.fill = 'var(--sinir)';
    var c2 = el('circle', { cx:tx, cy:ty, r:5.4 });
    c2.style.fill = 'var(--ova)'; c2.style.stroke = 'var(--card)'; c2.style.strokeWidth = 1.5;
    var t = el('text', { x:tx, y:ty - 8, 'class':'mk' });
    t.setAttribute('text-anchor','middle'); t.textContent = sinav.soru.n.n;
    t.style.font = '600 7.5px Archivo, sans-serif'; t.style.fill = 'var(--ink)';
    t.style.paintOrder = 'stroke'; t.style.stroke = 'var(--card)'; t.style.strokeWidth = '2.8px';
    gCevap.appendChild(c1); gCevap.appendChild(c2); gCevap.appendChild(t);

    sinavCubuk({ sinif:sinif, metin:metin });
  }

  ciz(); yan(); uygula(); altBilgi(null, null);
  return { ciz:ciz };
}

window.Harita = { olustur: olustur, bolgeKatmani: bolgeKatmani };

})();

    var card = h('div','sq');
    card.appendChild(H('div','qs', (si + 1) + '. ' + md(s.q)));
    var exp = H('div','exp','<b>A\u00e7\u0131klama.</b> ' + md(s.a || ''));
    var btns = [];
    s.c.forEach(function(c, ci){
      var b2 = h('button','op');
      b2.innerHTML = '<span class="lt">' + 'ABCDE'[ci] + ')</span>' + md(c);
      b2.onclick = function(){
        btns.forEach(function(x){ x.disabled = true; });
        btns[s.d].classList.add('dogru');
        if(ci !== s.d) b2.classList.add('yanlis');
        exp.classList.add('gor');
      };
      btns.push(b2); card.appendChild(b2);
    });
    card.appendChild(exp); w.appendChild(card);
  });
  return w;
}
};

function blokCiz(b){
  var f = CIZ[b.t];
  return f ? f(b) : H('div','stub','<b>Bilinmeyen blok: ' + b.t + '</b>');
}

/* =========== YAN MENU =========== */
function menuKur(){
  var nav = q('#nav'); nav.textContent = '';
  DERSLER.forEach(function(d){
    var box = h('div','nav-ders'); box.dataset.d = d.id;
    var t = h('button','nav-t');
    var dot = h('span','dot'); dot.style.background = 'var(--c-' + d.renk + ')';
    t.appendChild(dot);
    t.appendChild(document.createTextNode(d.ad));
    t.appendChild(h('span','cnt', d.soru + ' soru'));
    t.insertAdjacentHTML('beforeend','<svg class="arw" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>');
    t.onclick = function(){ box.classList.toggle('acik'); };
    box.appendChild(t);
    var kl = h('div','nav-k');
    var ders = h('a', null, 'Ders \u00f6zeti'); ders.href = '#/' + d.id; kl.appendChild(ders);
    d.konular.forEach(function(k){
      var a = h('a'); a.href = '#/' + d.id + '/' + k.id;
      a.appendChild(document.createTextNode(k.ad));
      if(k.durum === 'iskelet') a.appendChild(h('span','st','iskelet'));
      else if(bitti[d.id + '/' + k.id]) a.appendChild(h('span','st','\u2713'));
      kl.appendChild(a);
    });
    box.appendChild(kl); nav.appendChild(box);
  });
}
function menuIsaretle(dersId, konuId){
  document.querySelectorAll('#nav a').forEach(function(a){ a.classList.remove('on'); });
  document.querySelectorAll('.nav-ders').forEach(function(b){
    b.classList.toggle('acik', b.dataset.d === dersId);
  });
  var hedef = '#/' + dersId + (konuId ? '/' + konuId : '');
  var a = document.querySelector('#nav a[href="' + hedef + '"]');
  if(a) a.classList.add('on');
}

/* =========== SAYFALAR =========== */
function anasayfa(){
  var m = q('#icerik'); m.textContent = '';

  var hero = h('div','hero');
  hero.appendChild(h('div','eyebrow','KPSS \u00d6n Lisans \u00b7 Genel Yetenek + Genel K\u00fclt\u00fcr \u00b7 120 soru'));
  hero.appendChild(H('h1', null, 'Konu anlat\u0131m\u0131 de\u011fil.<br><em>Tekrar atlas\u0131.</em>'));
  hero.appendChild(h('p','','Be\u015f dersin tamam\u0131 s\u0131navda sorulan bi\u00e7imde \u00f6zetlendi: tablo, tuzak kutusu, haf\u0131za kodu ve harita. Co\u011frafyay\u0131 ezberlemek yerine haritadan \u00e7al\u0131\u015f \u2014 her da\u011f, g\u00f6l, maden ve \u00fcr\u00fcn ger\u00e7ek koordinat\u0131nda i\u015faretli.'));
  m.appendChild(hero);

  /* ana sayfa haritasi */
  var mw = h('div','hero-map');
  mw.appendChild(h('div','blk-h','T\u00fcrkiye \u2014 co\u011frafi b\u00f6lgeler'));
  window.Harita.olustur(mw, { katman:'bolge' });
  m.appendChild(mw);

  var g = h('div','gridDers');
  DERSLER.forEach(function(d){
    var a = h('a','dc'); a.href = '#/' + d.id;
    a.style.setProperty('--dc','var(--c-' + d.renk + ')');
    a.appendChild(h('div','bl', d.bolum));
    a.appendChild(h('h3', null, d.ad));
    a.appendChild(h('div','num', d.soru + ' soru \u00b7 ' + d.konular.length + ' konu'));
    a.appendChild(h('p', null, d.tanim));
    var hz = d.konular.filter(function(k){ return k.durum !== 'iskelet'; }).length;
    a.appendChild(h('div','kt', hz + ' / ' + d.konular.length + ' konu haz\u0131r'));
    g.appendChild(a);
  });
  m.appendChild(g);

  var p = h('div','plan');
  p.appendChild(h('h3','Nas\u0131l \u00e7al\u0131\u015f\u0131l\u0131r'));
  var ol = h('ol');
  [ '<b>Co\u011frafya tamamen haz\u0131r.</b> Konuyu a\u00e7, alt\u0131ndaki haritada katman\u0131 se\u00e7, i\u015faretlere t\u0131kla. Sonra \u201c?\u201d d\u00fc\u011fmesiyle s\u0131nav moduna ge\u00e7 \u2014 sorulan yeri haritada bulmaya \u00e7al\u0131\u015f.',
    '<b>Tuzak kutular\u0131</b> \u00e7\u0131km\u0131\u015f sorularda en \u00e7ok yan\u0131ltan noktalard\u0131r; test \u00f6ncesi sadece onlar\u0131 okumak bile i\u015fe yarar.',
    '<b>Her ders farkl\u0131 bi\u00e7imde</b> haz\u0131rland\u0131: T\u00fcrk\u00e7e yanl\u0131\u015f/do\u011fru c\u00fcmle \u00e7iftiyle, Matematik form\u00fcl + \u00e7\u00f6z\u00fcm + h\u0131z takti\u011fiyle, Tarih zaman \u015feridiyle, Vatanda\u015fl\u0131k \u015fema + say\u0131 kart\u0131yla.',
    '<b>\u201c\u0130skelet\u201d etiketli konular</b> hen\u00fcz doldurulmad\u0131 \u2014 ba\u015fl\u0131k, soru say\u0131s\u0131 ve \u00e7al\u0131\u015fma y\u00f6ntemi haz\u0131r, i\u00e7erik sonraki turda gelecek.'
  ].forEach(function(x){ ol.appendChild(H('li', null, x)); });
  p.appendChild(ol); m.appendChild(p);

  menuIsaretle('', '');
  document.title = 'KPSS \u00d6n Lisans \u2014 Tekrar Atlas\u0131';
}

function dersSayfa(d){
  var m = q('#icerik'); m.textContent = '';
  var hd = h('div','dhead');
  hd.appendChild(H('div','crumb','<a href="#/">Ana sayfa</a> \u00b7 ' + d.bolum));
  hd.appendChild(h('h1', null, d.ad));
  hd.appendChild(h('p','lead', d.tanim));
  var bar = h('div','khead'); var b2 = h('div','bar');
  b2.appendChild(h('span','pill', d.soru + ' soru'));
  b2.appendChild(h('span','pill', d.konular.length + ' konu'));
  hd.appendChild(b2);
  if(d.yontem){
    var mt = h('div','metod');
    d.yontem.forEach(function(x){ mt.appendChild(H('div', null, md(x))); });
    hd.appendChild(mt);
  }
  m.appendChild(hd);

  var kl = h('div','klist');
  d.konular.forEach(function(k, i){
    var a = h('a','ki'); a.href = '#/' + d.id + '/' + k.id;
    a.appendChild(h('div','no', String(i + 1).padStart(2,'0')));
    var tx = h('div','tx');
    tx.appendChild(h('b', null, k.ad));
    if(k.ozet) tx.appendChild(h('span', null, k.ozet));
    a.appendChild(tx);
    if(k.soru) a.appendChild(h('div','sq', k.soru));
    a.appendChild(h('div','tag ' + (k.durum === 'iskelet' ? 'iskelet' : 'hazir'),
                    k.durum === 'iskelet' ? 'iskelet' : (bitti[d.id + '/' + k.id] ? 'okundu' : 'haz\u0131r')));
    kl.appendChild(a);
  });
  m.appendChild(kl);
  menuIsaretle(d.id, null);
  document.title = d.ad + ' \u2014 Tekrar Atlas\u0131';
}

function konuSayfa(d, k){
  var m = q('#icerik'); m.textContent = '';
  var hd = h('div','khead');
  hd.appendChild(H('div','crumb','<a href="#/">Ana sayfa</a> \u00b7 <a href="#/' + d.id + '">' + d.ad + '</a>'));
  hd.appendChild(h('h1', null, k.ad));
  if(k.ozet) hd.appendChild(h('p','ozet', k.ozet));
  var bar = h('div','bar');
  if(k.soru) bar.appendChild(h('span','pill', k.soru));
  var anahtar = d.id + '/' + k.id;
  if(k.durum !== 'iskelet'){
    var ob = h('button','okundu' + (bitti[anahtar] ? ' on' : ''), bitti[anahtar] ? '\u2713 Okundu' : 'Okundu i\u015faretle');
    ob.onclick = function(){
      bitti[anahtar] = !bitti[anahtar]; DP.yaz('bitti', bitti);
      ob.classList.toggle('on', bitti[anahtar]);
      ob.textContent = bitti[anahtar] ? '\u2713 Okundu' : 'Okundu i\u015faretle';
      menuKur(); menuIsaretle(d.id, k.id);
    };
    bar.appendChild(ob);
  }
  hd.appendChild(bar); m.appendChild(hd);

  if(k.durum === 'iskelet'){
    m.appendChild(H('div','stub','<b>Bu konu hen\u00fcz doldurulmad\u0131.</b><p>Ba\u015fl\u0131k, soru say\u0131s\u0131 ve \u00e7al\u0131\u015fma y\u00f6ntemi yerinde. \u0130\u00e7erik sonraki turda eklenecek \u2014 site yap\u0131s\u0131 haz\u0131r oldu\u011fu i\u00e7in sadece veri dosyas\u0131na konu eklemek yeterli.</p>'));
  }
  (k.bloklar || []).forEach(function(b){ m.appendChild(blokCiz(b)); });

  /* onceki / sonraki */
  var ix = d.konular.indexOf(k), pn = h('div','pnav');
  if(ix > 0){
    var p = d.konular[ix - 1], a1 = h('a');
    a1.href = '#/' + d.id + '/' + p.id;
    a1.appendChild(h('span','','\u00d6nceki')); a1.appendChild(h('b', null, p.ad)); pn.appendChild(a1);
  }
  if(ix < d.konular.length - 1){
    var n = d.konular[ix + 1], a2 = h('a','nx');
    a2.href = '#/' + d.id + '/' + n.id;
    a2.appendChild(h('span','','Sonraki')); a2.appendChild(h('b', null, n.ad)); pn.appendChild(a2);
  }
  m.appendChild(pn);
  menuIsaretle(d.id, k.id);
  document.title = k.ad + ' \u00b7 ' + d.ad;
}

/* =========== ARAMA =========== */
function ara(s){
  s = s.trim().toLocaleLowerCase('tr');
  var nav = q('#nav'), res = q('#res');
  if(s.length < 2){ nav.style.display = ''; res.style.display = 'none'; return; }
  nav.style.display = 'none'; res.style.display = ''; res.textContent = '';
  var n = 0;
  DERSLER.forEach(function(d){
    d.konular.forEach(function(k){
      var metin = (k.ad + ' ' + (k.ozet || '') + ' ' + JSON.stringify(k.bloklar || '')).toLocaleLowerCase('tr');
      if(metin.indexOf(s) < 0 || n > 24) return;
      n++;
      var a = h('a'); a.href = '#/' + d.id + '/' + k.id;
      a.appendChild(h('b', null, k.ad));
      a.appendChild(h('span', null, d.ad + (k.durum === 'iskelet' ? ' \u00b7 iskelet' : '')));
      res.appendChild(a);
    });
  });
  if(!n) res.appendChild(H('div','mnote','Sonu\u00e7 yok.'));
}

/* =========== YONLENDIRICI =========== */
function yonlendir(){
  var p = location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  var d = byId[p[0]];
  if(!d) anasayfa();
  else {
    var k = p[1] && d.konular.find(function(x){ return x.id === p[1]; });
    if(k) konuSayfa(d, k); else dersSayfa(d);
  }
  window.scrollTo(0, 0);
  q('#side').classList.remove('acik'); q('#scrim').classList.remove('acik');
}

/* =========== BASLAT =========== */
function baslat(){
  /* tema */
  var tema = DP.al('tema','kagit');
  document.documentElement.dataset.tema = tema;
  var tb = q('#temaBtn');
  function temaYaz(){ tb.textContent = document.documentElement.dataset.tema === 'gece' ? '\u2600 Ka\u011f\u0131t' : '\u263e Gece'; }
  temaYaz();
  tb.onclick = function(){
    var y = document.documentElement.dataset.tema === 'gece' ? 'kagit' : 'gece';
    document.documentElement.dataset.tema = y; DP.yaz('tema', y); temaYaz();
  };

  /* mobil cekmece */
  q('#menuBtn').onclick = function(){
    q('#side').classList.toggle('acik'); q('#scrim').classList.toggle('acik');
  };
  q('#scrim').onclick = function(){
    q('#side').classList.remove('acik'); q('#scrim').classList.remove('acik');
  };

  q('#arama').oninput = function(){ ara(this.value); };

  menuKur();
  window.addEventListener('hashchange', yonlendir);
  yonlendir();
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', baslat);
else baslat();

})();

</script>
