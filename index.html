  /* ========= 6 ========= */
  { id:'osmanli-kurulus', ad:'Osmanl\u0131 Kurulu\u015f ve Y\u00fckselme D\u00f6nemi', soru:'1\u20132 soru', durum:'hazir',
    ozet:'Padi\u015fah\u2013olay e\u015fle\u015ftirmesi ve "kurulu\u015fta g\u00fc\u00e7lenme sebepleri" sorulur.',
    bloklar:[
      { t:'ozet', b:'Osmanl\u0131\'n\u0131n k\u0131sa s\u00fcrede g\u00fc\u00e7lenmesinin sebepleri', i:[
        '**Co\u011frafi konum**: Bizans s\u0131n\u0131r\u0131nda, u\u00e7 beyli\u011fi olarak **gaza ve cihat** i\u00e7in elveri\u015fli konum.',
        '**Bizans\'\u0131n ve Balkanlar\u0131n zay\u0131fl\u0131\u011f\u0131**: taht kavgalar\u0131, mezhep \u00e7at\u0131\u015fmalar\u0131, feodal da\u011f\u0131n\u0131kl\u0131k.',
        '**Anadolu beylikleriyle iyi ge\u00e7inme**: enerjiyi bat\u0131ya y\u00f6neltme politikas\u0131.',
        '**\u0130sk\u00e2n (\u015fenlendirme) politikas\u0131**: fethedilen yerlere Anadolu\'dan T\u00fcrkmen aileleri yerle\u015ftirme \u2014 \u00f6zellikle **konarg\u00f6\u00e7erler** tercih edildi.',
        '**Ho\u015fg\u00f6r\u00fcl\u00fc y\u00f6netim (istimalet)**: yerli halk\u0131n din ve geleneklerine dokunulmamas\u0131, vergilerin hafifletilmesi.',
        '**Ahilerin ve T\u00fcrkmen dervi\u015flerinin deste\u011fi.**',
        '**Merkeziyet\u00e7i ve d\u00fczenli ordu** kurulmas\u0131.'
      ]},
      { t:'zaman', b:'Kurulu\u015ftan Kanuni\'ye', z:[
        { y:'1299', o:'Osman Bey \u2014 kurulu\u015f', d:'S\u00f6\u011f\u00fct merkezli. **Koyunhisar (1302)** \u2014 Bizans\'la ilk sava\u015f. \u0130lk Osmanl\u0131 paras\u0131 bast\u0131r\u0131ld\u0131.' },
        { y:'1326 \u2013 1362', o:'Orhan Bey', d:'**\u0130lk d\u00fczenli ordu** (yaya ve m\u00fcsellem), **Bursa ba\u015fkent**, **ilk medrese** (\u0130znik), **Karesi\'nin ilhak\u0131**, **\u00c7impe Kalesi 1353** ile Rumeli\'ye ge\u00e7i\u015f. **\u0130lk kapit\u00fclasyonlar (1352, Cenevizlilere).**' },
        { y:'1362 \u2013 1389', o:'I. Murad', d:'**Yeni\u00e7eri Oca\u011f\u0131**, **dev\u015firme** ve **pen\u00e7ik** sistemi, **Rumeli Beylerbeyli\u011fi**. S\u0131rps\u0131nd\u0131\u011f\u0131 1364, **I. Kosova 1389**. *"\u00dclke h\u00fck\u00fcmdar ve o\u011fullar\u0131n\u0131nd\u0131r"* anlay\u0131\u015f\u0131.' },
        { y:'1389 \u2013 1402', o:'Y\u0131ld\u0131r\u0131m Bayezid', d:'**Ni\u011fbolu 1396** \u2014 son b\u00fcy\u00fck Ha\u00e7l\u0131 seferi. \u0130stanbul ku\u015fatmalar\u0131, **Anadolu Hisar\u0131**. **Ankara Sava\u015f\u0131 1402** \u2014 Timur\'a yenilgi \u2192 **Fetret Devri (1402-1413)**.' },
        { y:'1413 \u2013 1421', o:'\u00c7elebi Mehmet', d:'Fetret Devri\'ni sona erdirdi; **devletin ikinci kurucusu** say\u0131l\u0131r. **\u015eeyh Bedreddin \u0130syan\u0131** bast\u0131r\u0131ld\u0131.' },
        { y:'1421 \u2013 1451', o:'II. Murad', d:'**Edirne-Segedin 1444** (ilk kez e\u015fit ko\u015fullarda antla\u015fma), **Varna 1444**, **II. Kosova 1448** \u2014 Ha\u00e7l\u0131lar\u0131n sald\u0131r\u0131 g\u00fcc\u00fc bitti, T\u00fcrkler Balkanlarda kesin \u00fcst\u00fcnl\u00fck sa\u011flad\u0131.' },
        { y:'1451 \u2013 1481', o:'Fatih Sultan Mehmet', d:'**\u0130stanbul\'un Fethi 1453** \u2192 Orta \u00c7a\u011f kapand\u0131. **Otlukbeli 1473** (Uzun Hasan), **K\u0131r\u0131m 1475** (Karadeniz T\u00fcrk g\u00f6l\u00fc), Trabzon, Ege adalar\u0131. **Kanunname-i Ali Osman** \u2014 ilk Osmanl\u0131 kanunnamesi.' },
        { y:'1481 \u2013 1512', o:'II. Bayezid', d:'**Cem Sultan olay\u0131** \u2014 Osmanl\u0131 i\u00e7 sorunu Avrupa\'n\u0131n elinde koza d\u00f6n\u00fc\u015ft\u00fc; fetihler duraksad\u0131.' },
        { y:'1512 \u2013 1520', o:'Yavuz Sultan Selim', d:'**\u00c7ald\u0131ran 1514** (\u015eah \u0130smail), Turnada\u011f 1515, **Mercidab\u0131k 1516** ve **Ridaniye 1517** \u2192 Meml\u00fckler y\u0131k\u0131ld\u0131, **halifelik Osmanl\u0131\'ya ge\u00e7ti**, Baharat Yolu ve **Mekke-Medine\'nin hamili\u011fi** kazan\u0131ld\u0131.' },
        { y:'1520 \u2013 1566', o:'Kanuni Sultan S\u00fcleyman', d:'Belgrad 1521, Rodos 1522, **Moha\u00e7 1526**, **I. Viyana Ku\u015fatmas\u0131 1529**, **Preveze 1538** (Barbaros), **Fransa\'ya kapit\u00fclasyonlar 1535**, **Amasya 1555** (\u0130ran\'la ilk antla\u015fma).' }
      ]},
      { t:'kod', b:'Haf\u0131za kodu', x:'**Yavuz = Do\u011fu ve G\u00fcney** (\u0130ran, Suriye, M\u0131s\u0131r, halifelik). **Kanuni = Bat\u0131 ve Deniz** (Macaristan, Viyana, Akdeniz). Y\u00f6n kar\u0131\u015f\u0131rsa padi\u015fah da kar\u0131\u015f\u0131r.' },
      { t:'tuzak', i:[
        '**Fetret Devri\'nde (1402-1413) Osmanl\u0131 y\u0131k\u0131lmad\u0131**, taht kavgas\u0131 ya\u015fand\u0131. Bu d\u00f6nemde Balkanlarda toprak kaybedilmemesi **isk\u00e2n ve istimalet politikas\u0131n\u0131n** ba\u015far\u0131s\u0131 say\u0131l\u0131r.',
        '**\u0130lk kapit\u00fclasyonlar 1352\'de Orhan Bey d\u00f6neminde Cenevizlilere** verilmi\u015ftir. 1535\'te Kanuni\'nin Fransa\'ya verdikleri ise **en kapsaml\u0131** olan\u0131d\u0131r.',
        '**Halifelik Yavuz d\u00f6neminde (1517)** ge\u00e7mi\u015ftir; Fatih de\u011fil. Yavuz ayn\u0131 zamanda **Mekke ve Medine\'nin hamisi ve hac yollar\u0131n\u0131n koruyucusu** olmu\u015ftur.',
        '**Preveze 1538 Akdeniz\'i, K\u0131r\u0131m\'\u0131n al\u0131nmas\u0131 1475 Karadeniz\'i** T\u00fcrk g\u00f6l\u00fc yapt\u0131.',
        '**Otlukbeli Akkoyunlu**\'ya, **\u00c7ald\u0131ran Safevi**\'ye kar\u015f\u0131d\u0131r. \u0130kisi de do\u011fuda ama farkl\u0131 devletlerdir.',
        '**\u0130stanbul\'un fethi Orta \u00c7a\u011f\'\u0131 bitirdi, Yeni \u00c7a\u011f\'\u0131 ba\u015flatt\u0131**; ayr\u0131ca co\u011frafi ke\u015fifleri h\u0131zland\u0131rd\u0131\u011f\u0131 da s\u00f6ylenir.'
      ]},
      { t:'test', s:[
        { q:'Osmanl\u0131 Devleti\'nde halifeli\u011fin padi\u015fahlara ge\u00e7mesi hangi padi\u015fah d\u00f6neminde ger\u00e7ekle\u015fmi\u015ftir?',
          c:['Fatih Sultan Mehmet','Yavuz Sultan Selim','Kanuni Sultan S\u00fcleyman','II. Bayezid'], d:1,
          a:'1517 Ridaniye Sava\u015f\u0131 sonras\u0131nda Meml\u00fck Devleti\'nin y\u0131k\u0131lmas\u0131yla halifelik Yavuz Sultan Selim d\u00f6neminde Osmanl\u0131\'ya ge\u00e7mi\u015ftir.' },
        { q:'Osmanl\u0131 padi\u015fah\u0131n\u0131n sadece bir gazi sultan de\u011fil, ayn\u0131 zamanda Mekke ve Medine\'nin hamisi ve hac yollar\u0131n\u0131n koruyucusu h\u00e2line gelmesi a\u015fa\u011f\u0131dakilerden hangisinin sonucudur?',
          c:['\u0130stanbul\'un fethi','M\u0131s\u0131r Seferi','Moha\u00e7 Meydan Muharebesi','Preveze Deniz Sava\u015f\u0131'],
          d:1, a:'1516-1517 M\u0131s\u0131r Seferi (Mercidab\u0131k ve Ridaniye) ile Meml\u00fckler y\u0131k\u0131lm\u0131\u015f, kutsal topraklar\u0131n koruyuculu\u011fu Osmanl\u0131\'ya ge\u00e7mi\u015ftir.' },
        { q:'Osmanl\u0131 Devleti\'nin Rumeli\'ye ge\u00e7i\u015fi hangi padi\u015fah d\u00f6neminde ve hangi kale ile olmu\u015ftur?',
          c:['Osman Bey \u2013 Karacahisar','Orhan Bey \u2013 \u00c7impe','I. Murad \u2013 Edirne','Y\u0131ld\u0131r\u0131m Bayezid \u2013 Ni\u011fbolu'], d:1,
          a:'1353\'te Orhan Bey d\u00f6neminde \u00c7impe Kalesi\'nin al\u0131nmas\u0131yla Osmanl\u0131 Rumeli\'ye ilk kez ayak basm\u0131\u015ft\u0131r.' },
        { q:'Osmanl\u0131 tarihinde Fetret Devri olarak bilinen d\u00f6nem hangi padi\u015fah taraf\u0131ndan sona erdirilmi\u015ftir?',
          c:['II. Murad','\u00c7elebi Mehmet','Y\u0131ld\u0131r\u0131m Bayezid','Fatih Sultan Mehmet'], d:1,
          a:'1413\'te \u00c7elebi Mehmet karde\u015fleriyle m\u00fccadeleyi kazanarak Fetret Devri\'ni bitirmi\u015f ve devletin ikinci kurucusu say\u0131lm\u0131\u015ft\u0131r.' },
        { q:'A\u015fa\u011f\u0131dakilerden hangisi XIV. y\u00fczy\u0131lda Osmanl\u0131 Devleti\'nin Balkanlar\'a ge\u00e7i\u015fini kolayla\u015ft\u0131ran durumlardan biridir?',
          c:['Bizans\'ta ve Balkan devletlerinde siyasi birli\u011fin bulunmamas\u0131','Co\u011frafi ke\u015fiflerin ba\u015flamas\u0131','Kapit\u00fclasyonlar\u0131n kald\u0131r\u0131lmas\u0131','R\u00f6nesans hareketlerinin yay\u0131lmas\u0131'],
          d:0, a:'Bizans\'taki taht kavgalar\u0131, Balkanlardaki feodal da\u011f\u0131n\u0131kl\u0131k ve mezhep \u00e7at\u0131\u015fmalar\u0131 Osmanl\u0131\'n\u0131n ilerlemesini kolayla\u015ft\u0131rm\u0131\u015ft\u0131r.' },
        { q:'A\u015fa\u011f\u0131daki sava\u015flardan hangisi sonucunda Akdeniz\'de T\u00fcrk \u00fcst\u00fcnl\u00fc\u011f\u00fc kesinle\u015fmi\u015ftir?',
          c:['Preveze Deniz Sava\u015f\u0131','\u0130nebaht\u0131 Deniz Sava\u015f\u0131','Otlukbeli Sava\u015f\u0131','Moha\u00e7 Sava\u015f\u0131'], d:0,
          a:'1538 Preveze Deniz Sava\u015f\u0131\'nda Barbaros Hayreddin Pa\u015fa Ha\u00e7l\u0131 donanmas\u0131n\u0131 yenmi\u015f, Akdeniz T\u00fcrk g\u00f6l\u00fc h\u00e2line gelmi\u015ftir.' },
        { q:'Osmanl\u0131 Devleti\'nde fethedilen b\u00f6lgelere Anadolu\'dan T\u00fcrkmen ailelerin yerle\u015ftirilmesine dayanan politikaya ne ad verilir?',
          c:['\u0130stimalet','\u0130sk\u00e2n','Dev\u015firme','M\u00fcsadere'], d:1,
          a:'\u0130sk\u00e2n (\u015fenlendirme) politikas\u0131nda fethedilen yerlere \u00f6zellikle konarg\u00f6\u00e7er T\u00fcrkmenler yerle\u015ftirilerek b\u00f6lgenin T\u00fcrkle\u015fmesi ve g\u00fcvenli\u011fi sa\u011flanm\u0131\u015ft\u0131r.' },
        { q:'Yeni\u00e7eri Oca\u011f\u0131 ve dev\u015firme sistemi hangi padi\u015fah d\u00f6neminde olu\u015fturulmu\u015ftur?',
          c:['Orhan Bey','I. Murad','Y\u0131ld\u0131r\u0131m Bayezid','II. Murad'], d:1,
          a:'I. Murad d\u00f6neminde pen\u00e7ik sistemiyle Yeni\u00e7eri Oca\u011f\u0131 kurulmu\u015f, dev\u015firme uygulamas\u0131 ba\u015flat\u0131lm\u0131\u015ft\u0131r.' },
        { q:'Osmanl\u0131 Devleti\'nin Ha\u00e7l\u0131larla e\u015fit ko\u015fullarda imzalad\u0131\u011f\u0131 ilk antla\u015fma hangisidir?',
          c:['Edirne-Segedin Antla\u015fmas\u0131','Zitvatorok Antla\u015fmas\u0131','Karlof\u00e7a Antla\u015fmas\u0131','Buca\u015f Antla\u015fmas\u0131'],
          d:0, a:'1444 Edirne-Segedin Antla\u015fmas\u0131, Osmanl\u0131\'n\u0131n bir Ha\u00e7l\u0131 toplulu\u011fuyla e\u015fit ko\u015fullarda imzalad\u0131\u011f\u0131 ilk antla\u015fmad\u0131r.' },
        { q:'Osmanl\u0131 Devleti\'nde ilk kapit\u00fclasyonlar hangi padi\u015fah d\u00f6neminde ve kime verilmi\u015ftir?',
          c:['Orhan Bey \u2013 Cenevizlilere','Fatih \u2013 Venediklilere','Kanuni \u2013 Frans\u0131zlara','II. Bayezid \u2013 \u0130ngilizlere'],
          d:0, a:'\u0130lk ticari ayr\u0131cal\u0131klar 1352\'de Orhan Bey d\u00f6neminde Cenevizlilere verilmi\u015ftir; 1535\'te Kanuni\'nin Fransa\'ya verdi\u011fi kapit\u00fclasyonlar ise en kapsaml\u0131 olan\u0131d\u0131r.' },
        { q:'\u0130stanbul\'un fethinin d\u00fcnya tarihi bak\u0131m\u0131ndan sonu\u00e7lar\u0131 aras\u0131nda a\u015fa\u011f\u0131dakilerden hangisi yer **almaz**?',
          c:['Orta \u00c7a\u011f\'\u0131n kapanmas\u0131','Co\u011frafi ke\u015fiflerin h\u0131zlanmas\u0131','Bizans \u0130mparatorlu\u011fu\'nun sona ermesi','Sanayi \u0130nk\u0131lab\u0131\'n\u0131n ba\u015flamas\u0131'],
          d:3, a:'Sanayi \u0130nk\u0131lab\u0131 18. y\u00fczy\u0131lda \u0130ngiltere\'de ba\u015flam\u0131\u015ft\u0131r ve \u0130stanbul\'un fethiyle do\u011frudan bir ba\u011f\u0131 yoktur.' },
        { q:'Fatih Sultan Mehmet D\u00f6nemi\'nde Karadeniz\'in bir T\u00fcrk g\u00f6l\u00fc h\u00e2line gelmesini sa\u011flayan geli\u015fme hangisidir?',
          c:['Trabzon\'un fethi','K\u0131r\u0131m\'\u0131n al\u0131nmas\u0131','Otlukbeli Sava\u015f\u0131','Ege adalar\u0131n\u0131n fethi'],
          d:1, a:'1475\'te K\u0131r\u0131m\'\u0131n Osmanl\u0131 egemenli\u011fine girmesiyle Karadeniz bir T\u00fcrk g\u00f6l\u00fc h\u00e2line gelmi\u015ftir.' },
        { q:'Cem Sultan olay\u0131n\u0131n Osmanl\u0131 Devleti a\u00e7\u0131s\u0131ndan en \u00f6nemli sonucu a\u015fa\u011f\u0131dakilerden hangisidir?',
          c:['Anadolu\'da beylikler yeniden kurulmu\u015ftur.','Bir i\u00e7 sorun d\u0131\u015f politikada Avrupa\'n\u0131n koz olarak kulland\u0131\u011f\u0131 bir mesele h\u00e2line gelmi\u015ftir.','Halifelik Osmanl\u0131\'ya ge\u00e7mi\u015ftir.','Yeni\u00e7eri Oca\u011f\u0131 kald\u0131r\u0131lm\u0131\u015ft\u0131r.'],
          d:1, a:'Cem Sultan\'\u0131n Avrupa\'ya s\u0131\u011f\u0131nmas\u0131, bir taht kavgas\u0131n\u0131 uluslararas\u0131 bir soruna d\u00f6n\u00fc\u015ft\u00fcrm\u00fc\u015f ve II. Bayezid d\u00f6neminde fetihleri yava\u015flatm\u0131\u015ft\u0131r.' },
        { q:'Osmanl\u0131 Devleti\'nin ilk d\u00fczenli ordusu olan "yaya ve m\u00fcsellem" hangi padi\u015fah d\u00f6neminde kurulmu\u015ftur?',
          c:['Osman Bey','Orhan Bey','I. Murad','Y\u0131ld\u0131r\u0131m Bayezid'], d:1,
          a:'\u0130lk d\u00fczenli ordu birlikleri olan yaya (piyade) ve m\u00fcsellem (atl\u0131), Orhan Bey d\u00f6neminde olu\u015fturulmu\u015ftur.' },
        { q:'A\u015fa\u011f\u0131dakilerden hangisi Osmanl\u0131 Devleti\'nin Anadolu\'da siyasi birli\u011fi sa\u011flamaya y\u00f6nelik faaliyetlerinden biri **de\u011fildir**?',
          c:['Karesio\u011fullar\u0131\'n\u0131n ilhak\u0131','Otlukbeli Sava\u015f\u0131','Turnada\u011f Sava\u015f\u0131','Preveze Deniz Sava\u015f\u0131'],
          d:3, a:'Preveze Deniz Sava\u015f\u0131 Akdeniz\'de Ha\u00e7l\u0131 donanmas\u0131na kar\u015f\u0131 yap\u0131lm\u0131\u015ft\u0131r; Anadolu\'daki siyasi birlikle ilgisi yoktur.' },
        { q:'Kanuni Sultan S\u00fcleyman D\u00f6nemi\'nde \u0130ran ile imzalanan ve iki devlet aras\u0131ndaki ilk resm\u00ee antla\u015fma olan belge hangisidir?',
          c:['Amasya Antla\u015fmas\u0131','Ferhat Pa\u015fa Antla\u015fmas\u0131','Kasr-\u0131 \u015eirin Antla\u015fmas\u0131','Nasuh Pa\u015fa Antla\u015fmas\u0131'],
          d:0, a:'1555 Amasya Antla\u015fmas\u0131, Osmanl\u0131 ile \u0130ran (Safeviler) aras\u0131nda imzalanan ilk resm\u00ee antla\u015fmad\u0131r.' }
      ]}
    ]},

  /* ========= 7 ========= */
  { id:'duraklama', ad:'17. Y\u00fczy\u0131l \u2014 Duraklama D\u00f6nemi', soru:'1 soru', durum:'hazir',
    ozet:'Antla\u015fma\u2013sonu\u00e7 e\u015fle\u015ftirmesi, Celali \u0130syanlar\u0131 ve 17. y\u00fczy\u0131l \u0131slahatlar\u0131n\u0131n niteli\u011fi.',
    bloklar:[
      { t:'tablo', b:'17. y\u00fczy\u0131l antla\u015fmalar\u0131', h:['Antla\u015fma','Taraf','Sonu\u00e7'], r:[
        ['**Zitvatorok 1606**','Avusturya','Avusturya ar\u015fid\u00fck\u00fc **padi\u015faha denk** say\u0131ld\u0131 \u2192 Osmanl\u0131 \u00fcst\u00fcnl\u00fc\u011f\u00fc sona erdi. Y\u0131ll\u0131k vergi kald\u0131r\u0131ld\u0131.'],
        ['Nasuh Pa\u015fa 1612','\u0130ran','Osmanl\u0131 1590\'da ald\u0131\u011f\u0131 topraklar\u0131 geri verdi.'],
        ['**Kasr-\u0131 \u015eirin 1639**','\u0130ran','**Bug\u00fcnk\u00fc T\u00fcrkiye-\u0130ran s\u0131n\u0131r\u0131n\u0131n temeli.** Ba\u011fdat Osmanl\u0131\'da kald\u0131.'],
        ['Vasvar 1664','Avusturya','Uyvar al\u0131nd\u0131; Osmanl\u0131 lehine son Avusturya antla\u015fmas\u0131.'],
        ['**Buca\u015f 1672**','Lehistan','Podolya al\u0131nd\u0131 \u2014 **Osmanl\u0131 en geni\u015f s\u0131n\u0131rlar\u0131na** ula\u015ft\u0131.'],
        ['**Karlof\u00e7a 1699**','Kutsal \u0130ttifak','**\u0130lk b\u00fcy\u00fck toprak kayb\u0131.** Duraklama bitti, gerileme ba\u015flad\u0131.']
      ]},
      { t:'ozet', b:'Duraklaman\u0131n sebepleri', i:[
        '**\u0130\u00e7 sebepler**: merkez\u00ee otoritenin zay\u0131flamas\u0131, **\u015fehzadelerin sanca\u011fa \u00e7\u0131kma usul\u00fcn\u00fcn kald\u0131r\u0131lmas\u0131**, **t\u0131mar sisteminin bozulmas\u0131**, kap\u0131kulu ocaklar\u0131n\u0131n siyasete kar\u0131\u015fmas\u0131, ilmiye s\u0131n\u0131f\u0131n\u0131n bozulmas\u0131 (be\u015fik ulemas\u0131), r\u00fc\u015fvet ve iltimas, saray kad\u0131nlar\u0131n\u0131n y\u00f6netime kar\u0131\u015fmas\u0131.',
        '**D\u0131\u015f sebepler**: **do\u011fal s\u0131n\u0131rlara ula\u015f\u0131lmas\u0131**, Avrupa\'da merkez\u00ee krall\u0131klar\u0131n g\u00fc\u00e7lenmesi, **co\u011frafi ke\u015fiflerle** ticaret yollar\u0131n\u0131n \u00f6nem kaybetmesi, teknolojide geri kal\u0131\u015f.',
        '**Celali \u0130syanlar\u0131**: Anadolu\'da devlet d\u00fczeninin bozulmas\u0131ndan kaynaklanan halk ve asker isyanlar\u0131. **Din\u00ee de\u011fil, ekonomik ve idari** kaynakl\u0131d\u0131r. \u00dcretim d\u00fc\u015ft\u00fc, "b\u00fcy\u00fck ka\u00e7gunluk" ad\u0131 verilen g\u00f6\u00e7ler ya\u015fand\u0131.',
        '**Ekber ve er\u015fed sistemi** (I. Ahmed): hanedan\u0131n **en ya\u015fl\u0131 ve olgun** \u00fcyesinin tahta ge\u00e7mesi. Taht kavgalar\u0131n\u0131 azaltt\u0131 ama **deneyimsiz padi\u015fahlar** d\u00f6nemini ba\u015flatt\u0131.',
        '**II. Osman (Gen\u00e7 Osman)**: **yeni\u00e7eriler taraf\u0131ndan \u00f6ld\u00fcr\u00fclen ilk padi\u015fah**t\u0131r.',
        '**IV. Murad**: Revan ve Ba\u011fdat seferleri; **Ko\u00e7i Bey Risalesi** ona sunuldu.',
        '**K\u00f6pr\u00fcl\u00fcler D\u00f6nemi (1656-1691)**: ge\u00e7ici toparlanma; **Girit tamamen al\u0131nd\u0131 (1669)**.'
      ]},
      { t:'ozet', b:'17. y\u00fczy\u0131l \u0131slahat\u00e7\u0131lar\u0131 ve eserleri', i:[
        '**Ko\u00e7i Bey** \u2014 *Ko\u00e7i Bey Risalesi*, IV. Murad\'a sunuldu. "Osmanl\u0131\'n\u0131n Montesquieu\'s\u00fc" denir.',
        '**K\u00e2tip \u00c7elebi** \u2014 *D\u00fcstur\u00fc\'l Amel*, *Ke\u015ff\u00fc\'z-Z\u00fcnun*, *Cihann\u00fcma*.',
        '**Aziz Efendi** \u2014 *Kanunname-i Sultani*.',
        '**Defterdar Sar\u0131 Mehmet Pa\u015fa** \u2014 *Nesayih\u00fc\'l V\u00fczera*.',
        'Bu d\u00f6nemde \u0131slahatlar **"eski d\u00fczene d\u00f6n\u00fc\u015f"** amac\u0131 ta\u015f\u0131r ve **ki\u015filere ba\u011fl\u0131, bask\u0131c\u0131** oldu\u011fu i\u00e7in kal\u0131c\u0131 olmam\u0131\u015ft\u0131r.'
      ]},
      { t:'kod', b:'Haf\u0131za kodu', x:'**Zitvatorok = e\u015fitlik \u00b7 Kasr-\u0131 \u015eirin = s\u0131n\u0131r \u00b7 Buca\u015f = zirve \u00b7 Karlof\u00e7a = d\u00fc\u015f\u00fc\u015f.** D\u00f6rt antla\u015fma 17. y\u00fczy\u0131l\u0131n tamam\u0131n\u0131 \u00f6zetler.' },
      { t:'tuzak', i:[
        '**Duraklaman\u0131n ba\u015flang\u0131c\u0131 Zitvatorok 1606, sonu Karlof\u00e7a 1699** kabul edilir.',
        '**Karlof\u00e7a ile ilk kez b\u00fcy\u00fck \u00f6l\u00e7ekli toprak kaybedildi**; "ilk toprak kayb\u0131" ifadesi bu antla\u015fma i\u00e7indir.',
        '**Celali \u0130syanlar\u0131 din\u00ee de\u011fil, ekonomik ve idari** sebeplidir; ama\u00e7 devleti y\u0131kmak de\u011fildir.',
        '**Girit Seferi 24 y\u0131l (1645-1669) s\u00fcrd\u00fc** \u2014 Osmanl\u0131 tarihinin en uzun ku\u015fatmas\u0131d\u0131r.',
        '**17. y\u00fczy\u0131l \u0131slahatlar\u0131 "eski d\u00fczene d\u00f6n\u00fc\u015f"** hedefler; **18. y\u00fczy\u0131lda ise Avrupa \u00f6rnek al\u0131n\u0131r.** Bu fark s\u0131k sorulur.',
        '**Kasr-\u0131 \u015eirin s\u0131n\u0131r\u0131 bug\u00fcne kadar b\u00fcy\u00fck \u00f6l\u00e7\u00fcde korunmu\u015ftur.**'
      ]},
      { t:'test', s:[

        { y:'1865 sonras\u0131', o:'Yeni Osmanl\u0131lar (Gen\u00e7 Osmanl\u0131lar)', d:'**Me\u015frutiyet** ve **anayasa** isteyen ayd\u0131n hareketi. Ama\u00e7: **Osmanl\u0131c\u0131l\u0131k** ile imparatorlu\u011fun da\u011f\u0131lmas\u0131n\u0131 \u00f6nlemek. Nam\u0131k Kemal, Ziya Pa\u015fa, \u015einasi, Ali Suavi.' },
        { y:'1876', o:'I. Me\u015frutiyet', d:'**II. Abd\u00fclhamid \u2013 Mithat Pa\u015fa. Kanun-i Esasi: ilk Osmanl\u0131 anayasas\u0131.** Meclis-i Umumi (Ayan + Mebusan) a\u00e7\u0131ld\u0131. **Yasama yetkisi Ayan ve Mebusan Meclisi\'ne** verildi ama padi\u015fah\u0131n \u00fcst\u00fcnl\u00fc\u011f\u00fc s\u00fcrd\u00fc.' },
        { y:'1877\u201378', o:'93 Harbi', d:'Rusya\'ya a\u011f\u0131r yenilgi. **Ayastefanos** imzaland\u0131 ama uygulanmad\u0131; yerine **Berlin Antla\u015fmas\u0131 1878** y\u00fcr\u00fcrl\u00fc\u011fe girdi. **K\u0131br\u0131s\'\u0131n y\u00f6netimi \u0130ngiltere\'ye** b\u0131rak\u0131ld\u0131.' },

      { t:'ozet', b:'II. Mahmud\'un yenilikleri (s\u0131k sorulur)', i:[

      { t:'kod', b:'Haf\u0131za kodu', x:'**1839 Tanzimat = herkes \u00b7 1856 Islahat = gayrim\u00fcslimler \u00b7 1876 Kanun-i Esasi = anayasa.** Fermanlar giderek daral\u0131r, sonunda anayasaya var\u0131r. **Islahat d\u0131\u015f bask\u0131yla, Tanzimat i\u00e7 kaynakl\u0131d\u0131r.**' },
      { t:'tuzak', i:[

        '**Yunanistan 1829 Edirne Antla\u015fmas\u0131 ile ba\u011f\u0131ms\u0131zl\u0131\u011f\u0131n\u0131 kazanan ilk az\u0131nl\u0131kt\u0131r.**'

        ['**Ni\u015fanc\u0131**','Padi\u015fah **tu\u011fras\u0131n\u0131** \u00e7eker; tapu-kadastro (tahrir defterleri) ve d\u0131\u015f yaz\u0131\u015fmalar.'],
        ['**Kaptan-\u0131 Derya**','Donanma komutan\u0131 (Divan\'a sonradan kat\u0131ld\u0131).'],
        ['**Yeni\u00e7eri A\u011fas\u0131**','Kap\u0131kulu ocaklar\u0131n\u0131n ba\u015f\u0131 (sonradan kat\u0131ld\u0131).'],
        ['**\u015eeyh\u00fclislam**','**Divan \u00fcyesi DE\u011e\u0130LD\u0130R**; kararlar\u0131n dine uygunlu\u011funu bildiren **fetva** makam\u0131d\u0131r.']
      ]},
      { t:'tablo', b:'Toplum yap\u0131s\u0131 \u2014 y\u00f6netenler ve y\u00f6netilenler', h:['S\u0131n\u0131f','Kimler / g\u00f6rev'], r:[
        ['**Seyfiye (ehl-i \u00f6rf)**','Asker\u00ee ve idari s\u0131n\u0131f: **veziriazam**, beylerbeyi, sancakbeyi, yeni\u00e7eri a\u011fas\u0131, kap\u0131kulu ve t\u0131marl\u0131 sipahi.'],
        ['**\u0130lmiye (ehl-i \u015fer)**','E\u011fitim, hukuk ve din: **\u015feyh\u00fclislam**, kazasker, kad\u0131, m\u00fcderris, m\u00fcft\u00fc.'],
        ['**Kalemiye (ehl-i kalem)**','B\u00fcrokrasi ve maliye: **ni\u015fanc\u0131**, defterdar, reis\u00fclk\u00fcttap.'],
        ['**Reaya (y\u00f6netilenler)**','Vergi veren \u00fcretici halk: k\u00f6yl\u00fc, esnaf, t\u00fcccar, g\u00f6\u00e7ebe. **M\u00fcslim ve gayrim\u00fcslim** ayr\u0131m\u0131 g\u00f6zetilmez.']
      ]},
      { t:'tablo', b:'Toprak ve ordu d\u00fczeni', h:['Sistem','Ayr\u0131nt\u0131'], r:[
        ['**Miri arazi**','M\u00fclkiyeti **devlete** ait topraklar; en b\u00fcy\u00fck b\u00f6l\u00fcm. **Sat\u0131lamaz ve miras b\u0131rak\u0131lamaz.**'],
        ['**Dirlik**','**Has** (100.000 ak\u00e7e \u00fcst\u00fc) \u00b7 **Zeamet** (20.000-100.000) \u00b7 **T\u0131mar** (3.000-20.000 ak\u00e7e)'],
        ['**Salyaneli eyalet**','T\u0131mar uygulanmayan, vergisi **y\u0131ll\u0131k toplan\u0131p** hazineye g\u00f6nderilen uzak eyaletler (M\u0131s\u0131r, Cezayir, Ba\u011fdat, Yemen).'],
        ['**Salyanesiz eyalet**','**T\u0131mar sisteminin uyguland\u0131\u011f\u0131** merkeze yak\u0131n eyaletler.'],
        ['**Kap\u0131kulu askerleri**','**Dev\u015firme** k\u00f6kenli, **maa\u015fl\u0131 (ulufe)**, \u0130stanbul\'da. Yaya: yeni\u00e7eri, **cebeci**, top\u00e7u, top arabac\u0131, humbarac\u0131, la\u011f\u0131mc\u0131. Atl\u0131: kap\u0131kulu sipahisi.'],
        ['**Eyalet askerleri**','**T\u0131marl\u0131 sipahiler** \u2014 maa\u015f almaz, dirlik geliriyle **cebel\u00fc** besler. **Ordunun en kalabal\u0131k b\u00f6l\u00fcm\u00fc.**'],
        ['**Cebehane Oca\u011f\u0131**','Yeni\u00e7erilerin **ok, yay, kalkan, k\u0131l\u0131\u00e7, z\u0131rh, t\u00fcfek** gibi silahlar\u0131n\u0131n yap\u0131ld\u0131\u011f\u0131 ve onar\u0131ld\u0131\u011f\u0131 ocak.']
      ]},
      { t:'ozet', b:'Ekonomi, esnaf ve e\u011fitim', i:[
        '**Lonca (esnaf te\u015fkilat\u0131)**: fiyat ve kalite denetimi, mesle\u011fe giri\u015f d\u00fczeni, kar\u015f\u0131l\u0131kl\u0131 yard\u0131mla\u015fma. **Toplumun e\u011fitim-\u00f6\u011fretim faaliyetlerini y\u00fcr\u00fctmek loncan\u0131n g\u00f6revi de\u011fildir.**',
        '**Gedik**: bir i\u015fi yapabilme ve i\u015f yeri a\u00e7abilme izin belgesi \u2014 **\u00e7\u0131ra\u011f\u0131n ustala\u015ft\u0131\u011f\u0131n\u0131 g\u00f6steren belge**.',
        '**Narh**: devletin koydu\u011fu **azami fiyat**. **\u0130htisap**: \u00e7ar\u015f\u0131-pazar denetimi (muhtesip).',
        '**\u0130a\u015fe (provizyonizm)** ilkesi: \u00f6nce halk\u0131n ihtiyac\u0131 kar\u015f\u0131lan\u0131r; baz\u0131 b\u00f6lgeler \u0130stanbul\'a et ve tah\u0131l g\u00f6ndermekle **y\u00fck\u00fcml\u00fc** tutulurdu.',
        '**Ta\u011f\u015fi\u015f**: paran\u0131n i\u00e7indeki de\u011ferli maden oran\u0131n\u0131n d\u00fc\u015f\u00fcr\u00fclmesi \u2014 16. y\u00fczy\u0131ldan itibaren enflasyona yol a\u00e7t\u0131.',
        '**M\u00fcsadere**: devlet g\u00f6revlisinin mal varl\u0131\u011f\u0131na devlet\u00e7e el konulmas\u0131 (II. Mahmud kald\u0131rd\u0131).',
        '**E\u011fitim**: s\u0131byan mektebi (ilk\u00f6\u011fretim) \u2192 **medrese** (y\u00fcksek\u00f6\u011fretim) \u2192 **Enderun** (saray okulu, devlet adam\u0131 yeti\u015ftirir).',
        '**Vak\u0131f ve imaret**: cami, medrese, dar\u00fc\u015f\u015fifa, a\u015fevi. **\u0130marette zengin-fakir ayr\u0131m\u0131 yap\u0131lmadan** yemek verilirdi \u2014 sosyal devlet anlay\u0131\u015f\u0131n\u0131n g\u00f6stergesi.',
        '**Millet sistemi**: gruplar **din esas\u0131na** g\u00f6re \u00f6rg\u00fctlenir; her cemaat kendi i\u00e7 hukukunu uygular.'
      ]},
      { t:'kod', b:'Haf\u0131za kodu', x:'**Divan\'\u0131n d\u00f6rt asl\u0131: Vezir \u2013 Kazasker \u2013 Defterdar \u2013 Ni\u015fanc\u0131.** Kaptan-\u0131 Derya ve Yeni\u00e7eri A\u011fas\u0131 sonradan kat\u0131l\u0131r, **\u015eeyh\u00fclislam \u00fcye de\u011fildir.** "Divan \u00fcyesi olmayan hangisidir?" sorusunun cevab\u0131 hep \u015eeyh\u00fclislam\'d\u0131r.' },
      { t:'tuzak', i:[
        '**\u015eeyh\u00fclislam Divan \u00fcyesi de\u011fildir.** Fetva verir ama oylamaya kat\u0131lmaz. En s\u0131k sorulan ayr\u0131nt\u0131d\u0131r.',
        '**Divan bir parlamento de\u011fildir**; kararlar padi\u015fah\u0131n onay\u0131yla y\u00fcr\u00fcrl\u00fc\u011fe girer.',
        '**T\u0131marl\u0131 sipahiler maa\u015f almaz**, kap\u0131kullar\u0131 \u00fc\u00e7 ayda bir **ulufe** al\u0131r.',
        '**Veziriazam seyfiye s\u0131n\u0131f\u0131ndand\u0131r**, kalemiye de\u011fil. Ni\u015fanc\u0131 ve defterdar kalemiyedir.',
        '**Loncalar e\u011fitim-\u00f6\u011fretim faaliyetlerini y\u00fcr\u00fctmez**; g\u00f6revleri fiyat, kalite ve meslek d\u00fczenidir.',
        '**Miri arazi sat\u0131lamaz ve miras b\u0131rak\u0131lamaz**; k\u00f6yl\u00fc topra\u011f\u0131 **i\u015fleme hakk\u0131na** sahiptir, m\u00fclkiyetine de\u011fil.',
        '**Salyaneli eyaletlerde t\u0131mar uygulanmaz**; bu ayr\u0131m merkeze uzakl\u0131k ve ekonomik yap\u0131yla ilgilidir.',
        '**\u0130sk\u00e2n politikas\u0131nda konarg\u00f6\u00e7erler tercih edilirdi**; ama\u00e7 hem b\u00f6lgeyi T\u00fcrkle\u015ftirmek hem de g\u00f6\u00e7ebeleri yerle\u015fik hayata ge\u00e7irmekti.'
      ]},
      { t:'test', s:[
        { q:'A\u015fa\u011f\u0131dakilerden hangisi Divan-\u0131 H\u00fcmayun\'un asli \u00fcyelerinden **de\u011fildir**?',
          c:['Veziriazam','Kazasker','\u015eeyh\u00fclislam','Defterdar'], d:2,
          a:'\u015eeyh\u00fclislam Divan \u00fcyesi de\u011fildir; al\u0131nan kararlar\u0131n dine uygunlu\u011fu konusunda fetva veren makamd\u0131r.' },
        { q:'Divan-\u0131 H\u00fcmayun\'un mal\u00ee i\u015flerden sorumlu \u00fcyesi a\u015fa\u011f\u0131dakilerden hangisidir?',
          c:['Ni\u015fanc\u0131','Defterdar','Kazasker','Reis\u00fclk\u00fcttap'], d:1,
          a:'Defterdar, devletin gelir ve giderlerinden yani maliyeden sorumlu Divan \u00fcyesidir.' },
        { q:'Osmanl\u0131 ordusunda maa\u015f almay\u0131p dirlik gelirinden asker besleyen s\u0131n\u0131f hangisidir?',
          c:['Yeni\u00e7eriler','T\u0131marl\u0131 sipahiler','Cebeciler','Top\u00e7ular'], d:1,
          a:'T\u0131marl\u0131 sipahiler dirli\u011fin gelirinden "cebel\u00fc" ad\u0131 verilen askerleri besler, hazineden maa\u015f almazlard\u0131.' },
        { q:'Osmanl\u0131 Devleti\'nde yeni\u00e7erilerin ihtiyac\u0131 olan ok, yay, kalkan, k\u0131l\u0131\u00e7, z\u0131rh ve t\u00fcfek gibi aletlerin yap\u0131ld\u0131\u011f\u0131 ve onar\u0131ld\u0131\u011f\u0131 ocak hangisidir?',
          c:['Top\u00e7u Oca\u011f\u0131','Cebehane Oca\u011f\u0131','Humbarac\u0131 Oca\u011f\u0131','La\u011f\u0131mc\u0131 Oca\u011f\u0131'], d:1,
          a:'Cebeci Oca\u011f\u0131 (Cebehane), kap\u0131kulu askerlerinin silah ve te\u00e7hizat\u0131n\u0131 \u00fcreten ve onaran ocakt\u0131r.' },
        { q:'Osmanl\u0131 Devleti\'nde bir ustan\u0131n yan\u0131nda \u00e7al\u0131\u015fan \u00e7\u0131ra\u011f\u0131n o i\u015fte ustala\u015ft\u0131\u011f\u0131n\u0131 ve i\u015fi yapmada ehliyet sahibi oldu\u011funu g\u00f6steren belge hangisidir?',
          c:['Berat','Gedik','Narh','Tezkere'], d:1,
          a:'Gedik, bir ki\u015finin mesle\u011fi icra edebilece\u011fini ve i\u015f yeri a\u00e7abilece\u011fini g\u00f6steren belgedir.' },
        { q:'Osmanl\u0131 Devleti\'nde loncalar a\u015fa\u011f\u0131daki g\u00f6revlerden hangilerini \u00fcstlenmi\u015ftir?\n\nI. Fiyatlar\u0131 denetlemek   II. Kaliteli mal ve hizmet \u00fcretilmesini sa\u011flamak   III. Toplumun b\u00fct\u00fcn e\u011fitim \u00f6\u011fretim faaliyetlerini y\u00fcr\u00fctmek',
          c:['Yaln\u0131z I','I ve II','II ve III','I, II ve III'], d:1,
          a:'Loncalar fiyat ve kalite denetimi ile meslek d\u00fczeninden sorumluydu; toplumun genel e\u011fitim-\u00f6\u011fretim faaliyetlerini y\u00fcr\u00fctmezdi.' },
        { q:'Osmanl\u0131 Devleti\'nde eyaletlerin salyaneli ve salyanesiz olarak grupland\u0131r\u0131lmas\u0131nda a\u015fa\u011f\u0131dakilerden hangisinin etkili oldu\u011fu savunulabilir?',
          c:['Eyaletlerin merkeze uzakl\u0131\u011f\u0131 ve ekonomik yap\u0131s\u0131','Eyaletlerdeki n\u00fcfusun din\u00ee yap\u0131s\u0131','Eyaletlerin fetih tarihi','Eyaletlerdeki kad\u0131lar\u0131n say\u0131s\u0131'],
          d:0, a:'Merkeze uzak ve t\u0131mara elveri\u015fli olmayan eyaletlerde vergi y\u0131ll\u0131k toplan\u0131p hazineye g\u00f6nderilirdi; bunlara salyaneli eyalet denir.' },
        { q:'Osmanl\u0131 Devleti\'nin isk\u00e2n politikas\u0131nda \u00f6zellikle konarg\u00f6\u00e7erlerin tercih edilmesiyle a\u015fa\u011f\u0131dakilerden hangisi ama\u00e7lanm\u0131\u015ft\u0131r?',
          c:['Fethedilen b\u00f6lgeyi T\u00fcrkle\u015ftirmek ve g\u00f6\u00e7ebeleri yerle\u015fik hayata ge\u00e7irmek','Ticaret yollar\u0131n\u0131 kapatmak','Vergi gelirlerini azaltmak','Asker\u00ee s\u0131n\u0131f\u0131 geni\u015fletmek'],
          d:0, a:'\u0130sk\u00e2n politikas\u0131yla hem fethedilen b\u00f6lgenin T\u00fcrkle\u015fmesi ve g\u00fcvenli\u011fi hem de konarg\u00f6\u00e7erlerin yerle\u015fik d\u00fczene ge\u00e7mesi ama\u00e7lanm\u0131\u015ft\u0131r.' },
        { q:'A\u015fa\u011f\u0131dakilerden hangisi Osmanl\u0131 toplumunda y\u00f6netici gruplar aras\u0131nda yer **almaz**?',
          c:['Seyfiye','\u0130lmiye','Kalemiye','Reaya'], d:3,
          a:'Reaya, vergi veren y\u00f6netilen kesimdir. Y\u00f6neten s\u0131n\u0131flar seyfiye, ilmiye ve kalemiyedir.' },
        { q:'"Bir imarette bulunan \u00e2lim ve salih kimselere, imarete gelen ister fakir ister zengin olsun t\u00fcm misafirlere ikramda bulunulurdu." Bu ifade a\u015fa\u011f\u0131dakilerden hangisiyle ili\u015fkilidir?',
          c:['T\u0131mar sistemi','Vak\u0131f ve sosyal yard\u0131mla\u015fma anlay\u0131\u015f\u0131','Dev\u015firme sistemi','M\u00fcsadere usul\u00fc'],
          d:1, a:'\u0130maretler vak\u0131flar arac\u0131l\u0131\u011f\u0131yla i\u015fletilirdi ve ayr\u0131m g\u00f6zetmeden hizmet verilmesi Osmanl\u0131\'daki sosyal devlet anlay\u0131\u015f\u0131n\u0131 yans\u0131t\u0131r.' },
        { q:'Osmanl\u0131 Devleti\'nde XVI. y\u00fczy\u0131ldan itibaren kar\u015f\u0131la\u015f\u0131lan ekonomik sorunlar\u0131 a\u015fmak i\u00e7in ba\u015fvurulan uygulamalar aras\u0131nda a\u015fa\u011f\u0131dakilerden hangisi yer **almaz**?',
          c:['Paran\u0131n ayar\u0131n\u0131n d\u00fc\u015f\u00fcr\u00fclmesi (ta\u011f\u015fi\u015f)','Yeni vergiler konulmas\u0131','M\u00fcsadere usul\u00fcne ba\u015fvurulmas\u0131','Kapit\u00fclasyonlar\u0131n kald\u0131r\u0131lmas\u0131'],
          d:3, a:'Kapit\u00fclasyonlar bu d\u00f6nemde kald\u0131r\u0131lmam\u0131\u015f, aksine 1740\'ta s\u00fcrekli h\u00e2le getirilmi\u015ftir. Kapit\u00fclasyonlar 1923 Lozan ile kald\u0131r\u0131lm\u0131\u015ft\u0131r.' },
        { q:'Osmanl\u0131 Devleti\'nde padi\u015fah ad\u0131na tu\u011fra \u00e7eken ve tapu-kadastro i\u015flerini y\u00fcr\u00fcten divan \u00fcyesi kimdir?',
          c:['Ni\u015fanc\u0131','Defterdar','Kazasker','Veziriazam'], d:0,
          a:'Ni\u015fanc\u0131, padi\u015fah ad\u0131na tu\u011fra \u00e7eker, tahrir defterlerini tutar ve d\u0131\u015f yaz\u0131\u015fmalar\u0131 d\u00fczenlerdi.' },
        { q:'Osmanl\u0131 Devleti\'nde saray i\u00e7in devlet adam\u0131 yeti\u015ftiren okul a\u015fa\u011f\u0131dakilerden hangisidir?',
          c:['S\u0131byan mektebi','Medrese','Enderun','R\u00fc\u015ftiye'], d:2,
          a:'Enderun, dev\u015firme yoluyla al\u0131nan yetenekli \u00e7ocuklar\u0131n devlet adam\u0131 olarak yeti\u015ftirildi\u011fi saray okuludur.' },
        { q:'Osmanl\u0131 ekonomisinde \u00f6nce \u00fclke i\u00e7indeki ihtiyac\u0131n kar\u015f\u0131lanmas\u0131, baz\u0131 b\u00f6lgelerin \u0130stanbul\'a et ve tah\u0131l g\u00f6ndermekle y\u00fck\u00fcml\u00fc tutulmas\u0131 hangi ilkeyle a\u00e7\u0131klan\u0131r?',
          c:['\u0130a\u015fe (provizyonizm)','Merkantilizm','Fiskalizm','Serbest ticaret'],
          d:0, a:'\u0130a\u015fe ilkesi, mal darl\u0131\u011f\u0131 ya\u015fanmamas\u0131 ve halk\u0131n ihtiyac\u0131n\u0131n \u00f6nce kar\u015f\u0131lanmas\u0131 esas\u0131na dayan\u0131r.' },
        { q:'Klasik D\u00f6nem Osmanl\u0131 yarg\u0131 sistemi ile ilgili a\u015fa\u011f\u0131dakilerden hangisi **s\u00f6ylenemez**?',
          c:['\u015eer\'i ve \u00f6rfi hukuk birlikte uygulanm\u0131\u015ft\u0131r.','Kad\u0131lar kazasker taraf\u0131ndan atanm\u0131\u015ft\u0131r.','Kad\u0131lar hem yarg\u0131 hem belediye g\u00f6revleri y\u00fcr\u00fctm\u00fc\u015ft\u00fcr.','Gayrim\u00fcslimler hi\u00e7bir konuda kendi mahkemelerine ba\u015fvuramazd\u0131.'],
          d:3, a:'Millet sistemi gere\u011fi gayrim\u00fcslimler aile ve miras gibi konularda kendi cemaat mahkemelerine ba\u015fvurabiliyordu.' },
        { q:'Osmanl\u0131 Devleti\'nde t\u0131marl\u0131 sipahiler ile ilgili a\u015fa\u011f\u0131daki yarg\u0131lardan hangilerine ula\u015f\u0131labilir?\n\nI. Devletten maa\u015f almazlar   II. Merkez\u00ee y\u00f6netim taraf\u0131ndan tayin edilirler   III. Seferler i\u00e7in asker yeti\u015ftirmekle g\u00f6revlidirler',
          c:['Yaln\u0131z I','I ve III','II ve III','I, II ve III'], d:3,
          a:'T\u0131marl\u0131 sipahiler dirlik geliriyle ge\u00e7inir, merkez taraf\u0131ndan tayin edilir ve cebel\u00fc ad\u0131 verilen askerleri besleyip sefere g\u00f6t\u00fcr\u00fcrlerdi.' },
        { q:'Osmanl\u0131 Devleti\'nde devletin mallara koydu\u011fu azami fiyat s\u0131n\u0131r\u0131na ne ad verilir?',
          c:['Narh','Gedik','Avar\u0131z','\u00d6\u015f\u00fcr'], d:0,
          a:'Narh, fiyatlar\u0131n a\u015f\u0131r\u0131 y\u00fckselmesini engellemek i\u00e7in devletin belirledi\u011fi azami sat\u0131\u015f fiyat\u0131d\u0131r.' },
        { q:'Osmanl\u0131 toplumunda "reaya" kavram\u0131 kimleri ifade eder?',
          c:['Yaln\u0131z M\u00fcsl\u00fcman halk\u0131','Yaln\u0131z gayrim\u00fcslim halk\u0131','Vergi veren \u00fcretici halk\u0131n tamam\u0131n\u0131','Asker\u00ee s\u0131n\u0131f\u0131'],
          d:2, a:'Reaya, din ayr\u0131m\u0131 g\u00f6zetilmeksizin vergi veren \u00fcretici halk\u0131n tamam\u0131n\u0131 ifade eder.' }
      ]}
    ]},

  { id:'yirminci-yy-osmanli', ad:'XX. Y\u00fczy\u0131l Ba\u015flar\u0131nda Osmanl\u0131 Devleti', soru:'1\u20132 soru', durum:'hazir',
    ozet:'Trablusgarp, Balkan Sava\u015flar\u0131, I. D\u00fcnya Sava\u015f\u0131 cepheleri ve Mondros.',
    bloklar:[
      { t:'zaman', b:'1908\'den Sevr\'e', z:[
        { y:'1908', o:'II. Me\u015frutiyet', d:'\u0130ttihat ve Terakki bask\u0131s\u0131yla Kanun-i Esasi yeniden y\u00fcr\u00fcrl\u00fc\u011fe girdi. F\u0131rsattan yararlanarak **Bulgaristan ba\u011f\u0131ms\u0131zl\u0131\u011f\u0131n\u0131 ilan etti, Avusturya Bosna-Hersek\'i ilhak etti, Girit Yunanistan\'a kat\u0131ld\u0131\u011f\u0131n\u0131 a\u00e7\u0131klad\u0131.**' },
        { y:'1909', o:'31 Mart Olay\u0131', d:'**Hareket Ordusu** \u0130stanbul\'a girdi, II. Abd\u00fclhamid tahttan indirildi. Mustafa Kemal ordunun kurmay ba\u015fkan\u0131 olarak yer ald\u0131.' },
        { y:'1911\u201312', o:'Trablusgarp Sava\u015f\u0131', d:'\u0130talya\'ya kar\u015f\u0131. Osmanl\u0131 **donanma g\u00f6nderemedi**; Mustafa Kemal ve Enver Bey gibi subaylar gizlice giderek yerel halk\u0131 \u00f6rg\u00fctledi. **U\u015fi Antla\u015fmas\u0131 1912**: Kuzey Afrika\'daki **son toprak** kaybedildi, Rodos ve 12 Ada ge\u00e7ici olarak \u0130talya\'da kald\u0131.' },
        { y:'1912\u201313', o:'I. Balkan Sava\u015f\u0131', d:'A\u011f\u0131r yenilgi. **Londra Antla\u015fmas\u0131 1913** \u2014 Edirne d\u00e2hil geni\u015f topraklar kaybedildi. **Arnavutluk ba\u011f\u0131ms\u0131z oldu** (Osmanl\u0131\'dan ayr\u0131lan son Balkan milleti).' },
        { y:'1913', o:'II. Balkan Sava\u015f\u0131', d:'Balkan devletleri payla\u015f\u0131mda anla\u015famad\u0131. **Edirne ve K\u0131rklareli geri al\u0131nd\u0131.** B\u00fckre\u015f, \u0130stanbul (Bulgaristan) ve Atina (Yunanistan) antla\u015fmalar\u0131.' },
        { y:'1914\u201318', o:'I. D\u00fcnya Sava\u015f\u0131', d:'Osmanl\u0131 **Almanya saf\u0131nda** sava\u015fa girdi (Goeben ve Breslau gemilerinin Rus limanlar\u0131n\u0131 bombalamas\u0131).' },
        { y:'30 Ekim 1918', o:'Mondros Ate\u015fkes Antla\u015fmas\u0131', d:'**7. madde**: \u0130tilaf Devletleri g\u00fcvenliklerini tehdit g\u00f6ren yerleri i\u015fgal edebilecek \u2192 **i\u015fgallerin hukuki dayana\u011f\u0131**. **24. madde**: alt\u0131 vilayette kar\u0131\u015f\u0131kl\u0131k \u00e7\u0131karsa i\u015fgal.' },
        { y:'10 A\u011fustos 1920', o:'Sevr Antla\u015fmas\u0131', d:'Osmanl\u0131\'y\u0131 payla\u015fan antla\u015fma. **Mebusan Meclisi onaylamad\u0131\u011f\u0131 i\u00e7in hukuken y\u00fcr\u00fcrl\u00fc\u011fe girmedi**; TBMM hi\u00e7 tan\u0131mad\u0131.' }
      ]},
      { t:'tablo', b:'I. D\u00fcnya Sava\u015f\u0131 cepheleri', h:['Cephe t\u00fcr\u00fc','Cepheler','Rakip'], r:[
        ['**Taarruz**','**Kafkas** (Sar\u0131kam\u0131\u015f 1914-15) \u00b7 **Kanal** (S\u00fcvey\u015f)','Kafkas \u2192 **Rusya** \u00b7 Kanal \u2192 \u0130ngiltere'],
        ['**Savunma**','**\u00c7anakkale 1915** (tek kesin zafer) \u00b7 **Irak** (Kut\'\u00fcl Amare 1916) \u00b7 **Suriye-Filistin** \u00b7 **Hicaz-Yemen**','\u0130ngiltere ve Fransa'],
        ['**M\u00fcttefike yard\u0131m**','**Gali\u00e7ya \u00b7 Romanya \u00b7 Makedonya**','Gali\u00e7ya ve Romanya \u2192 **Rusya**']
      ]},
      { t:'kod', b:'Haf\u0131za kodu', x:'**Rusya\'ya kar\u015f\u0131 sava\u015f\u0131lan cepheler: Kafkas + Gali\u00e7ya + Romanya.** \u00c7anakkale \u0130ngiliz-Frans\u0131z, Kanal ve Irak \u0130ngiliz cephesidir. "Hangi cephede Rusya\'ya kar\u015f\u0131 sava\u015f\u0131ld\u0131" sorusu bu ayr\u0131m\u0131 \u00f6l\u00e7er.' },
      { t:'ozet', b:'\u00c7anakkale Cephesi\'nin sonu\u00e7lar\u0131', i:[
        '\u0130tilaf Devletleri **Rusya\'ya yard\u0131m ula\u015ft\u0131ramad\u0131** \u2192 **Rus \u0130htilali (1917) h\u0131zland\u0131**, Rusya sava\u015ftan \u00e7ekildi.',
        'Sava\u015f **iki y\u0131l daha uzad\u0131**.',
        '**Mustafa Kemal**, Anafartalar Grup Komutan\u0131 olarak \u00fcn kazand\u0131; "Anafartalar Kahraman\u0131" oldu.',
        'Bulgaristan \u0130ttifak Devletleri yan\u0131nda sava\u015fa girdi.',
        'Yakla\u015f\u0131k **250 bin \u015fehit** verildi; okumu\u015f bir neslin b\u00fcy\u00fck k\u0131sm\u0131 kaybedildi.'
      ]},
      { t:'tuzak', i:[
        '**I. Balkan Sava\u015f\u0131 kay\u0131p, II. Balkan Sava\u015f\u0131 kazan\u00e7t\u0131r.** Edirne II. Balkan Sava\u015f\u0131\'nda geri al\u0131nm\u0131\u015ft\u0131r.',
        '**Sevr hukuken y\u00fcr\u00fcrl\u00fc\u011fe girmemi\u015ftir**; Mebusan Meclisi da\u011f\u0131t\u0131lm\u0131\u015f oldu\u011fu i\u00e7in onaylanamam\u0131\u015ft\u0131r.',
        '**Mondros bir ate\u015fkes, Sevr bir bar\u0131\u015f antla\u015fmas\u0131d\u0131r.**',
        '**Kut\'\u00fcl Amare bir zaferdir** ama sava\u015f\u0131n genel seyrini de\u011fi\u015ftirmemi\u015ftir.',
        '**Trablusgarp\'ta Osmanl\u0131 donanma g\u00f6nderememi\u015ftir**; \u00e7\u00fcnk\u00fc M\u0131s\u0131r \u0130ngiliz, Akdeniz \u0130talyan denetimindeydi.',
        '**Osmanl\u0131\'n\u0131n sava\u015fa girmesindeki as\u0131l ama\u00e7** kaybedilen topraklar\u0131 geri almak, kapit\u00fclasyonlardan kurtulmak ve Almanya\'n\u0131n kazanaca\u011f\u0131na inanmakt\u0131.'
      ]},
      { t:'test', s:[
        { q:'Osmanl\u0131 Devleti, Birinci D\u00fcnya Sava\u015f\u0131 s\u0131ras\u0131nda a\u015fa\u011f\u0131daki cephelerin hangilerinde Rusya\'ya kar\u015f\u0131 sava\u015fm\u0131\u015ft\u0131r?\n\nI. Gali\u00e7ya   II. Kafkas   III. \u00c7anakkale',
          c:['Yaln\u0131z II','I ve II','II ve III','I, II ve III'], d:1,
          a:'Kafkas Cephesi do\u011frudan Rusya\'ya kar\u015f\u0131 a\u00e7\u0131lm\u0131\u015ft\u0131r; Gali\u00e7ya Cephesi\'nde de m\u00fcttefiklere yard\u0131m amac\u0131yla Rusya\'ya kar\u015f\u0131 sava\u015f\u0131lm\u0131\u015ft\u0131r. \u00c7anakkale ise \u0130ngiltere ve Fransa\'ya kar\u015f\u0131d\u0131r.' },
        { q:'Osmanl\u0131 Devleti\'nin Kuzey Afrika\'daki son topra\u011f\u0131n\u0131 kaybetti\u011fi antla\u015fma hangisidir?',
          c:['U\u015fi Antla\u015fmas\u0131','Londra Antla\u015fmas\u0131','B\u00fckre\u015f Antla\u015fmas\u0131','Atina Antla\u015fmas\u0131'], d:0,
          a:'1912 U\u015fi Antla\u015fmas\u0131 ile Trablusgarp ve Bingazi \u0130talya\'ya b\u0131rak\u0131lm\u0131\u015f, Osmanl\u0131\'n\u0131n Kuzey Afrika\'daki varl\u0131\u011f\u0131 sona ermi\u015ftir.' },
        { q:'Mondros Ate\u015fkes Antla\u015fmas\u0131\'n\u0131n hangi maddesi i\u015fgallere hukuki zemin haz\u0131rlam\u0131\u015ft\u0131r?',
          c:['Bo\u011fazlar\u0131n a\u00e7\u0131lmas\u0131','Ordunun terhis edilmesi','G\u00fcvenli\u011fi tehdit eden yerlerin i\u015fgal edilebilmesi','Haberle\u015fmenin denetlenmesi'], d:2,
          a:'7. madde, \u0130tilaf Devletleri\'ne g\u00fcvenliklerini tehdit g\u00f6ren herhangi bir stratejik noktay\u0131 i\u015fgal etme hakk\u0131 vermi\u015ftir.' },
        { q:'\u00c7anakkale Cephesi\'nin sonu\u00e7lar\u0131 aras\u0131nda a\u015fa\u011f\u0131dakilerden hangisi yer **almaz**?',
          c:['Rusya\'ya yard\u0131m ula\u015ft\u0131r\u0131lamam\u0131\u015ft\u0131r.','Rus \u0130htilali h\u0131zlanm\u0131\u015ft\u0131r.','Sava\u015f uzam\u0131\u015ft\u0131r.','Osmanl\u0131 Devleti sava\u015ftan \u00e7ekilmi\u015ftir.'],
          d:3, a:'Osmanl\u0131 Devleti \u00c7anakkale\'den sonra sava\u015fa devam etmi\u015f, sava\u015ftan ancak 1918 Mondros ile \u00e7ekilmi\u015ftir.' },
        { q:'II. Me\u015frutiyet\'in ilan\u0131n\u0131n hemen ard\u0131ndan ya\u015fanan geli\u015fmeler aras\u0131nda a\u015fa\u011f\u0131dakilerden hangisi yer **almaz**?',
          c:['Bulgaristan\'\u0131n ba\u011f\u0131ms\u0131zl\u0131\u011f\u0131n\u0131 ilan etmesi','Avusturya\'n\u0131n Bosna-Hersek\'i ilhak etmesi','Girit\'in Yunanistan\'a kat\u0131ld\u0131\u011f\u0131n\u0131 a\u00e7\u0131klamas\u0131','K\u0131br\u0131s\'\u0131n \u0130ngiltere\'ye b\u0131rak\u0131lmas\u0131'],
          d:3, a:'K\u0131br\u0131s\'\u0131n y\u00f6netimi 1878\'de Berlin Antla\u015fmas\u0131 s\u00fcrecinde \u0130ngiltere\'ye b\u0131rak\u0131lm\u0131\u015ft\u0131r; 1908 ile ilgisi yoktur.' },
        { q:'I. Balkan Sava\u015f\u0131 sonucunda Osmanl\u0131 Devleti\'nden ayr\u0131larak ba\u011f\u0131ms\u0131zl\u0131\u011f\u0131n\u0131 kazanan son Balkan milleti hangisidir?',
          c:['S\u0131rplar','Bulgarlar','Arnavutlar','Yunanlar'], d:2,
          a:'Arnavutluk 1912\'de ba\u011f\u0131ms\u0131zl\u0131\u011f\u0131n\u0131 ilan etmi\u015f ve Osmanl\u0131\'dan ayr\u0131lan son Balkan milleti olmu\u015ftur.' },
        { q:'Edirne ve K\u0131rklareli hangi sava\u015f sonucunda geri al\u0131nm\u0131\u015ft\u0131r?',
          c:['I. Balkan Sava\u015f\u0131','II. Balkan Sava\u015f\u0131','Trablusgarp Sava\u015f\u0131','I. D\u00fcnya Sava\u015f\u0131'], d:1,
          a:'Balkan devletlerinin payla\u015f\u0131mda anla\u015famamas\u0131 \u00fczerine \u00e7\u0131kan II. Balkan Sava\u015f\u0131\'nda Edirne ve K\u0131rklareli geri al\u0131nm\u0131\u015ft\u0131r.' },
        { q:'Osmanl\u0131 Devleti\'nin I. D\u00fcnya Sava\u015f\u0131\'na fiilen girmesine yol a\u00e7an olay hangisidir?',
          c:['Sar\u0131kam\u0131\u015f Harek\u00e2t\u0131','Goeben ve Breslau gemilerinin Rus limanlar\u0131n\u0131 bombalamas\u0131','\u00c7anakkale\'nin kapat\u0131lmas\u0131','Kanal Seferi'],
          d:1, a:'Almanya\'dan al\u0131nan Yavuz ve Midilli ad\u0131 verilen gemilerin Karadeniz\'de Rus limanlar\u0131n\u0131 bombalamas\u0131 Osmanl\u0131\'y\u0131 fiilen sava\u015fa sokmu\u015ftur.' },
        { q:'Sevr Antla\u015fmas\u0131 ile ilgili a\u015fa\u011f\u0131dakilerden hangisi do\u011frudur?',
          c:['TBMM taraf\u0131ndan onaylanm\u0131\u015ft\u0131r.','Mebusan Meclisi taraf\u0131ndan onaylanmad\u0131\u011f\u0131 i\u00e7in hukuken y\u00fcr\u00fcrl\u00fc\u011fe girmemi\u015ftir.','Mudanya\'dan sonra imzalanm\u0131\u015ft\u0131r.','Osmanl\u0131 Devleti\'nin toprak kazand\u0131\u011f\u0131 bir antla\u015fmad\u0131r.'],
          d:1, a:'Sevr, Osmanl\u0131 Mebusan Meclisi da\u011f\u0131t\u0131lm\u0131\u015f oldu\u011fu i\u00e7in onaylanamam\u0131\u015f ve hukuken y\u00fcr\u00fcrl\u00fc\u011fe girmemi\u015ftir.' },
        { q:'Trablusgarp Sava\u015f\u0131\'nda Osmanl\u0131 Devleti\'nin b\u00f6lgeye donanma g\u00f6nderememesinin sebebi a\u015fa\u011f\u0131dakilerden hangisidir?',
          c:['Donanman\u0131n Karadeniz\'de olmas\u0131','M\u0131s\u0131r\'\u0131n \u0130ngiliz, Akdeniz\'in \u0130talyan denetiminde olmas\u0131','Sava\u015f\u0131n k\u0131\u015f\u0131n ba\u015flamas\u0131','B\u00f6lgenin Osmanl\u0131 topra\u011f\u0131 olmamas\u0131'],
          d:1, a:'M\u0131s\u0131r \u0130ngiliz i\u015fgalinde, Akdeniz ise \u0130talyan donanmas\u0131n\u0131n denetiminde oldu\u011fu i\u00e7in Trablusgarp\'a kara ve deniz yoluyla yard\u0131m g\u00f6nderilememi\u015ftir.' },
        { q:'A\u015fa\u011f\u0131dakilerden hangisi Osmanl\u0131 Devleti\'nin I. D\u00fcnya Sava\u015f\u0131\'nda savunma amac\u0131yla a\u00e7t\u0131\u011f\u0131 cephelerden biridir?',
          c:['Kafkas Cephesi','Kanal Cephesi','\u00c7anakkale Cephesi','Gali\u00e7ya Cephesi'], d:2,
          a:'\u00c7anakkale, Irak, Suriye-Filistin ve Hicaz-Yemen savunma cepheleridir. Kafkas ve Kanal taarruz, Gali\u00e7ya ise m\u00fcttefike yard\u0131m cephesidir.' },
        { q:'"Askerlerimiz Kars\'a ula\u015fmak \u00fczereler." ifadesinin ge\u00e7ti\u011fi bir I. D\u00fcnya Sava\u015f\u0131 mektubu a\u015fa\u011f\u0131daki cephelerin hangisinden g\u00f6nderilmi\u015f olabilir?',
          c:['Kanal Cephesi','Kafkas Cephesi','\u00c7anakkale Cephesi','Irak Cephesi'], d:1,
          a:'Kars ve \u00e7evresi Kafkas Cephesi\'nin harek\u00e2t alan\u0131d\u0131r; bu cephede Rusya\'ya kar\u015f\u0131 sava\u015f\u0131lm\u0131\u015ft\u0131r.' },
        { q:'31 Mart Olay\u0131\'n\u0131 bast\u0131rmak \u00fczere Selanik\'ten \u0130stanbul\'a g\u00f6nderilen birlik hangisidir?',
          c:['Hareket Ordusu','Kuvay\u0131milliye','Asakir-i Mansure','Nizam-\u0131 Cedid'], d:0,
          a:'1909\'daki 31 Mart Olay\u0131, Selanik\'ten gelen Hareket Ordusu taraf\u0131ndan bast\u0131r\u0131lm\u0131\u015f, II. Abd\u00fclhamid tahttan indirilmi\u015ftir.' },
        { q:'A\u015fa\u011f\u0131dakilerden hangisi Mondros Ate\u015fkes Antla\u015fmas\u0131\'n\u0131n sonu\u00e7lar\u0131ndan biri **de\u011fildir**?',
          c:['Osmanl\u0131 ordusunun terhis edilmesi','\u0130\u015fgallerin ba\u015flamas\u0131','Cemiyetlerin kurulmaya ba\u015flanmas\u0131','Saltanat\u0131n kald\u0131r\u0131lmas\u0131'],
          d:3, a:'Saltanat 1 Kas\u0131m 1922\'de TBMM karar\u0131yla kald\u0131r\u0131lm\u0131\u015ft\u0131r; Mondros\'un do\u011frudan sonucu de\u011fildir.' },
        { q:'Kut\'\u00fcl Amare Zaferi hangi cephede kazan\u0131lm\u0131\u015ft\u0131r?',
          c:['Kafkas Cephesi','Irak Cephesi','\u00c7anakkale Cephesi','Suriye Cephesi'], d:1,
          a:'1916\'da Irak Cephesi\'nde \u0130ngiliz birlikleri Kut\'\u00fcl Amare\'de ku\u015fat\u0131larak teslim al\u0131nm\u0131\u015ft\u0131r.' },
        { q:'Osmanl\u0131 Devleti\'nin I. D\u00fcnya Sava\u015f\u0131\'na girme sebepleri aras\u0131nda a\u015fa\u011f\u0131dakilerden hangisi yer **almaz**?',
          c:['Kaybedilen topraklar\u0131 geri alma iste\u011fi','Kapit\u00fclasyonlardan kurtulma iste\u011fi','Almanya\'n\u0131n sava\u015f\u0131 kazanaca\u011f\u0131na inan\u0131lmas\u0131','Balkan Antant\u0131\'na \u00fcye olma iste\u011fi'],
          d:3, a:'Balkan Antant\u0131 1934\'te kurulmu\u015ftur ve I. D\u00fcnya Sava\u015f\u0131 ile ilgisi yoktur.' }
      ]}
    ]},
