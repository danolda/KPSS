<!DOCTYPE html>
<html lang="tr" data-tema="kagit">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPSS &#214;n Lisans &#8212; Tekrar Atlas&#305;</title>
<meta name="description" content="KPSS &#214;n Lisans i&#231;in pratik tekrar &#246;zetleri: T&#252;rk&#231;e, Matematik, Tarih, Co&#287;rafya, Vatanda&#351;l&#305;k. Co&#287;rafya interaktif T&#252;rkiye haritas&#305;yla.">
<meta name="color-scheme" content="light dark">
<style>
/* ===========================================================
   KPSS On Lisans -- Tekrar Atlasi
   Tasarim fikri: fiziki harita lejanti. Renkler yukselti
   basamaklarindan (ova -> plato -> dag -> zirve) alinmistir.
   =========================================================== */

@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  /* lejant renkleri */
  --ova:#7d9f57; --plato:#d3a63f; --dag:#bd6f36; --zirve:#e6dcc7;
  --akarsu:#3f9ac4; --lav:#a1495c; --baraj:#37718f; --sinir:#bf4a41;

  /* kagit temasi */
  --bg:#eae5d7; --bg2:#f3efe4; --card:#fbf8f0; --ink:#1c2b30;
  --ink2:#4a5a5f; --ink3:#7b888c; --line:#cfc7b3; --line2:#e0d9c7;
  --acc:#c98a2e;
  --sel:rgba(201,138,46,.16);
  --shadow:0 1px 0 rgba(28,43,48,.05), 0 8px 22px -14px rgba(28,43,48,.4);

  /* ders renkleri */
  --c-cog:#c07f28; --c-tar:#b8453c; --c-tur:#37809f; --c-mat:#5e8f52; --c-vat:#7f66a8; --c-gun:#2f8f8a;

  --f-d:'Archivo',system-ui,sans-serif;
  --f-b:'Source Serif 4',Georgia,serif;
  --f-m:'IBM Plex Mono',ui-monospace,monospace;

  --r:10px; --w:1180px;
}
[data-tema="gece"]{
  --bg:#0d1f27; --bg2:#122932; --card:#16323d; --ink:#e6ecec;
  --ink2:#a9bcbf; --ink3:#748b90; --line:#27454f; --line2:#1e3a44;
  --zirve:#cfc2a6; --sel:rgba(224,177,90,.18); --acc:#e0b15a;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 26px -16px #000;
  --c-cog:#e0b15a; --c-tar:#e0736a; --c-tur:#63b6d6; --c-mat:#8dbc7e; --c-vat:#a98fd0; --c-gun:#5fc4bd;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--f-b); font-size:16.5px; line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button{font-family:inherit; cursor:pointer}
h1,h2,h3,h4{font-family:var(--f-d); font-weight:700; letter-spacing:-.02em; line-height:1.15; margin:0}

/* --- yukselti seridi: sitenin imzasi --- */
.ramp{height:4px; display:flex; width:100%}
.ramp i{flex:1; display:block}
.ramp i:nth-child(1){background:var(--ova)}
.ramp i:nth-child(2){background:var(--plato)}
.ramp i:nth-child(3){background:var(--dag)}
.ramp i:nth-child(4){background:var(--lav)}
.ramp i:nth-child(5){background:var(--zirve)}

/* --- baslik --- */
.head{position:sticky; top:0; z-index:60; background:var(--bg2); border-bottom:1px solid var(--line)}
.head-in{max-width:var(--w); margin:0 auto; padding:11px 20px; display:flex; align-items:center; gap:14px}
.brand{display:flex; align-items:center; gap:11px; text-decoration:none; margin-right:auto}
.brand svg{width:30px; height:30px; flex:none}
.brand b{font-family:var(--f-d); font-weight:800; font-size:16px; letter-spacing:-.03em; display:block; line-height:1.1}
.brand span{font-family:var(--f-m); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink3)}
.hbtn{background:none; border:1px solid var(--line); color:var(--ink2); border-radius:99px; padding:6px 13px;
  font-family:var(--f-d); font-size:12.5px; font-weight:600; transition:.15s}
.hbtn:hover{border-color:var(--acc); color:var(--acc)}
#menuBtn{display:none}

/* --- iskelet --- */
.shell{max-width:var(--w); margin:0 auto; display:grid; grid-template-columns:262px 1fr; gap:34px; padding:0 20px}
.side{position:sticky; top:57px; height:calc(100vh - 57px); overflow-y:auto; padding:22px 0 60px; scrollbar-width:thin}
.side::-webkit-scrollbar{width:5px} .side::-webkit-scrollbar-thumb{background:var(--line); border-radius:9px}
main{padding:30px 0 90px; min-width:0}

/* --- arama --- */
.srch{position:relative; margin-bottom:16px}
.srch input{width:100%; padding:8px 11px 8px 30px; border:1px solid var(--line); background:var(--card);
  color:var(--ink); border-radius:8px; font-family:var(--f-d); font-size:13px; outline:none}
.srch input:focus{border-color:var(--acc)}
.srch svg{position:absolute; left:9px; top:9px; width:14px; height:14px; stroke:var(--ink3); fill:none; stroke-width:2}

/* --- yan menu --- */
.nav-ders{margin-bottom:5px; border-radius:9px; overflow:hidden}
.nav-t{width:100%; display:flex; align-items:center; gap:9px; padding:9px 11px; background:none; border:0;
  text-align:left; color:var(--ink); font-family:var(--f-d); font-weight:600; font-size:14px; border-radius:8px}
.nav-t:hover{background:var(--bg2)}
.nav-t .dot{width:9px; height:9px; border-radius:3px; flex:none}
.nav-t .cnt{margin-left:auto; font-family:var(--f-m); font-size:10.5px; color:var(--ink3)}
.nav-t .arw{width:11px; height:11px; stroke:var(--ink3); fill:none; stroke-width:2.4; transition:.2s}
.nav-ders.acik .arw{transform:rotate(90deg)}
.nav-k{display:none; padding:2px 0 8px 11px; margin-left:9px; border-left:1px solid var(--line2)}
.nav-ders.acik .nav-k{display:block}
.nav-k a{display:block; padding:5px 9px; font-size:13.4px; color:var(--ink2); text-decoration:none;
  border-radius:6px; line-height:1.35; font-family:var(--f-d); font-weight:500}
.nav-k a:hover{background:var(--bg2); color:var(--ink)}
.nav-k a.on{background:var(--sel); color:var(--ink); font-weight:600}
.nav-k a .st{float:right; font-family:var(--f-m); font-size:9px; color:var(--ink3); letter-spacing:.06em; margin-top:2px}

/* --- ana sayfa --- */
.hero{padding:44px 0 34px; border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--f-m); font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink3); margin-bottom:14px}
.hero h1{font-size:clamp(34px,5.4vw,56px); font-weight:800; letter-spacing:-.038em; max-width:16ch}
.hero h1 em{font-style:normal; color:var(--acc)}
.hero p{max-width:56ch; color:var(--ink2); margin:16px 0 0; font-size:17px}
.hero-map{margin:26px 0 0; border:1px solid var(--line); border-radius:var(--r); background:var(--card); padding:10px; overflow:hidden}
.hero-map svg{width:100%; height:auto; display:block}

.gridDers{display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:14px; margin:28px 0}
.dc{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:17px 17px 15px;
  text-decoration:none; display:block; position:relative; overflow:hidden; transition:.18s; box-shadow:var(--shadow)}
.dc:hover{transform:translateY(-2px); border-color:var(--dc)}
.dc::before{content:''; position:absolute; inset:0 auto 0 0; width:3px; background:var(--dc)}
.dc .bl{font-family:var(--f-m); font-size:9.5px; letter-spacing:.15em; text-transform:uppercase; color:var(--ink3)}
.dc h3{font-size:20px; margin:7px 0 6px; letter-spacing:-.03em}
.dc .num{font-family:var(--f-m); font-size:12px; color:var(--dc); font-weight:600}
.dc p{margin:9px 0 0; font-size:13.6px; color:var(--ink2); line-height:1.5}
.dc .kt{margin-top:12px; padding-top:10px; border-top:1px solid var(--line2); font-family:var(--f-m); font-size:10.5px; color:var(--ink3)}

.plan{background:var(--bg2); border:1px solid var(--line); border-radius:var(--r); padding:20px 22px; margin:8px 0 40px}
.plan h3{font-size:16px; margin-bottom:12px}
.plan ol{margin:0; padding-left:19px; color:var(--ink2); font-size:14.6px}
.plan li{margin-bottom:7px}
.plan li b{color:var(--ink)}

/* --- ders sayfasi --- */
.dhead{border-bottom:1px solid var(--line); padding-bottom:22px; margin-bottom:26px}
.dhead h1{font-size:clamp(28px,4.4vw,42px); letter-spacing:-.035em}
.dhead .lead{color:var(--ink2); max-width:60ch; margin:12px 0 0}
.pill{display:inline-flex; align-items:center; gap:6px; font-family:var(--f-m); font-size:11px; letter-spacing:.08em;
  text-transform:uppercase; padding:4px 10px; border-radius:99px; border:1px solid var(--line); color:var(--ink2)}
.metod{display:grid; gap:8px; margin:20px 0 0; padding:16px 18px; background:var(--bg2); border-radius:var(--r); border:1px solid var(--line)}
.metod div{font-size:14px; color:var(--ink2); padding-left:20px; position:relative}
.metod div::before{content:'\2192 '; position:absolute; left:0; color:var(--acc); font-family:var(--f-m)}

.klist{display:grid; gap:9px}
.ki{display:flex; align-items:center; gap:13px; padding:13px 16px; background:var(--card); border:1px solid var(--line);
  border-radius:9px; text-decoration:none; transition:.15s}
.ki:hover{border-color:var(--acc); transform:translateX(3px)}
.ki .no{font-family:var(--f-m); font-size:11.5px; color:var(--ink3); width:22px; flex:none}
.ki .tx{flex:1; min-width:0}
.ki .tx b{display:block; font-family:var(--f-d); font-size:15px; font-weight:600; letter-spacing:-.01em}
.ki .tx span{font-size:13px; color:var(--ink2); display:block; margin-top:2px}
.ki .sq{font-family:var(--f-m); font-size:10.5px; padding:3px 8px; border-radius:5px; background:var(--bg2);
  color:var(--ink2); flex:none; white-space:nowrap}
.ki .tag{font-family:var(--f-m); font-size:9px; letter-spacing:.1em; text-transform:uppercase; padding:3px 7px;
  border-radius:4px; flex:none; border:1px solid var(--line)}
.tag.iskelet{color:var(--ink3)}
.tag.hazir{color:var(--ova); border-color:var(--ova)}

/* --- konu sayfasi --- */
.crumb{font-family:var(--f-m); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink3); margin-bottom:12px}
.crumb a{color:var(--ink2); text-decoration:none}
.crumb a:hover{color:var(--acc)}
.khead h1{font-size:clamp(26px,4vw,38px); letter-spacing:-.035em}
.khead .ozet{font-size:18px; color:var(--ink2); margin:12px 0 0; max-width:62ch; font-style:italic}
.khead .bar{display:flex; gap:9px; align-items:center; margin-top:15px; flex-wrap:wrap}
.okundu{background:none; border:1px solid var(--line); color:var(--ink2); border-radius:99px; padding:5px 13px;
  font-family:var(--f-d); font-size:12.5px; font-weight:600}
.okundu.on{background:var(--ova); border-color:var(--ova); color:#fff}

.blk{margin:30px 0}
.blk-h{font-family:var(--f-d); font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink3); margin-bottom:13px; display:flex; align-items:center; gap:9px}
.blk-h::after{content:''; flex:1; height:1px; background:var(--line2)}

/* ozet listesi */
.b-ozet ul{margin:0; padding:0; list-style:none}
.b-ozet li{position:relative; padding:0 0 0 21px; margin-bottom:10px; color:var(--ink2)}
.b-ozet li::before{content:''; position:absolute; left:3px; top:11px; width:7px; height:7px; border-radius:2px; background:var(--plato)}
.b-ozet li strong, .b-ozet li b{color:var(--ink); font-weight:600}

/* tablo */
.tw{overflow-x:auto; border:1px solid var(--line); border-radius:9px; background:var(--card)}
table{width:100%; border-collapse:collapse; font-size:14.4px; min-width:440px}
th{background:var(--bg2); font-family:var(--f-d); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink3); text-align:left; padding:9px 13px; border-bottom:1px solid var(--line); font-weight:700; white-space:nowrap}
td{padding:10px 13px; border-bottom:1px solid var(--line2); vertical-align:top; color:var(--ink2)}
tr:last-child td{border-bottom:0}
td:first-child{color:var(--ink); font-weight:600; font-family:var(--f-d); font-size:13.8px}
td strong{color:var(--ink)}

/* tuzak */
.b-tuzak{background:var(--card); border:1px solid var(--sinir); border-left-width:3px; border-radius:9px; padding:16px 19px}
.b-tuzak .blk-h{color:var(--sinir); margin-bottom:11px}
.b-tuzak .blk-h::after{background:color-mix(in srgb,var(--sinir) 25%, transparent)}
.b-tuzak ul{margin:0; padding-left:19px}
.b-tuzak li{margin-bottom:8px; color:var(--ink2); font-size:15px}
.b-tuzak li:last-child{margin-bottom:0}
.b-tuzak strong{color:var(--ink)}

/* hafiza kodu */
.b-kod{background:linear-gradient(180deg,var(--bg2),var(--card)); border:1px dashed var(--plato); border-radius:9px; padding:16px 19px}
.b-kod .blk-h{color:var(--plato)}
.b-kod .blk-h::after{background:color-mix(in srgb,var(--plato) 30%, transparent)}
.b-kod p{margin:0; font-size:15.5px; color:var(--ink2)}
.b-kod strong{color:var(--ink); font-weight:600}

/* formul karti */
.b-formul{background:var(--card); border:1px solid var(--line); border-radius:9px; padding:6px 0; overflow:hidden}
.b-formul .fr{padding:10px 19px; border-bottom:1px solid var(--line2); font-family:var(--f-m); font-size:14px; color:var(--ink2)}
.b-formul .fr:last-child{border-bottom:0}
.b-formul .fr strong{color:var(--acc); font-weight:600}

/* cozumlu ornek */
.b-cozum{border:1px solid var(--line); border-radius:9px; overflow:hidden}
.b-cozum .q{background:var(--bg2); padding:14px 19px; font-size:15.4px; border-bottom:1px solid var(--line)}
.b-cozum ol{margin:0; padding:14px 19px 14px 40px; background:var(--card)}
.b-cozum li{margin-bottom:8px; color:var(--ink2); font-size:15px}
.b-cozum .cev{padding:11px 19px; background:var(--bg2); border-top:1px solid var(--line);
  font-family:var(--f-m); font-size:13.5px; color:var(--ova); font-weight:600}

/* taktik */
.b-taktik{background:var(--card); border:1px solid var(--akarsu); border-left-width:3px; border-radius:9px; padding:16px 19px}
.b-taktik .blk-h{color:var(--akarsu)}
.b-taktik .blk-h::after{background:color-mix(in srgb,var(--akarsu) 25%, transparent)}
.b-taktik p{margin:0; font-size:15.2px; color:var(--ink2)}

/* karsit (yanlis / dogru) */
.b-karsit .kp{display:grid; grid-template-columns:1fr 1fr; gap:0; border:1px solid var(--line);
  border-radius:9px; overflow:hidden; margin-bottom:11px}
.b-karsit .kp>div{padding:14px 17px; font-size:14.6px}
.b-karsit .yn{background:color-mix(in srgb,var(--sinir) 8%, var(--card)); color:var(--ink2); border-right:1px solid var(--line)}
.b-karsit .dg{background:color-mix(in srgb,var(--ova) 9%, var(--card)); color:var(--ink2)}
.b-karsit .lb{display:block; font-family:var(--f-m); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; margin-bottom:6px}
.b-karsit .yn .lb{color:var(--sinir)} .b-karsit .dg .lb{color:var(--ova)}
.b-karsit strong{color:var(--ink)}

/* zaman seridi */
.b-zaman .tl{position:relative; padding-left:26px}
.b-zaman .tl::before{content:''; position:absolute; left:6px; top:6px; bottom:6px; width:2px;
  background:linear-gradient(180deg,var(--ova),var(--plato),var(--dag),var(--lav))}
.b-zaman .ev{position:relative; margin-bottom:19px}
.b-zaman .ev::before{content:''; position:absolute; left:-24px; top:6px; width:10px; height:10px;
  border-radius:50%; background:var(--card); border:2px solid var(--dag)}
.b-zaman .yr{font-family:var(--f-m); font-size:11.5px; color:var(--dag); font-weight:600; letter-spacing:.04em}
.b-zaman .ol{font-family:var(--f-d); font-size:16px; font-weight:700; margin:2px 0 4px; letter-spacing:-.02em}
.b-zaman .ds{font-size:14.6px; color:var(--ink2)}

/* sema */
.b-sema{display:grid; gap:13px; grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.b-sema .box{background:var(--card); border:1px solid var(--line); border-radius:9px; overflow:hidden}
.b-sema .box>b{display:block; background:var(--bg2); padding:9px 15px; font-family:var(--f-d); font-size:13.5px;
  border-bottom:1px solid var(--line); letter-spacing:-.01em}
.b-sema .box ul{margin:0; padding:9px 15px 11px 30px}
.b-sema .box li{font-size:14px; color:var(--ink2); margin-bottom:5px}

/* sayi karti */
.b-sayilar{display:grid; gap:9px; grid-template-columns:repeat(auto-fill,minmax(178px,1fr))}
.b-sayilar .sc{background:var(--card); border:1px solid var(--line); border-radius:9px; padding:13px 15px}
.b-sayilar .sc b{display:block; font-family:var(--f-m); font-size:23px; font-weight:600; color:var(--acc); letter-spacing:-.02em}
.b-sayilar .sc span{display:block; font-size:13.2px; color:var(--ink2); margin-top:4px; line-height:1.4}

/* test */
.b-test .sq{background:var(--card); border:1px solid var(--line); border-radius:9px; padding:17px 19px; margin-bottom:12px}
.b-test .qs{font-size:15.6px; margin-bottom:13px}
.b-test .op{display:block; width:100%; text-align:left; background:var(--bg2); border:1px solid var(--line);
  border-radius:7px; padding:9px 13px; margin-bottom:7px; font-family:var(--f-b); font-size:14.6px; color:var(--ink2); transition:.13s}
.b-test .op:hover:not(:disabled){border-color:var(--acc)}
.b-test .op:disabled{cursor:default}
.b-test .op .lt{font-family:var(--f-m); font-size:11.5px; color:var(--ink3); margin-right:9px}
.b-test .op.dogru{background:color-mix(in srgb,var(--ova) 15%, var(--card)); border-color:var(--ova); color:var(--ink)}
.b-test .op.yanlis{background:color-mix(in srgb,var(--sinir) 13%, var(--card)); border-color:var(--sinir)}
.b-test .exp{margin-top:11px; padding:12px 15px; background:var(--bg2); border-radius:7px; font-size:14.4px; color:var(--ink2); display:none}
.b-test .exp.gor{display:block}
.b-test .exp b{color:var(--ink)}

/* iskelet uyarisi */
.stub{background:var(--bg2); border:1px dashed var(--line); border-radius:9px; padding:18px 20px; margin:22px 0}
.stub b{font-family:var(--f-d); font-size:14px; display:block; margin-bottom:5px}
.stub p{margin:0; font-size:14.2px; color:var(--ink2)}

/* sayfa gezinme */
.pnav{display:flex; gap:11px; margin-top:44px; padding-top:22px; border-top:1px solid var(--line)}
.pnav a{flex:1; padding:13px 16px; background:var(--card); border:1px solid var(--line); border-radius:9px;
  text-decoration:none; transition:.15s}
.pnav a:hover{border-color:var(--acc)}
.pnav a span{display:block; font-family:var(--f-m); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink3)}
.pnav a b{font-family:var(--f-d); font-size:14.5px; font-weight:600; letter-spacing:-.01em}
.pnav a.nx{text-align:right}

/* ======= HARITA ======= */
.mapw{border:1px solid var(--line); border-radius:var(--r); background:var(--card); overflow:hidden; margin:14px 0 0}
.mtop{display:flex; gap:7px; padding:10px 12px; border-bottom:1px solid var(--line); background:var(--bg2);
  flex-wrap:wrap; align-items:center}
.mchip{background:var(--card); border:1px solid var(--line); border-radius:99px; padding:5px 12px;
  font-family:var(--f-d); font-size:12.3px; font-weight:600; color:var(--ink2); transition:.13s; white-space:nowrap}
.mchip:hover{border-color:var(--acc)}
.mchip.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.mchip .sw{display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:6px; vertical-align:1px}
.mspacer{flex:1}
.mtool{background:none; border:1px solid var(--line); border-radius:7px; width:29px; height:29px; color:var(--ink2);
  font-family:var(--f-m); font-size:14px; line-height:1; display:grid; place-items:center}
.mtool:hover{border-color:var(--acc); color:var(--acc)}
.mtool.on{background:var(--acc); border-color:var(--acc); color:#fff}

.mbody{display:grid; grid-template-columns:1fr 232px}
.mstage{position:relative; background:
  linear-gradient(var(--bg2),var(--bg2)); overflow:hidden; touch-action:none; cursor:grab}
.mstage.drag{cursor:grabbing}
.mstage svg{width:100%; height:auto; display:block; user-select:none}
.il{fill:var(--bg); stroke:var(--line); stroke-width:.6; transition:fill .18s}
[data-tema="gece"] .il{fill:#17323d; stroke:#25454f}
.il:hover{fill:var(--sel)}
.il.hl{fill:var(--acc); opacity:.85}
.il.rg{opacity:.9}
.mk{cursor:pointer}
.mk circle{stroke:var(--card); stroke-width:1.4; transition:r .15s}
.mk:hover circle{stroke:var(--ink)}
.mk.sec circle{stroke:var(--ink); stroke-width:2.2}
.mk text{font-family:'Archivo',sans-serif; font-size:7px; font-weight:600; fill:var(--ink);
  paint-order:stroke; stroke:var(--card); stroke-width:2.6; stroke-linejoin:round; pointer-events:none}
.riv{fill:none; stroke:var(--akarsu); stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; opacity:.85}
.riv.sec{stroke-width:3; opacity:1}
.ilad{font-family:'IBM Plex Mono',monospace; font-size:5.6px; fill:var(--ink3); pointer-events:none; text-anchor:middle}

.mside{border-left:1px solid var(--line); max-height:520px; overflow-y:auto; background:var(--bg2)}
.mside::-webkit-scrollbar{width:5px} .mside::-webkit-scrollbar-thumb{background:var(--line); border-radius:9px}
.mgh{position:sticky; top:0; background:var(--bg2); padding:9px 13px 6px; font-family:var(--f-d); font-size:10.5px;
  letter-spacing:.13em; text-transform:uppercase; color:var(--ink3); border-bottom:1px solid var(--line2); z-index:2}
.mit{padding:8px 13px; border-bottom:1px solid var(--line2); cursor:pointer; transition:.12s}
.mit:hover{background:var(--card)}
.mit.sec{background:var(--sel)}
.mit b{display:block; font-family:var(--f-d); font-size:13px; font-weight:600; letter-spacing:-.01em}
.mit span{display:block; font-size:12.2px; color:var(--ink2); line-height:1.42; margin-top:2px}
.mit strong{color:var(--ink)}
.mnote{padding:10px 13px; font-size:12.4px; color:var(--ink2); background:var(--card); border-bottom:1px solid var(--line2)}

.mtip{position:absolute; z-index:20; background:var(--ink); color:var(--bg); padding:8px 11px; border-radius:7px;
  font-size:12.6px; max-width:250px; pointer-events:none; opacity:0; transition:opacity .12s; line-height:1.45}
.mtip.gor{opacity:1}
.mtip b{font-family:var(--f-d); display:block; font-size:13px; margin-bottom:2px}

.mfoot{padding:8px 13px; border-top:1px solid var(--line); background:var(--bg2); font-family:var(--f-m);
  font-size:11px; color:var(--ink3); display:flex; gap:14px; flex-wrap:wrap; align-items:center}
.mfoot b{color:var(--ink); font-weight:600}
.qbar{padding:11px 13px; background:var(--card); border-top:1px solid var(--line); display:flex;
  align-items:center; gap:12px; flex-wrap:wrap}
.qbar .qq{font-family:var(--f-d); font-size:15px; font-weight:600; flex:1; min-width:170px}
.qbar .qs{font-family:var(--f-m); font-size:12px; color:var(--ink2)}
.qbar .qr{font-family:var(--f-m); font-size:12.5px; padding:4px 10px; border-radius:6px}
.qr.iyi{background:color-mix(in srgb,var(--ova) 20%,transparent); color:var(--ova)}
.qr.orta{background:color-mix(in srgb,var(--plato) 22%,transparent); color:var(--dag)}
.qr.kotu{background:color-mix(in srgb,var(--sinir) 16%,transparent); color:var(--sinir)}

/* --- arama sonuclari --- */
.res{display:grid; gap:8px; margin-top:18px}
.res a{padding:12px 15px; background:var(--card); border:1px solid var(--line); border-radius:9px; text-decoration:none}
.res a:hover{border-color:var(--acc)}
.res b{font-family:var(--f-d); font-size:14.5px; display:block}
.res span{font-size:12.6px; color:var(--ink3); font-family:var(--f-m)}

/* --- responsive --- */
@media(max-width:900px){
  .shell{grid-template-columns:1fr; gap:0}
  .side{position:fixed; inset:57px auto 0 0; width:280px; background:var(--bg2); border-right:1px solid var(--line);
    padding:18px 16px 60px; transform:translateX(-102%); transition:transform .22s; z-index:55; height:calc(100vh - 57px)}
  .side.acik{transform:none}
  #menuBtn{display:grid; place-items:center; width:33px; height:31px; padding:0}
  .mbody{grid-template-columns:1fr}
  .mside{border-left:0; border-top:1px solid var(--line); max-height:290px}
  .b-karsit .kp{grid-template-columns:1fr}
  .b-karsit .yn{border-right:0; border-bottom:1px solid var(--line)}
  body{font-size:16px}
  .scrim{position:fixed; inset:0; background:rgba(0,0,0,.32); z-index:54; display:none}
  .scrim.acik{display:block}
}
@media(max-width:520px){
  .head-in{padding:9px 14px; gap:9px}
  .shell{padding:0 14px}
  .gridDers{grid-template-columns:1fr}
  .pnav{flex-direction:column}
  .mtop{padding:8px}
  .mchip{font-size:11.6px; padding:4px 10px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important; scroll-behavior:auto}}
:focus-visible{outline:2px solid var(--acc); outline-offset:2px}

      { t:'kod', b:'Haf\u0131za kodu', x:'Bozukluk ararken \u015fu s\u0131rayla bak: \u2460 **Gereksiz kelime var m\u0131?** (en s\u0131k) \u2461 **\u0130ki y\u00fcklem varsa ortak \u00f6ge tutuyor mu?** \u2462 **\u00d6zne cans\u0131z m\u0131, y\u00fcklem \u00e7o\u011ful mu?** \u2463 **Kelime do\u011fru anlamda m\u0131?**' },

      { t:'test', s:[

      { t:'test', s:[

        '"Bir say\u0131n\u0131n 3 fazlas\u0131n\u0131n 2 kat\u0131" ile "bir say\u0131n\u0131n 2 kat\u0131n\u0131n 3 fazlas\u0131" **farkl\u0131d\u0131r**: 2(x+3) \u2260 2x+3.',

    ozet:'Devletlerin s\u0131ras\u0131 ve "ilk"ler sorulur. Co\u011frafya Orta Asya, sebep genellikle kurakl\u0131k ve boy yap\u0131s\u0131.',
    bloklar:[
      { t:'zaman', b:'Devletler zaman \u015feridi', z:[
        { y:'M\u00d6 4. yy \u2013 MS 216', o:'Asya (B\u00fcy\u00fck) Hun Devleti', d:'**\u0130lk te\u015fkilatl\u0131 T\u00fcrk devleti.** **Mete Han** \u2014 onluk sistem, d\u00fczenli ordunun kurucusu. \u00c7in\'e kar\u015f\u0131 \u00fcst\u00fcnl\u00fck.' },
        { y:'375 \u2013 469', o:'Avrupa Hun Devleti', d:'**Kavimler G\u00f6\u00e7\u00fc** sonras\u0131nda kuruldu. **Attila** \u2014 Balkan ve Galya seferleri, Bat\u0131 Roma\'y\u0131 sarst\u0131.' },
        { y:'552 \u2013 744', o:'G\u00f6kt\u00fcrk (K\u00f6k T\u00fcrk) Devleti', d:'**T\u00fcrk ad\u0131n\u0131 ilk kez devlet ad\u0131 olarak kullanan** devlet. Bumin ve \u0130stemi. II. G\u00f6kt\u00fcrk\'te **Orhun Yaz\u0131tlar\u0131**.' },
        { y:'744 \u2013 840', o:'Uygur Devleti', d:'**Yerle\u015fik hayata ge\u00e7en ilk T\u00fcrk devleti.** Mani ve Budizm. Matbaa ve k\u00e2\u011f\u0131t kullan\u0131m\u0131, kendi alfabeleri.' },
        { y:'VI \u2013 XI. yy', o:'Di\u011fer T\u00fcrk devletleri', d:'**Avarlar** (\u0130stanbul\'u ku\u015fatan ilk T\u00fcrk devleti), **Hazarlar** (Musevilik, "Hazar Bar\u0131\u015f \u00c7a\u011f\u0131"), **K\u0131rg\u0131zlar** (Manas Destan\u0131), Bulgarlar, Pe\u00e7enek, Kuman, O\u011fuzlar.' }
      ]},
      { t:'kod', b:'S\u0131ralama ezberi', x:'**"Asya \u2013 Avrupa \u2013 G\u00f6k \u2013 Uygur"** \u2192 **A-A-G-U**. Hunlar ikiye ayr\u0131l\u0131r, sonra G\u00f6kt\u00fcrk, en sonda yerle\u015fik hayata ge\u00e7en Uygur gelir.' },
      { t:'tuzak', i:[
        '**T\u00fcrk ad\u0131n\u0131 ilk kullanan** G\u00f6kt\u00fcrkler\'dir; **ilk te\u015fkilatl\u0131 devlet** Asya Hunlar\u0131\'d\u0131r. \u0130kisi ayr\u0131 ayr\u0131 sorulur.',
        'Uygurlar **yerle\u015fik hayata ge\u00e7en ilk T\u00fcrk devleti**dir; \u015fehir kurmu\u015f, tap\u0131nak yapm\u0131\u015flard\u0131r.',
        '**Kavimler G\u00f6\u00e7\u00fc\'n\u00fc Avrupa Hunlar\u0131 ba\u015flatmad\u0131.** Bat\u0131ya g\u00f6\u00e7 eden Hun bask\u0131s\u0131 kavimleri harekete ge\u00e7irdi; Avrupa Hun Devleti g\u00f6\u00e7\u00fcn *sonucunda* kuruldu.',
        '**G\u00f6\u00e7 sebepleri**: kurakl\u0131k ve otlak yetersizli\u011fi, n\u00fcfus art\u0131\u015f\u0131, \u00c7in bask\u0131s\u0131, boylar aras\u0131 m\u00fccadele, salg\u0131n hastal\u0131klar.',
        'T\u00fcrkler **ba\u011f\u0131ms\u0131zl\u0131\u011fa \u00e7ok d\u00fc\u015fk\u00fcn** olduklar\u0131 i\u00e7in g\u00f6\u00e7 ederken bulunduklar\u0131 yeri terk etmi\u015flerdir; bu, tarih boyunca s\u00fcrekli devlet kurma sebebidir.'
      ]},
      { t:'test', s:[
        { q:'A\u015fa\u011f\u0131daki T\u00fcrk devletlerinden hangisi "T\u00fcrk" ad\u0131n\u0131 ilk kez devletinin ad\u0131nda kullanm\u0131\u015ft\u0131r?',
          c:['Asya Hun Devleti','G\u00f6kt\u00fcrk Devleti','Uygur Devleti','Avar Devleti'], d:1,
          a:'552\'de kurulan G\u00f6kt\u00fcrk (K\u00f6k T\u00fcrk) Devleti, T\u00fcrk ad\u0131n\u0131 resm\u00ee devlet ad\u0131 olarak kullanan ilk T\u00fcrk devletidir. \u0130lk te\u015fkilatl\u0131 T\u00fcrk devleti ise Asya Hunlar\u0131\'d\u0131r.' },
        { q:'Yerle\u015fik hayata ge\u00e7en, \u015fehirler kuran ve kendi alfabesini olu\u015fturan ilk T\u00fcrk devleti hangisidir?',
          c:['G\u00f6kt\u00fcrkler','Hazarlar','Uygurlar','K\u0131rg\u0131zlar'], d:2,
          a:'744-840 aras\u0131nda h\u00fck\u00fcm s\u00fcren Uygurlar yerle\u015fik hayata ge\u00e7mi\u015f, tap\u0131nak ve \u015fehirler kurmu\u015f, 18 harfli kendi alfabelerini kullanm\u0131\u015flard\u0131r.' },
        { q:'Musevili\u011fi benimseyerek "Hazar Bar\u0131\u015f \u00c7a\u011f\u0131" olarak an\u0131lan bir d\u00f6nem ya\u015fatan T\u00fcrk devleti hangisidir?',
          c:['Avarlar','Bulgarlar','Hazarlar','Pe\u00e7enekler'], d:2,
          a:'Hazarlar y\u00f6netici s\u0131n\u0131f\u0131 itibar\u0131yla Musevili\u011fi benimsemi\u015f, ho\u015fg\u00f6r\u00fcl\u00fc y\u00f6netimleriyle bilinen uzun bir bar\u0131\u015f d\u00f6nemi ya\u015fatm\u0131\u015flard\u0131r.' }
      ]}
    ]},

  /* ========= 2 ========= */
  { id:'islamiyet-oncesi-kultur', ad:'\u0130slamiyet \u00d6ncesi T\u00fcrklerde K\u00fclt\u00fcr ve Medeniyet', soru:'1\u20133 soru', durum:'hazir',
    ozet:'Kavram sorusu gelir: kut, t\u00f6re, kurultay, balbal. Kavram\u0131 bilen soruyu bilir.',
    bloklar:[
      { t:'tablo', b:'Devlet ve toplum yap\u0131s\u0131', h:['Kavram','Anlam\u0131'], r:[
        ['**Kut**','Y\u00f6netme yetkisinin **Tanr\u0131 taraf\u0131ndan** h\u00fck\u00fcmdara verildi\u011fi inanc\u0131. Kan yoluyla ge\u00e7ti\u011fi i\u00e7in **taht kavgalar\u0131na** yol a\u00e7t\u0131.'],
        ['**Ka\u011fan / Hakan**','Devletin ba\u015f\u0131. Unvanlar: \u015fany\u00fc, tanhu, idikut, ilteber.'],
        ['**Kurultay (Toy)**','Devlet meclisi. Kararlar\u0131 **tavsiye niteli\u011finde**, h\u00fck\u00fcmdar\u0131 ba\u011flamaz.'],
        ['**T\u00f6re**','**Yaz\u0131s\u0131z** hukuk kurallar\u0131. H\u00fck\u00fcmdar bile t\u00f6reye uymak zorundad\u0131r.'],
        ['**\u0130kili te\u015fkilat**','\u00dclkenin **do\u011fu (sol) ve bat\u0131 (sa\u011f)** olarak y\u00f6netilmesi. Do\u011fu \u00fcst\u00fcnd\u00fcr.'],
        ['**Boy \u2013 Budun \u2013 \u0130l**','Ogu\u015f(aile) \u2192 Urug \u2192 Boy \u2192 Budun(millet) \u2192 \u0130l(devlet)'],
        ['**Balbal**','\u00d6len ki\u015finin **\u00f6ld\u00fcrd\u00fc\u011f\u00fc d\u00fc\u015fman say\u0131s\u0131nca** mezar\u0131na dikilen ta\u015f.'],
        ['**Kurgan**','Yer alt\u0131na yap\u0131lan **mezar odas\u0131**.']
      ]},
      { t:'ozet', b:'Din, yaz\u0131 ve sanat', i:[
        '**G\u00f6k Tanr\u0131 inanc\u0131**: tek tanr\u0131l\u0131, ahiret inanc\u0131 var (u\u00e7ma\u011f/tamu). **\u015eamanizm bir din de\u011fil**, bir inan\u00e7 prati\u011fidir.',
        '**Benimsenen dinler**: Uygurlar \u2192 Mani ve Budizm \u00b7 Hazarlar \u2192 Musevilik \u00b7 Bulgarlar (Tuna) \u2192 Hristiyanl\u0131k',
        '**G\u00f6kt\u00fcrk alfabesi 38 harf**, **Uygur alfabesi 18 harf**.',
        '**Orhun Yaz\u0131tlar\u0131 (G\u00f6kt\u00fcrk Kitabeleri)**: 8. y\u00fczy\u0131l, II. G\u00f6kt\u00fcrk Devleti. **Bilge Ka\u011fan, K\u00fcltigin ve Tonyukuk** ad\u0131na dikildi. Yazan: **Yollu\u011f Tigin**. 1893\'te Danimarkal\u0131 **Thomsen** \u00e7\u00f6zd\u00fc. **\u0130lk T\u00fcrk\u00e7e yaz\u0131l\u0131 belge** ve ilk siyasi metindir.',
        '**Destanlar**: Hunlar \u2192 O\u011fuz Ka\u011fan \u00b7 G\u00f6kt\u00fcrkler \u2192 Bozkurt, Ergenekon \u00b7 Uygurlar \u2192 T\u00fcreyi\u015f, G\u00f6\u00e7 \u00b7 K\u0131rg\u0131zlar \u2192 Manas (**d\u00fcnyan\u0131n en uzun destan\u0131**) \u00b7 \u0130skitler(Saka) \u2192 Alp Er Tunga, \u015eu',
        '**Paz\u0131r\u0131k Hal\u0131s\u0131**: Altaylar\'da bulunan, **d\u00fcnyan\u0131n bilinen en eski hal\u0131s\u0131**.',
        '**12 Hayvanl\u0131 T\u00fcrk Takvimi**: Ay y\u0131l\u0131 de\u011fil **g\u00fcne\u015f y\u0131l\u0131** esasl\u0131d\u0131r.'
      ]},
      { t:'kod', b:'Haf\u0131za kodu', x:'**Kut = koltuk.** Tanr\u0131\'n\u0131n verdi\u011fi koltuk kanla ge\u00e7er \u2192 herkes hak sahibi \u2192 **taht kavgas\u0131**. T\u00fcrk devletlerinin k\u0131sa \u00f6m\u00fcrl\u00fc olmas\u0131n\u0131n bir numaral\u0131 sebebi budur.' },
      { t:'tuzak', i:[
        '**\u015eamanizm bir din de\u011fildir.** T\u00fcrklerin dini **G\u00f6k Tanr\u0131** inanc\u0131d\u0131r; \u015eaman (Kam) bir din adam\u0131 tipidir.',
        '**Kurultay kararlar\u0131 ba\u011flay\u0131c\u0131 de\u011fildir.** Meclis vard\u0131r ama demokrasi yoktur.',
        '**T\u00f6re yaz\u0131s\u0131z olmas\u0131na ra\u011fmen h\u00fck\u00fcmdar\u0131 da ba\u011flar.** "Ka\u011fan t\u00f6reye uymak zorundad\u0131r" ifadesi do\u011frudur.',
        '**Orhun Yaz\u0131tlar\u0131 II. G\u00f6kt\u00fcrk d\u00f6nemine** aittir, I. G\u00f6kt\u00fcrk\'e de\u011fil.',
        '**Konarg\u00f6\u00e7er** ya\u015fam "s\u00fcrekli gezen" demek de\u011fildir; yazlak ve k\u0131\u015flak aras\u0131nda **belirli bir d\u00fczende** hareket edilir.',
        'T\u00fcrklerde **\u00f6zel m\u00fclkiyet ve kad\u0131n\u0131n toplumsal konumu** g\u00fc\u00e7l\u00fcd\u00fcr; hatun kurultaya kat\u0131l\u0131r, el\u00e7i kabul edebilir.'
      ]},
      { t:'test', s:[
        { q:'T\u00fcrklerde h\u00fck\u00fcmdar\u0131n y\u00f6netme yetkisini Tanr\u0131\'dan ald\u0131\u011f\u0131 inanc\u0131na ne ad verilir?',
          c:['T\u00f6re','Kut','Yu\u011f','Kurultay'], d:1,
          a:'Kut inanc\u0131, y\u00f6netme yetkisinin Tanr\u0131 taraf\u0131ndan verildi\u011fini ifade eder. Kanla ge\u00e7ti\u011fi i\u00e7in hanedan\u0131n t\u00fcm erkek \u00fcyeleri hak sahibi say\u0131lm\u0131\u015f, bu da taht kavgalar\u0131na yol a\u00e7m\u0131\u015ft\u0131r.' },
        { q:'Orhun Yaz\u0131tlar\u0131 ile ilgili a\u015fa\u011f\u0131dakilerden hangisi **yanl\u0131\u015ft\u0131r**?',
          c:['II. G\u00f6kt\u00fcrk Devleti d\u00f6neminde dikilmi\u015ftir.','T\u00fcrk\u00e7enin ilk yaz\u0131l\u0131 belgeleri say\u0131l\u0131r.','Uygur alfabesiyle yaz\u0131lm\u0131\u015ft\u0131r.','Bilge Ka\u011fan, K\u00fcltigin ve Tonyukuk ad\u0131na dikilmi\u015ftir.'], d:2,
          a:'Yaz\u0131tlar G\u00f6kt\u00fcrk alfabesiyle yaz\u0131lm\u0131\u015ft\u0131r, Uygur alfabesiyle de\u011fil. Di\u011fer bilgiler do\u011frudur; yaz\u0131tlar\u0131 Yollu\u011f Tigin kaleme alm\u0131\u015ft\u0131r.' },
        { q:'\u00d6len ki\u015finin sa\u011fl\u0131\u011f\u0131nda \u00f6ld\u00fcrd\u00fc\u011f\u00fc d\u00fc\u015fman say\u0131s\u0131nca mezar\u0131na dikilen ta\u015flara ne ad verilir?',
          c:['Kurgan','Balbal','Yu\u011f','Damga'], d:1,
          a:'Balbal, \u00f6len ki\u015finin \u00f6ld\u00fcrd\u00fc\u011f\u00fc d\u00fc\u015fman say\u0131s\u0131nca dikilen ta\u015flard\u0131r. Kurgan ise mezar\u0131n kendisidir.' }
      ]}
    ]},

  /* ========= 3 ========= */
  { id:'ilk-turk-islam', ad:'\u0130lk T\u00fcrk-\u0130slam Devletleri', soru:'1\u20132 soru', durum:'hazir',
    ozet:'\u00dc\u00e7 sava\u015f her \u015feyi belirler: Talas 751, Dandanakan 1040, Malazgirt 1071.',
    bloklar:[
      { t:'zaman', b:'Zaman \u015feridi', z:[
        { y:'751', o:'Talas Sava\u015f\u0131', d:'**Abbasiler + Karluklar, \u00c7in\'e kar\u015f\u0131.** T\u00fcrklerin \u0130slamla\u015fmas\u0131nda **d\u00f6n\u00fcm noktas\u0131**. K\u00e2\u011f\u0131t \u00c7in d\u0131\u015f\u0131na ilk kez yay\u0131ld\u0131.' },
        { y:'840 \u2013 1212', o:'Karahanl\u0131lar', d:'**\u0130lk M\u00fcsl\u00fcman T\u00fcrk devleti.** **Satuk Bu\u011fra Han** \u0130slamiyet\'i kabul etti. **T\u00fcrk\u00e7eyi resm\u00ee dil** yapan tek devlet; ilk T\u00fcrk\u00e7e \u0130slami eserler burada yaz\u0131ld\u0131.' },
        { y:'963 \u2013 1187', o:'Gazneliler', d:'**Gazneli Mahmud** \u2014 Hindistan\'a 17 sefer, **"Sultan" unvan\u0131n\u0131 ilk kullanan** T\u00fcrk h\u00fck\u00fcmdar\u0131. Resm\u00ee dil Arap\u00e7a-Fars\u00e7a.' },
        { y:'1040', o:'Dandanakan Sava\u015f\u0131', d:'Sel\u00e7uklular Gaznelileri yendi. **B\u00fcy\u00fck Sel\u00e7uklu Devleti resmen kuruldu**, Gazneliler y\u0131k\u0131l\u0131\u015f s\u00fcrecine girdi.' },
        { y:'1048', o:'Pasinler Sava\u015f\u0131', d:'Sel\u00e7uklular\u0131n **Bizans ile ilk b\u00fcy\u00fck sava\u015f\u0131**.' },
        { y:'1071', o:'Malazgirt Sava\u015f\u0131', d:'**Alparslan \u2013 Romen Diyojen.** **Anadolu\'nun kap\u0131lar\u0131 T\u00fcrklere a\u00e7\u0131ld\u0131**; Anadolu\'da T\u00fcrk beylikleri kurulmaya ba\u015fland\u0131.' },
        { y:'1077 \u2013 1308', o:'T\u00fcrkiye (Anadolu) Sel\u00e7uklu Devleti', d:'Kurucu **S\u00fcleyman \u015eah**, ba\u015fkent \u0130znik sonra Konya.' },
        { y:'1176', o:'Miryokefalon Sava\u015f\u0131', d:'**II. K\u0131l\u0131\u00e7arslan \u2013 Bizans.** Anadolu **kesin olarak T\u00fcrk yurdu** oldu; Bizans\'\u0131n Anadolu\'yu geri alma umudu bitti.' },
        { y:'1243', o:'K\u00f6seda\u011f Sava\u015f\u0131', d:'Mo\u011follara yenilgi. T\u00fcrkiye Sel\u00e7uklu **da\u011f\u0131lma s\u00fcrecine** girdi, Anadolu\'da beylikler d\u00f6nemi ba\u015flad\u0131.' }
      ]},
      { t:'tablo', b:'\u0130lk T\u00fcrk\u00e7e \u0130slami eserler (hepsi Karahanl\u0131 d\u00f6nemi)', h:['Eser','Yazar','\u00d6zellik'], r:[
        ['**Kutadgu Bilig**','Yusuf Has Hacib','\u0130lk T\u00fcrk-\u0130slam siyasetnamesi ("mutluluk veren bilgi")'],
        ['**Divan\u00fc L\u00fcgati\'t-T\u00fcrk**','Ka\u015fgarl\u0131 Mahmud','\u0130lk T\u00fcrk\u00e7e s\u00f6zl\u00fck; Araplara T\u00fcrk\u00e7e \u00f6\u011fretmek i\u00e7in yaz\u0131ld\u0131'],
        ['**Atabet\u00fc\'l Hakay\u0131k**','Edip Ahmet Y\u00fckneki','Ahlak ve \u00f6\u011f\u00fct kitab\u0131'],
        ['**Divan-\u0131 Hikmet**','Ahmet Yesevi','\u0130lk tasavvufi T\u00fcrk\u00e7e eser']
      ]},
      { t:'kod', b:'Haf\u0131za kodu', x:'**\u00dc\u00e7 sava\u015f, \u00fc\u00e7 kap\u0131:** **Talas 751** \u2192 \u0130slam\'\u0131n kap\u0131s\u0131 \u00b7 **Dandanakan 1040** \u2192 devletin kap\u0131s\u0131 \u00b7 **Malazgirt 1071** \u2192 Anadolu\'nun kap\u0131s\u0131. **Miryokefalon 1176** ise kap\u0131y\u0131 *kilitler* \u2014 Anadolu art\u0131k kesin T\u00fcrk yurdudur.' },
      { t:'tuzak', i:[
        '**Malazgirt Anadolu\'nun kap\u0131s\u0131n\u0131 a\u00e7t\u0131, Miryokefalon kapatt\u0131.** "Anadolu T\u00fcrk yurdu oldu" ifadesi **Miryokefalon** i\u00e7indir.',
        '**\u0130lk M\u00fcsl\u00fcman T\u00fcrk devleti Karahanl\u0131lar**\'d\u0131r. **M\u0131s\u0131r\'da kurulan ilk T\u00fcrk devleti** ise **Toluno\u011fullar\u0131**\'d\u0131r \u2014 soru hangisini soruyor, oku.',
        '**Talas Sava\u015f\u0131\'n\u0131 T\u00fcrkler kazanmad\u0131**, Abbasiler kazand\u0131; Karluk T\u00fcrkleri Abbasilerin yan\u0131nda yer ald\u0131.',
        '**Karahanl\u0131lar T\u00fcrk\u00e7eyi resm\u00ee dil yapan tek** T\u00fcrk-\u0130slam devletidir. Gazneli ve Sel\u00e7uklularda resm\u00ee dil Fars\u00e7a/Arap\u00e7ad\u0131r.',
        '**"Sultan" unvan\u0131n\u0131 ilk kullanan** Gazneli Mahmud\'dur.',
        'K\u00f6seda\u011f\'da Mo\u011follar kazand\u0131 ama **Anadolu\'yu do\u011frudan y\u00f6netmediler**; Sel\u00e7uklu bir s\u00fcre daha varl\u0131\u011f\u0131n\u0131 s\u00fcrd\u00fcrd\u00fc (1308).'
      ]},
      { t:'test', s:[
        { q:'Anadolu\'nun kesin olarak T\u00fcrk yurdu h\u00e2line geldi\u011fi kabul edilen sava\u015f hangisidir?',
          c:['Malazgirt Sava\u015f\u0131','Pasinler Sava\u015f\u0131','Miryokefalon Sava\u015f\u0131','K\u00f6seda\u011f Sava\u015f\u0131'], d:2,
          a:'1176 Miryokefalon Sava\u015f\u0131\'ndan sonra Bizans\'\u0131n Anadolu\'yu geri alma umudu bitmi\u015f, Anadolu kesin olarak T\u00fcrk yurdu say\u0131lm\u0131\u015ft\u0131r. Malazgirt (1071) ise Anadolu\'nun kap\u0131lar\u0131n\u0131 a\u00e7an sava\u015ft\u0131r.' },
        { q:'T\u00fcrklerin \u0130slamiyet\'i kabul s\u00fcrecinde d\u00f6n\u00fcm noktas\u0131 say\u0131lan 751 tarihli sava\u015f hangisidir?',
          c:['Talas Sava\u015f\u0131','Dandanakan Sava\u015f\u0131','Pasinler Sava\u015f\u0131','Katvan Sava\u015f\u0131'], d:0,
          a:'751\'deki Talas Sava\u015f\u0131\'nda Karluk T\u00fcrkleri Abbasilerin yan\u0131nda yer alm\u0131\u015f, bu yak\u0131nla\u015fma T\u00fcrklerin kitleler h\u00e2linde \u0130slamiyet\'i kabul etmesinin ba\u015flang\u0131c\u0131 olmu\u015ftur.' },
        { q:'Kutadgu Bilig ve Divan\u00fc L\u00fcgati\'t-T\u00fcrk hangi devlet d\u00f6neminde yaz\u0131lm\u0131\u015ft\u0131r?',
          c:['Gazneliler','Karahanl\u0131lar','B\u00fcy\u00fck Sel\u00e7uklu','T\u00fcrkiye Sel\u00e7uklu'], d:1,
          a:'Her iki eser de T\u00fcrk\u00e7eyi resm\u00ee dil olarak kullanan Karahanl\u0131lar d\u00f6neminde yaz\u0131lm\u0131\u015ft\u0131r.' }
      ]}
    ]},

  /* ========= 4 ========= */
  { id:'ilk-turk-islam-kultur', ad:'\u0130lk T\u00fcrk-\u0130slam Devletlerinde K\u00fclt\u00fcr ve Medeniyet', soru:'1\u20133 soru', durum:'hazir',
    ozet:'\u0130kta, Nizamiye ve T\u00fcrk-\u0130slam bilginleri. Kavram ve isim sorusudur.',
    bloklar:[
      { t:'tablo', b:'Kurumlar ve kavramlar', h:['Kavram','Anlam\u0131'], r:[
        ['**\u0130kta sistemi**','Topra\u011f\u0131n gelirinin hizmet kar\u015f\u0131l\u0131\u011f\u0131 g\u00f6revlilere verilmesi. **Osmanl\u0131 t\u0131mar sisteminin temeli**. Toprak m\u00fclkiyeti devlette kal\u0131r.'],
        ['**Atabeylik**','\u015eehzadelerin e\u011fitiminden sorumlu devlet adam\u0131. Merkez zay\u0131flay\u0131nca **ba\u011f\u0131ms\u0131z beylikler** kurdular.'],
        ['**Divan-\u0131 Saltanat**','B\u00fcy\u00fck Sel\u00e7uklu\'da devlet i\u015flerinin g\u00f6r\u00fc\u015f\u00fcld\u00fc\u011f\u00fc merkez divan.'],
        ['**Nizamiye Medreseleri**','**Nizam\u00fclm\u00fclk** taraf\u0131ndan kuruldu. \u0130slam d\u00fcnyas\u0131n\u0131n **ilk d\u00fczenli, devlet destekli** medreseleri.'],
        ['**Siyasetname**','Nizam\u00fclm\u00fclk\'\u00fcn yazd\u0131\u011f\u0131, devlet y\u00f6netimini anlatan eser.'],
        ['**Ahilik**','Anadolu\'da esnaf ve sanatk\u00e2r te\u015fkilat\u0131. Kurucusu **Ahi Evran**.'],
        ['**Gulam sistemi**','Saray i\u00e7in yeti\u015ftirilen askerler; **Osmanl\u0131 dev\u015firme sisteminin \u00f6nc\u00fcs\u00fc**.']
      ]},
      { t:'ozet', b:'T\u00fcrk-\u0130slam bilginleri', i:[
        '**Farabi** \u2014 "Muallim-i Sani" (\u0130kinci \u00d6\u011fretmen). Felsefe ve mant\u0131k.',
        '**\u0130bn-i Sina** \u2014 *El-Kanun fi\'t-T\u0131b*. Bat\u0131\'da y\u00fczy\u0131llarca t\u0131p ders kitab\u0131 olarak okutuldu.',
        '**Biruni** \u2014 Astronomi ve co\u011frafya; D\u00fcnya\'n\u0131n \u00e7ap\u0131n\u0131 hesaplad\u0131.',
        '**\u00d6mer Hayyam** \u2014 **Celali Takvimi**\'ni haz\u0131rlad\u0131; matematik\u00e7i ve \u015fair.',
        '**Gazali** \u2014 *\u0130hyau Ulumi\'d-Din*. Nizamiye Medreseleri\'nde ders verdi; Bat\u0131nilikle m\u00fccadele etti.',
        '**Harezmi** \u2014 **Cebirin kurucusu** say\u0131l\u0131r; "algoritma" s\u00f6zc\u00fc\u011f\u00fc ad\u0131ndan t\u00fcremi\u015ftir.'
      ]},
      { t:'kod', b:'Haf\u0131za kodu', x:'**\u0130kta \u2192 t\u0131mar \u00b7 Gulam \u2192 dev\u015firme \u00b7 Atabey \u2192 lala.** Sel\u00e7uklu\'daki her kurumun Osmanl\u0131\'da bir kar\u015f\u0131l\u0131\u011f\u0131 vard\u0131r. Soru "hangisinin temelini olu\u015fturur" diye gelir.' },
      { t:'tuzak', i:[
        '**\u0130kta\'da topra\u011f\u0131n m\u00fclkiyeti devlete aittir**, g\u00f6revliye verilen yaln\u0131zca **gelirin kullan\u0131m hakk\u0131**d\u0131r. Bu, Avrupa\'daki feodaliteden temel farkt\u0131r.',
        '**Nizamiye Medreseleri\'ni Nizam\u00fclm\u00fclk kurdu**, Melik\u015fah de\u011fil. Melik\u015fah d\u00f6nemine denk gelir ama kurucu vezirdir.',
        '**\u0130bn-i Sina t\u0131p, Biruni astronomi, Harezmi matematik.** \u0130sim-alan e\u015fle\u015ftirmesi do\u011frudan sorulur.',
        '**T\u00fcrk-\u0130slam mimarisinde** kervansaray, k\u00fclliye, ta\u00e7kap\u0131 ve \u00e7ift minare \u00f6ne \u00e7\u0131kar; kubbe kullan\u0131m\u0131 Sel\u00e7uklu ile yayg\u0131nla\u015fm\u0131\u015ft\u0131r.',
        'Sel\u00e7uklularda **T\u00fcrk\u00e7e resm\u00ee dil de\u011fildir**; bilim dili Arap\u00e7a, edebiyat ve devlet dili Fars\u00e7ad\u0131r.'
      ]},
      { t:'test', s:[
        { q:'Sel\u00e7uklularda topra\u011f\u0131n gelirinin hizmet kar\u015f\u0131l\u0131\u011f\u0131nda g\u00f6revlilere verilmesi esas\u0131na dayanan ve Osmanl\u0131 t\u0131mar sisteminin temelini olu\u015fturan uygulama hangisidir?',
          c:['Vak\u0131f','\u0130kta','M\u00fclk','\u00d6\u015f\u00fcr'], d:1,
          a:'\u0130kta sisteminde topra\u011f\u0131n m\u00fclkiyeti devlette kal\u0131r, gelirinin bir k\u0131sm\u0131 hizmet kar\u015f\u0131l\u0131\u011f\u0131 g\u00f6revliye b\u0131rak\u0131l\u0131r. Osmanl\u0131 t\u0131mar sistemi bu uygulaman\u0131n devam\u0131d\u0131r.' },
        { q:'\u0130slam d\u00fcnyas\u0131n\u0131n ilk d\u00fczenli ve devlet destekli medreseleri olan Nizamiye Medreseleri\'ni kuran devlet adam\u0131 kimdir?',
          c:['Alparslan','Melik\u015fah','Nizam\u00fclm\u00fclk','Tu\u011frul Bey'], d:2,
          a:'Nizamiye Medreseleri, B\u00fcy\u00fck Sel\u00e7uklu veziri Nizam\u00fclm\u00fclk taraf\u0131ndan kurulmu\u015ftur. Siyasetname adl\u0131 eser de ona aittir.' },
        { q:'*El-Kanun fi\'t-T\u0131b* adl\u0131 eseriyle Avrupa \u00fcniversitelerinde y\u00fczy\u0131llarca ders kitab\u0131 olarak okutulan T\u00fcrk-\u0130slam bilgini kimdir?',
          c:['Farabi','Biruni','\u0130bn-i Sina','Harezmi'], d:2,
          a:'\u0130bn-i Sina\'n\u0131n t\u0131p ansiklopedisi niteli\u011findeki bu eseri, Bat\u0131\'da Avicenna ad\u0131yla uzun s\u00fcre temel kaynak olarak kullan\u0131lm\u0131\u015ft\u0131r.' }
      ]}
    ]},

  /* ========= 5 ========= */
  { id:'osmanli-kurulus', ad:'Osmanl\u0131 Kurulu\u015f ve Y\u00fckselme D\u00f6nemi', soru:'1\u20132 soru', durum:'hazir',
    ozet:'Padi\u015fah\u2013olay e\u015fle\u015ftirmesi sorulur. Her padi\u015fah\u0131n "ilk"ini bil.',
    bloklar:[
      { t:'zaman', b:'Kurulu\u015ftan Kanuni\'ye', z:[
        { y:'1299', o:'Osman Bey \u2014 kurulu\u015f', d:'S\u00f6\u011f\u00fct merkezli beylik. **Koyunhisar (1302)** Bizans\'la ilk sava\u015f.' },
        { y:'1326 \u2013 1362', o:'Orhan Bey', d:'**\u0130lk d\u00fczenli ordu** (yaya ve m\u00fcsellem), **Bursa ba\u015fkent**, **ilk medrese** (\u0130znik), **Karesi ilhak\u0131** (denizcili\u011fin ba\u015flang\u0131c\u0131), **\u00c7impe Kalesi 1353** ile Rumeli\'ye ge\u00e7i\u015f.' },
        { y:'1362 \u2013 1389', o:'I. Murad', d:'**Yeni\u00e7eri Oca\u011f\u0131** ve **dev\u015firme** sistemi, **Rumeli Beylerbeyli\u011fi**. S\u0131rps\u0131nd\u0131\u011f\u0131 1364, **I. Kosova 1389**. "\u00dclke h\u00fck\u00fcmdar ve o\u011fullar\u0131n\u0131nd\u0131r" anlay\u0131\u015f\u0131.' },
        { y:'1389 \u2013 1402', o:'Y\u0131ld\u0131r\u0131m Bayezid', d:'**Ni\u011fbolu 1396** (son b\u00fcy\u00fck Ha\u00e7l\u0131 seferi), \u0130stanbul ku\u015fatmalar\u0131. **Ankara Sava\u015f\u0131 1402** \u2014 Timur\'a yenilgi \u2192 **Fetret Devri (1402-1413)**.' },
        { y:'1413 \u2013 1421', o:'\u00c7elebi Mehmet', d:'Devletin **ikinci kurucusu**. Fetret Devri\'ni sona erdirdi.' },
        { y:'1421 \u2013 1451', o:'II. Murad', d:'**Edirne-Segedin 1444** (ilk kez e\u015fit ko\u015fullarda antla\u015fma), **Varna 1444**, **II. Kosova 1448** \u2014 Ha\u00e7l\u0131lar\u0131n sald\u0131r\u0131 g\u00fcc\u00fc bitti.' },
        { y:'1451 \u2013 1481', o:'Fatih Sultan Mehmet', d:'**\u0130stanbul\'un Fethi 1453** \u2192 Orta \u00c7a\u011f kapand\u0131. **Otlukbeli 1473** (Uzun Hasan), **K\u0131r\u0131m 1475** (Karadeniz T\u00fcrk g\u00f6l\u00fc), **Kanunname-i Ali Osman** (ilk Osmanl\u0131 kanunnamesi).' },
        { y:'1481 \u2013 1512', o:'II. Bayezid', d:'**Cem Sultan olay\u0131** \u2014 i\u00e7 sorun ve d\u0131\u015f bask\u0131; fetihler duraksad\u0131.' },
        { y:'1512 \u2013 1520', o:'Yavuz Sultan Selim', d:'**\u00c7ald\u0131ran 1514** (\u015eah \u0130smail), **Mercidab\u0131k 1516** ve **Ridaniye 1517** \u2192 Meml\u00fckler y\u0131k\u0131ld\u0131, **halifelik Osmanl\u0131\'ya ge\u00e7ti**, Baharat Yolu ele ge\u00e7irildi.' },
        { y:'1520 \u2013 1566', o:'Kanuni Sultan S\u00fcleyman', d:'Belgrad 1521, Rodos 1522, **Moha\u00e7 1526**, **I. Viyana Ku\u015fatmas\u0131 1529**, **Preveze Deniz Sava\u015f\u0131 1538** (Barbaros \u2014 Akdeniz T\u00fcrk g\u00f6l\u00fc), **Fransa\'ya kapit\u00fclasyonlar 1535**, **Amasya 1555** (\u0130ran\'la ilk antla\u015fma).' }
      ]},
      { t:'kod', b:'Haf\u0131za kodu', x:'**Yavuz = Do\u011fu ve G\u00fcney** (\u0130ran, Suriye, M\u0131s\u0131r \u2014 halifelik). **Kanuni = Bat\u0131 ve Deniz** (Macaristan, Viyana, Akdeniz). Y\u00f6n kar\u0131\u015f\u0131rsa padi\u015fah da kar\u0131\u015f\u0131r.' },
      { t:'tuzak', i:[
        '**Fetret Devri\'nde (1402-1413) Osmanl\u0131 y\u0131k\u0131lmad\u0131**, taht kavgas\u0131 ya\u015fand\u0131. Bu d\u00f6nemde Balkanlarda toprak kaybedilmemesi, **isk\u00e2n politikas\u0131n\u0131n** ba\u015far\u0131s\u0131 say\u0131l\u0131r.',
        '**\u0130lk kapit\u00fclasyonlar 1352\'de Orhan Bey d\u00f6neminde Cenevizlilere** verilmi\u015ftir. 1535\'te Kanuni\'nin Fransa\'ya verdi\u011fi ayr\u0131cal\u0131klar ise **en kapsaml\u0131** olan\u0131d\u0131r.',
        '**\u0130stanbul\'un fethi Orta \u00c7a\u011f\'\u0131 bitirdi**, Yeni \u00c7a\u011f\'\u0131 ba\u015flatt\u0131. "Co\u011frafi ke\u015fifleri h\u0131zland\u0131rd\u0131" ifadesi de do\u011frudur.',
        '**Halifelik Yavuz d\u00f6neminde (1517)** Osmanl\u0131\'ya ge\u00e7mi\u015ftir; Fatih de\u011fil.',
        '**Preveze 1538 Akdeniz\'i, K\u0131r\u0131m\'\u0131n al\u0131nmas\u0131 1475 Karadeniz\'i** T\u00fcrk g\u00f6l\u00fc yapt\u0131. Deniz-tarih e\u015fle\u015ftirmesine dikkat.',
        '**Otlukbeli Sava\u015f\u0131 Akkoyunlu**\'ya kar\u015f\u0131d\u0131r; **\u00c7ald\u0131ran Safevi**\'ye kar\u015f\u0131d\u0131r. \u0130kisi de do\u011fuda ama farkl\u0131 devletlerdir.'
      ]},
      { t:'test', s:[
        { q:'Osmanl\u0131 Devleti\'nde halifeli\u011fin padi\u015fahlara ge\u00e7mesi hangi padi\u015fah d\u00f6neminde ger\u00e7ekle\u015fmi\u015ftir?',
          c:['Fatih Sultan Mehmet','Yavuz Sultan Selim','Kanuni Sultan S\u00fcleyman','II. Bayezid'], d:1,
          a:'1517 Ridaniye Sava\u015f\u0131 sonras\u0131nda Meml\u00fck Devleti\'nin y\u0131k\u0131lmas\u0131yla halifelik Yavuz Sultan Selim d\u00f6neminde Osmanl\u0131\'ya ge\u00e7mi\u015ftir.' },
        { q:'Osmanl\u0131 Devleti\'nin Rumeli\'ye ge\u00e7i\u015fi hangi padi\u015fah d\u00f6neminde ve hangi kale ile olmu\u015ftur?',
          c:['Osman Bey \u2013 Karacahisar','Orhan Bey \u2013 \u00c7impe','I. Murad \u2013 Edirne','Y\u0131ld\u0131r\u0131m Bayezid \u2013 Ni\u011fbolu'], d:1,
          a:'1353\'te Orhan Bey d\u00f6neminde \u00c7impe Kalesi\'nin al\u0131nmas\u0131yla Osmanl\u0131 Rumeli\'ye ilk kez ayak basm\u0131\u015ft\u0131r.' },
        { q:'A\u015fa\u011f\u0131daki sava\u015flardan hangisi sonucunda Akdeniz\'de T\u00fcrk \u00fcst\u00fcnl\u00fc\u011f\u00fc kesinle\u015fmi\u015ftir?',
          c:['Preveze Deniz Sava\u015f\u0131','\u0130nebaht\u0131 Deniz Sava\u015f\u0131','Otlukbeli Sava\u015f\u0131','Moha\u00e7 Sava\u015f\u0131'], d:0,
          a:'1538 Preveze Deniz Sava\u015f\u0131\'nda Barbaros Hayreddin Pa\u015fa komutas\u0131ndaki donanma Ha\u00e7l\u0131 donanmas\u0131n\u0131 yenmi\u015f, Akdeniz T\u00fcrk g\u00f6l\u00fc h\u00e2line gelmi\u015ftir.' }
      ]}
    ]},

  /* ========= 6 ========= */
  { id:'duraklama', ad:'17. Y\u00fczy\u0131l \u2014 Duraklama D\u00f6nemi', soru:'1\u20133 soru', durum:'hazir',
    ozet:'Antla\u015fma\u2013sonu\u00e7 e\u015fle\u015ftirmesi ve Celali \u0130syanlar\u0131. Zitvatorok ile Karlof\u00e7a aras\u0131.',
    bloklar:[
      { t:'tablo', b:'17. y\u00fczy\u0131l antla\u015fmalar\u0131', h:['Antla\u015fma','Taraf','Sonu\u00e7'], r:[
        ['**Zitvatorok 1606**','Avusturya','Avusturya ar\u015fid\u00fck\u00fc **padi\u015faha denk** say\u0131ld\u0131 \u2192 Osmanl\u0131 \u00fcst\u00fcnl\u00fc\u011f\u00fc sona erdi. Y\u0131ll\u0131k vergi kald\u0131r\u0131ld\u0131.'],
        ['Nasuh Pa\u015fa 1612','\u0130ran','Osmanl\u0131, 1590\'da ald\u0131\u011f\u0131 topraklar\u0131 geri verdi.'],
        ['**Kasr-\u0131 \u015eirin 1639**','\u0130ran','**Bug\u00fcnk\u00fc T\u00fcrkiye-\u0130ran s\u0131n\u0131r\u0131n\u0131n temeli.** Ba\u011fdat Osmanl\u0131\'da kald\u0131.'],
        ['Vasvar 1664','Avusturya','Uyvar ve \u00e7evresi al\u0131nd\u0131; Osmanl\u0131 lehine son Avusturya antla\u015fmas\u0131.'],
        ['**Buca\u015f 1672**','Lehistan','Podolya al\u0131nd\u0131 \u2014 **Osmanl\u0131 en geni\u015f s\u0131n\u0131rlar\u0131na** ula\u015ft\u0131.'],
        ['**Karlof\u00e7a 1699**','Kutsal \u0130ttifak','**\u0130lk b\u00fcy\u00fck toprak kayb\u0131.** Duraklama bitti, gerileme ba\u015flad\u0131.']
      ]},
      { t:'ozet', b:'Duraklaman\u0131n sebepleri', i:[
        '**\u0130\u00e7 sebepler**: merkez\u00ee otoritenin zay\u0131flamas\u0131, \u015fehzadelerin sanca\u011fa \u00e7\u0131kma usul\u00fcn\u00fcn kald\u0131r\u0131lmas\u0131, **t\u0131mar sisteminin bozulmas\u0131**, kap\u0131kulu ocaklar\u0131n\u0131n siyasete kar\u0131\u015fmas\u0131, ilmiye s\u0131n\u0131f\u0131n\u0131n bozulmas\u0131, r\u00fc\u015fvet ve iltimas.',
        '**D\u0131\u015f sebepler**: **do\u011fal s\u0131n\u0131rlara ula\u015f\u0131lmas\u0131**, Avrupa\'da g\u00fc\u00e7l\u00fc devletlerin ortaya \u00e7\u0131kmas\u0131, **co\u011frafi ke\u015fifler**le ticaret yollar\u0131n\u0131n \u00f6nem kaybetmesi, teknolojik geri kal\u0131\u015f.',
        '**Celali \u0130syanlar\u0131**: Anadolu\'da devlet d\u00fczeninin bozulmas\u0131ndan kaynaklanan halk ve asker isyanlar\u0131. \u00dcretim d\u00fc\u015ft\u00fc, g\u00f6\u00e7ler artt\u0131 ("b\u00fcy\u00fck ka\u00e7gunluk").',
        '**Ekber ve er\u015fed** sistemi (I. Ahmed): hanedan\u0131n **en ya\u015fl\u0131 ve olgun** \u00fcyesinin tahta ge\u00e7mesi. Taht kavgalar\u0131n\u0131 azaltt\u0131 ama deneyimsiz padi\u015fahlar d\u00f6nemini ba\u015flatt\u0131.',
        '**II. Osman (Gen\u00e7 Osman)**: **yeni\u00e7eriler taraf\u0131ndan \u00f6ld\u00fcr\u00fclen ilk padi\u015fah**t\u0131r.',
        '**IV. Murad**: Revan ve Ba\u011fdat seferleri; i\u00e7ki-t\u00fct\u00fcn yasa\u011f\u0131; **Ko\u00e7i Bey Risalesi** ona sunuldu.',
        '**K\u00f6pr\u00fcl\u00fcler D\u00f6nemi (1656-1691)**: ge\u00e7ici bir toparlanma sa\u011fland\u0131; Girit tamamen al\u0131nd\u0131 (1669).'
      ]},
      { t:'kod', b:'Haf\u0131za kodu', x:'**Zitvatorok = e\u015fitlik, Kasr-\u0131 \u015eirin = s\u0131n\u0131r, Buca\u015f = zirve, Karlof\u00e7a = d\u00fc\u015f\u00fc\u015f.** D\u00f6rt antla\u015fma 17. y\u00fczy\u0131l\u0131n tamam\u0131n\u0131 \u00f6zetler.' },
      { t:'tuzak', i:[
        '**Duraklaman\u0131n ba\u015flang\u0131c\u0131 Zitvatorok 1606, sonu Karlof\u00e7a 1699** kabul edilir. Baz\u0131 kaynaklar Sokullu\'nun \u00f6l\u00fcm\u00fcn\u00fc (1579) ba\u015flang\u0131\u00e7 sayar.',
        '**Karlof\u00e7a ile ilk kez b\u00fcy\u00fck \u00f6l\u00e7ekli toprak kaybedildi**; "ilk toprak kayb\u0131" ifadesi bu antla\u015fma i\u00e7in kullan\u0131l\u0131r.',
        '**Celali \u0130syanlar\u0131 din\u00ee de\u011fil, ekonomik ve idari** sebeplidir. Devleti y\u0131kmay\u0131 de\u011fil, d\u00fczenin bozulmas\u0131na tepkiyi hedefler.',
        '**Girit Seferi 24 y\u0131l (1645-1669) s\u00fcrd\u00fc** \u2014 Osmanl\u0131 tarihinin en uzun ku\u015fatmas\u0131d\u0131r.',
        '**Kasr-\u0131 \u015eirin s\u0131n\u0131r\u0131 bug\u00fcne kadar b\u00fcy\u00fck \u00f6l\u00e7\u00fcde korunmu\u015ftur**; bu ayr\u0131nt\u0131 s\u0131k sorulur.',
        '17. y\u00fczy\u0131l \u0131slahatlar\u0131 **ki\u015filere ba\u011fl\u0131 ve bask\u0131c\u0131** kald\u0131\u011f\u0131 i\u00e7in kal\u0131c\u0131 olmam\u0131\u015ft\u0131r.'
      ]},
      { t:'test', s:[

  { id:'gerileme', ad:'18. Y\u00fczy\u0131l \u2014 Gerileme D\u00f6nemi', soru:'1\u20132 soru', durum:'hazir',

      { t:'zaman', b:'18. y\u00fczy\u0131l zaman \u015feridi', z:[

        { y:'1711', o:'Prut Antla\u015fmas\u0131', d:'**Rusya\'ya kar\u015f\u0131 kazan\u0131lan zafer.** Baltac\u0131 Mehmet Pa\u015fa; Azak geri al\u0131nd\u0131.' },
        { y:'1718', o:'Pasarof\u00e7a Antla\u015fmas\u0131', d:'**Lale Devri (1718-1730)** ba\u015flad\u0131. Bat\u0131 \u00f6rnek al\u0131nmaya ba\u015fland\u0131.' },
        { y:'1727', o:'\u0130lk T\u00fcrk matbaas\u0131', d:'**\u0130brahim M\u00fcteferrika** ve Said Efendi. Din\u00ee kitaplar bas\u0131lmad\u0131.' },
        { y:'1730', o:'Patrona Halil \u0130syan\u0131', d:'Lale Devri sona erdi, III. Ahmed tahttan indirildi.' },
        { y:'1739', o:'Belgrad Antla\u015fmas\u0131', d:'**Son kazan\u00e7l\u0131 antla\u015fma.** 1740\'ta Fransa\'ya kapit\u00fclasyonlar **s\u00fcrekli** h\u00e2le getirildi.' },
        { y:'1774', o:'K\u00fc\u00e7\u00fck Kaynarca Antla\u015fmas\u0131', d:'**En a\u011f\u0131r antla\u015fma.** K\u0131r\u0131m\'a s\u00f6zde ba\u011f\u0131ms\u0131zl\u0131k, Rusya\'ya kapit\u00fclasyon ve Ortodokslar\u0131n koruyuculu\u011fu, sava\u015f tazminat\u0131.' },

      { t:'tablo', b:'18. y\u00fczy\u0131l \u0131slahatlar\u0131', h:['D\u00f6nem','Yap\u0131lanlar'], r:[
        ['**Lale Devri** (III. Ahmed)','**Matbaa (1727)**, itfaiye (Tulumbac\u0131 Oca\u011f\u0131), \u00e7i\u00e7ek a\u015f\u0131s\u0131, k\u00e2\u011f\u0131t ve kuma\u015f fabrikas\u0131, **ilk ge\u00e7ici el\u00e7ilikler**, \u00e7ini at\u00f6lyesi, k\u00fct\u00fcphaneler, \u00e7eviri heyeti'],

        ['**III. Mustafa**','**Baron de Tott** ile top\u00e7u oca\u011f\u0131 \u0131slah\u0131; **M\u00fchendishane-i Bahri-i H\u00fcmayun** (deniz m\u00fchendisli\u011fi)'],

      { t:'kod', b:'Haf\u0131za kodu', x:'**"Prut kazand\u0131rd\u0131, Pasarof\u00e7a durdurdu, Belgrad son g\u00fcld\u00fcrd\u00fc, Kaynarca \u00e7\u00f6kertti."** 18. y\u00fczy\u0131l\u0131n d\u00f6rt antla\u015fmas\u0131 bu s\u0131rayla gelir.' },
      { t:'tuzak', i:[
        '**Belgrad 1739 son kazan\u00e7l\u0131 antla\u015fmad\u0131r.** Bundan sonra Osmanl\u0131 kazanan taraf olarak masaya oturmam\u0131\u015ft\u0131r.',
        '**K\u00fc\u00e7\u00fck Kaynarca 1774\'te K\u0131r\u0131m\'a verilen "ba\u011f\u0131ms\u0131zl\u0131k" ger\u00e7ek de\u011fildir**; Rusya\'n\u0131n K\u0131r\u0131m\'\u0131 ilhak\u0131n\u0131n haz\u0131rl\u0131\u011f\u0131d\u0131r. K\u0131r\u0131m, **kaybedilen ilk M\u00fcsl\u00fcman T\u00fcrk topra\u011f\u0131** olarak \u00f6nemlidir.',

        '**Lale Devri\'nde asker\u00ee \u0131slahat yap\u0131lmad\u0131**; k\u00fclt\u00fcr, sanat ve imar \u00f6ne \u00e7\u0131kt\u0131.',
        '**\u0130lk daim\u00ee el\u00e7ilikler III. Selim d\u00f6neminde** a\u00e7\u0131ld\u0131; Lale Devri\'ndekiler **ge\u00e7ici** el\u00e7iliklerdir.',
        '18. y\u00fczy\u0131l \u0131slahatlar\u0131 **Avrupa \u00f6rnek al\u0131narak** yap\u0131lm\u0131\u015ft\u0131r; 17. y\u00fczy\u0131lda ise "eski d\u00fczene d\u00f6n\u00fc\u015f" hedeflenmi\u015fti. Fark s\u0131k sorulur.'
      ]},
      { t:'test', s:[
        { q:'Osmanl\u0131 Devleti\'nin son kez toprak kazand\u0131\u011f\u0131 antla\u015fma hangisidir?',
          c:['Prut Antla\u015fmas\u0131','Pasarof\u00e7a Antla\u015fmas\u0131','Belgrad Antla\u015fmas\u0131','Ya\u015f Antla\u015fmas\u0131'], d:2,

        { q:'K\u00fc\u00e7\u00fck Kaynarca Antla\u015fmas\u0131 ile ilgili a\u015fa\u011f\u0131dakilerden hangisi **yanl\u0131\u015ft\u0131r**?',
          c:['K\u0131r\u0131m\'a ba\u011f\u0131ms\u0131zl\u0131k verilmi\u015ftir.','Rusya Ortodokslar\u0131n koruyuculu\u011funu \u00fcstlenmi\u015ftir.','Osmanl\u0131 Devleti sava\u015f tazminat\u0131 \u00f6demi\u015ftir.','Osmanl\u0131 Devleti toprak kazanm\u0131\u015ft\u0131r.'], d:3,
          a:'1774 K\u00fc\u00e7\u00fck Kaynarca, Osmanl\u0131\'n\u0131n imzalad\u0131\u011f\u0131 en a\u011f\u0131r antla\u015fmalardand\u0131r; toprak kazan\u0131lmam\u0131\u015f, aksine a\u011f\u0131r siyasi ve ekonomik \u00f6d\u00fcnler verilmi\u015ftir.' },
        { q:'\u0130lk T\u00fcrk matbaas\u0131 hangi d\u00f6nemde ve kim taraf\u0131ndan kurulmu\u015ftur?',

          a:'1727\'de Lale Devri\'nde \u0130brahim M\u00fcteferrika ve Said Efendi taraf\u0131ndan kurulmu\u015ftur. Din\u00ee kitaplar\u0131n bas\u0131m\u0131na izin verilmemi\u015ftir.' }

    ]},

  { id:'dagilma', ad:'19. Y\u00fczy\u0131l \u2014 Da\u011f\u0131lma D\u00f6nemi', soru:'1\u20132 soru', durum:'hazir',

        { y:'1839', o:'Tanzimat Ferman\u0131', d:'**Abd\u00fclmecid \u2013 Mustafa Re\u015fid Pa\u015fa.** Kanun \u00fcst\u00fcnl\u00fc\u011f\u00fc, can-mal-namus g\u00fcvencesi. **Padi\u015fah kendi yetkisini kendi s\u0131n\u0131rlad\u0131.**' },
        { y:'1853\u201356', o:'K\u0131r\u0131m Sava\u015f\u0131', d:'Osmanl\u0131 + \u0130ngiltere + Fransa, Rusya\'ya kar\u015f\u0131. **\u0130lk d\u0131\u015f bor\u00e7 1854**\'te al\u0131nd\u0131.' },

        { y:'1877\u201378', o:'93 Harbi', d:'Rusya\'ya a\u011f\u0131r yenilgi. **Ayastefanos** imzaland\u0131 ama uygulanmad\u0131; yerine **Berlin Antla\u015fmas\u0131 1878** y\u00fcr\u00fcrl\u00fc\u011fe girdi.' },
        { y:'1881', o:'Duyun-u Umumiye', d:'**Genel Bor\u00e7lar \u0130daresi** kuruldu; Osmanl\u0131 maliyesi b\u00fcy\u00fck \u00f6l\u00e7\u00fcde denetim alt\u0131na girdi.' }

      { t:'tablo', b:'\u00dc\u00e7 ferman kar\u015f\u0131la\u015ft\u0131rmas\u0131', h:['Belge','Y\u0131l','\u00d6ne \u00e7\u0131kan'], r:[

        ['**Islahat Ferman\u0131**','1856','**Gayrim\u00fcslimlere** e\u015fitlik ve geni\u015f haklar; d\u0131\u015f bask\u0131yla haz\u0131rland\u0131']

      { t:'kod', b:'Haf\u0131za kodu', x:'**1839 Tanzimat = herkes \u00b7 1856 Islahat = gayrim\u00fcslimler \u00b7 1876 Kanun-i Esasi = anayasa.** Fermanlar giderek daral\u0131r, sonunda anayasaya var\u0131r.' },
      { t:'tuzak', i:[

        '**Islahat Ferman\u0131 d\u0131\u015f bask\u0131yla** haz\u0131rland\u0131 ve Paris Konferans\u0131 \u00f6ncesinde ilan edildi; Tanzimat ise **i\u00e7 kaynakl\u0131** say\u0131l\u0131r.',

      ]},
      { t:'test', s:[

        { q:'93 Harbi sonunda imzalanan ancak uygulanmayan antla\u015fma hangisidir?',
