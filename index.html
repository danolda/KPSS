        { y:'28 May\u0131s 1919', o:'Havza Genelgesi', d:'\u0130\u015fgalleri protesto mitingleri d\u00fczenlenmesi \u00e7a\u011fr\u0131s\u0131 \u2014 **halk\u0131n ilk kez topluca harekete ge\u00e7irilmesi**.' },
        { y:'22 Haziran 1919', o:'Amasya Genelgesi', d:'**Mill\u00ee M\u00fccadele\'nin ama\u00e7, gerek\u00e7e ve y\u00f6ntemi ilk kez** a\u00e7\u0131kland\u0131. *"Milletin istiklalini yine milletin azim ve karar\u0131 kurtaracakt\u0131r."* **\u0130htilal beyannamesi** niteli\u011findedir. **Sivas\'ta mill\u00ee bir kongre** toplanmas\u0131 karar\u0131 burada al\u0131nd\u0131.' },
        { y:'8-9 Temmuz 1919', o:'Mustafa Kemal askerlikten istifa etti', d:'Erzurum Kongresi \u00f6ncesinde, **Amasya Genelgesi sonras\u0131nda** \u0130stanbul\'un geri \u00e7a\u011f\u0131rmas\u0131 \u00fczerine "sine-i millete" d\u00f6nd\u00fc. **K\u00e2z\u0131m Karabekir** ordusuyla deste\u011fini s\u00fcrd\u00fcrd\u00fc.' },
        { y:'23 Temmuz \u2013 7 A\u011fustos 1919', o:'Erzurum Kongresi', d:'**Toplan\u0131\u015f\u0131 b\u00f6lgesel, kararlar\u0131 mill\u00eedir.** \u0130lk kez **manda ve himaye reddedildi**, ilk kez **mill\u00ee s\u0131n\u0131rlar**dan s\u00f6z edildi, **Temsil Heyeti** kuruldu (Do\u011fu Anadolu\'yu temsilen).' },
        { y:'4 \u2013 11 Eyl\u00fcl 1919', o:'Sivas Kongresi', d:'**Toplan\u0131\u015f\u0131 ve kararlar\u0131 mill\u00eedir.** T\u00fcm cemiyetler **Anadolu ve Rumeli M\u00fcdafaa-i Hukuk Cemiyeti** \u00e7at\u0131s\u0131nda birle\u015fti; Temsil Heyeti **t\u00fcm yurdu** temsil eder h\u00e2le geldi. Manda ve himaye **kesin olarak** reddedildi.' },
        { y:'Eyl\u00fcl 1919', o:'\u0130rade-i Milliye gazetesi', d:'Sivas Kongresi sonras\u0131nda \u00e7\u0131kar\u0131ld\u0131; **Mill\u00ee M\u00fccadele\'nin ilk yay\u0131n organ\u0131**. Ankara\'da yerini **H\u00e2kimiyet-i Milliye**\'ye b\u0131rakt\u0131.' },
        { y:'20 \u2013 22 Ekim 1919', o:'Amasya G\u00f6r\u00fc\u015fmeleri', d:'**\u0130stanbul H\u00fck\u00fcmeti Temsil Heyeti\'ni hukuken tan\u0131d\u0131.** Salih Pa\u015fa ile Mustafa Kemal g\u00f6r\u00fc\u015ft\u00fc.' },
        { y:'28 Ocak 1920', o:'Misak-\u0131 Mill\u00ee', d:'Son Osmanl\u0131 Mebusan Meclisi\'nde kabul edildi. **Mill\u00ee s\u0131n\u0131rlar Mondros Ate\u015fkesi\'nin imzaland\u0131\u011f\u0131 s\u0131radaki s\u0131n\u0131rlar esas al\u0131narak** belirlendi. Tam ba\u011f\u0131ms\u0131zl\u0131k belgesi.' },
        { y:'16 Mart 1920', o:'\u0130stanbul\'un resmen i\u015fgali', d:'Mebusan Meclisi da\u011f\u0131t\u0131ld\u0131 \u2192 Ankara\'da yeni meclisin toplanmas\u0131n\u0131n yolu a\u00e7\u0131ld\u0131.' }
      ]},
      { t:'tablo', b:'Erzurum ve Sivas Kongreleri fark\u0131', h:['\u00d6l\u00e7\u00fct','Erzurum','Sivas'], r:[
        ['Toplan\u0131\u015f','**B\u00f6lgesel**','**Mill\u00ee**'],
        ['Kararlar','**Mill\u00ee**','**Mill\u00ee**'],
        ['Temsil Heyeti','Kuruldu \u2014 **yaln\u0131z Do\u011fu Anadolu**\'yu temsil','**T\u00fcm yurdu** temsil eder h\u00e2le geldi'],
        ['Manda\u2013himaye','**\u0130lk kez reddedildi**','**Kesin olarak reddedildi**'],
        ['Cemiyetler','\u2014','T\u00fcm\u00fc **tek \u00e7at\u0131** alt\u0131nda birle\u015ftirildi'],
        ['Yay\u0131n organ\u0131','\u2014','**\u0130rade-i Milliye** gazetesi \u00e7\u0131kar\u0131ld\u0131']
      ]},
      { t:'kod', b:'Haf\u0131za kodu', x:'**"H-A-E-S-A-M":** **H**avza \u2192 **A**masya Genelgesi \u2192 **E**rzurum \u2192 **S**ivas \u2192 **A**masya G\u00f6r\u00fc\u015fmeleri \u2192 **M**isak-\u0131 Mill\u00ee. S\u0131ra sorusu gelirse bu alt\u0131 harf yeter.' },
      { t:'tuzak', i:[
        '**Manda ve himaye ilk kez Erzurum\'da reddedildi**, **kesin olarak Sivas\'ta** reddedildi. "\u0130lk" ve "kesin" ayr\u0131m\u0131na dikkat.',
        '**Mustafa Kemal askerlikten Amasya Genelgesi\'nden sonra, Erzurum Kongresi \u00f6ncesinde istifa etmi\u015ftir** \u2014 Sivas\'tan sonra de\u011fil.',
        '**Misak-\u0131 Mill\u00ee\'de esas al\u0131nan s\u0131n\u0131rlar Mondros Ate\u015fkes Antla\u015fmas\u0131\'n\u0131n imzaland\u0131\u011f\u0131 s\u0131radaki (30 Ekim 1918) s\u0131n\u0131rlard\u0131r.**',
        '**Amasya Genelgesi bir genelge, Misak-\u0131 Mill\u00ee bir karard\u0131r.** Amasya "ne yap\u0131lacak"\u0131, Misak-\u0131 Mill\u00ee "s\u0131n\u0131rlar ne olacak"\u0131 s\u00f6yler.',
        '**Mill\u00ee M\u00fccadele\'nin ilk yay\u0131n organ\u0131 \u0130rade-i Milliye**\'dir (Sivas); Ankara\'da H\u00e2kimiyet-i Milliye \u00e7\u0131kar\u0131lm\u0131\u015ft\u0131r.',
        '**Kuvay\u0131milliye d\u00fczensiz birliklerdir**; d\u00fczenli ordu kuruluncaya kadar direni\u015fi s\u00fcrd\u00fcrm\u00fc\u015f, sonra tasfiye edilmi\u015ftir.',
        '**Temsil Heyeti Erzurum\'da kuruldu ama Sivas\'ta genelle\u015fti.**'
      ]},
      { t:'test', s:[
        { q:'Mill\u00ee M\u00fccadele\'nin amac\u0131, gerek\u00e7esi ve y\u00f6nteminin ilk kez a\u00e7\u0131kland\u0131\u011f\u0131 belge hangisidir?',
          c:['Havza Genelgesi','Amasya Genelgesi','Erzurum Kongresi kararlar\u0131','Misak-\u0131 Mill\u00ee'], d:1,
          a:'22 Haziran 1919 tarihli Amasya Genelgesi, Mill\u00ee M\u00fccadele\'nin amac\u0131n\u0131, gerek\u00e7esini ve y\u00f6ntemini ilk kez ortaya koyan ihtilal beyannamesi niteli\u011findedir.' },
        { q:'Manda ve himaye fikri ilk kez hangi kongrede reddedilmi\u015ftir?',
          c:['Sivas Kongresi','Erzurum Kongresi','Bal\u0131kesir Kongresi','Ala\u015fehir Kongresi'], d:1,
          a:'Manda ve himaye ilk kez Erzurum Kongresi\'nde reddedilmi\u015f, Sivas Kongresi\'nde kesin olarak karara ba\u011flanm\u0131\u015ft\u0131r.' },
        { q:'Erzurum Kongresi \u00f6ncesinde b\u00fct\u00fcn resm\u00ee g\u00f6revlerinden istifa ederek "sine-i millete" d\u00f6nen Mustafa Kemal Pa\u015fa\'ya ordusuyla destek veren komutan kimdir?',
          c:['Ali Fuat Cebesoy','K\u00e2z\u0131m Karabekir','Refet Bele','Rauf Orbay'], d:1,
          a:'15. Kolordu Komutan\u0131 K\u00e2z\u0131m Karabekir, "Emrinizdeyiz Pa\u015fam" diyerek Mustafa Kemal\'e ordusuyla birlikte deste\u011fini s\u00fcrd\u00fcrm\u00fc\u015ft\u00fcr.' },
        { q:'28 Ocak 1920\'de Osmanl\u0131 Mebusan Meclisi\'nde kabul edilen Misak\u0131mill\u00ee\'de s\u0131n\u0131rlar hangi antla\u015fman\u0131n imzaland\u0131\u011f\u0131 s\u0131radaki duruma g\u00f6re belirlenmi\u015ftir?',
          c:['Sevr Antla\u015fmas\u0131','Mondros Ate\u015fkes Antla\u015fmas\u0131','Berlin Antla\u015fmas\u0131','U\u015fi Antla\u015fmas\u0131'], d:1,
          a:'Misak-\u0131 Mill\u00ee\'de, Mondros Ate\u015fkes Antla\u015fmas\u0131\'n\u0131n imzaland\u0131\u011f\u0131 30 Ekim 1918 tarihindeki s\u0131n\u0131rlar esas al\u0131nm\u0131\u015ft\u0131r.' },
        { q:'Sivas Kongresi sonras\u0131nda \u00e7\u0131kar\u0131lan ve Mill\u00ee M\u00fccadele\'nin ilk yay\u0131n organ\u0131 olma \u00f6zelli\u011fini ta\u015f\u0131yan gazete hangisidir?',
          c:['H\u00e2kimiyet-i Milliye','\u0130rade-i Milliye','Takvim-i Vekayi','Tanin'], d:1,
          a:'\u0130rade-i Milliye gazetesi Eyl\u00fcl 1919\'da Sivas\'ta \u00e7\u0131kar\u0131lm\u0131\u015ft\u0131r; Ankara\'ya ge\u00e7ildikten sonra H\u00e2kimiyet-i Milliye yay\u0131mlanm\u0131\u015ft\u0131r.' },
        { q:'A\u015fa\u011f\u0131dakilerden hangisi Sivas Kongresi ile al\u0131nan kararlardan biridir?',
          c:['Temsil Heyeti\'nin t\u00fcm yurdu temsil eder h\u00e2le gelmesi','Saltanat\u0131n kald\u0131r\u0131lmas\u0131','TBMM\'nin a\u00e7\u0131lmas\u0131','Cumhuriyetin ilan edilmesi'],
          d:0, a:'Sivas Kongresi\'nde t\u00fcm cemiyetler birle\u015ftirilmi\u015f ve Erzurum\'da kurulan Temsil Heyeti t\u00fcm yurdu temsil eder duruma getirilmi\u015ftir.' },
        { q:'Mustafa Kemal Pa\u015fa askerlik g\u00f6revinden a\u015fa\u011f\u0131dakilerin hangisinden sonra istifa etmi\u015ftir?',
          c:['Havza Genelgesi','Amasya Genelgesi','Sivas Kongresi','Amasya G\u00f6r\u00fc\u015fmeleri'], d:1,
          a:'Amasya Genelgesi\'nin ard\u0131ndan \u0130stanbul H\u00fck\u00fcmeti\'nin geri \u00e7a\u011f\u0131rmas\u0131 \u00fczerine, Erzurum Kongresi \u00f6ncesinde askerlikten istifa etmi\u015ftir.' },
        { q:'\u0130stanbul H\u00fck\u00fcmeti\'nin Temsil Heyeti\'ni hukuken tan\u0131d\u0131\u011f\u0131 geli\u015fme hangisidir?',
          c:['Havza Genelgesi','Amasya G\u00f6r\u00fc\u015fmeleri','Erzurum Kongresi','Misak-\u0131 Mill\u00ee'], d:1,
          a:'20-22 Ekim 1919\'daki Amasya G\u00f6r\u00fc\u015fmeleri\'nde Bahriye Naz\u0131r\u0131 Salih Pa\u015fa ile yap\u0131lan g\u00f6r\u00fc\u015fmeler, \u0130stanbul H\u00fck\u00fcmeti\'nin Temsil Heyeti\'ni tan\u0131d\u0131\u011f\u0131 anlam\u0131na gelmi\u015ftir.' },
        { q:'A\u015fa\u011f\u0131dakilerden hangisi Mill\u00ee M\u00fccadele D\u00f6nemi\'nde kurulan zararl\u0131 cemiyetlerden biri **de\u011fildir**?',
          c:['Mavri Mira','Etnik-i Eterya','Redd-i \u0130lhak','\u0130ngiliz Muhipleri Cemiyeti'], d:2,
          a:'Redd-i \u0130lhak Cemiyeti, \u0130zmir\'in i\u015fgaline kar\u015f\u0131 kurulan yararl\u0131 bir cemiyettir.' },
        { q:'\u0130\u015fgalleri protesto amac\u0131yla yurt genelinde mitingler d\u00fczenlenmesini isteyen ve halk\u0131 ilk kez topluca harekete ge\u00e7iren belge hangisidir?',
          c:['Havza Genelgesi','Amasya Genelgesi','Erzurum Kongresi bildirisi','Misak-\u0131 Mill\u00ee'], d:0,
          a:'28 May\u0131s 1919 tarihli Havza Genelgesi ile i\u015fgallerin protesto edilmesi ve mitingler d\u00fczenlenmesi istenmi\u015ftir.' },
        { q:'A\u015fa\u011f\u0131dakilerden hangisi \u0130stanbul\'un \u0130tilaf Devletleri taraf\u0131ndan resmen i\u015fgal edilmesinin sebepleri aras\u0131nda g\u00f6sterile**mez**?',
          c:['Mebusan Meclisi\'nde Misak-\u0131 Mill\u00ee\'nin kabul edilmesi','Anadolu\'daki mill\u00ee direni\u015fin g\u00fc\u00e7lenmesi','\u0130stanbul H\u00fck\u00fcmeti\'nin denetlenmek istenmesi','Cumhuriyetin ilan edilmesi'],
          d:3, a:'Cumhuriyet 29 Ekim 1923\'te ilan edilmi\u015ftir; 16 Mart 1920\'deki i\u015fgalle ilgisi yoktur.' },
        { q:'Erzurum Kongresi\'nin toplan\u0131\u015f\u0131 ve kararlar\u0131 bak\u0131m\u0131ndan \u00f6zelli\u011fi hangisinde do\u011fru verilmi\u015ftir?',
          c:['Toplan\u0131\u015f\u0131 mill\u00ee, kararlar\u0131 b\u00f6lgeseldir.','Toplan\u0131\u015f\u0131 b\u00f6lgesel, kararlar\u0131 mill\u00eedir.','Hem toplan\u0131\u015f\u0131 hem kararlar\u0131 b\u00f6lgeseldir.','Hem toplan\u0131\u015f\u0131 hem kararlar\u0131 mill\u00eedir.'],
          d:1, a:'Erzurum Kongresi Do\u011fu Anadolu M\u00fcdafaa-i Hukuk Cemiyeti\'nce topland\u0131\u011f\u0131 i\u00e7in b\u00f6lgesel, ald\u0131\u011f\u0131 kararlar t\u00fcm vatan\u0131 ilgilendirdi\u011fi i\u00e7in mill\u00eedir.' },
        { q:'A\u015fa\u011f\u0131dakilerden hangisi Mill\u00ee M\u00fccadele D\u00f6nemi\'nde manda ve himaye fikrini savunan cemiyettir?',
          c:['Kilikyal\u0131lar Cemiyeti','Wilson Prensipleri Cemiyeti','Mill\u00ee Kongre Cemiyeti','Trakya-Pa\u015faeli Cemiyeti'],
          d:1, a:'Wilson Prensipleri Cemiyeti Amerikan mandas\u0131n\u0131, \u0130ngiliz Muhipleri Cemiyeti ise \u0130ngiliz mandas\u0131n\u0131 savunmu\u015ftur.' },
        { q:'Kuvay\u0131milliye birlikleri ile ilgili a\u015fa\u011f\u0131dakilerden hangisi **s\u00f6ylenemez**?',
          c:['D\u00fczensiz birliklerdir.','\u0130\u015fgallere kar\u015f\u0131 b\u00f6lgesel direni\u015f g\u00f6stermi\u015flerdir.','D\u00fczenli ordu kuruluncaya kadar m\u00fccadeleyi s\u00fcrd\u00fcrm\u00fc\u015flerdir.','TBMM taraf\u0131ndan kurulmu\u015flard\u0131r.'],
          d:3, a:'Kuvay\u0131milliye, TBMM a\u00e7\u0131lmadan \u00f6nce halk\u0131n kendili\u011finden olu\u015fturdu\u011fu d\u00fczensiz direni\u015f birlikleridir.' },
        { q:'"Milletin istiklalini yine milletin azim ve karar\u0131 kurtaracakt\u0131r." ifadesi hangi belgede yer al\u0131r?',
          c:['Havza Genelgesi','Amasya Genelgesi','Misak-\u0131 Mill\u00ee','Te\u015fkilat-\u0131 Esasiye'], d:1,
          a:'Bu ifade Amasya Genelgesi\'nde yer al\u0131r ve mill\u00ee egemenlik anlay\u0131\u015f\u0131n\u0131n ilk i\u015faretlerinden say\u0131l\u0131r.' },
        { q:'Anadolu ve Rumeli M\u00fcdafaa-i Hukuk Cemiyeti hangi kongrede olu\u015fturulmu\u015ftur?',
          c:['Erzurum Kongresi','Sivas Kongresi','Bal\u0131kesir Kongresi','Ala\u015fehir Kongresi'], d:1,
          a:'Sivas Kongresi\'nde \u00fclkedeki t\u00fcm yararl\u0131 cemiyetler Anadolu ve Rumeli M\u00fcdafaa-i Hukuk Cemiyeti ad\u0131 alt\u0131nda birle\u015ftirilmi\u015ftir.' }
      ]}
    ]},

  /* ========= 13 ========= */
  { id:'milli-mucadele-savaslar', ad:'Mill\u00ee M\u00fccadele \u2014 Muharebeler ve I. TBMM', soru:'2 soru \u00b7 \u00e7ok sorulur', durum:'hazir',
    ozet:'Cepheler, sava\u015flar ve antla\u015fmalar. Hangi antla\u015fma hangi cepheyi kapatt\u0131, ezberle.',
    bloklar:[
      { t:'tablo', b:'Cepheler ve kapan\u0131\u015flar\u0131', h:['Cephe','Rakip / komutan','Kapan\u0131\u015f\u0131'], r:[
        ['**Do\u011fu Cephesi**','Ermenistan \u2014 **K\u00e2z\u0131m Karabekir**','**G\u00fcmr\u00fc Antla\u015fmas\u0131 (3 Aral\u0131k 1920)** \u2014 TBMM\'nin **ilk siyasi zaferi ve ilk antla\u015fmas\u0131**'],
        ['**G\u00fcney Cephesi**','Fransa \u2014 **Kuvay\u0131milliye** (Mara\u015f, Antep, Urfa)','**Ankara Antla\u015fmas\u0131 (20 Ekim 1921)** \u2014 TBMM\'yi tan\u0131yan **ilk \u0130tilaf Devleti**'],
        ['**Bat\u0131 Cephesi**','Yunanistan \u2014 **\u0130smet Pa\u015fa**, Refet Bele, Ali Fuat Cebesoy','**Mudanya Ate\u015fkesi (11 Ekim 1922)**']
      ]},
      { t:'zaman', b:'Muharebeler ve antla\u015fmalar', z:[
        { y:'23 Nisan 1920', o:'TBMM a\u00e7\u0131ld\u0131', d:'**G\u00fc\u00e7ler birli\u011fi** ilkesi; "Meclisin \u00fcst\u00fcnde g\u00fc\u00e7 yoktur". Yeni T\u00fcrk devletinin temeli.' },
        { y:'29 Nisan 1920', o:'H\u0131yanet-i Vataniye Kanunu', d:'\u0130\u00e7 ayaklanmalara kar\u015f\u0131 \u00e7\u0131kar\u0131ld\u0131; **\u0130stiklal Mahkemeleri** kuruldu.' },
        { y:'3 Aral\u0131k 1920', o:'G\u00fcmr\u00fc Antla\u015fmas\u0131', d:'Ermenistan ile. **TBMM\'nin imzalad\u0131\u011f\u0131 ilk antla\u015fma**; do\u011fu s\u0131n\u0131r\u0131 b\u00fcy\u00fck \u00f6l\u00e7\u00fcde \u00e7izildi.' },
        { y:'6 \u2013 10 Ocak 1921', o:'I. \u0130n\u00f6n\u00fc Sava\u015f\u0131', d:'**D\u00fczenli ordunun ilk zaferi.** Sonu\u00e7lar\u0131: **Te\u015fkilat-\u0131 Esasiye (20 Ocak 1921)**, **Londra Konferans\u0131**, **Moskova Antla\u015fmas\u0131 (16 Mart 1921)**, **\u0130stiklal Mar\u015f\u0131\'n\u0131n kabul\u00fc (12 Mart 1921)**.' },
        { y:'23 Mart \u2013 1 Nisan 1921', o:'II. \u0130n\u00f6n\u00fc Sava\u015f\u0131', d:'Yunanlar **Sevr\'i kabul ettirmek i\u00e7in** sald\u0131rd\u0131. \u0130talyanlar Anadolu\'yu bo\u015faltmaya ba\u015flad\u0131; TBMM\'ye g\u00fcven artt\u0131.' },
        { y:'Temmuz 1921', o:'K\u00fctahya \u2013 Eski\u015fehir Sava\u015flar\u0131', d:'**Yenilgi.** Ordu Sakarya\'n\u0131n do\u011fusuna \u00e7ekildi; **Ba\u015fkomutanl\u0131k Kanunu (5 A\u011fustos 1921)** ve **Tek\u00e2lif-i Milliye Emirleri** \u00e7\u0131kar\u0131ld\u0131.' },
        { y:'23 A\u011fustos \u2013 13 Eyl\u00fcl 1921', o:'Sakarya Meydan Muharebesi', d:'**1683 Viyana\'dan beri s\u00fcren geri \u00e7ekili\u015fin sonu.** Mustafa Kemal\'e **Gazi** unvan\u0131 ve **Mare\u015fal** r\u00fctbesi. Sonu\u00e7lar\u0131: **Kars (13 Ekim 1921)**, **Ankara Antla\u015fmas\u0131 (20 Ekim 1921 \u2013 Fransa)**.' },
        { y:'26 \u2013 30 A\u011fustos 1922', o:'B\u00fcy\u00fck Taarruz', d:'**30 A\u011fustos Ba\u015fkomutanl\u0131k Meydan Muharebesi**; 9 Eyl\u00fcl\'de \u0130zmir\'e girildi.' },
        { y:'11 Ekim 1922', o:'Mudanya Ate\u015fkes Antla\u015fmas\u0131', d:'**Do\u011fu Trakya sava\u015fs\u0131z** kurtar\u0131ld\u0131; Kurtulu\u015f Sava\u015f\u0131\'n\u0131n **asker\u00ee safhas\u0131** sona erdi.' },
        { y:'24 Temmuz 1923', o:'Lozan Bar\u0131\u015f Antla\u015fmas\u0131', d:'Yeni T\u00fcrk Devleti **uluslararas\u0131 alanda tan\u0131nd\u0131**; **kapit\u00fclasyonlar kald\u0131r\u0131ld\u0131**.' }
      ]},
      { t:'ozet', b:'Lozan \u2014 \u00e7\u00f6z\u00fclenler ve \u00e7\u00f6z\u00fclemeyenler', i:[
        '**\u00c7\u00f6z\u00fclenler**: kapit\u00fclasyonlar\u0131n kald\u0131r\u0131lmas\u0131, Osmanl\u0131 bor\u00e7lar\u0131n\u0131n payla\u015ft\u0131r\u0131lmas\u0131, Bat\u0131 s\u0131n\u0131r\u0131 (Meri\u00e7), az\u0131nl\u0131klar\u0131n T\u00fcrk vatanda\u015f\u0131 say\u0131lmas\u0131, sava\u015f tazminat\u0131 (Yunanistan\'dan Karaa\u011fa\u00e7).',
        '**\u00c7\u00f6z\u00fclemeyenler / sonraya kalanlar**: **Musul**, **Hatay**, **Bo\u011fazlar**, **yabanc\u0131 okullar**, **n\u00fcfus m\u00fcbadelesinin baz\u0131 ayr\u0131nt\u0131lar\u0131**, **patrikhane**.',
        '**Lozan\'a g\u00f6zlemci olarak ABD kat\u0131lm\u0131\u015ft\u0131r.**',
        '**Mudanya g\u00f6r\u00fc\u015fmelerinde Do\u011fu Trakya, \u0130ngiliz ve Yunan yetkilileri ikna edilerek sava\u015fs\u0131z** T\u00fcrk y\u00f6netimine b\u0131rak\u0131lm\u0131\u015ft\u0131r.'
      ]},
      { t:'ozet', b:'I. TBMM\'nin \u00f6zellikleri', i:[
        '**Kurucu meclis** niteli\u011findedir; **g\u00fc\u00e7ler birli\u011fi** ilkesi ge\u00e7erlidir.',
        '**Meclis h\u00fck\u00fcmeti sistemi**: bakanlar meclis i\u00e7inden ve meclis\u00e7e se\u00e7ilir.',
        '**"Meclisin \u00fcst\u00fcnde bir g\u00fc\u00e7 yoktur"** ilkesi kabul edilmi\u015ftir.',
        '**1921 Te\u015fkilat-\u0131 Esasiye Kanunu**: *"Egemenlik kay\u0131ts\u0131z \u015farts\u0131z milletindir"* \u2192 **me\u015frutiyetten cumhuriyete ge\u00e7i\u015fin i\u015fareti**.',
        'Meclis i\u00e7inde gruplar olu\u015ftu; **Birinci Grup** (M\u00fcdafaa-i Hukuk) ve **\u0130kinci Grup** ayr\u0131m\u0131 do\u011fdu.',
        '**\u0130stiklal Mar\u015f\u0131 12 Mart 1921\'de TBMM\'de kabul edildi** (Mehmet Akif Ersoy).'
      ]},
      { t:'kod', b:'Haf\u0131za kodu', x:'**Cephe \u2192 antla\u015fma:** Do\u011fu \u2192 **G\u00fcmr\u00fc** \u00b7 G\u00fcney \u2192 **Ankara** \u00b7 Bat\u0131 \u2192 **Mudanya**. "\u0130lk"ler: ilk antla\u015fma **G\u00fcmr\u00fc**, tan\u0131yan ilk \u0130tilaf devleti **Fransa**, d\u00fczenli ordunun ilk zaferi **I. \u0130n\u00f6n\u00fc**.' },
      { t:'tuzak', i:[
        '**G\u00fcmr\u00fc, TBMM\'nin imzalad\u0131\u011f\u0131 ilk antla\u015fmad\u0131r.** Ancak TBMM\'yi tan\u0131yan **ilk \u0130tilaf devleti Fransa**\'d\u0131r (Ankara Antla\u015fmas\u0131 1921). Rusya bir \u0130tilaf devleti de\u011fildir.',
        '**Moskova ve Kars antla\u015fmalar\u0131nda do\u011fu s\u0131n\u0131r\u0131** d\u00fczenlenir; **Ankara Antla\u015fmas\u0131\'nda (Fransa) do\u011fu s\u0131n\u0131r\u0131yla ilgili h\u00fck\u00fcm yoktur** \u2014 g\u00fcney s\u0131n\u0131r\u0131n\u0131 d\u00fczenler.',
        '**Sakarya bir savunma muharebesidir**, B\u00fcy\u00fck Taarruz ise sald\u0131r\u0131 harek\u00e2t\u0131d\u0131r.',
        '**Mudanya bir ate\u015fkes, Lozan bir bar\u0131\u015f antla\u015fmas\u0131d\u0131r.** Do\u011fu Trakya Mudanya ile **sava\u015f\u0131lmadan** al\u0131nm\u0131\u015ft\u0131r.',
        '**II. \u0130n\u00f6n\u00fc Sava\u015f\u0131 Yunanl\u0131lar\u0131n Sevr\'i kabul ettirme amac\u0131yla** ba\u015flatt\u0131\u011f\u0131 sald\u0131r\u0131d\u0131r.',
        '**\u0130stiklal Mar\u015f\u0131 12 Mart 1921\'de kabul edilmi\u015ftir** \u2014 I. \u0130n\u00f6n\u00fc Zaferi sonras\u0131ndaki moral ortam\u0131nda.',
        '**Lozan\'a ABD g\u00f6zlemci olarak kat\u0131lm\u0131\u015ft\u0131r**, taraf olarak de\u011fil.'
      ]},
      { t:'test', s:[
        { q:'TBMM H\u00fck\u00fcmeti\'ni resmen tan\u0131yan ilk \u0130tilaf Devleti hangisidir ve bu hangi antla\u015fma ile olmu\u015ftur?',
          c:['\u0130ngiltere \u2013 Mudanya','Fransa \u2013 Ankara Antla\u015fmas\u0131','\u0130talya \u2013 Londra Konferans\u0131','Rusya \u2013 Moskova Antla\u015fmas\u0131'], d:1,
          a:'20 Ekim 1921 Ankara Antla\u015fmas\u0131 ile Fransa, TBMM H\u00fck\u00fcmeti\'ni resmen tan\u0131yan ilk \u0130tilaf Devleti olmu\u015ftur. Rusya bir \u0130tilaf Devleti de\u011fildir.' },
        { q:'Mill\u00ee M\u00fccadele D\u00f6nemi\'nde imzalanan a\u015fa\u011f\u0131daki antla\u015fmalar\u0131n hangisinde T\u00fcrkiye\'nin do\u011fu s\u0131n\u0131r\u0131yla ilgili bir h\u00fck\u00fcm bulun**mamaktad\u0131r**?',
          c:['G\u00fcmr\u00fc Antla\u015fmas\u0131','Moskova Antla\u015fmas\u0131','Kars Antla\u015fmas\u0131','Ankara Antla\u015fmas\u0131'], d:3,
          a:'Ankara Antla\u015fmas\u0131 Fransa ile imzalanm\u0131\u015f olup g\u00fcney s\u0131n\u0131r\u0131n\u0131 d\u00fczenler. G\u00fcmr\u00fc, Moskova ve Kars antla\u015fmalar\u0131 do\u011fu s\u0131n\u0131r\u0131yla ilgilidir.' },
        { q:'Yunan ordusunun Sevr Antla\u015fmas\u0131\'n\u0131 TBMM\'ye kabul ettirmek amac\u0131yla 23 Mart 1921\'de ba\u015flatt\u0131\u011f\u0131 sald\u0131r\u0131 sonucu ger\u00e7ekle\u015fen muharebe hangisidir?',
          c:['I. \u0130n\u00f6n\u00fc Sava\u015f\u0131','II. \u0130n\u00f6n\u00fc Sava\u015f\u0131','Sakarya Meydan Muharebesi','K\u00fctahya-Eski\u015fehir Sava\u015flar\u0131'], d:1,
          a:'23 Mart \u2013 1 Nisan 1921 tarihleri aras\u0131ndaki II. \u0130n\u00f6n\u00fc Sava\u015f\u0131, Yunanl\u0131lar\u0131n Sevr\'i kabul ettirme amac\u0131yla ba\u015flatt\u0131\u011f\u0131 sald\u0131r\u0131 sonucu ger\u00e7ekle\u015fmi\u015ftir.' },
        { q:'Do\u011fu Trakya\'n\u0131n sava\u015f\u0131lmadan geri al\u0131nmas\u0131n\u0131 sa\u011flayan antla\u015fma hangisidir?',
          c:['Lozan Antla\u015fmas\u0131','Mudanya Ate\u015fkes Antla\u015fmas\u0131','Ankara Antla\u015fmas\u0131','Kars Antla\u015fmas\u0131'], d:1,
          a:'11 Ekim 1922 Mudanya Ate\u015fkes Antla\u015fmas\u0131 ile Do\u011fu Trakya sava\u015f\u0131lmadan TBMM y\u00f6netimine b\u0131rak\u0131lm\u0131\u015ft\u0131r.' },
        { q:'Mehmet Akif Ersoy taraf\u0131ndan kaleme al\u0131nan \u0130stiklal Mar\u015f\u0131 hangi tarihte mill\u00ee mar\u015f olarak kabul edilmi\u015ftir?',
          c:['23 Nisan 1920','12 Mart 1921','30 A\u011fustos 1922','29 Ekim 1923'], d:1,
          a:'\u0130stiklal Mar\u015f\u0131, I. \u0130n\u00f6n\u00fc Zaferi sonras\u0131ndaki moral ortam\u0131nda 12 Mart 1921\'de TBMM\'de kabul edilmi\u015ftir.' },
        { q:'1921 Anayasas\u0131\'nda yer alan a\u015fa\u011f\u0131daki h\u00fck\u00fcmlerden hangisi, me\u015frutiyet idaresinden cumhuriyet y\u00f6netimine ge\u00e7ilece\u011fine dair bir i\u015farettir?',
          c:['Egemenli\u011fin kay\u0131ts\u0131z \u015farts\u0131z millete ait olmas\u0131','Yasama ve y\u00fcr\u00fctmenin mecliste toplanmas\u0131','Se\u00e7imlerin iki y\u0131lda bir yap\u0131lmas\u0131','Vilayetlerin idaresinin d\u00fczenlenmesi'],
          d:0, a:'"Egemenlik kay\u0131ts\u0131z \u015farts\u0131z milletindir" ilkesi, saltanat ve me\u015frutiyet anlay\u0131\u015f\u0131yla ba\u011fda\u015fmaz ve cumhuriyete ge\u00e7i\u015fin habercisidir.' },
        { q:'Lozan Bar\u0131\u015f Konferans\u0131\'na g\u00f6zlemci olarak kat\u0131lan devlet hangisidir?',
          c:['Almanya','ABD','Rusya','Japonya'], d:1,
          a:'ABD, Lozan Konferans\u0131\'na taraf olarak de\u011fil g\u00f6zlemci s\u0131fat\u0131yla kat\u0131lm\u0131\u015ft\u0131r.' },
        { q:'A\u015fa\u011f\u0131dakilerden hangisi Lozan Antla\u015fmas\u0131\'nda \u00e7\u00f6z\u00fcme kavu\u015fturula**mayan** konulardan biridir?',
          c:['Kapit\u00fclasyonlar\u0131n kald\u0131r\u0131lmas\u0131','Osmanl\u0131 bor\u00e7lar\u0131n\u0131n payla\u015ft\u0131r\u0131lmas\u0131','Musul sorunu','Bat\u0131 s\u0131n\u0131r\u0131n\u0131n belirlenmesi'],
          d:2, a:'Musul sorunu Lozan\'da \u00e7\u00f6z\u00fclememi\u015f, 1926 Ankara Antla\u015fmas\u0131 ile Musul Irak\'a b\u0131rak\u0131lm\u0131\u015ft\u0131r.' },
        { q:'A\u015fa\u011f\u0131dakilerden hangisi I. \u0130n\u00f6n\u00fc Sava\u015f\u0131\'n\u0131n sonu\u00e7lar\u0131 aras\u0131nda yer **almaz**?',
          c:['Te\u015fkilat-\u0131 Esasiye Kanunu\'nun kabul edilmesi','Londra Konferans\u0131\'n\u0131n toplanmas\u0131','Moskova Antla\u015fmas\u0131\'n\u0131n imzalanmas\u0131','Saltanat\u0131n kald\u0131r\u0131lmas\u0131'],
          d:3, a:'Saltanat 1 Kas\u0131m 1922\'de kald\u0131r\u0131lm\u0131\u015ft\u0131r; I. \u0130n\u00f6n\u00fc Sava\u015f\u0131\'n\u0131n (Ocak 1921) sonucu de\u011fildir.' },
        { q:'K\u00fctahya-Eski\u015fehir Sava\u015flar\u0131\'n\u0131n ard\u0131ndan al\u0131nan \u00f6nlemler aras\u0131nda a\u015fa\u011f\u0131dakilerden hangisi yer al\u0131r?',
          c:['Ba\u015fkomutanl\u0131k Kanunu\'nun \u00e7\u0131kar\u0131lmas\u0131 ve Tek\u00e2lif-i Milliye Emirleri','Saltanat\u0131n kald\u0131r\u0131lmas\u0131','Cumhuriyetin ilan edilmesi','Halifeli\u011fin kald\u0131r\u0131lmas\u0131'],
          d:0, a:'Yenilgi sonras\u0131nda Mustafa Kemal\'e Ba\u015fkomutanl\u0131k yetkisi verilmi\u015f ve ordunun ihtiya\u00e7lar\u0131n\u0131 kar\u015f\u0131lamak i\u00e7in Tek\u00e2lif-i Milliye Emirleri yay\u0131mlanm\u0131\u015ft\u0131r.' },
        { q:'Mustafa Kemal\'e Gazi unvan\u0131 ve Mare\u015fal r\u00fctbesi hangi sava\u015ftan sonra verilmi\u015ftir?',
          c:['I. \u0130n\u00f6n\u00fc Sava\u015f\u0131','II. \u0130n\u00f6n\u00fc Sava\u015f\u0131','Sakarya Meydan Muharebesi','B\u00fcy\u00fck Taarruz'], d:2,
          a:'Sakarya Meydan Muharebesi\'nin (1921) kazan\u0131lmas\u0131n\u0131n ard\u0131ndan TBMM taraf\u0131ndan Gazi unvan\u0131 ve Mare\u015fal r\u00fctbesi verilmi\u015ftir.' },
        { q:'Mill\u00ee M\u00fccadele D\u00f6nemi\'nde G\u00fcney Cephesi ile ilgili a\u015fa\u011f\u0131daki bilgilerden hangisi do\u011frudur?',
          c:['D\u00fczenli ordu birlikleriyle m\u00fccadele edilmi\u015ftir.','Kuvay\u0131milliye birlikleriyle Frans\u0131zlara kar\u015f\u0131 m\u00fccadele edilmi\u015ftir.','Ermenistan\'a kar\u015f\u0131 sava\u015f\u0131lm\u0131\u015ft\u0131r.','Mudanya ile kapanm\u0131\u015ft\u0131r.'],
          d:1, a:'G\u00fcney Cephesi\'nde Mara\u015f, Antep ve Urfa\'da Frans\u0131zlara kar\u015f\u0131 Kuvay\u0131milliye birlikleri m\u00fccadele etmi\u015f, cephe Ankara Antla\u015fmas\u0131 ile kapanm\u0131\u015ft\u0131r.' },
        { q:'TBMM\'nin imzalad\u0131\u011f\u0131 ilk antla\u015fma hangisidir?',
          c:['Moskova Antla\u015fmas\u0131','G\u00fcmr\u00fc Antla\u015fmas\u0131','Kars Antla\u015fmas\u0131','Ankara Antla\u015fmas\u0131'], d:1,
          a:'3 Aral\u0131k 1920 tarihli G\u00fcmr\u00fc Antla\u015fmas\u0131, TBMM\'nin imzalad\u0131\u011f\u0131 ilk antla\u015fmad\u0131r ve ilk siyasi ba\u015far\u0131s\u0131d\u0131r.' },
        { q:'I. TBMM ile ilgili a\u015fa\u011f\u0131dakilerden hangisi **s\u00f6ylenemez**?',
          c:['G\u00fc\u00e7ler birli\u011fi ilkesi ge\u00e7erlidir.','Kurucu meclis niteli\u011findedir.','Meclis h\u00fck\u00fcmeti sistemi uygulanm\u0131\u015ft\u0131r.','Kuvvetler ayr\u0131l\u0131\u011f\u0131 esas\u0131 benimsenmi\u015ftir.'],
          d:3, a:'I. TBMM\'de yasama, y\u00fcr\u00fctme ve yarg\u0131 mecliste toplanm\u0131\u015ft\u0131r; kuvvetler ayr\u0131l\u0131\u011f\u0131 benimsenmemi\u015ftir.' },
        { q:'Mill\u00ee M\u00fccadele D\u00f6nemi\'nde Bat\u0131 Cephesi\'ndeki T\u00fcrk-Yunan m\u00fccadelesinde a\u015fa\u011f\u0131daki komutanlardan hangisi yer alma**m\u0131\u015ft\u0131r**?',
          c:['\u0130smet Pa\u015fa','Refet Bele','Ali Fuat Cebesoy','K\u00e2z\u0131m Karabekir'], d:3,
          a:'K\u00e2z\u0131m Karabekir Do\u011fu Cephesi komutan\u0131d\u0131r; Bat\u0131 Cephesi\'nde g\u00f6rev almam\u0131\u015ft\u0131r.' },
        { q:'A\u015fa\u011f\u0131dakilerden hangisi B\u00fcy\u00fck Taarruz\'un sonu\u00e7lar\u0131 aras\u0131nda g\u00f6sterile**mez**?',
          c:['Bat\u0131 Anadolu\'nun Yunan i\u015fgalinden kurtar\u0131lmas\u0131','\u0130zmir\'e girilmesi','Mudanya Ate\u015fkes Antla\u015fmas\u0131\'n\u0131n imzalanmas\u0131','Musul sorununun \u00e7\u00f6z\u00fclmesi'],
          d:3, a:'Musul sorunu 1926 Ankara Antla\u015fmas\u0131 ile \u00e7\u00f6z\u00fclm\u00fc\u015ft\u00fcr; B\u00fcy\u00fck Taarruz ile ilgisi yoktur.' }
      ]}
    ]},

  /* ========= 14 ========= */
  { id:'inkilap', ad:'Atat\u00fcrk \u0130nk\u0131laplar\u0131 ve \u0130\u00e7 Politik Geli\u015fmeler', soru:'3\u20134 soru \u00b7 en \u00e7ok soru gelen konu', durum:'hazir',
    ozet:'\u00c7\u0131km\u0131\u015f soru taramas\u0131nda en \u00e7ok soru bu konudan geldi. Tarih\u2013ink\u0131lap e\u015fle\u015ftirmesi ve sonu\u00e7lar\u0131 sorulur.',
    bloklar:[
      { t:'zaman', b:'Siyasi ink\u0131laplar', z:[
        { y:'1 Kas\u0131m 1922', o:'Saltanat\u0131n kald\u0131r\u0131lmas\u0131', d:'Osmanl\u0131 Devleti hukuken sona erdi. **Lozan\'a iki h\u00fck\u00fcmetin \u00e7a\u011fr\u0131lmas\u0131** karar\u0131 h\u0131zland\u0131rd\u0131. Sadrazam **Tevfik Pa\u015fa istifa etti**; Osmanl\u0131 H\u00fck\u00fcmeti son buldu. Halifelik bir s\u00fcre daha devam etti.' },
        { y:'13 Ekim 1923', o:'Ankara ba\u015fkent oldu', d:'G\u00fcvenlik ve merkez\u00ee konum gerek\u00e7esiyle.' },
        { y:'29 Ekim 1923', o:'Cumhuriyetin ilan\u0131', d:'Fethi Bey\'in istifas\u0131yla do\u011fan **h\u00fck\u00fcmet bunal\u0131m\u0131** cumhuriyetin ilan\u0131yla sona erdi. **Kabine sistemine** ge\u00e7ildi; devlet ba\u015fkanl\u0131\u011f\u0131 sorunu \u00e7\u00f6z\u00fcld\u00fc.' },
        { y:'3 Mart 1924', o:'Halifeli\u011fin kald\u0131r\u0131lmas\u0131', d:'Ayn\u0131 g\u00fcn **Tevhid-i Tedrisat Kanunu** kabul edildi ve **\u015eer\'iye ve Evkaf Vek\u00e2leti** ile **Erk\u00e2n-\u0131 Harbiye Vek\u00e2leti** kald\u0131r\u0131ld\u0131. **Laikli\u011fe giden en \u00f6nemli ad\u0131m.**' },
        { y:'1924 \u00b7 1930', o:'\u00c7ok partili hayat denemeleri', d:'**Terakkiperver Cumhuriyet F\u0131rkas\u0131 (17 Kas\u0131m 1924)** \u2014 program\u0131nda **liberalizm** ve *"din\u00ee inan\u00e7lara sayg\u0131l\u0131y\u0131z"* maddesi; \u015eeyh Sait \u0130syan\u0131 sonras\u0131 kapat\u0131ld\u0131. **Serbest Cumhuriyet F\u0131rkas\u0131 (12 A\u011fustos 1930)** \u2014 Fethi Okyar; kendini feshetti.' },
        { y:'1925 \u00b7 1926 \u00b7 1930', o:'Rejime y\u00f6nelik tepkiler', d:'**\u015eeyh Sait \u0130syan\u0131 (13 \u015eubat 1925)** \u2192 **Takrir-i S\u00fck\u00fbn Kanunu (4 Mart 1925)** \u00b7 **\u0130zmir Suikast\u0131 (Haziran 1926)** \u00b7 **Menemen Olay\u0131 (23 Aral\u0131k 1930)** \u2014 Aste\u011fmen Kubilay \u015fehit edildi.' }
      ]},
      { t:'tablo', b:'\u0130nk\u0131laplar \u2014 alan alan', h:['Alan','\u0130nk\u0131lap ve y\u0131l'], r:[
        ['**Hukuk**','**Medeni Kanun 1926** (\u0130svi\u00e7re) \u00b7 Ceza (\u0130talya) \u00b7 Bor\u00e7lar (\u0130svi\u00e7re) \u00b7 Ticaret (Almanya) \u00b7 **1924 Anayasas\u0131** \u00b7 **1928**\'de "Devletin dini \u0130slam\'d\u0131r" maddesi \u00e7\u0131kar\u0131ld\u0131 \u00b7 **1937**\'de laiklik anayasaya girdi'],
        ['**E\u011fitim**','**Tevhid-i Tedrisat 3 Mart 1924** \u00b7 **Harf \u0130nk\u0131lab\u0131 1 Kas\u0131m 1928** \u00b7 **Millet Mektepleri 1928** \u00b7 **TTK 1931** \u00b7 **TDK 1932** \u00b7 \u00dcniversite Reformu 1933 \u00b7 **E\u011fitmen kurslar\u0131** ve **Halkevleri (1932)**'],
        ['**Toplum**','**\u015eapka Kanunu 1925** \u00b7 **Tekke, zaviye ve t\u00fcrbelerin kapat\u0131lmas\u0131 1925** \u00b7 **Takvim, saat ve \u00f6l\u00e7\u00fcler 1925-1931** \u00b7 **Soyad\u0131 Kanunu 1934** \u00b7 **Lakap ve unvanlar\u0131n kald\u0131r\u0131lmas\u0131 1934**'],
        ['**Kad\u0131n haklar\u0131**','**1926** Medeni Kanun ile hukuki e\u015fitlik \u00b7 **1930** belediye se\u00e7imleri \u00b7 **1933** muhtarl\u0131k \u00b7 **5 Aral\u0131k 1934** milletvekili se\u00e7me ve se\u00e7ilme'],
        ['**Ekonomi**','**\u0130zmir \u0130ktisat Kongresi 17 \u015eubat 1923** \u00b7 **A\u015far\'\u0131n kald\u0131r\u0131lmas\u0131 1925** \u00b7 **Kabotaj Kanunu 1 Temmuz 1926** \u00b7 Te\u015fvik-i Sanayi 1927 \u00b7 **I. Be\u015f Y\u0131ll\u0131k Sanayi Plan\u0131 1934** \u00b7 S\u00fcmerbank 1933 \u00b7 **Etibank ve MTA 1935**']
      ]},
      { t:'ozet', b:'S\u0131k sorulan sonu\u00e7lar', i:[
        '**Saltanat\u0131n kald\u0131r\u0131lmas\u0131n\u0131n sonu\u00e7lar\u0131**: Osmanl\u0131 Devleti hukuken sona erdi \u00b7 \u0130stanbul H\u00fck\u00fcmeti istifa etti \u00b7 **Lozan\'a tek h\u00fck\u00fcmet kat\u0131ld\u0131** \u00b7 mill\u00ee egemenlik yolunda b\u00fcy\u00fck ad\u0131m at\u0131ld\u0131 \u00b7 Osmanl\u0131 ailesi 1924\'te yurt d\u0131\u015f\u0131na \u00e7\u0131kar\u0131ld\u0131.',
        '**Medeni Kanun ile gelenler**: tek e\u015flilik, resm\u00ee nik\u00e2h zorunlulu\u011fu, kad\u0131n-erkek e\u015fitli\u011fi (miras, \u015fahitlik, bo\u015fanma), kad\u0131na istedi\u011fi mesle\u011fi se\u00e7me hakk\u0131. **\u015eer\'iye mahkemelerinin faaliyet alan\u0131 ortadan kalkt\u0131.**',
        '**Harf \u0130nk\u0131lab\u0131 ile**: **Millet Mektepleri** a\u00e7\u0131ld\u0131, Atat\u00fcrk **Ba\u015f\u00f6\u011fretmen** unvan\u0131n\u0131 ald\u0131, okuma-yazma oran\u0131 h\u0131zla artt\u0131.',
        '**Tevhid-i Tedrisat ile**: medreseler kapat\u0131ld\u0131, **az\u0131nl\u0131k ve yabanc\u0131 okullar Mill\u00ee E\u011fitim Bakanl\u0131\u011f\u0131\'na ba\u011fland\u0131**, e\u011fitimde birlik sa\u011fland\u0131.',
        '**Lakap ve unvanlar\u0131n kald\u0131r\u0131lmas\u0131n\u0131n amac\u0131**: toplumda **s\u0131n\u0131f ve ayr\u0131cal\u0131k** yaratan ifadeleri kald\u0131rmak, e\u015fitli\u011fi sa\u011flamak.',

      { t:'kod', b:'Haf\u0131za kodu', x:'**3 Mart 1924 = \u00fc\u00e7 karar bir g\u00fcnde:** Halifelik kald\u0131r\u0131ld\u0131 + Tevhid-i Tedrisat + \u015eer\'iye ve Evkaf Vek\u00e2leti kald\u0131r\u0131ld\u0131. Tek tarih, \u00fc\u00e7 cevap. Kronoloji: **saltanat (1922) \u2192 cumhuriyet (1923) \u2192 halifelik (1924)**.' },
      { t:'tuzak', i:[

        '**Laiklik 1937\'de anayasaya girmi\u015ftir**; "Devletin dini \u0130slam\'d\u0131r" ifadesi **1928\'de** \u00e7\u0131kar\u0131lm\u0131\u015ft\u0131r.',

        '**Cumhuriyetin ilan\u0131 bir h\u00fck\u00fcmet bunal\u0131m\u0131 sonucunda** ger\u00e7ekle\u015fmi\u015ftir (Fethi Bey\'in istifas\u0131).',

      ]},
      { t:'test', s:[

        { q:'Saltanat\u0131n kald\u0131r\u0131lmas\u0131n\u0131n ard\u0131ndan istifa eden Osmanl\u0131 H\u00fck\u00fcmeti\'nin sadrazam\u0131 kimdir?',

        { q:'T\u00fcrk Medeni Kanunu\'nun kabul edilmesiyle a\u015fa\u011f\u0131daki kurumlardan hangisinin faaliyet alan\u0131 ortadan kalkm\u0131\u015ft\u0131r?',

          d:0, a:'1934\'te lakap ve unvanlar\u0131n kald\u0131r\u0131lmas\u0131yla toplumsal e\u015fitlik ve halk\u00e7\u0131l\u0131k ilkesi g\u00fc\u00e7lendirilmi\u015ftir.' },
        { q:'T\u00fcrk kad\u0131nlar\u0131na milletvekili se\u00e7me ve se\u00e7ilme hakk\u0131 hangi y\u0131l verilmi\u015ftir?',

        { q:'A\u015fa\u011f\u0131dakilerden hangisi 1926 y\u0131l\u0131nda kabul edilen kanunlardan biri **de\u011fildir**?',
          c:['Medeni Kanun','Kabotaj Kanunu','Bor\u00e7lar Kanunu','Soyad\u0131 Kanunu'], d:3,
          a:'Soyad\u0131 Kanunu 1934\'te kabul edilmi\u015ftir. Medeni Kanun, Bor\u00e7lar Kanunu, Ticaret Kanunu ve Kabotaj Kanunu 1926 y\u0131l\u0131na aittir.' },
        { q:'T\u00fcrk kara sular\u0131nda y\u00fck ve yolcu ta\u015f\u0131ma hakk\u0131n\u0131 yaln\u0131zca T\u00fcrk gemilerine veren kanun hangisidir?',

        { q:'A\u015fa\u011f\u0131dakilerden hangisi 17 \u015eubat 1923\'te toplanan \u0130zmir \u0130ktisat Kongresi\'nde al\u0131nan kararlardan biri **de\u011fildir**?',
          c:['Hammaddesi yurt i\u00e7inde olan sanayi dallar\u0131n\u0131n kurulmas\u0131','Yerli mal\u0131 kullan\u0131lmas\u0131n\u0131n \u00f6zendirilmesi','\u00d6zel te\u015febb\u00fcs\u00fcn desteklenmesi','B\u00fct\u00fcn sanayi kurulu\u015flar\u0131n\u0131n devletle\u015ftirilmesi'],
          d:3, a:'\u0130zmir \u0130ktisat Kongresi\'nde \u00f6zel te\u015febb\u00fcs desteklenmi\u015f, devletle\u015ftirme karar\u0131 al\u0131nmam\u0131\u015ft\u0131r. Devlet\u00e7ilik 1930\'lu y\u0131llarda \u00f6ne \u00e7\u0131km\u0131\u015ft\u0131r.' },
        { q:'Terakkiperver Cumhuriyet F\u0131rkas\u0131\'n\u0131n program\u0131n\u0131n belirgin \u00f6zelli\u011fi a\u015fa\u011f\u0131dakilerden hangisidir?',
          c:['Liberalizmi savunmas\u0131 ve din\u00ee inan\u00e7lara sayg\u0131l\u0131 oldu\u011funu belirtmesi','Tek parti y\u00f6netimini desteklemesi','Devlet\u00e7ili\u011fi benimsemesi','Saltanat\u0131n geri getirilmesini istemesi'],

        { q:'\u015eeyh Sait \u0130syan\u0131 sonras\u0131nda \u00e7\u0131kar\u0131lan ve h\u00fck\u00fcmete ola\u011fan\u00fcst\u00fc yetkiler veren kanun hangisidir?',
          c:['H\u0131yanet-i Vataniye Kanunu','Takrir-i S\u00fck\u00fbn Kanunu','Tevhid-i Tedrisat Kanunu','Te\u015fvik-i Sanayi Kanunu'], d:1,
          a:'4 Mart 1925\'te \u00e7\u0131kar\u0131lan Takrir-i S\u00fck\u00fbn Kanunu ile h\u00fck\u00fcmete ola\u011fan\u00fcst\u00fc yetkiler verilmi\u015f, \u0130stiklal Mahkemeleri yeniden faaliyete ge\u00e7irilmi\u015ftir.' },
        { q:'Cumhuriyetin ilan\u0131na do\u011frudan zemin haz\u0131rlayan geli\u015fme a\u015fa\u011f\u0131dakilerden hangisidir?',
          c:['Lozan Antla\u015fmas\u0131\'n\u0131n imzalanmas\u0131','Fethi Bey\'in istifas\u0131yla ortaya \u00e7\u0131kan h\u00fck\u00fcmet bunal\u0131m\u0131','Ankara\'n\u0131n ba\u015fkent olmas\u0131','Halifeli\u011fin kald\u0131r\u0131lmas\u0131'],

        { q:'A\u015fa\u011f\u0131dakilerden hangisi Harf \u0130nk\u0131lab\u0131\'n\u0131n uygulanmaya konulmas\u0131yla ilgili geli\u015fmelerden biridir?',

        { q:'A\u015fa\u011f\u0131dakilerden hangisi 1926 y\u0131l\u0131nda y\u00fcr\u00fcrl\u00fc\u011fe giren Medeni Kanun ile sa\u011flanan durumlardan biri **de\u011fildir**?',

          d:2, a:'Kad\u0131nlara milletvekili se\u00e7me ve se\u00e7ilme hakk\u0131 1934\'te anayasa de\u011fi\u015fikli\u011fiyle verilmi\u015ftir; Medeni Kanun\'la de\u011fil.' },
        { q:'A\u015far vergisinin kald\u0131r\u0131lmas\u0131n\u0131n en \u00f6nemli sonucu a\u015fa\u011f\u0131dakilerden hangisidir?',

          d:1, a:'\u00dcr\u00fcn \u00fczerinden al\u0131nan ve oran\u0131 y\u00fcksek olan a\u015far, k\u00f6yl\u00fcy\u00fc ezen en a\u011f\u0131r vergiydi; 1925\'te kald\u0131r\u0131lmas\u0131yla tar\u0131mda \u00fcretim artm\u0131\u015ft\u0131r.' },

        { q:'Halifeli\u011fin kald\u0131r\u0131lmas\u0131n\u0131n en \u00f6nemli sonucu a\u015fa\u011f\u0131dakilerden hangisidir?',

      { t:'test', s:[

        { q:'T\u00fcrkiye, \u0130ran, Irak ve Afganistan aras\u0131nda 1937\'de imzalanan ve do\u011fu s\u0131n\u0131rlar\u0131n\u0131n g\u00fcvenli\u011fini ama\u00e7layan pakt hangisidir?',

        { q:'Lahey S\u00fcrekli Adalet Divan\u0131\'n\u0131n Atat\u00fcrk D\u00f6nemi\'nde T\u00fcrkiye lehine karar verdi\u011fi sorun hangisidir?',

        { q:'S\u00fcleyman \u015eah\'\u0131n mezar\u0131n\u0131n bulundu\u011fu ve Lozan\'daki bir h\u00fck\u00fcmle T\u00fcrkiye\'ye ait oldu\u011fu belirtilen Caber Kalesi bug\u00fcn hangi devletin s\u0131n\u0131rlar\u0131 i\u00e7indedir?',

        { q:'Yunanistan ile ya\u015fanan n\u00fcfus m\u00fcbadelesi sorunu hangi y\u0131l \u00e7\u00f6z\u00fcme kavu\u015fturulmu\u015ftur?',

  { id:'cagdas-tarih', ad:'\u00c7a\u011fda\u015f T\u00fcrk ve D\u00fcnya Tarihi', soru:'1\u20132 soru', durum:'hazir',

    bloklar:[
      { t:'zaman', b:'1939\'dan g\u00fcn\u00fcm\u00fcze', z:[
        { y:'1939 \u2013 1945', o:'II. D\u00fcnya Sava\u015f\u0131', d:'T\u00fcrkiye **fiilen tarafs\u0131z** kald\u0131. **23 \u015eubat 1945**\'te Almanya ve Japonya\'ya sava\u015f ilan ederek **BM\'ye kurucu \u00fcye** oldu. Sava\u015f y\u0131llar\u0131nda **Varl\u0131k Vergisi (1942)** ve **K\u00f6y Enstit\u00fcleri (1940)**.' },
        { y:'1945 \u2013 1991', o:'So\u011fuk Sava\u015f', d:'ABD ve SSCB kutupla\u015fmas\u0131. **Truman Doktrini 1947** (SSCB yay\u0131lmac\u0131l\u0131\u011f\u0131na kar\u015f\u0131), **Marshall Plan\u0131 1948** (Avrupa\'n\u0131n ekonomik kalk\u0131nmas\u0131 ve kom\u00fcnizmin \u00f6nlenmesi).' },
        { y:'1946', o:'\u00c7ok partili hayata ge\u00e7i\u015f', d:'**Demokrat Parti** kuruldu. **1946 se\u00e7imleri** "a\u00e7\u0131k oy, gizli say\u0131m" nedeniyle tart\u0131\u015fmal\u0131d\u0131r.' },
        { y:'1949 \u00b7 1955', o:'Blokla\u015fma', d:'**NATO 1949\'da Washington\'da** kuruldu; T\u00fcrkiye **1952**\'de kat\u0131ld\u0131. Do\u011fu bloku **Var\u015fova Pakt\u0131**\'n\u0131 1955\'te kurdu.' },
        { y:'1950 \u2013 1953', o:'Kore Sava\u015f\u0131', d:'T\u00fcrkiye BM karar\u0131yla asker g\u00f6nderdi; bu, **NATO \u00fcyeli\u011finin** \u00f6n\u00fcn\u00fc a\u00e7t\u0131.' },
        { y:'14 May\u0131s 1950', o:'\u0130ktidar de\u011fi\u015fimi', d:'DP iktidara geldi; T\u00fcrkiye\'de **se\u00e7imle ilk iktidar de\u011fi\u015fimi**.' },
        { y:'1960 \u00b7 1971 \u00b7 1980', o:'Asker\u00ee m\u00fcdahaleler', d:'**27 May\u0131s 1960** (\u2192 1961 Anayasas\u0131) \u00b7 **12 Mart 1971** muht\u0131ras\u0131 \u00b7 **12 Eyl\u00fcl 1980** (\u2192 1982 Anayasas\u0131).' },
        { y:'1974 \u00b7 1983', o:'K\u0131br\u0131s', d:'Yunanistan g\u00fcd\u00fcm\u00fcndeki **EOKA** \u00f6rg\u00fct\u00fcn\u00fcn ENOSIS hedefine kar\u015f\u0131 **1974 K\u0131br\u0131s Bar\u0131\u015f Harek\u00e2t\u0131**; **1983\'te KKTC** ilan edildi.' },
        { y:'1991', o:'SSCB\'nin da\u011f\u0131lmas\u0131', d:'So\u011fuk Sava\u015f sona erdi; **T\u00fcrk Cumhuriyetleri ba\u011f\u0131ms\u0131zl\u0131\u011f\u0131n\u0131** kazand\u0131 (Azerbaycan, Kazakistan, K\u0131rg\u0131zistan, \u00d6zbekistan, T\u00fcrkmenistan).' },
        { y:'1996 \u00b7 1999', o:'AB s\u00fcreci', d:'**1996 G\u00fcmr\u00fck Birli\u011fi** y\u00fcr\u00fcrl\u00fc\u011fe girdi. **1999 Helsinki Zirvesi**\'nde T\u00fcrkiye\'ye **adayl\u0131k stat\u00fcs\u00fc** verildi.' }

      { t:'tablo', b:'T\u00fcrkiye\'nin anayasalar\u0131', h:['Anayasa','D\u00f6nem / \u00f6zellik'], r:[

        ['**1982 Anayasas\u0131**','12 Eyl\u00fcl sonras\u0131; y\u00fcr\u00fctme g\u00fc\u00e7lendirildi. H\u00e2len y\u00fcr\u00fcrl\u00fckte']

      { t:'kod', b:'Haf\u0131za kodu', x:'**Darbe \u2192 anayasa:** 1960 \u2192 **1961**, 1980 \u2192 **1982**. 1971 muht\u0131ras\u0131 yeni anayasa getirmedi, 1961 Anayasas\u0131\'nda **de\u011fi\u015fiklik** yapt\u0131. Bu ayr\u0131m sorulur.' },
      { t:'tuzak', i:[
        '**T\u00fcrkiye II. D\u00fcnya Sava\u015f\u0131\'na fiilen kat\u0131lmad\u0131.** 1945\'teki sava\u015f ilan\u0131 sembolik olup BM kurucu \u00fcyeli\u011fi i\u00e7indir.',
        '**\u00c7ok partili hayata ge\u00e7i\u015f 1946, iktidar de\u011fi\u015fimi 1950**\'dir. \u0130kisi farkl\u0131 y\u0131llard\u0131r.',
        '**NATO 1949\'da kuruldu, T\u00fcrkiye 1952\'de \u00fcye oldu.** Kore\'ye asker g\u00f6nderilmesi (1950) bu s\u00fcreci h\u0131zland\u0131rm\u0131\u015ft\u0131r.',
        '**T\u00fcrkiye AB\'ye \u00fcye de\u011fildir**; 1999\'da **aday** olmu\u015f, 2005\'te m\u00fczakerelere ba\u015flam\u0131\u015ft\u0131r. **G\u00fcmr\u00fck Birli\u011fi (1996) \u00fcyelik demek de\u011fildir.**',

        '**Varl\u0131k Vergisi (1942)** sava\u015f y\u0131llar\u0131nda bir defaya mahsus al\u0131nan servet vergisidir.',

      ]},
      { t:'test', s:[
        { q:'II. D\u00fcnya Sava\u015f\u0131\'n\u0131n s\u00fcrd\u00fc\u011f\u00fc bir d\u00f6nemde t\u00fcccar, sanayici ve di\u011fer i\u015f adamlar\u0131ndan bir defaya mahsus olmak \u00fczere al\u0131nmas\u0131 kararla\u015ft\u0131r\u0131lan servet vergisi hangisidir?',

        { q:'T\u00fcrkiye\'nin Birle\u015fmi\u015f Milletler\'e kurucu \u00fcye olabilmesi i\u00e7in 1945\'te att\u0131\u011f\u0131 ad\u0131m nedir?',
          c:['NATO\'ya \u00fcye olmas\u0131','Almanya ve Japonya\'ya sava\u015f ilan etmesi','Marshall Plan\u0131\'na kat\u0131lmas\u0131','Kore\'ye asker g\u00f6ndermesi'], d:1,
          a:'T\u00fcrkiye 23 \u015eubat 1945\'te Almanya ve Japonya\'ya sava\u015f ilan ederek San Francisco Konferans\u0131\'na kat\u0131lma hakk\u0131 kazanm\u0131\u015ft\u0131r.' },
        { q:'"Sald\u0131r\u0131ya u\u011framadan \u00f6nce birlik olmak" anlay\u0131\u015f\u0131yla 1949\'da Washington\'da kurulan ve T\u00fcrkiye\'nin de sonradan kat\u0131ld\u0131\u011f\u0131 ortak savunma te\u015fkilat\u0131 hangisidir?',
          c:['Var\u015fova Pakt\u0131','NATO','Ba\u011fdat Pakt\u0131','Balkan Antant\u0131'], d:1,

        { q:'Demokrat Parti D\u00f6nemi\'nde Kore Sava\u015f\u0131\'na kat\u0131lan T\u00fcrkiye\'nin bu sava\u015ftaki asker\u00ee ba\u015far\u0131lar\u0131 hangi olu\u015fuma \u00fcye olmas\u0131n\u0131 olumlu y\u00f6nde etkilemi\u015ftir?',
          c:['Birle\u015fmi\u015f Milletler','NATO','Avrupa Konseyi','Ba\u011fdat Pakt\u0131'], d:1,

        '**Emredici kural**, taraflar\u0131n anla\u015fmas\u0131yla de\u011fi\u015ftirilemez; tamamlay\u0131c\u0131 kural ise ancak taraflar susmu\u015fsa devreye girer.',
        '**\u00d6rf ve \u00e2det hukuku yaz\u0131s\u0131z asli kaynakt\u0131r**, yard\u0131mc\u0131 kaynak de\u011fildir. Yard\u0131mc\u0131 kaynaklar yarg\u0131 kararlar\u0131 ve bilimsel g\u00f6r\u00fc\u015flerdir.'
      ]},
      { t:'test', s:[
        { q:'4721 say\u0131l\u0131 T\u00fcrk Medeni Kanunu\'na g\u00f6re bir uyu\u015fmazl\u0131\u011f\u0131 \u00e7\u00f6zerken h\u00e2kim a\u015fa\u011f\u0131daki kaynaklara hangi \u00f6ncelik s\u0131ras\u0131yla ba\u015fvurur?',
          c:['\u00d6rf ve \u00e2det hukuku \u2013 Kanun \u2013 H\u00e2kimin hukuk yaratmas\u0131','Kanun \u2013 \u00d6rf ve \u00e2det hukuku \u2013 H\u00e2kimin hukuk yaratmas\u0131','H\u00e2kimin hukuk yaratmas\u0131 \u2013 Kanun \u2013 \u00d6rf ve \u00e2det hukuku','Kanun \u2013 H\u00e2kimin hukuk yaratmas\u0131 \u2013 \u00d6rf ve \u00e2det hukuku'],
          d:1, a:'MK m.1\'e g\u00f6re h\u00e2kim \u00f6nce asli yaz\u0131l\u0131 kayna\u011fa (kanun), yoksa \u00f6rf ve \u00e2det hukukuna, o da yoksa kendisi kanun koyucu olsayd\u0131 koyaca\u011f\u0131 kurala g\u00f6re karar verir.' },
        { q:'A\u015fa\u011f\u0131dakilerden hangisi 4721 say\u0131l\u0131 T\u00fcrk Medeni Kanunu\'nu olu\u015fturan kitaplardan biri **de\u011fildir**?',
          c:['Aile Hukuku','\u015eirketler Hukuku','Ki\u015filer Hukuku','E\u015fya Hukuku'],
          d:1, a:'Medeni Kanun d\u00f6rt kitaptan olu\u015fur: \u015eah\u0131s (Ki\u015filer), E\u015fya, Miras, Aile. \u015eirketler Hukuku T\u00fcrk Ticaret Kanunu\'nun konusudur.' },
        { q:'A\u015fa\u011f\u0131da verilen ki\u015filerden hangilerinin aras\u0131nda herhangi bir h\u0131s\u0131ml\u0131k ba\u011f\u0131 **yoktur**?',
          c:['Selin ile annesi Fatma','Berkay ile karde\u015fi \u0130smail','Do\u011fan\'\u0131n e\u015finin babas\u0131 Bekir ile Do\u011fan\'\u0131n teyzesi','Batuhan ile e\u015finin karde\u015fi Furkan'],
          d:2, a:'Ki\u015fi e\u015finin akrabalar\u0131yla kay\u0131n h\u0131sm\u0131d\u0131r, ancak e\u015flerin akrabalar\u0131 birbirleriyle h\u0131s\u0131m de\u011fildir. Do\u011fan\'\u0131n e\u015finin babas\u0131 ile Do\u011fan\'\u0131n teyzesi aras\u0131nda h\u0131s\u0131ml\u0131k bulunmaz.' },
        { q:'\u00dcstsoy\u2013altsoy kan h\u0131s\u0131mlar\u0131 aras\u0131nda a\u015fa\u011f\u0131dakilerden hangisi kesinlikle yasakt\u0131r?',
          c:['Evlenme','Miras\u00e7\u0131l\u0131k','Nafaka \u00f6deme','Vasili\u011fe \u00f6ncelikle atanma'],
          d:0, a:'Medeni Kanun\'a g\u00f6re \u00fc\u00e7\u00fcnc\u00fc dereceye kadar kan h\u0131s\u0131mlar\u0131 aras\u0131nda evlenme kesin evlenme yasa\u011f\u0131d\u0131r. Miras\u00e7\u0131l\u0131k, nafaka ve vasilik ise m\u00fcmk\u00fcnd\u00fcr.' },
        { q:'Aksine bir hukuki i\u015flem yap\u0131lmas\u0131 m\u00fcmk\u00fcn olmayan, taraflar\u0131n kendi iradeleriyle de\u011fi\u015ftiremeyece\u011fi hukuk kurallar\u0131na ne ad verilir?',
          c:['Tamamlay\u0131c\u0131 kurallar','Yorumlay\u0131c\u0131 kurallar','Emredici kurallar','Tan\u0131mlay\u0131c\u0131 kurallar'],
          d:2, a:'Emredici kurallar kamu d\u00fczenini, ahlak kurallar\u0131n\u0131 ve zay\u0131flar\u0131 korumak i\u00e7in konur; taraflar bunlar\u0131 s\u00f6zle\u015fmeyle de\u011fi\u015ftiremez.' },
        { q:'"Kanunda ikametg\u00e2h, yerle\u015fmek niyetiyle oturulan yer olarak tan\u0131mlanm\u0131\u015ft\u0131r." Bu h\u00fck\u00fcm hangi t\u00fcr hukuk kural\u0131na \u00f6rnektir?',
          c:['Emredici','Tamamlay\u0131c\u0131','Yorumlay\u0131c\u0131','Tan\u0131mlay\u0131c\u0131'],
          d:3, a:'Bir hukuki kavram\u0131n ne anlama geldi\u011fini a\u00e7\u0131klayan kurallara tan\u0131mlay\u0131c\u0131 kurallar denir.' },
        { q:'\u00d6zel hukuk alan\u0131nda yabanc\u0131 unsur ta\u015f\u0131yan hukuki ili\u015fki ve ihtilaflar\u0131n \u00e7\u00f6z\u00fcm\u00fcnde uygulanacak kurallar\u0131 kapsayan hukuk dal\u0131 a\u015fa\u011f\u0131dakilerden hangisidir?',
          c:['Devletler \u00f6zel hukuku','\u0130dare hukuku','Medeni hukuk','Medeni usul hukuku'],
          d:0, a:'Devletler \u00f6zel hukuku, farkl\u0131 uyruktaki ki\u015filer aras\u0131ndaki \u00f6zel hukuk ili\u015fkilerinde hangi devletin kanununun uygulanaca\u011f\u0131n\u0131 ve hangi mahkemenin yetkili oldu\u011funu d\u00fczenler.' },
        { q:'A\u015fa\u011f\u0131dakilerden hangisi kamu hukuku dallar\u0131ndan biri **de\u011fildir**?',
          c:['Vergi hukuku','Ceza hukuku','Bor\u00e7lar hukuku','\u0130dare hukuku'],
          d:2, a:'Bor\u00e7lar hukuku \u00f6zel hukuk dal\u0131d\u0131r. Kamu hukuku dallar\u0131 aras\u0131nda anayasa, idare, ceza, vergi, yarg\u0131lama usul\u00fc ve devletler umumi hukuku yer al\u0131r.' },
        { q:'A\u015fa\u011f\u0131dakilerden hangisi adli yarg\u0131 ilk derece mahkemelerinden biri **de\u011fildir**?',
          c:['Sulh hukuk mahkemesi','\u0130dare mahkemesi','A\u011f\u0131r ceza mahkemesi','Aile mahkemesi'],
          d:1, a:'\u0130dare mahkemesi idari yarg\u0131 koluna aittir. Di\u011fer \u00fc\u00e7\u00fc adli yarg\u0131 ilk derece mahkemeleridir.' },
        { q:'A\u015fa\u011f\u0131dakilerden hangisi \u00f6zel hukuk t\u00fczel ki\u015fisi **de\u011fildir**?',
          c:['Dernek','Vak\u0131f','Anonim \u015firket','\u0130l \u00f6zel idaresi'],
          d:3, a:'\u0130l \u00f6zel idaresi, belediye ve k\u00f6y idaresi kamu t\u00fczel ki\u015fili\u011fine sahip kamu idareleridir. Dernek, vak\u0131f, \u015firket ve kooperatif ise \u00f6zel hukuk t\u00fczel ki\u015fileridir.' },
        { q:'Ola\u011fan\u00fcst\u00fc durumlarda ve pek \u00f6nemli bir sebeple, h\u00e2kim izniyle en az ka\u00e7 ya\u015f\u0131n\u0131 dolduran erkek veya kad\u0131n\u0131n evlenmesi m\u00fcmk\u00fcnd\u00fcr?',
          c:['14','15','16','17'],
          d:2, a:'Normal evlenme ya\u015f\u0131 17\'dir. Ola\u011fan\u00fcst\u00fc durumlarda ve pek \u00f6nemli bir sebeple h\u00e2kim, 16 ya\u015f\u0131n\u0131 dolduranlar\u0131n evlenmesine izin verebilir.' },
        { q:'Ki\u015fiye e\u015fya \u00fczerinde do\u011frudan do\u011fruya h\u00e2kimiyet sa\u011flayan ve herkese kar\u015f\u0131 ileri s\u00fcr\u00fclebilen hak t\u00fcr\u00fc hangisidir?',
          c:['\u015eahsi hak','Ayni hak','Yenilik do\u011furan hak','Nispi hak'],
          d:1, a:'Ayni haklar (m\u00fclkiyet, irtifak, rehin) mutlak haklardand\u0131r ve herkese kar\u015f\u0131 ileri s\u00fcr\u00fclebilir. \u015eahsi haklar yaln\u0131z bor\u00e7luya kar\u015f\u0131 ileri s\u00fcr\u00fcl\u00fcr.' },
        { q:'1926 y\u0131l\u0131nda kabul edilen T\u00fcrk Ceza Kanunu hangi \u00fclkenin kanunu \u00f6rnek al\u0131narak haz\u0131rlanm\u0131\u015ft\u0131r?',
          c:['\u0130svi\u00e7re','Almanya','\u0130talya','Fransa'],
          d:2, a:'Ceza Kanunu \u0130talya\'dan; Medeni Kanun ve Bor\u00e7lar Kanunu \u0130svi\u00e7re\'den; Ticaret Kanunu Almanya\'dan al\u0131nm\u0131\u015ft\u0131r.' },
        { q:'Karde\u015fler aras\u0131ndaki h\u0131s\u0131ml\u0131k a\u015fa\u011f\u0131dakilerden hangisidir?',
          c:['\u00dcstsoy kan h\u0131s\u0131ml\u0131\u011f\u0131','Yansoy kan h\u0131s\u0131ml\u0131\u011f\u0131','Kay\u0131n h\u0131s\u0131ml\u0131\u011f\u0131','Evlatl\u0131k h\u0131s\u0131ml\u0131\u011f\u0131'],
          d:1, a:'Karde\u015fler ortak atadan gelir ancak biri di\u011ferinin soyundan gelmez; bu nedenle ikinci derece yansoy kan h\u0131sm\u0131d\u0131rlar.' },
        { q:'Bir k\u0131y\u0131 devletinin kara \u00fclkesinin denizin alt\u0131nda s\u00fcren do\u011fal uzant\u0131s\u0131na ne ad verilir?',
          c:['Karasular\u0131','K\u0131ta sahanl\u0131\u011f\u0131','Biti\u015fik b\u00f6lge','M\u00fcnhas\u0131r ekonomik b\u00f6lge'],
          d:1, a:'K\u0131ta sahanl\u0131\u011f\u0131, k\u0131y\u0131 devletinin kara \u00fclkesinin deniz alt\u0131ndaki do\u011fal uzant\u0131s\u0131d\u0131r ve devletler umumi hukukunun konusudur.' },
        { q:'Gelir vergisinin, geliri daha fazla olanlardan daha y\u00fcksek oranda tahsil edilmesi a\u015fa\u011f\u0131daki ilkelerden hangisiyle a\u00e7\u0131klan\u0131r?',
          c:['Kanun \u00f6n\u00fcnde e\u015fitlik','Vergide adalet','Kanuni idare','Hukuki g\u00fcvenlik'],
          d:1, a:'Artan oranl\u0131 vergilendirme, mali g\u00fcce g\u00f6re vergilendirmeyi yani vergi adaletini ve sosyal devlet ilkesini yans\u0131t\u0131r.' },
        { q:'\u0130ki taraf\u0131n kar\u015f\u0131l\u0131kl\u0131 ve birbirine uygun irade beyan\u0131yla kurulan hukuki i\u015fleme ne ad verilir?',
          c:['S\u00f6zle\u015fme','Vasiyet','Tek tarafl\u0131 i\u015flem','\u0130dari i\u015flem'],
          d:0, a:'\u0130ki taraf\u0131n kar\u015f\u0131l\u0131kl\u0131 ve birbirine uygun irade a\u00e7\u0131klamas\u0131yla kurulan i\u015fleme s\u00f6zle\u015fme (akit) denir.' },
        { q:'T\u00fcrk hukukunda yarg\u0131 kararlar\u0131 ile ilgili a\u015fa\u011f\u0131daki ifadelerden hangisi do\u011frudur?',
          c:['T\u00fcm yarg\u0131 kararlar\u0131 ba\u011flay\u0131c\u0131d\u0131r.','Yarg\u0131 kararlar\u0131 asli kaynakt\u0131r.','Kural olarak ba\u011flay\u0131c\u0131 de\u011fildir; i\u00e7tihad\u0131 birle\u015ftirme kararlar\u0131 istisnad\u0131r.','Yaln\u0131zca Anayasa Mahkemesi kararlar\u0131 ba\u011flay\u0131c\u0131d\u0131r.'],
          d:2, a:'Yarg\u0131 kararlar\u0131 yard\u0131mc\u0131 kaynakt\u0131r ve kural olarak ba\u011flay\u0131c\u0131 de\u011fildir. Yarg\u0131tay ve Dan\u0131\u015ftay\'\u0131n i\u00e7tihad\u0131 birle\u015ftirme kararlar\u0131 bu kural\u0131n istisnas\u0131d\u0131r.' }
      ]}
    ]},

  /* ============= 2 ============= */
  { id:'anayasal-kavramlar', ad:'Anayasa Hukuku ve Anayasal Kavramlar', soru:'1 soru', durum:'hazir',
    ozet:'Cumhuriyetin nitelikleri, de\u011fi\u015ftirilemez maddeler, anayasa tarihi ve se\u00e7im ilkeleri.',
    bloklar:[
      { t:'ozet', b:'Cumhuriyetin nitelikleri (1982 Anayasas\u0131 m.2)', i:[
        '*"T\u00fcrkiye Cumhuriyeti, toplumun huzuru, mill\u00ee dayan\u0131\u015fma ve adalet anlay\u0131\u015f\u0131 i\u00e7inde, **insan haklar\u0131na sayg\u0131l\u0131**, **Atat\u00fcrk milliyet\u00e7ili\u011fine ba\u011fl\u0131**, **ba\u015flang\u0131\u00e7ta belirtilen temel ilkelere dayanan**, **demokratik**, **l\u00e2ik** ve **sosyal** bir **hukuk devletidir**."*',
        'Bu maddede say\u0131lmayan nitelikler tuzak \u015f\u0131k olur: **"liberal devlet", "federal devlet", "\u00fcniter devlet"** madde 2\'de ge\u00e7mez.',
        '**Madde 1**: T\u00fcrkiye Devleti bir Cumhuriyettir.',
        '**Madde 3**: Devlet, \u00fclkesi ve milletiyle b\u00f6l\u00fcnmez bir b\u00fct\u00fcnd\u00fcr. **Dili T\u00fcrk\u00e7edir. Bayra\u011f\u0131, mar\u015f\u0131 ve ba\u015fkenti (Ankara)** bu maddede d\u00fczenlenir.',
        '**\u0130lk \u00fc\u00e7 madde de\u011fi\u015ftirilemez ve de\u011fi\u015ftirilmesi teklif edilemez.**'
      ]},
      { t:'zaman', b:'T\u00fcrkiye\'nin anayasalar\u0131', z:[
        { y:'1921', o:'Te\u015fkilat-\u0131 Esasiye Kanunu', d:'Mill\u00ee M\u00fccadele d\u00f6nemi. **G\u00fc\u00e7ler birli\u011fi**, k\u0131sa ve esnek; yumu\u015fak anayasa.' },
        { y:'1924', o:'1924 Anayasas\u0131', d:'Cumhuriyetin ilk kal\u0131c\u0131 anayasas\u0131. Tek meclis, g\u00fc\u00e7ler birli\u011fine yak\u0131n yap\u0131.' },
        { y:'1961', o:'1961 Anayasas\u0131', d:'27 May\u0131s sonras\u0131. **Kuvvetler ayr\u0131l\u0131\u011f\u0131**, **Anayasa Mahkemesi**, Senato, geni\u015f hak ve \u00f6zg\u00fcrl\u00fckler.' },
        { y:'1982', o:'1982 Anayasas\u0131', d:'12 Eyl\u00fcl sonras\u0131. Y\u00fcr\u00fctme g\u00fc\u00e7lendirildi. **H\u00e2len y\u00fcr\u00fcrl\u00fckte.**' },
        { y:'2010', o:'Anayasa de\u011fi\u015fikli\u011fi', d:'**Bireysel ba\u015fvuru** hakk\u0131, HSYK\'n\u0131n yap\u0131s\u0131nda de\u011fi\u015fiklik, ki\u015fisel verilerin korunmas\u0131 hakk\u0131.' },
        { y:'2017', o:'Anayasa de\u011fi\u015fikli\u011fi', d:'**Cumhurba\u015fkanl\u0131\u011f\u0131 h\u00fck\u00fcmet sistemi**. Milletvekili say\u0131s\u0131 600\'e, se\u00e7ilme ya\u015f\u0131 18\'e indi; **KHK kald\u0131r\u0131ld\u0131**.' }
      ]},
      { t:'sayilar', b:'Say\u0131 kartlar\u0131', s:[
        { n:'1-2-3', a:'De\u011fi\u015ftirilemeyen ve de\u011fi\u015ftirilmesi teklif edilemeyen maddeler' },
        { n:'177', a:'1982 Anayasas\u0131\'n\u0131n toplam madde say\u0131s\u0131' },
        { n:'4', a:'T\u00fcrkiye\'nin bug\u00fcne kadarki anayasa say\u0131s\u0131 (1921, 1924, 1961, 1982)' },
        { n:'18', a:'Se\u00e7me hakk\u0131 ya\u015f\u0131' },
        { n:'400\u2192450\u2192550\u2192600', a:'Milletvekili say\u0131s\u0131n\u0131n tarihsel seyri (1982 \u2192 1987 \u2192 1995 \u2192 2017)' }
      ]},
      { t:'ozet', b:'Se\u00e7imlerin temel ilkeleri', i:[
        'Se\u00e7imler ve halk oylamas\u0131 **serbest, e\u015fit, gizli, tek dereceli, genel oy, a\u00e7\u0131k say\u0131m ve d\u00f6k\u00fcm** esaslar\u0131na g\u00f6re, **yarg\u0131 y\u00f6netim ve denetimi** alt\u0131nda yap\u0131l\u0131r.',
        '**18 ya\u015f\u0131n\u0131 dolduran** her T\u00fcrk vatanda\u015f\u0131 se\u00e7me ve halk oylamas\u0131na kat\u0131lma hakk\u0131na sahiptir.',
        '**Oy kullanamayanlar**: silah alt\u0131ndaki er ve erba\u015flar, asker\u00ee \u00f6\u011frenciler, **taksirli su\u00e7lar hari\u00e7 ceza infaz kurumlar\u0131ndaki h\u00fck\u00fcml\u00fcler**.',
        '**Oy kullanabilenler**: **tutuklular** ve **taksirli su\u00e7lardan h\u00fck\u00fcm giyenler** \u2014 bu ayr\u0131m s\u0131navda do\u011frudan sorulur.',
        'Yurt d\u0131\u015f\u0131ndaki vatanda\u015flar\u0131n oy kullanmas\u0131 kanunla d\u00fczenlenir.'
      ]},
      { t:'kod', b:'Haf\u0131za kodu', x:'Cumhuriyetin nitelikleri: **"\u0130nsan haklar\u0131 \u2013 Atat\u00fcrk \u2013 Ba\u015flang\u0131\u00e7 \u2013 Demokratik \u2013 Laik \u2013 Sosyal \u2013 Hukuk"**. \u015e\u0131kta **"liberal"**, **"federal"** ya da **"\u00fcniter"** g\u00f6r\u00fcrsen cevap odur; bunlar madde 2\'de ge\u00e7mez.' },
      { t:'tuzak', i:[
        '**\u00dcniter devlet T\u00fcrkiye\'nin bir \u00f6zelli\u011fidir ama madde 2\'deki "Cumhuriyetin nitelikleri" aras\u0131nda say\u0131lmaz.** Soru "niteliklerinden biri de\u011fildir" diye gelirse dikkat.',
        '**Tutuklular oy kullanabilir**, h\u00fck\u00fcml\u00fcler kullanamaz. "Tutuklu" ile "h\u00fck\u00fcml\u00fc" ayr\u0131m\u0131 klasik tuzakt\u0131r.',
        '**Ba\u015fkent Ankara madde 3\'te** d\u00fczenlenir, madde 1\'de de\u011fil.',
        '**Anayasa Mahkemesi 1961 Anayasas\u0131 ile kurulmu\u015ftur**, 1982 ile de\u011fil.',
        '**Bireysel ba\u015fvuru 2010** de\u011fi\u015fikli\u011fiyle gelmi\u015ftir.',
        '**1921 Anayasas\u0131 yumu\u015fak (kolay de\u011fi\u015ftirilebilir) anayasad\u0131r**; di\u011ferleri kat\u0131 anayasad\u0131r.'
      ]},
      { t:'test', s:[
        { q:'1982 Anayasas\u0131\'na g\u00f6re a\u015fa\u011f\u0131dakilerden hangisi Cumhuriyetin niteliklerinden biri **de\u011fildir**?',
          c:['Ba\u015flang\u0131\u00e7ta belirtilen temel ilkelere ba\u011fl\u0131l\u0131k','Demokratik devlet','Hukuk devleti','Liberal devlet'],
          d:3, a:'Anayasa m.2\'de say\u0131lan nitelikler: insan haklar\u0131na sayg\u0131l\u0131, Atat\u00fcrk milliyet\u00e7ili\u011fine ba\u011fl\u0131, ba\u015flang\u0131\u00e7ta belirtilen ilkelere dayanan, demokratik, laik ve sosyal hukuk devleti. "Liberal devlet" bu maddede yer almaz.' },
        { q:'A\u015fa\u011f\u0131dakilerden hangisi 1982 Anayasas\u0131\'nda de\u011fi\u015ftirilemez ve de\u011fi\u015ftirilmesi teklif edilemez h\u00fck\u00fcmler aras\u0131nda yer **almaz**?',
          c:['Devlet \u015feklinin Cumhuriyet olmas\u0131','Devletin resm\u00ee dilinin T\u00fcrk\u00e7e olmas\u0131','Milletvekili say\u0131s\u0131n\u0131n 600 olmas\u0131','Ba\u015fkentin Ankara olmas\u0131'],

      { t:'kod', b:'Haf\u0131za kodu', x:'**Temyiz merci ikilisi: adli \u2192 Yarg\u0131tay, idari \u2192 Dan\u0131\u015ftay.** \u0130stinaf ikilisi: adli \u2192 B\u00f6lge Adliye, idari \u2192 B\u00f6lge \u0130dare. "B\u00f6lge" kelimesi g\u00f6rd\u00fc\u011f\u00fcn yerde **istinaf**, "-tay" ekini g\u00f6rd\u00fc\u011f\u00fcn yerde **temyiz** vard\u0131r.' },

        { b:'Yerinden y\u00f6netim \u2014 hizmet y\u00f6n\u00fcnden', a:['\u00dcniversiteler, TRT, K\u0130T\'ler','Kamu kurumu niteli\u011findeki meslek kurulu\u015flar\u0131 (barolar, odalar)','Ba\u011f\u0131ms\u0131z idari otoriteler (RT\u00dcK, BDDK, Rekabet Kurumu)'] }

      { t:'tablo', b:'Hiyerar\u015fi mi, idari vesayet mi?', h:['Ara\u00e7','Nerede i\u015fler','\u00d6rnek'], r:[

      { t:'ozet', b:'Mahall\u00ee idareler \u2014 ayr\u0131nt\u0131lar', i:[

        '**Belediye kurulabilmesi i\u00e7in** il ve il\u00e7e merkezi d\u0131\u015f\u0131ndaki yerle\u015fimlerde **n\u00fcfusun en az 5.000** olmas\u0131 gerekir. \u0130l ve il\u00e7e merkezlerinde n\u00fcfus \u015fart\u0131 aranmaz.',
        '**B\u00fcy\u00fck\u015fehir olan illerde il \u00f6zel idaresi ve k\u00f6y uygulamas\u0131 kald\u0131r\u0131lm\u0131\u015ft\u0131r**; k\u00f6yler mahalleye d\u00f6n\u00fc\u015fm\u00fc\u015ft\u00fcr.',
        '**Yetki geni\u015fli\u011fi**: merkeze ba\u011fl\u0131 g\u00f6revliye merkeze dan\u0131\u015fmadan karar alma yetkisinin b\u0131rak\u0131lmas\u0131d\u0131r. **Yaln\u0131z ilde ve yaln\u0131z vali** taraf\u0131ndan kullan\u0131l\u0131r.',
        '**Belediye organlar\u0131 veya \u00fcyeleri**, g\u00f6revleriyle ilgili bir su\u00e7 nedeniyle haklar\u0131nda soru\u015fturma a\u00e7\u0131l\u0131rsa **kesin h\u00fckme kadar \u0130\u00e7i\u015fleri Bakan\u0131** taraf\u0131ndan ge\u00e7ici olarak g\u00f6revden uzakla\u015ft\u0131r\u0131labilir. **Kesin olarak g\u00f6revden alma yetkisi Dan\u0131\u015ftay\'a** aittir.',
        '**Kanuni idare ilkesi**: idarenin kurulu\u015f, eylem ve i\u015flemlerinin kanuna dayanmas\u0131 ve kanuna ayk\u0131r\u0131 olamamas\u0131d\u0131r.'

        { n:'20 g\u00fcn', a:'\u00d6z\u00fcrs\u00fcz g\u00f6reve gelmeme h\u00e2linde memurluktan \u00e7\u0131karma s\u0131n\u0131r\u0131' },

  { id:'spor-2026', ad:'Spor \u2014 2026\'n\u0131n B\u00fcy\u00fck Organizasyonlar\u0131', soru:'1\u20132 soru', durum:'hazir',

    bloklar:[
      { t:'ozet', b:'2026 FIFA D\u00fcnya Kupas\u0131', i:[

        '**Alt\u0131n Top: Rodri** \u00b7 **Gol kral\u0131: Kylian Mbapp\u00e9 (10 gol)** \u00b7 **Alt\u0131n Eldiven: Unai Sim\u00f3n**',

      { t:'ozet', b:'2026 K\u0131\u015f Olimpiyatlar\u0131', i:[
        'Yer: **\u0130talya \u2014 Milano ve Cortina d\'Ampezzo**. Tarih: **6\u201322 \u015eubat 2026**.',

        'A\u00e7\u0131l\u0131\u015f t\u00f6reni **Milano San Siro Stadyumu**\'nda, kapan\u0131\u015f t\u00f6reni **Verona Arena**\'da yap\u0131ld\u0131.',

        'Ev sahipli\u011fi karar\u0131 **2019\'da Lozan\'daki 134. IOC oturumunda** al\u0131nd\u0131; \u0130sve\u00e7\'in Stockholm-\u00c5re teklifi 47-34 oyla geride b\u0131rak\u0131ld\u0131.',
        '\u0130talya\'n\u0131n ev sahipli\u011fi yapt\u0131\u011f\u0131 **d\u00f6rd\u00fcnc\u00fc** Olimpiyat Oyunlar\u0131 (1956 Cortina, 1960 Roma, 2006 Torino).'
      ]},
      { t:'tuzak', i:[

        'K\u0131\u015f Olimpiyatlar\u0131 **\u00e7ift y\u0131llarda ve Yaz Olimpiyatlar\u0131yla d\u00f6n\u00fc\u015f\u00fcml\u00fc** yap\u0131l\u0131r. 2026 K\u0131\u015f, 2028 Yaz (Los Angeles) olacakt\u0131r.',
        'Cortina d\'Ampezzo **ikinci kez** K\u0131\u015f Olimpiyatlar\u0131na ev sahipli\u011fi yapt\u0131 (ilki 1956).'
      ]},
      { t:'test', s:[
        { q:'2026 FIFA D\u00fcnya Kupas\u0131\'nda \u015fampiyon olan \u00fclke ve finalde yendi\u011fi rakip a\u015fa\u011f\u0131dakilerden hangisidir?',

          c:['\u00dc\u00e7 \u00fclke birlikte ev sahipli\u011fi yapm\u0131\u015ft\u0131r.','\u0130lk kez 48 tak\u0131m kat\u0131lm\u0131\u015ft\u0131r.','Toplam 104 ma\u00e7 oynanm\u0131\u015ft\u0131r.','T\u00fcrkiye ilk kez finale y\u00fckselmi\u015ftir.'],
          d:3, a:'Turnuvaya ABD, Kanada ve Meksika birlikte ev sahipli\u011fi yapt\u0131; ilk kez 48 tak\u0131m ve 104 ma\u00e7la d\u00fczenlendi. Finalde \u0130spanya ile Arjantin kar\u015f\u0131la\u015ft\u0131.' },
        { q:'2026 K\u0131\u015f Olimpiyatlar\u0131 hangi \u00fclkede d\u00fczenlenmi\u015ftir?',
          c:['Fransa','\u0130svi\u00e7re','\u0130talya','Avusturya'],

  { id:'unesco', ad:'UNESCO ve K\u00fclt\u00fcrel Miras', soru:'1\u20132 soru', durum:'hazir',

      { t:'tuzak', i:[

      { t:'test', s:[
