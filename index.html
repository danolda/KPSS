<!DOCTYPE html>
<html lang="tr" data-tema="kagit">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPSS &#214;n Lisans &#8212; Tekrar Atlas&#305;</title>
<meta name="description" content="KPSS &#214;n Lisans i&#231;in pratik tekrar &#246;zetleri: T&#252;rk&#231;e, Matematik, Tarih, Co&#287;rafya, Vatanda&#351;l&#305;k. Co&#287;rafya interaktif T&#252;rkiye haritas&#305;yla.">
<meta name="color-scheme" content="light dark">
<style>
/* ===========================================================
   KPSS On Lisans -- Tekrar Atlasi
   Tasarim fikri: fiziki harita lejanti. Renkler yukselti
   basamaklarindan (ova -> plato -> dag -> zirve) alinmistir.
   =========================================================== */

@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  /* lejant renkleri */
  --ova:#7d9f57; --plato:#d3a63f; --dag:#bd6f36; --zirve:#e6dcc7;
  --akarsu:#3f9ac4; --lav:#a1495c; --baraj:#37718f; --sinir:#bf4a41;

  /* kagit temasi */
  --bg:#eae5d7; --bg2:#f3efe4; --card:#fbf8f0; --ink:#1c2b30;
  --ink2:#4a5a5f; --ink3:#7b888c; --line:#cfc7b3; --line2:#e0d9c7;
  --acc:#c98a2e;
  --sel:rgba(201,138,46,.16);
  --shadow:0 1px 0 rgba(28,43,48,.05), 0 8px 22px -14px rgba(28,43,48,.4);

  /* ders renkleri */
  --c-cog:#c07f28; --c-tar:#b8453c; --c-tur:#37809f; --c-mat:#5e8f52; --c-vat:#7f66a8; --c-gun:#2f8f8a;

  --f-d:'Archivo',system-ui,sans-serif;
  --f-b:'Source Serif 4',Georgia,serif;
  --f-m:'IBM Plex Mono',ui-monospace,monospace;

  --r:10px; --w:1180px;
}
[data-tema="gece"]{
  --bg:#0d1f27; --bg2:#122932; --card:#16323d; --ink:#e6ecec;
  --ink2:#a9bcbf; --ink3:#748b90; --line:#27454f; --line2:#1e3a44;
  --zirve:#cfc2a6; --sel:rgba(224,177,90,.18); --acc:#e0b15a;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 26px -16px #000;
  --c-cog:#e0b15a; --c-tar:#e0736a; --c-tur:#63b6d6; --c-mat:#8dbc7e; --c-vat:#a98fd0; --c-gun:#5fc4bd;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--f-b); font-size:16.5px; line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button{font-family:inherit; cursor:pointer}
h1,h2,h3,h4{font-family:var(--f-d); font-weight:700; letter-spacing:-.02em; line-height:1.15; margin:0}

/* --- yukselti seridi: sitenin imzasi --- */
.ramp{height:4px; display:flex; width:100%}
.ramp i{flex:1; display:block}
.ramp i:nth-child(1){background:var(--ova)}
.ramp i:nth-child(2){background:var(--plato)}
.ramp i:nth-child(3){background:var(--dag)}
.ramp i:nth-child(4){background:var(--lav)}
.ramp i:nth-child(5){background:var(--zirve)}

/* --- baslik --- */
.head{position:sticky; top:0; z-index:60; background:var(--bg2); border-bottom:1px solid var(--line)}
.head-in{max-width:var(--w); margin:0 auto; padding:11px 20px; display:flex; align-items:center; gap:14px}
.brand{display:flex; align-items:center; gap:11px; text-decoration:none; margin-right:auto}
.brand svg{width:30px; height:30px; flex:none}
.brand b{font-family:var(--f-d); font-weight:800; font-size:16px; letter-spacing:-.03em; display:block; line-height:1.1}
.brand span{font-family:var(--f-m); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink3)}
.hbtn{background:none; border:1px solid var(--line); color:var(--ink2); border-radius:99px; padding:6px 13px;
  font-family:var(--f-d); font-size:12.5px; font-weight:600; transition:.15s}
.hbtn:hover{border-color:var(--acc); color:var(--acc)}
#menuBtn{display:none}

/* --- iskelet --- */
.shell{max-width:var(--w); margin:0 auto; display:grid; grid-template-columns:262px 1fr; gap:34px; padding:0 20px}
.side{position:sticky; top:57px; height:calc(100vh - 57px); overflow-y:auto; padding:22px 0 60px; scrollbar-width:thin}
.side::-webkit-scrollbar{width:5px} .side::-webkit-scrollbar-thumb{background:var(--line); border-radius:9px}
main{padding:30px 0 90px; min-width:0}

/* --- arama --- */
.srch{position:relative; margin-bottom:16px}
.srch input{width:100%; padding:8px 11px 8px 30px; border:1px solid var(--line); background:var(--card);
  color:var(--ink); border-radius:8px; font-family:var(--f-d); font-size:13px; outline:none}
.srch input:focus{border-color:var(--acc)}
.srch svg{position:absolute; left:9px; top:9px; width:14px; height:14px; stroke:var(--ink3); fill:none; stroke-width:2}

/* --- yan menu --- */
.nav-ders{margin-bottom:5px; border-radius:9px; overflow:hidden}
.nav-t{width:100%; display:flex; align-items:center; gap:9px; padding:9px 11px; background:none; border:0;
  text-align:left; color:var(--ink); font-family:var(--f-d); font-weight:600; font-size:14px; border-radius:8px}
.nav-t:hover{background:var(--bg2)}
.nav-t .dot{width:9px; height:9px; border-radius:3px; flex:none}
.nav-t .cnt{margin-left:auto; font-family:var(--f-m); font-size:10.5px; color:var(--ink3)}
.nav-t .arw{width:11px; height:11px; stroke:var(--ink3); fill:none; stroke-width:2.4; transition:.2s}
.nav-ders.acik .arw{transform:rotate(90deg)}
.nav-k{display:none; padding:2px 0 8px 11px; margin-left:9px; border-left:1px solid var(--line2)}
.nav-ders.acik .nav-k{display:block}
.nav-k a{display:block; padding:5px 9px; font-size:13.4px; color:var(--ink2); text-decoration:none;
  border-radius:6px; line-height:1.35; font-family:var(--f-d); font-weight:500}
.nav-k a:hover{background:var(--bg2); color:var(--ink)}
.nav-k a.on{background:var(--sel); color:var(--ink); font-weight:600}
.nav-k a .st{float:right; font-family:var(--f-m); font-size:9px; color:var(--ink3); letter-spacing:.06em; margin-top:2px}

/* --- ana sayfa --- */
.hero{padding:44px 0 34px; border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--f-m); font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink3); margin-bottom:14px}
.hero h1{font-size:clamp(34px,5.4vw,56px); font-weight:800; letter-spacing:-.038em; max-width:16ch}
.hero h1 em{font-style:normal; color:var(--acc)}
.hero p{max-width:56ch; color:var(--ink2); margin:16px 0 0; font-size:17px}
.hero-map{margin:26px 0 0; border:1px solid var(--line); border-radius:var(--r); background:var(--card); padding:10px; overflow:hidden}
.hero-map svg{width:100%; height:auto; display:block}

.gridDers{display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:14px; margin:28px 0}
.dc{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:17px 17px 15px;
  text-decoration:none; display:block; position:relative; overflow:hidden; transition:.18s; box-shadow:var(--shadow)}
.dc:hover{transform:translateY(-2px); border-color:var(--dc)}
.dc::before{content:''; position:absolute; inset:0 auto 0 0; width:3px; background:var(--dc)}
.dc .bl{font-family:var(--f-m); font-size:9.5px; letter-spacing:.15em; text-transform:uppercase; color:var(--ink3)}
.dc h3{font-size:20px; margin:7px 0 6px; letter-spacing:-.03em}
.dc .num{font-family:var(--f-m); font-size:12px; color:var(--dc); font-weight:600}
.dc p{margin:9px 0 0; font-size:13.6px; color:var(--ink2); line-height:1.5}
.dc .kt{margin-top:12px; padding-top:10px; border-top:1px solid var(--line2); font-family:var(--f-m); font-size:10.5px; color:var(--ink3)}

.plan{background:var(--bg2); border:1px solid var(--line); border-radius:var(--r); padding:20px 22px; margin:8px 0 40px}
.plan h3{font-size:16px; margin-bottom:12px}
.plan ol{margin:0; padding-left:19px; color:var(--ink2); font-size:14.6px}
.plan li{margin-bottom:7px}
.plan li b{color:var(--ink)}

/* --- ders sayfasi --- */
.dhead{border-bottom:1px solid var(--line); padding-bottom:22px; margin-bottom:26px}
.dhead h1{font-size:clamp(28px,4.4vw,42px); letter-spacing:-.035em}
.dhead .lead{color:var(--ink2); max-width:60ch; margin:12px 0 0}
.pill{display:inline-flex; align-items:center; gap:6px; font-family:var(--f-m); font-size:11px; letter-spacing:.08em;
  text-transform:uppercase; padding:4px 10px; border-radius:99px; border:1px solid var(--line); color:var(--ink2)}
.metod{display:grid; gap:8px; margin:20px 0 0; padding:16px 18px; background:var(--bg2); border-radius:var(--r); border:1px solid var(--line)}
.metod div{font-size:14px; color:var(--ink2); padding-left:20px; position:relative}
.metod div::before{content:'\2192 '; position:absolute; left:0; color:var(--acc); font-family:var(--f-m)}

.klist{display:grid; gap:9px}
.ki{display:flex; align-items:center; gap:13px; padding:13px 16px; background:var(--card); border:1px solid var(--line);
  border-radius:9px; text-decoration:none; transition:.15s}
.ki:hover{border-color:var(--acc); transform:translateX(3px)}
.ki .no{font-family:var(--f-m); font-size:11.5px; color:var(--ink3); width:22px; flex:none}
.ki .tx{flex:1; min-width:0}
.ki .tx b{display:block; font-family:var(--f-d); font-size:15px; font-weight:600; letter-spacing:-.01em}
.ki .tx span{font-size:13px; color:var(--ink2); display:block; margin-top:2px}
.ki .sq{font-family:var(--f-m); font-size:10.5px; padding:3px 8px; border-radius:5px; background:var(--bg2);
  color:var(--ink2); flex:none; white-space:nowrap}
.ki .tag{font-family:var(--f-m); font-size:9px; letter-spacing:.1em; text-transform:uppercase; padding:3px 7px;
  border-radius:4px; flex:none; border:1px solid var(--line)}
.tag.iskelet{color:var(--ink3)}
.tag.hazir{color:var(--ova); border-color:var(--ova)}

/* --- konu sayfasi --- */
.crumb{font-family:var(--f-m); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink3); margin-bottom:12px}
.crumb a{color:var(--ink2); text-decoration:none}
.crumb a:hover{color:var(--acc)}
.khead h1{font-size:clamp(26px,4vw,38px); letter-spacing:-.035em}
.khead .ozet{font-size:18px; color:var(--ink2); margin:12px 0 0; max-width:62ch; font-style:italic}
.khead .bar{display:flex; gap:9px; align-items:center; margin-top:15px; flex-wrap:wrap}
.okundu{background:none; border:1px solid var(--line); color:var(--ink2); border-radius:99px; padding:5px 13px;
  font-family:var(--f-d); font-size:12.5px; font-weight:600}
.okundu.on{background:var(--ova); border-color:var(--ova); color:#fff}

.blk{margin:30px 0}
.blk-h{font-family:var(--f-d); font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink3); margin-bottom:13px; display:flex; align-items:center; gap:9px}
.blk-h::after{content:''; flex:1; height:1px; background:var(--line2)}

/* ozet listesi */
.b-ozet ul{margin:0; padding:0; list-style:none}
.b-ozet li{position:relative; padding:0 0 0 21px; margin-bottom:10px; color:var(--ink2)}
.b-ozet li::before{content:''; position:absolute; left:3px; top:11px; width:7px; height:7px; border-radius:2px; background:var(--plato)}
.b-ozet li strong, .b-ozet li b{color:var(--ink); font-weight:600}

/* tablo */
.tw{overflow-x:auto; border:1px solid var(--line); border-radius:9px; background:var(--card)}
table{width:100%; border-collapse:collapse; font-size:14.4px; min-width:440px}
th{background:var(--bg2); font-family:var(--f-d); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink3); text-align:left; padding:9px 13px; border-bottom:1px solid var(--line); font-weight:700; white-space:nowrap}
td{padding:10px 13px; border-bottom:1px solid var(--line2); vertical-align:top; color:var(--ink2)}
tr:last-child td{border-bottom:0}
td:first-child{color:var(--ink); font-weight:600; font-family:var(--f-d); font-size:13.8px}
td strong{color:var(--ink)}

/* tuzak */
.b-tuzak{background:var(--card); border:1px solid var(--sinir); border-left-width:3px; border-radius:9px; padding:16px 19px}
.b-tuzak .blk-h{color:var(--sinir); margin-bottom:11px}
.b-tuzak .blk-h::after{background:color-mix(in srgb,var(--sinir) 25%, transparent)}
.b-tuzak ul{margin:0; padding-left:19px}
.b-tuzak li{margin-bottom:8px; color:var(--ink2); font-size:15px}
.b-tuzak li:last-child{margin-bottom:0}
.b-tuzak strong{color:var(--ink)}

/* hafiza kodu */
.b-kod{background:linear-gradient(180deg,var(--bg2),var(--card)); border:1px dashed var(--plato); border-radius:9px; padding:16px 19px}
.b-kod .blk-h{color:var(--plato)}
.b-kod .blk-h::after{background:color-mix(in srgb,var(--plato) 30%, transparent)}
.b-kod p{margin:0; font-size:15.5px; color:var(--ink2)}
.b-kod strong{color:var(--ink); font-weight:600}

/* formul karti */
.b-formul{background:var(--card); border:1px solid var(--line); border-radius:9px; padding:6px 0; overflow:hidden}
.b-formul .fr{padding:10px 19px; border-bottom:1px solid var(--line2); font-family:var(--f-m); font-size:14px; color:var(--ink2)}
.b-formul .fr:last-child{border-bottom:0}
.b-formul .fr strong{color:var(--acc); font-weight:600}

/* cozumlu ornek */
.b-cozum{border:1px solid var(--line); border-radius:9px; overflow:hidden}
.b-cozum .q{background:var(--bg2); padding:14px 19px; font-size:15.4px; border-bottom:1px solid var(--line)}
.b-cozum ol{margin:0; padding:14px 19px 14px 40px; background:var(--card)}
.b-cozum li{margin-bottom:8px; color:var(--ink2); font-size:15px}
.b-cozum .cev{padding:11px 19px; background:var(--bg2); border-top:1px solid var(--line);
  font-family:var(--f-m); font-size:13.5px; color:var(--ova); font-weight:600}

/* taktik */
.b-taktik{background:var(--card); border:1px solid var(--akarsu); border-left-width:3px; border-radius:9px; padding:16px 19px}
.b-taktik .blk-h{color:var(--akarsu)}
.b-taktik .blk-h::after{background:color-mix(in srgb,var(--akarsu) 25%, transparent)}
.b-taktik p{margin:0; font-size:15.2px; color:var(--ink2)}

/* karsit (yanlis / dogru) */
.b-karsit .kp{display:grid; grid-template-columns:1fr 1fr; gap:0; border:1px solid var(--line);
  border-radius:9px; overflow:hidden; margin-bottom:11px}
.b-karsit .kp>div{padding:14px 17px; font-size:14.6px}
.b-karsit .yn{background:color-mix(in srgb,var(--sinir) 8%, var(--card)); color:var(--ink2); border-right:1px solid var(--line)}
.b-karsit .dg{background:color-mix(in srgb,var(--ova) 9%, var(--card)); color:var(--ink2)}
.b-karsit .lb{display:block; font-family:var(--f-m); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; margin-bottom:6px}
.b-karsit .yn .lb{color:var(--sinir)} .b-karsit .dg .lb{color:var(--ova)}
.b-karsit strong{color:var(--ink)}

/* zaman seridi */
.b-zaman .tl{position:relative; padding-left:26px}
.b-zaman .tl::before{content:''; position:absolute; left:6px; top:6px; bottom:6px; width:2px;
  background:linear-gradient(180deg,var(--ova),var(--plato),var(--dag),var(--lav))}
.b-zaman .ev{position:relative; margin-bottom:19px}
.b-zaman .ev::before{content:''; position:absolute; left:-24px; top:6px; width:10px; height:10px;
  border-radius:50%; background:var(--card); border:2px solid var(--dag)}
.b-zaman .yr{font-family:var(--f-m); font-size:11.5px; color:var(--dag); font-weight:600; letter-spacing:.04em}
.b-zaman .ol{font-family:var(--f-d); font-size:16px; font-weight:700; margin:2px 0 4px; letter-spacing:-.02em}
.b-zaman .ds{font-size:14.6px; color:var(--ink2)}

/* sema */
.b-sema{display:grid; gap:13px; grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.b-sema .box{background:var(--card); border:1px solid var(--line); border-radius:9px; overflow:hidden}
.b-sema .box>b{display:block; background:var(--bg2); padding:9px 15px; font-family:var(--f-d); font-size:13.5px;
  border-bottom:1px solid var(--line); letter-spacing:-.01em}
.b-sema .box ul{margin:0; padding:9px 15px 11px 30px}
.b-sema .box li{font-size:14px; color:var(--ink2); margin-bottom:5px}

/* sayi karti */
.b-sayilar{display:grid; gap:9px; grid-template-columns:repeat(auto-fill,minmax(178px,1fr))}
.b-sayilar .sc{background:var(--card); border:1px solid var(--line); border-radius:9px; padding:13px 15px}
.b-sayilar .sc b{display:block; font-family:var(--f-m); font-size:23px; font-weight:600; color:var(--acc); letter-spacing:-.02em}
.b-sayilar .sc span{display:block; font-size:13.2px; color:var(--ink2); margin-top:4px; line-height:1.4}

/* test */
.b-test .sq{background:var(--card); border:1px solid var(--line); border-radius:9px; padding:17px 19px; margin-bottom:12px}
.b-test .qs{font-size:15.6px; margin-bottom:13px}
.b-test .op{display:block; width:100%; text-align:left; background:var(--bg2); border:1px solid var(--line);
  border-radius:7px; padding:9px 13px; margin-bottom:7px; font-family:var(--f-b); font-size:14.6px; color:var(--ink2); transition:.13s}
.b-test .op:hover:not(:disabled){border-color:var(--acc)}
.b-test .op:disabled{cursor:default}
.b-test .op .lt{font-family:var(--f-m); font-size:11.5px; color:var(--ink3); margin-right:9px}
.b-test .op.dogru{background:color-mix(in srgb,var(--ova) 15%, var(--card)); border-color:var(--ova); color:var(--ink)}
.b-test .op.yanlis{background:color-mix(in srgb,var(--sinir) 13%, var(--card)); border-color:var(--sinir)}
.b-test .exp{margin-top:11px; padding:12px 15px; background:var(--bg2); border-radius:7px; font-size:14.4px; color:var(--ink2); display:none}
.b-test .exp.gor{display:block}
.b-test .exp b{color:var(--ink)}

/* iskelet uyarisi */
.stub{background:var(--bg2); border:1px dashed var(--line); border-radius:9px; padding:18px 20px; margin:22px 0}
.stub b{font-family:var(--f-d); font-size:14px; display:block; margin-bottom:5px}
.stub p{margin:0; font-size:14.2px; color:var(--ink2)}

/* sayfa gezinme */
.pnav{display:flex; gap:11px; margin-top:44px; padding-top:22px; border-top:1px solid var(--line)}
.pnav a{flex:1; padding:13px 16px; background:var(--card); border:1px solid var(--line); border-radius:9px;
  text-decoration:none; transition:.15s}
.pnav a:hover{border-color:var(--acc)}
.pnav a span{display:block; font-family:var(--f-m); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink3)}
.pnav a b{font-family:var(--f-d); font-size:14.5px; font-weight:600; letter-spacing:-.01em}
.pnav a.nx{text-align:right}

/* ======= HARITA ======= */
.mapw{border:1px solid var(--line); border-radius:var(--r); background:var(--card); overflow:hidden; margin:14px 0 0}
.mtop{display:flex; gap:7px; padding:10px 12px; border-bottom:1px solid var(--line); background:var(--bg2);
  flex-wrap:wrap; align-items:center}
.mchip{background:var(--card); border:1px solid var(--line); border-radius:99px; padding:5px 12px;
  font-family:var(--f-d); font-size:12.3px; font-weight:600; color:var(--ink2); transition:.13s; white-space:nowrap}
.mchip:hover{border-color:var(--acc)}
.mchip.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.mchip .sw{display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:6px; vertical-align:1px}
.mspacer{flex:1}
.mtool{background:none; border:1px solid var(--line); border-radius:7px; width:29px; height:29px; color:var(--ink2);
  font-family:var(--f-m); font-size:14px; line-height:1; display:grid; place-items:center}
.mtool:hover{border-color:var(--acc); color:var(--acc)}
.mtool.on{background:var(--acc); border-color:var(--acc); color:#fff}

.mbody{display:grid; grid-template-columns:1fr 232px}
.mstage{position:relative; background:
  linear-gradient(var(--bg2),var(--bg2)); overflow:hidden; touch-action:none; cursor:grab}
.mstage.drag{cursor:grabbing}
.mstage svg{width:100%; height:auto; display:block; user-select:none}
.il{fill:var(--bg); stroke:var(--line); stroke-width:.6; transition:fill .18s}
[data-tema="gece"] .il{fill:#17323d; stroke:#25454f}
.il:hover{fill:var(--sel)}
.il.hl{fill:var(--acc); opacity:.85}
.il.rg{opacity:.9}
.mk{cursor:pointer}
.mk circle{stroke:var(--card); stroke-width:1.4; transition:r .15s}
.mk:hover circle{stroke:var(--ink)}
.mk.sec circle{stroke:var(--ink); stroke-width:2.2}
.mk text{font-family:'Archivo',sans-serif; font-size:7px; font-weight:600; fill:var(--ink);
  paint-order:stroke; stroke:var(--card); stroke-width:2.6; stroke-linejoin:round; pointer-events:none}
.riv{fill:none; stroke:var(--akarsu); stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; opacity:.85}
.riv.sec{stroke-width:3; opacity:1}
.ilad{font-family:'IBM Plex Mono',monospace; font-size:5.6px; fill:var(--ink3); pointer-events:none; text-anchor:middle}

.mside{border-left:1px solid var(--line); max-height:520px; overflow-y:auto; background:var(--bg2)}
.mside::-webkit-scrollbar{width:5px} .mside::-webkit-scrollbar-thumb{background:var(--line); border-radius:9px}
.mgh{position:sticky; top:0; background:var(--bg2); padding:9px 13px 6px; font-family:var(--f-d); font-size:10.5px;
  letter-spacing:.13em; text-transform:uppercase; color:var(--ink3); border-bottom:1px solid var(--line2); z-index:2}
.mit{padding:8px 13px; border-bottom:1px solid var(--line2); cursor:pointer; transition:.12s}
.mit:hover{background:var(--card)}
.mit.sec{background:var(--sel)}
.mit b{display:block; font-family:var(--f-d); font-size:13px; font-weight:600; letter-spacing:-.01em}
.mit span{display:block; font-size:12.2px; color:var(--ink2); line-height:1.42; margin-top:2px}
.mit strong{color:var(--ink)}
.mnote{padding:10px 13px; font-size:12.4px; color:var(--ink2); background:var(--card); border-bottom:1px solid var(--line2)}

.mtip{position:absolute; z-index:20; background:var(--ink); color:var(--bg); padding:8px 11px; border-radius:7px;
  font-size:12.6px; max-width:250px; pointer-events:none; opacity:0; transition:opacity .12s; line-height:1.45}
.mtip.gor{opacity:1}
.mtip b{font-family:var(--f-d); display:block; font-size:13px; margin-bottom:2px}

.mfoot{padding:8px 13px; border-top:1px solid var(--line); background:var(--bg2); font-family:var(--f-m);
  font-size:11px; color:var(--ink3); display:flex; gap:14px; flex-wrap:wrap; align-items:center}
.mfoot b{color:var(--ink); font-weight:600}
.qbar{padding:11px 13px; background:var(--card); border-top:1px solid var(--line); display:flex;
  align-items:center; gap:12px; flex-wrap:wrap}
.qbar .qq{font-family:var(--f-d); font-size:15px; font-weight:600; flex:1; min-width:170px}
.qbar .qs{font-family:var(--f-m); font-size:12px; color:var(--ink2)}
.qbar .qr{font-family:var(--f-m); font-size:12.5px; padding:4px 10px; border-radius:6px}
.qr.iyi{background:color-mix(in srgb,var(--ova) 20%,transparent); color:var(--ova)}
.qr.orta{background:color-mix(in srgb,var(--plato) 22%,transparent); color:var(--dag)}
.qr.kotu{background:color-mix(in srgb,var(--sinir) 16%,transparent); color:var(--sinir)}

/* --- arama sonuclari --- */
.res{display:grid; gap:8px; margin-top:18px}
.res a{padding:12px 15px; background:var(--card); border:1px solid var(--line); border-radius:9px; text-decoration:none}
.res a:hover{border-color:var(--acc)}
.res b{font-family:var(--f-d); font-size:14.5px; display:block}
.res span{font-size:12.6px; color:var(--ink3); font-family:var(--f-m)}

/* --- responsive --- */
@media(max-width:900px){
  .shell{grid-template-columns:1fr; gap:0}
  .side{position:fixed; inset:57px auto 0 0; width:280px; background:var(--bg2); border-right:1px solid var(--line);
    padding:18px 16px 60px; transform:translateX(-102%); transition:transform .22s; z-index:55; height:calc(100vh - 57px)}
  .side.acik{transform:none}
  #menuBtn{display:grid; place-items:center; width:33px; height:31px; padding:0}
  .mbody{grid-template-columns:1fr}
  .mside{border-left:0; border-top:1px solid var(--line); max-height:290px}
  .b-karsit .kp{grid-template-columns:1fr}
  .b-karsit .yn{border-right:0; border-bottom:1px solid var(--line)}
  body{font-size:16px}
  .scrim{position:fixed; inset:0; background:rgba(0,0,0,.32); z-index:54; display:none}
  .scrim.acik{display:block}
}
@media(max-width:520px){
  .head-in{padding:9px 14px; gap:9px}
  .shell{padding:0 14px}
  .gridDers{grid-template-columns:1fr}
  .pnav{flex-direction:column}
  .mtop{padding:8px}
  .mchip{font-size:11.6px; padding:4px 10px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important; scroll-behavior:auto}}
:focus-visible{outline:2px solid var(--acc); outline-offset:2px}

      { t:'kod', b:'Haf\u0131za kodu', x:'Bozukluk ararken \u015fu s\u0131rayla bak: \u2460 **Gereksiz kelime var m\u0131?** (en s\u0131k) \u2461 **\u0130ki y\u00fcklem varsa ortak \u00f6ge tutuyor mu?** \u2462 **\u00d6zne cans\u0131z m\u0131, y\u00fcklem \u00e7o\u011ful mu?** \u2463 **Kelime do\u011fru anlamda m\u0131?**' },

      { t:'test', s:[

      { t:'test', s:[

        '"Bir say\u0131n\u0131n 3 fazlas\u0131n\u0131n 2 kat\u0131" ile "bir say\u0131n\u0131n 2 kat\u0131n\u0131n 3 fazlas\u0131" **farkl\u0131d\u0131r**: 2(x+3) \u2260 2x+3.',

    '**Osmanl\u0131 K\u00fclt\u00fcr ve Medeniyeti\'ni hafife alma** \u2014 \u00e7\u0131km\u0131\u015f soru taramas\u0131nda Mill\u00ee M\u00fccadele\'den sonra en \u00e7ok soru bu konudan gelmi\u015ftir.'
  ],

  { id:'islamiyet-oncesi', ad:'\u0130slamiyet \u00d6ncesi T\u00fcrk Tarihi', soru:'1 soru', durum:'hazir',
    ozet:'Devletlerin s\u0131ras\u0131, kurucular\u0131 ve "ilk"ler. Orta Asya k\u00fclt\u00fcrleri ve g\u00f6\u00e7 sebepleri de sorulur.',
    bloklar:[
      { t:'ozet', b:'Orta Asya\'n\u0131n ilk k\u00fclt\u00fcrleri', i:[
        '**Anav** (T\u00fcrkmenistan) \u2014 Orta Asya\'n\u0131n **en eski** k\u00fclt\u00fcr\u00fc.',
        '**Afanasyevo** \u2014 T\u00fcrklerin **en eski atas\u0131** say\u0131lan k\u00fclt\u00fcr; avc\u0131l\u0131k ve sava\u015f\u00e7\u0131l\u0131k.',
        '**Andronova** \u2014 **en geni\u015f alana yay\u0131lan** ve T\u00fcrk k\u00fclt\u00fcr\u00fcne en yak\u0131n olan; at ve demir i\u015flenmi\u015ftir.',
        '**Karasuk** \u2014 demirin i\u015flendi\u011fi, **tekerlekli araba** kullan\u0131lan k\u00fclt\u00fcr.',
        '**Tagar** \u2014 Orta Asya\'n\u0131n **en geli\u015fmi\u015f ve en son** k\u00fclt\u00fcr\u00fc.',
        '**Kelteminar** \u2014 avc\u0131l\u0131k ve bal\u0131k\u00e7\u0131l\u0131k.'
      ]},
      { t:'zaman', b:'Devletler zaman \u015feridi', z:[
        { y:'M\u00d6 VIII\u2013III. yy', o:'\u0130skitler (Sakalar)', d:'**\u0130lk T\u00fcrk kad\u0131n h\u00fck\u00fcmdar Tomris Hatun.** *Alp Er Tunga* ve *\u015eu* destanlar\u0131. **Hayvan \u00fcslubu** sanat\u0131; atl\u0131 g\u00f6\u00e7ebe k\u00fclt\u00fcr\u00fcn \u00f6nc\u00fcs\u00fc.' },
        { y:'M\u00d6 220 \u2013 MS 216', o:'Asya (B\u00fcy\u00fck) Hun Devleti', d:'**\u0130lk te\u015fkilatl\u0131 T\u00fcrk devleti.** Teoman ve **Mete Han** (M\u00d6 209-174). **Onluk sistem** \u2014 d\u00fczenli ordunun kurucusu. \u00c7in\'e kar\u015f\u0131 \u00fcst\u00fcnl\u00fck, \u00c7in Seddi.' },
        { y:'375', o:'Kavimler G\u00f6\u00e7\u00fc', d:'Bat\u0131ya g\u00f6\u00e7 eden Hunlar\u0131n bask\u0131s\u0131yla Avrupa\'daki kavimler yer de\u011fi\u015ftirdi. **Roma ikiye ayr\u0131ld\u0131**, Avrupa\'da **feodalite** do\u011fdu, **\u0130lk \u00c7a\u011f kapand\u0131**.' },
        { y:'375 \u2013 469', o:'Avrupa Hun Devleti', d:'Uld\u0131z, Rua, **Attila**. **Margos (434)** ve **Anatolius (447)** antla\u015fmalar\u0131 \u2014 Bizans\'a vergi kabul ettirildi. Galya ve \u0130talya seferleri.' },
        { y:'552 \u2013 630', o:'I. G\u00f6kt\u00fcrk Devleti', d:'**Bumin Ka\u011fan** (do\u011fu) ve **\u0130stemi Yabgu** (bat\u0131). **"T\u00fcrk" ad\u0131n\u0131 devlet ad\u0131 olarak kullanan ilk devlet.** Sasanilerle birlikte Akhunlar\u0131 y\u0131kt\u0131, sonra Bizans\'la \u0130pek Yolu i\u00e7in ittifak kurdu.' },
        { y:'682 \u2013 744', o:'II. G\u00f6kt\u00fcrk (Kutluk) Devleti', d:'**Kutluk (\u0130lteri\u015f) Ka\u011fan** ba\u011f\u0131ms\u0131zl\u0131\u011f\u0131 kazand\u0131. **Bilge Ka\u011fan, K\u00fcltigin, Tonyukuk** d\u00f6nemi. **Orhun Yaz\u0131tlar\u0131** bu d\u00f6neme aittir.' },
        { y:'744 \u2013 840', o:'Uygur Devleti', d:'Kutluk Bilge K\u00fcl Ka\u011fan, **B\u00f6g\u00fc Ka\u011fan** (Maniheizm). **Yerle\u015fik hayata ge\u00e7en ilk T\u00fcrk devleti**; \u015fehir ve tap\u0131nak kurdular, matbaa ve k\u00e2\u011f\u0131t kulland\u0131lar. Ba\u015fkent **Ordu-Bal\u0131k (Karabalgasun)**. K\u0131rg\u0131zlar taraf\u0131ndan y\u0131k\u0131ld\u0131.' }
      ]},
      { t:'tablo', b:'Di\u011fer T\u00fcrk devlet ve topluluklar\u0131', h:['Devlet','\u00d6ne \u00e7\u0131kan \u00f6zellik'], r:[
        ['**Avarlar**','**\u0130stanbul\'u ku\u015fatan ilk T\u00fcrk devleti** (619 ve 626). **\u00dczengiyi** Avrupa\'ya tan\u0131tt\u0131lar.'],
        ['**Hazarlar**','**Musevili\u011fi** benimseyen y\u00f6netici s\u0131n\u0131f. **"Hazar Bar\u0131\u015f \u00c7a\u011f\u0131"** \u2014 ho\u015fg\u00f6r\u00fc ve ticaret.'],
        ['**T\u00fcrgi\u015fler**','**\u0130lk T\u00fcrk paras\u0131n\u0131** bast\u0131ran devlet (Baga Tarkan). Emevilere kar\u015f\u0131 Orta Asya\'y\u0131 savundu.'],
        ['**K\u0131rg\u0131zlar**','**Manas Destan\u0131** \u2014 d\u00fcnyan\u0131n en uzun destan\u0131. Uygur Devleti\'ni y\u0131kt\u0131lar.'],
        ['**Bulgarlar**','Tuna Bulgarlar\u0131 **Hristiyanl\u0131\u011f\u0131**, \u0130dil (Volga) Bulgarlar\u0131 **\u0130slamiyet**\'i kabul etti.'],
        ['**Macarlar, Pe\u00e7enekler, Kumanlar (K\u0131p\u00e7aklar)**','Do\u011fu Avrupa\'ya yerle\u015ftiler; Kumanlar i\u00e7in **Codex Cumanicus** s\u00f6zl\u00fc\u011f\u00fc yaz\u0131ld\u0131.'],
        ['**Sabirler (Sibirler)**','Sibirya ad\u0131 buradan gelir.'],
        ['**Karluklar**','**Talas Sava\u015f\u0131\'nda (751)** Abbasilerin yan\u0131nda yer ald\u0131lar.']
      ]},
      { t:'kod', b:'Haf\u0131za kodu', x:'S\u0131ralama: **\u0130skit \u2192 Asya Hun \u2192 Avrupa Hun \u2192 G\u00f6kt\u00fcrk \u2192 Uygur.** "\u0130lk"ler: **te\u015fkilatl\u0131** = Asya Hun \u00b7 **T\u00fcrk ad\u0131n\u0131 kullanan** = G\u00f6kt\u00fcrk \u00b7 **yerle\u015fik** = Uygur \u00b7 **\u0130stanbul\'u ku\u015fatan** = Avar \u00b7 **para bast\u0131ran** = T\u00fcrgi\u015f.' },
      { t:'tuzak', i:[
        '**Kavimler G\u00f6\u00e7\u00fc\'n\u00fc Avrupa Hunlar\u0131 ba\u015flatmad\u0131.** Bat\u0131ya g\u00f6\u00e7en Hun bask\u0131s\u0131 kavimleri harekete ge\u00e7irdi; Avrupa Hun Devleti g\u00f6\u00e7\u00fcn *sonucunda* kuruldu.',
        '**T\u00fcrk ad\u0131n\u0131 ilk kullanan** G\u00f6kt\u00fcrkler, **ilk te\u015fkilatl\u0131 devlet** Asya Hunlar\u0131\'d\u0131r. \u0130kisi ayr\u0131 ayr\u0131 sorulur.',
        '**Orhun Yaz\u0131tlar\u0131 II. G\u00f6kt\u00fcrk d\u00f6nemine** aittir; I. G\u00f6kt\u00fcrk\'e de\u011fil. Bilge Ka\u011fan, K\u00fcltigin ve Tonyukuk ad\u0131na dikilmi\u015ftir.',
        '**G\u00f6\u00e7 sebepleri**: kurakl\u0131k ve otlak yetersizli\u011fi, n\u00fcfus art\u0131\u015f\u0131, \u00c7in bask\u0131s\u0131, boylar aras\u0131 m\u00fccadele, salg\u0131n hastal\u0131klar, ba\u011f\u0131ms\u0131zl\u0131k tutkusu.',
        '**Uygurlar yerle\u015fik hayata ge\u00e7ti\u011fi i\u00e7in** T\u00fcrk devletleri aras\u0131nda ilk kez \u015fehir, tap\u0131nak ve k\u00fct\u00fcphane kurmu\u015flard\u0131r \u2014 ama bu, sava\u015f\u00e7\u0131l\u0131klar\u0131n\u0131 zay\u0131flatm\u0131\u015ft\u0131r.',
        '**T\u00fcrgi\u015fler ilk T\u00fcrk paras\u0131n\u0131 bast\u0131**; ilk T\u00fcrk-\u0130slam paras\u0131n\u0131 basan ise Karahanl\u0131lar\'d\u0131r. Kar\u0131\u015ft\u0131rma.'
      ]},
      { t:'test', s:[
        { q:'562\'de Bayan Han taraf\u0131ndan Orta Avrupa\'da kurulan, \u0130stanbul\'u iki kez ku\u015fatan ve 805\'te Franklar taraf\u0131ndan y\u0131k\u0131lan devlet a\u015fa\u011f\u0131dakilerden hangisidir?',
          c:['Hazarlar','Avarlar','Pe\u00e7enekler','Bulgarlar'], d:1,
          a:'Avar Devleti, \u0130stanbul\'u ku\u015fatan ilk T\u00fcrk devletidir (619 ve 626). \u00dczengiyi Avrupa\'ya tan\u0131tan da Avarlard\u0131r.' },
        { q:'Orhun Yaz\u0131tlar\u0131 a\u015fa\u011f\u0131daki devlet adamlar\u0131ndan hangilerinin d\u00f6nemine ait bilgileri i\u00e7erir?\n\nI. Bilge Ka\u011fan   II. Tonyukuk   III. Bumin Ka\u011fan',
          c:['Yaln\u0131z I','I ve II','II ve III','I, II ve III'], d:1,
          a:'Orhun Yaz\u0131tlar\u0131 II. G\u00f6kt\u00fcrk (Kutluk) Devleti d\u00f6nemine aittir ve Bilge Ka\u011fan, K\u00fcltigin ile Tonyukuk ad\u0131na dikilmi\u015ftir. Bumin Ka\u011fan I. G\u00f6kt\u00fcrk\'\u00fcn kurucusudur.' },
        { q:'A\u015fa\u011f\u0131daki T\u00fcrk devletlerinden hangisi "T\u00fcrk" ad\u0131n\u0131 ilk kez devletinin ad\u0131nda kullanm\u0131\u015ft\u0131r?',
          c:['Asya Hun Devleti','G\u00f6kt\u00fcrk Devleti','Uygur Devleti','Avar Devleti'], d:1,
          a:'552\'de kurulan G\u00f6kt\u00fcrk Devleti, T\u00fcrk ad\u0131n\u0131 resm\u00ee devlet ad\u0131 olarak kullanan ilk T\u00fcrk devletidir.' },
        { q:'Yerle\u015fik hayata ge\u00e7en, \u015fehirler kuran ve kendi alfabesini olu\u015fturan ilk T\u00fcrk devleti hangisidir?',
          c:['G\u00f6kt\u00fcrkler','Hazarlar','Uygurlar','K\u0131rg\u0131zlar'], d:2,
          a:'Uygurlar yerle\u015fik hayata ge\u00e7mi\u015f, tap\u0131nak ve \u015fehirler kurmu\u015f, 18 harfli kendi alfabelerini kullanm\u0131\u015flard\u0131r.' },
        { q:'Musevili\u011fi benimseyerek "Hazar Bar\u0131\u015f \u00c7a\u011f\u0131" olarak an\u0131lan bir d\u00f6nem ya\u015fatan T\u00fcrk devleti hangisidir?',
          c:['Avarlar','Bulgarlar','Hazarlar','T\u00fcrgi\u015fler'], d:2,
          a:'Hazarlar\'da y\u00f6netici s\u0131n\u0131f Musevili\u011fi benimsemi\u015f, ho\u015fg\u00f6r\u00fcl\u00fc y\u00f6netimleriyle uzun bir bar\u0131\u015f ve ticaret d\u00f6nemi ya\u015fanm\u0131\u015ft\u0131r.' },
        { q:'\u0130lk T\u00fcrk paras\u0131n\u0131 bast\u0131ran T\u00fcrk devleti a\u015fa\u011f\u0131dakilerden hangisidir?',
          c:['Uygurlar','T\u00fcrgi\u015fler','Karahanl\u0131lar','Hazarlar'], d:1,
          a:'T\u00fcrgi\u015f h\u00fck\u00fcmdar\u0131 Baga Tarkan ilk T\u00fcrk paras\u0131n\u0131 bast\u0131rm\u0131\u015ft\u0131r. Karahanl\u0131lar ise ilk T\u00fcrk-\u0130slam paras\u0131n\u0131 basm\u0131\u015ft\u0131r.' },
        { q:'Orta Asya k\u00fclt\u00fcrlerinden hangisi en geni\u015f alana yay\u0131lm\u0131\u015f ve T\u00fcrk k\u00fclt\u00fcr\u00fcne en yak\u0131n k\u00fclt\u00fcr olarak kabul edilir?',
          c:['Anav','Kelteminar','Andronova','Tagar'], d:2,
          a:'Andronova k\u00fclt\u00fcr\u00fc en geni\u015f alana yay\u0131lan k\u00fclt\u00fcrd\u00fcr; at ve demir bu k\u00fclt\u00fcrde i\u015flenmi\u015ftir. Anav en eski, Tagar ise en geli\u015fmi\u015f k\u00fclt\u00fcrd\u00fcr.' },
        { q:'Kavimler G\u00f6\u00e7\u00fc\'n\u00fcn sonu\u00e7lar\u0131 aras\u0131nda a\u015fa\u011f\u0131dakilerden hangisi yer **almaz**?',
          c:['Roma \u0130mparatorlu\u011fu ikiye ayr\u0131lm\u0131\u015ft\u0131r.','Avrupa\'da feodalite (derebeylik) do\u011fmu\u015ftur.','\u0130lk \u00c7a\u011f kapanm\u0131\u015f, Orta \u00c7a\u011f ba\u015flam\u0131\u015ft\u0131r.','Co\u011frafi ke\u015fifler ba\u015flam\u0131\u015ft\u0131r.'],
          d:3, a:'Co\u011frafi ke\u015fifler 15. y\u00fczy\u0131lda ba\u015flam\u0131\u015ft\u0131r ve Kavimler G\u00f6\u00e7\u00fc ile ilgisi yoktur. Di\u011fer \u00fc\u00e7\u00fc g\u00f6\u00e7\u00fcn do\u011frudan sonu\u00e7lar\u0131d\u0131r.' },
        { q:'T\u00fcrklerin Orta Asya\'dan g\u00f6\u00e7 etmelerinin sebepleri aras\u0131nda a\u015fa\u011f\u0131dakilerden hangisi g\u00f6sterile**mez**?',
          c:['Kurakl\u0131k ve otlaklar\u0131n yetersiz kalmas\u0131','N\u00fcfusun artmas\u0131','\u00c7in bask\u0131s\u0131 ve boylar aras\u0131 m\u00fccadele','Deniz ticaretini ele ge\u00e7irme iste\u011fi'],
          d:3, a:'Konarg\u00f6\u00e7er T\u00fcrk topluluklar\u0131n\u0131n deniz ticareti gibi bir amac\u0131 yoktu. G\u00f6\u00e7 sebepleri iklim, n\u00fcfus, siyasi bask\u0131 ve ba\u011f\u0131ms\u0131zl\u0131k tutkusuyla ilgilidir.' },
        { q:'D\u00fczenli ordu te\u015fkilat\u0131n\u0131 kuran ve onluk sistemi uygulayan T\u00fcrk h\u00fck\u00fcmdar\u0131 kimdir?',
          c:['Attila','Mete Han','Bilge Ka\u011fan','Bumin Ka\u011fan'], d:1,
          a:'Asya Hun h\u00fck\u00fcmdar\u0131 Mete Han, orduyu onluk sisteme g\u00f6re \u00f6rg\u00fctleyerek d\u00fczenli T\u00fcrk ordusunun temelini atm\u0131\u015ft\u0131r.' },
        { q:'A\u015fa\u011f\u0131daki destan-devlet e\u015fle\u015ftirmelerinden hangisi **yanl\u0131\u015ft\u0131r**?',
          c:['O\u011fuz Ka\u011fan Destan\u0131 \u2013 Hunlar','Ergenekon Destan\u0131 \u2013 G\u00f6kt\u00fcrkler','Manas Destan\u0131 \u2013 Uygurlar','Alp Er Tunga Destan\u0131 \u2013 \u0130skitler'],
          d:2, a:'Manas Destan\u0131 K\u0131rg\u0131zlara aittir ve d\u00fcnyan\u0131n en uzun destan\u0131d\u0131r. Uygurlar\u0131n destanlar\u0131 T\u00fcreyi\u015f ve G\u00f6\u00e7\'t\u00fcr.' },
        { q:'Bizans\'a Margos ve Anatolius antla\u015fmalar\u0131n\u0131 kabul ettirerek vergiye ba\u011flayan T\u00fcrk devleti hangisidir?',
          c:['Asya Hun Devleti','Avrupa Hun Devleti','I. G\u00f6kt\u00fcrk Devleti','Avarlar'],
          d:1, a:'Avrupa Hun Devleti, Attila d\u00f6neminde Bizans\'a \u00f6nce Margos (434), sonra Anatolius (447) antla\u015fmalar\u0131n\u0131 kabul ettirmi\u015ftir.' }
      ]}
    ]},

  /* ========= 2 ========= */
  { id:'islamiyet-oncesi-kultur', ad:'\u0130slamiyet \u00d6ncesi T\u00fcrklerde K\u00fclt\u00fcr ve Medeniyet', soru:'1 soru', durum:'hazir',
    ozet:'Kavram sorusu gelir: kut, t\u00f6re, kurultay, balbal, \u00fcl\u00fc\u015f. Kavram\u0131 bilen soruyu bilir.',
    bloklar:[
      { t:'tablo', b:'Devlet ve toplum yap\u0131s\u0131', h:['Kavram','Anlam\u0131'], r:[
        ['**Kut**','Y\u00f6netme yetkisinin **Tanr\u0131 taraf\u0131ndan** verildi\u011fi inanc\u0131. Kan yoluyla ge\u00e7ti\u011fi i\u00e7in **taht kavgalar\u0131na** yol a\u00e7t\u0131.'],
        ['**Ka\u011fan / Hakan**','Devletin ba\u015f\u0131. Di\u011fer unvanlar: \u015fany\u00fc, tanhu, idikut, ilteber, yabgu.'],
        ['**Kurultay (Toy)**','Devlet meclisi. Kararlar\u0131 **tavsiye niteli\u011finde**, h\u00fck\u00fcmdar\u0131 ba\u011flamaz. Hatun da kat\u0131labilir.'],
        ['**T\u00f6re**','**Yaz\u0131s\u0131z** hukuk kurallar\u0131. H\u00fck\u00fcmdar d\u00e2hil herkes t\u00f6reye uymak zorundad\u0131r.'],
        ['**\u0130kili te\u015fkilat (\u00fcl\u00fc\u015f)**','\u00dclkenin **do\u011fu (sol) \u2013 bat\u0131 (sa\u011f)** olarak y\u00f6netilmesi. Do\u011fu \u00fcst\u00fcnd\u00fcr.'],
        ['**Boy d\u00fczeni**','Ogu\u015f (aile) \u2192 Urug \u2192 Boy \u2192 Budun (millet) \u2192 \u0130l (devlet)'],
        ['**Balbal**','\u00d6lenin **\u00f6ld\u00fcrd\u00fc\u011f\u00fc d\u00fc\u015fman say\u0131s\u0131nca** mezar\u0131na dikilen ta\u015f.'],
        ['**Kurgan**','Yer alt\u0131na yap\u0131lan **mezar odas\u0131**.'],
        ['**Yu\u011f**','\u00d6l\u00fc g\u00f6mme t\u00f6reni.']
      ]},
      { t:'ozet', b:'Din, yaz\u0131, sanat ve ekonomi', i:[
        '**G\u00f6k Tanr\u0131 inanc\u0131**: tek tanr\u0131l\u0131; ahiret inanc\u0131 vard\u0131r (*u\u00e7ma\u011f* = cennet, *tamu* = cehennem). **\u015eamanizm bir din de\u011fildir**, \u015eaman (Kam) bir din adam\u0131 tipidir.',
        '**Benimsenen dinler**: Uygurlar \u2192 Mani ve Budizm \u00b7 Hazarlar \u2192 Musevilik \u00b7 Tuna Bulgarlar\u0131 \u2192 Hristiyanl\u0131k \u00b7 \u0130dil Bulgarlar\u0131 ve Karluklar \u2192 \u0130slamiyet',
        '**G\u00f6kt\u00fcrk alfabesi 38 harf**, **Uygur alfabesi 18 harf**.',
        '**Orhun Yaz\u0131tlar\u0131**: 8. y\u00fczy\u0131l, II. G\u00f6kt\u00fcrk. Yazan **Yollu\u011f Tigin**; 1893\'te Danimarkal\u0131 **Thomsen** \u00e7\u00f6zd\u00fc. **T\u00fcrk\u00e7enin ilk yaz\u0131l\u0131 belgesi** ve ilk siyasi metnidir; halka hesap verme anlay\u0131\u015f\u0131n\u0131 yans\u0131t\u0131r.',
        '**Paz\u0131r\u0131k Hal\u0131s\u0131**: Altaylar\'da bulunan, **d\u00fcnyan\u0131n bilinen en eski hal\u0131s\u0131**.',
        '**12 Hayvanl\u0131 T\u00fcrk Takvimi**: **g\u00fcne\u015f y\u0131l\u0131** esasl\u0131d\u0131r.',
        '**Ekonomi**: konarg\u00f6\u00e7er hayvanc\u0131l\u0131k, dokumac\u0131l\u0131k, madencilik, **\u0130pek Yolu** ticareti. Toprakta **\u00f6zel m\u00fclkiyet** vard\u0131r.',
        '**Kad\u0131n\u0131n konumu g\u00fc\u00e7l\u00fcd\u00fcr**: hatun kurultaya kat\u0131l\u0131r, el\u00e7i kabul eder, devlet i\u015flerinde s\u00f6z sahibidir.'
      ]},
      { t:'kod', b:'Haf\u0131za kodu', x:'**Kut = koltuk.** Tanr\u0131\'n\u0131n verdi\u011fi koltuk **kanla** ge\u00e7er \u2192 hanedan\u0131n her erke\u011fi hak sahibi \u2192 **taht kavgas\u0131**. T\u00fcrk devletlerinin k\u0131sa \u00f6m\u00fcrl\u00fc olmas\u0131n\u0131n bir numaral\u0131 sebebi budur.' },
      { t:'tuzak', i:[
        '**\u015eamanizm bir din de\u011fildir.** T\u00fcrklerin dini **G\u00f6k Tanr\u0131** inanc\u0131d\u0131r.',
        '**Kurultay kararlar\u0131 ba\u011flay\u0131c\u0131 de\u011fildir.** Meclis vard\u0131r ama modern anlamda demokrasi yoktur.',
        '**T\u00f6re yaz\u0131s\u0131z olmas\u0131na ra\u011fmen h\u00fck\u00fcmdar\u0131 da ba\u011flar.**',
        '**Konarg\u00f6\u00e7erlik "s\u00fcrekli gezmek" demek de\u011fildir**; yazlak ve k\u0131\u015flak aras\u0131nda belirli bir d\u00fczende hareket edilir.',
        '**T\u00fcrklerde ahiret inanc\u0131 vard\u0131r** \u2014 mezara e\u015fya konulmas\u0131 ve balbal gelene\u011fi bunu g\u00f6sterir.',
        '**Orhun Yaz\u0131tlar\u0131\'nda ka\u011fan halka hesap verir**; bu, "devlet-millet kayna\u015fmas\u0131" ve "halk\u00e7\u0131l\u0131k" \u00f6rne\u011fi olarak sorulur.'
      ]},
      { t:'test', s:[
        { q:'T\u00fcrklerde h\u00fck\u00fcmdar\u0131n y\u00f6netme yetkisini Tanr\u0131\'dan ald\u0131\u011f\u0131 inanc\u0131na ne ad verilir?',
          c:['T\u00f6re','Kut','Yu\u011f','\u00dcl\u00fc\u015f'], d:1,
          a:'Kut inanc\u0131, y\u00f6netme yetkisinin Tanr\u0131 taraf\u0131ndan verildi\u011fini ifade eder; kan yoluyla ge\u00e7ti\u011fi i\u00e7in taht kavgalar\u0131na yol a\u00e7m\u0131\u015ft\u0131r.' },
        { q:'Orhun Yaz\u0131tlar\u0131 ile ilgili a\u015fa\u011f\u0131dakilerden hangisi **yanl\u0131\u015ft\u0131r**?',
          c:['II. G\u00f6kt\u00fcrk Devleti d\u00f6neminde dikilmi\u015ftir.','T\u00fcrk\u00e7enin ilk yaz\u0131l\u0131 belgeleri say\u0131l\u0131r.','Uygur alfabesiyle yaz\u0131lm\u0131\u015ft\u0131r.','Yollu\u011f Tigin taraf\u0131ndan kaleme al\u0131nm\u0131\u015ft\u0131r.'],
          d:2, a:'Yaz\u0131tlar G\u00f6kt\u00fcrk alfabesiyle yaz\u0131lm\u0131\u015ft\u0131r. 1893\'te Danimarkal\u0131 bilim insan\u0131 Thomsen taraf\u0131ndan \u00e7\u00f6z\u00fclm\u00fc\u015ft\u00fcr.' },
        { q:'\u00d6len ki\u015finin sa\u011fl\u0131\u011f\u0131nda \u00f6ld\u00fcrd\u00fc\u011f\u00fc d\u00fc\u015fman say\u0131s\u0131nca mezar\u0131na dikilen ta\u015flara ne ad verilir?',
          c:['Kurgan','Balbal','Yu\u011f','Damga'], d:1,
          a:'Balbal, \u00f6lenin \u00f6ld\u00fcrd\u00fc\u011f\u00fc d\u00fc\u015fman say\u0131s\u0131nca dikilen ta\u015flard\u0131r; kurgan ise mezar\u0131n kendisidir.' },
        { q:'"T\u00fcrklerde kurultay ad\u0131 verilen bir meclis bulunmakta, kararlar burada g\u00f6r\u00fc\u015f\u00fclmektedir." Bu bilgiye dayanarak a\u015fa\u011f\u0131dakilerden hangisi **s\u00f6ylenemez**?',
          c:['Devlet i\u015flerinde dan\u0131\u015fma gelene\u011fi vard\u0131r.','Hatunlar kurultaya kat\u0131labilir.','Kurultay kararlar\u0131 h\u00fck\u00fcmdar\u0131 ba\u011flay\u0131c\u0131d\u0131r.','Y\u00f6netimde tek ki\u015finin s\u00f6z\u00fc mutlak de\u011fildir.'],
          d:2, a:'Kurultay kararlar\u0131 tavsiye niteli\u011findedir; h\u00fck\u00fcmdar\u0131 hukuken ba\u011flamaz. Bu nedenle kurultay\u0131n varl\u0131\u011f\u0131 modern anlamda demokrasi g\u00f6stergesi say\u0131lmaz.' },
        { q:'T\u00fcrklerin ahiret inanc\u0131na sahip oldu\u011funun kan\u0131t\u0131 olarak a\u015fa\u011f\u0131dakilerden hangisi g\u00f6sterilebilir?',
          c:['Mezarlara \u00f6l\u00fcn\u00fcn e\u015fyalar\u0131n\u0131n konulmas\u0131','Kurultay\u0131n toplanmas\u0131','\u0130kili te\u015fkilat uygulamas\u0131','Onluk sistemin kullan\u0131lmas\u0131'],
          d:0, a:'\u00d6l\u00fcn\u00fcn e\u015fyalar\u0131yla birlikte g\u00f6m\u00fclmesi ve balbal gelene\u011fi, \u00f6ld\u00fckten sonra bir hayata inan\u0131ld\u0131\u011f\u0131n\u0131 g\u00f6sterir.' },
        { q:'D\u00fcnyan\u0131n bilinen en eski hal\u0131s\u0131 olarak kabul edilen ve Altay Da\u011flar\u0131\'nda bulunan eser hangisidir?',
          c:['K\u00fcltigin Yaz\u0131t\u0131','Paz\u0131r\u0131k Hal\u0131s\u0131','Codex Cumanicus','Karabalgasun Yaz\u0131t\u0131'],
          d:1, a:'Paz\u0131r\u0131k Kurgan\u0131\'nda bulunan hal\u0131, d\u00fcnyan\u0131n bilinen en eski hal\u0131s\u0131d\u0131r ve \u0130skit (Saka) d\u00f6nemine aittir.' },
        { q:'\u0130slamiyet \u00f6ncesi T\u00fcrklerde kullan\u0131lan 12 Hayvanl\u0131 T\u00fcrk Takvimi ile ilgili a\u015fa\u011f\u0131dakilerden hangisi do\u011frudur?',
          c:['Ay y\u0131l\u0131 esasl\u0131d\u0131r.','G\u00fcne\u015f y\u0131l\u0131 esasl\u0131d\u0131r.','Hicri takvimin devam\u0131d\u0131r.','Yaln\u0131z Uygurlarca kullan\u0131lm\u0131\u015ft\u0131r.'],
          d:1, a:'12 Hayvanl\u0131 T\u00fcrk Takvimi g\u00fcne\u015f y\u0131l\u0131 esasl\u0131d\u0131r ve her y\u0131l bir hayvan ad\u0131yla an\u0131l\u0131r.' },
        { q:'T\u00fcrk devletlerinin k\u0131sa \u00f6m\u00fcrl\u00fc olmas\u0131n\u0131n en \u00f6nemli sebebi a\u015fa\u011f\u0131dakilerden hangisidir?',
          c:['Yaz\u0131l\u0131 hukukun bulunmamas\u0131','Kut anlay\u0131\u015f\u0131ndan kaynaklanan taht kavgalar\u0131','Tar\u0131mla u\u011fra\u015f\u0131lmamas\u0131','\u0130pek Yolu\'nun denetlenememesi'],
          d:1, a:'Kut\'un kan yoluyla ge\u00e7ti\u011fi inanc\u0131, hanedan\u0131n t\u00fcm erkek \u00fcyelerini hak sahibi k\u0131ld\u0131\u011f\u0131 i\u00e7in s\u00fcrekli taht m\u00fccadelelerine yol a\u00e7m\u0131\u015ft\u0131r.' },
        { q:'A\u015fa\u011f\u0131dakilerden hangisi \u0130slamiyet \u00f6ncesi T\u00fcrklerde kad\u0131n\u0131n toplumsal konumunun g\u00fc\u00e7l\u00fc oldu\u011funu g\u00f6stermez?',
          c:['Hatunun kurultaya kat\u0131lmas\u0131','Hatunun el\u00e7i kabul edebilmesi','Devlet belgelerinde hatunun ad\u0131n\u0131n ge\u00e7mesi','Taht kavgalar\u0131n\u0131n ya\u015fanmas\u0131'],
          d:3, a:'Taht kavgalar\u0131 kut anlay\u0131\u015f\u0131n\u0131n sonucudur ve kad\u0131n\u0131n konumuyla ilgili de\u011fildir. Di\u011fer \u00fc\u00e7\u00fc kad\u0131n\u0131n y\u00f6netimde etkili oldu\u011funu g\u00f6sterir.' },
        { q:'\u0130slamiyet \u00f6ncesi T\u00fcrklerde uygulanan ikili te\u015fkilat neyi ifade eder?',
          c:['Ordunun onluk sisteme g\u00f6re b\u00f6l\u00fcnmesini','\u00dclkenin do\u011fu ve bat\u0131 olarak y\u00f6netilmesini','Hukukun yaz\u0131l\u0131 ve yaz\u0131s\u0131z olarak ikiye ayr\u0131lmas\u0131n\u0131','Yazlak ve k\u0131\u015flak aras\u0131nda g\u00f6\u00e7 edilmesini'],
          d:1, a:'\u0130kili (\u00fcl\u00fc\u015f) te\u015fkilatta \u00fclke do\u011fu ve bat\u0131 olarak ikiye ayr\u0131l\u0131r; do\u011fuyu y\u00f6neten \u00fcst\u00fcn say\u0131l\u0131r.' },
        { q:'T\u00fcrklerde toplumsal \u00f6rg\u00fctlenmenin en k\u00fc\u00e7\u00fck biriminden en b\u00fcy\u00fc\u011f\u00fcne do\u011fru s\u0131ralamas\u0131 hangisinde do\u011fru verilmi\u015ftir?',
          c:['Boy \u2013 Ogu\u015f \u2013 Urug \u2013 Budun \u2013 \u0130l','Ogu\u015f \u2013 Urug \u2013 Boy \u2013 Budun \u2013 \u0130l','Urug \u2013 Ogu\u015f \u2013 Budun \u2013 Boy \u2013 \u0130l','Ogu\u015f \u2013 Boy \u2013 Urug \u2013 \u0130l \u2013 Budun'],
          d:1, a:'Do\u011fru s\u0131ralama: Ogu\u015f (aile) \u2192 Urug (soy) \u2192 Boy \u2192 Budun (millet) \u2192 \u0130l (devlet).' },
        { q:'Uygurlar\u0131n yerle\u015fik hayata ge\u00e7mesinin sonu\u00e7lar\u0131 aras\u0131nda a\u015fa\u011f\u0131dakilerden hangisi g\u00f6sterile**mez**?',
          c:['\u015eehir ve tap\u0131naklar\u0131n kurulmas\u0131','K\u00e2\u011f\u0131t ve matbaan\u0131n kullan\u0131lmas\u0131','Asker\u00ee g\u00fc\u00e7lerinin zay\u0131flamas\u0131','\u0130lk T\u00fcrk paras\u0131n\u0131n bas\u0131lmas\u0131'],
          d:3, a:'\u0130lk T\u00fcrk paras\u0131n\u0131 T\u00fcrgi\u015fler basm\u0131\u015ft\u0131r. Yerle\u015fik hayat Uygurlarda mimari, yaz\u0131 ve ticareti geli\u015ftirmi\u015f ancak sava\u015f\u00e7\u0131l\u0131klar\u0131n\u0131 zay\u0131flatm\u0131\u015ft\u0131r.' }
      ]}
    ]},

  /* ========= 3 ========= */
  { id:'ilk-turk-islam', ad:'\u0130lk T\u00fcrk-\u0130slam Devletleri', soru:'1\u20132 soru', durum:'hazir',

    bloklar:[
      { t:'zaman', b:'Zaman \u015feridi', z:[
        { y:'751', o:'Talas Sava\u015f\u0131', d:'**Abbasiler + Karluklar, \u00c7in\'e kar\u015f\u0131.** T\u00fcrklerin \u0130slamla\u015fmas\u0131nda **d\u00f6n\u00fcm noktas\u0131**. **K\u00e2\u011f\u0131t** \u00c7in d\u0131\u015f\u0131na ilk kez yay\u0131ld\u0131.' },
        { y:'840 \u2013 1212', o:'Karahanl\u0131lar', d:'**\u0130lk M\u00fcsl\u00fcman T\u00fcrk devleti.** **Satuk Bu\u011fra Han** \u0130slamiyet\'i kabul etti (Abdulkerim ad\u0131n\u0131 ald\u0131). **T\u00fcrk\u00e7eyi resm\u00ee dil yapan tek** T\u00fcrk-\u0130slam devleti; ilk T\u00fcrk\u00e7e \u0130slami eserler burada yaz\u0131ld\u0131. \u0130lk **kervansaray (ribat)** ve ilk T\u00fcrk-\u0130slam paras\u0131.' },
        { y:'963 \u2013 1187', o:'Gazneliler', d:'Kurucu **Alptigin**. **Gazneli Mahmud** \u2014 Hindistan\'a 17 sefer, Somnat Tap\u0131na\u011f\u0131, **"Sultan" unvan\u0131n\u0131 ilk kullanan** T\u00fcrk h\u00fck\u00fcmdar\u0131. Resm\u00ee dil Arap\u00e7a ve Fars\u00e7ad\u0131r.' },
        { y:'1040', o:'Dandanakan Sava\u015f\u0131', d:'Sel\u00e7uklular Gaznelileri yendi. **B\u00fcy\u00fck Sel\u00e7uklu Devleti resmen kuruldu**, Gazneliler y\u0131k\u0131l\u0131\u015f s\u00fcrecine girdi.' },
        { y:'1048', o:'Pasinler Sava\u015f\u0131', d:'Sel\u00e7uklular\u0131n **Bizans ile ilk b\u00fcy\u00fck sava\u015f\u0131** \u2014 \u0130brahim Y\u0131nal ve Kutalm\u0131\u015f komutas\u0131nda kazan\u0131ld\u0131.' },
        { y:'1055', o:'Tu\u011frul Bey\'in Ba\u011fdat Seferi', d:'\u015eii B\u00fcveyho\u011fullar\u0131 ve **Arslan Besasiri** tehlikesi ortadan kald\u0131r\u0131ld\u0131. Abbasi halifesi Tu\u011frul Bey\'e **"Do\u011fu\'nun ve Bat\u0131\'n\u0131n H\u00fck\u00fcmdar\u0131"** unvan\u0131n\u0131 verdi.' },
        { y:'1071', o:'Malazgirt Sava\u015f\u0131', d:'**Alparslan \u2013 Romen Diyojen.** **Anadolu\'nun kap\u0131lar\u0131 T\u00fcrklere a\u00e7\u0131ld\u0131**; Anadolu\'da ilk T\u00fcrk beylikleri kuruldu.' },
        { y:'1092', o:'Melik\u015fah d\u00f6nemi ve sonras\u0131', d:'Devletin **en parlak d\u00f6nemi**. Vezir **Nizam\u00fclm\u00fclk**, **Nizamiye Medreseleri**, **Celali Takvimi**. \u00d6l\u00fcm\u00fcnden sonra taht kavgalar\u0131 ve **Bat\u0131nilik** sorunu.' },
        { y:'1141', o:'Katvan Sava\u015f\u0131', d:'Sultan **Sencer**, Karahitaylara yenildi; B\u00fcy\u00fck Sel\u00e7uklu\'nun da\u011f\u0131l\u0131\u015f\u0131 h\u0131zland\u0131. **Sencer (1118-1157) son B\u00fcy\u00fck Sel\u00e7uklu sultan\u0131d\u0131r.**' }
      ]},
      { t:'tablo', b:'\u0130lk T\u00fcrk\u00e7e \u0130slami eserler (hepsi Karahanl\u0131 d\u00f6nemi)', h:['Eser','Yazar','\u00d6zellik'], r:[
        ['**Kutadgu Bilig**','Yusuf Has Hacib','"Mutluluk veren bilgi" \u2014 ilk T\u00fcrk-\u0130slam **siyasetnamesi**. **Tabga\u00e7 Bu\u011fra Han\'a** sunuldu.'],
        ['**Divan\u00fc L\u00fcgati\'t-T\u00fcrk**','Ka\u015fgarl\u0131 Mahmud','**\u0130lk T\u00fcrk\u00e7e s\u00f6zl\u00fck ve ansiklopedi**; Araplara T\u00fcrk\u00e7e \u00f6\u011fretmek i\u00e7in yaz\u0131ld\u0131.'],
        ['**Atabet\u00fc\'l Hakay\u0131k**','Edip Ahmet Y\u00fckneki','Ahlak ve \u00f6\u011f\u00fct kitab\u0131.'],
        ['**Divan-\u0131 Hikmet**','Ahmet Yesevi','**\u0130lk tasavvufi T\u00fcrk\u00e7e eser**; Anadolu\'nun T\u00fcrkle\u015fmesinde etkili oldu.']
      ]},
      { t:'tablo', b:'Di\u011fer T\u00fcrk-\u0130slam devletleri', h:['Devlet','\u00d6zellik'], r:[
        ['**Toluno\u011fullar\u0131**','**M\u0131s\u0131r\'da kurulan ilk T\u00fcrk devleti** (868).'],

        ['**Eyyubiler**','Selahaddin Eyyubi \u2014 **H\u0131ttin Sava\u015f\u0131 (1187)** ile Kud\u00fcs al\u0131nd\u0131.'],
        ['**Meml\u00fckler**','**Ayn Calut (1260)** ile Mo\u011follar\u0131 durdurdular. H\u00fck\u00fcmdarl\u0131k **babadan o\u011fula ge\u00e7mezdi**.'],
        ['**Harzem\u015fahlar**','**Yass\u0131\u00e7emen (1230)** ile T\u00fcrkiye Sel\u00e7uklu\'ya yenildiler; Mo\u011follara kar\u015f\u0131 tampon devlet ortadan kalkt\u0131.'],

      { t:'kod', b:'Haf\u0131za kodu', x:'**\u00dc\u00e7 sava\u015f, \u00fc\u00e7 kap\u0131:** **Talas 751** \u2192 \u0130slam\'\u0131n kap\u0131s\u0131 \u00b7 **Dandanakan 1040** \u2192 devletin kap\u0131s\u0131 \u00b7 **Malazgirt 1071** \u2192 Anadolu\'nun kap\u0131s\u0131. **Miryokefalon 1176** kap\u0131y\u0131 *kilitler*.' },
      { t:'tuzak', i:[

        '**\u0130lk M\u00fcsl\u00fcman T\u00fcrk devleti Karahanl\u0131lar**\'d\u0131r. **M\u0131s\u0131r\'da kurulan ilk T\u00fcrk devleti** ise **Toluno\u011fullar\u0131**\'d\u0131r \u2014 soru hangisini soruyor, dikkat.',
        '**Karahanl\u0131lar T\u00fcrk\u00e7eyi resm\u00ee dil yapan tek** T\u00fcrk-\u0130slam devletidir. Gazneli ve Sel\u00e7uklularda bilim dili Arap\u00e7a, edebiyat ve devlet dili Fars\u00e7ad\u0131r.',
        '**"Sultan" unvan\u0131n\u0131 ilk kullanan** Gazneli Mahmud\'dur; "Do\u011fu\'nun ve Bat\u0131\'n\u0131n H\u00fck\u00fcmdar\u0131" unvan\u0131n\u0131 alan ise **Tu\u011frul Bey**\'dir.',
        '**B\u00fcy\u00fck Sel\u00e7uklu\'nun son sultan\u0131 Sencer**\'dir (1118-1157).',
        '**Meml\u00fcklerde h\u00fck\u00fcmdarl\u0131k babadan o\u011fula ge\u00e7mezdi**; en g\u00fc\u00e7l\u00fc ve becerikli komutan sultan olurdu. Bu, \u00fclkede s\u00fcrekli i\u00e7 m\u00fccadeleye yol a\u00e7t\u0131.'
      ]},
      { t:'test', s:[
        { q:'T\u00fcrklerin \u0130slamiyet\'i kabul s\u00fcrecinde d\u00f6n\u00fcm noktas\u0131 say\u0131lan 751 tarihli sava\u015f hangisidir?',
          c:['Talas Sava\u015f\u0131','Dandanakan Sava\u015f\u0131','Pasinler Sava\u015f\u0131','Katvan Sava\u015f\u0131'], d:0,
          a:'751\'deki Talas Sava\u015f\u0131\'nda Karluk T\u00fcrkleri Abbasilerin yan\u0131nda yer alm\u0131\u015f, bu yak\u0131nla\u015fma T\u00fcrklerin kitleler h\u00e2linde \u0130slamiyet\'i kabul etmesinin ba\u015flang\u0131c\u0131 olmu\u015ftur.' },
        { q:'Arslan Besasiri tehlikesini ortadan kald\u0131rmas\u0131 \u00fczerine Abbasi halifesi taraf\u0131ndan "Do\u011fu\'nun ve Bat\u0131\'n\u0131n H\u00fck\u00fcmdar\u0131" unvan\u0131 verilen T\u00fcrk-\u0130slam h\u00fck\u00fcmdar\u0131 kimdir?',
          c:['Alparslan','Tu\u011frul Bey','Gazneli Mahmud','Melik\u015fah'], d:1,
          a:'Tu\u011frul Bey 1055\'teki Ba\u011fdat Seferi ile halifeyi \u015eii B\u00fcveyho\u011fullar\u0131 ve Besasiri bask\u0131s\u0131ndan kurtarm\u0131\u015f, kar\u015f\u0131l\u0131\u011f\u0131nda bu unvan\u0131 alm\u0131\u015ft\u0131r.' },
        { q:'1118-1157 y\u0131llar\u0131 aras\u0131nda h\u00fck\u00fcmdarl\u0131k yapm\u0131\u015f olan ve B\u00fcy\u00fck Sel\u00e7uklu Devleti\'nin son sultan\u0131 olarak bilinen ki\u015fi kimdir?',
          c:['Melik\u015fah','Berkyaruk','Sencer','Muhammed Tapar'], d:2,
          a:'Sultan Sencer, B\u00fcy\u00fck Sel\u00e7uklu\'nun son sultan\u0131d\u0131r; Katvan Sava\u015f\u0131\'nda (1141) Karahitaylara yenilmesi da\u011f\u0131lmay\u0131 h\u0131zland\u0131rm\u0131\u015ft\u0131r.' },
        { q:'Yusuf Has Hacib, Kutadgu Bilig adl\u0131 eserini hangi T\u00fcrk devleti d\u00f6neminde ve kime takdim etmi\u015ftir?',
          c:['Gazneliler \u2013 Gazneli Mahmud','Karahanl\u0131lar \u2013 Tabga\u00e7 Bu\u011fra Han','B\u00fcy\u00fck Sel\u00e7uklu \u2013 Melik\u015fah','T\u00fcrkiye Sel\u00e7uklu \u2013 I. Alaeddin Keykubat'], d:1,
          a:'Kutadgu Bilig, T\u00fcrk\u00e7eyi resm\u00ee dil olarak kullanan Karahanl\u0131lar d\u00f6neminde yaz\u0131lm\u0131\u015f ve Tabga\u00e7 Bu\u011fra Han\'a sunulmu\u015ftur.' },
        { q:'M\u0131s\u0131r\'da kurulan ilk T\u00fcrk devleti a\u015fa\u011f\u0131dakilerden hangisidir?',
          c:['\u0130h\u015fidiler','Toluno\u011fullar\u0131','Eyyubiler','Meml\u00fckler'], d:1,
          a:'868 y\u0131l\u0131nda Toluno\u011fullar\u0131 M\u0131s\u0131r\'da kurulan ilk T\u00fcrk devletidir. \u0130h\u015fidiler ikinci, Meml\u00fckler ise daha sonraki T\u00fcrk devletleridir.' },
        { q:'"Sultan" unvan\u0131n\u0131 ilk kez kullanan T\u00fcrk-\u0130slam h\u00fck\u00fcmdar\u0131 kimdir?',
          c:['Satuk Bu\u011fra Han','Gazneli Mahmud','Tu\u011frul Bey','Alparslan'], d:1,
          a:'Gazneli Mahmud, Hindistan seferleri sonras\u0131nda halife taraf\u0131ndan "Sultan" unvan\u0131yla an\u0131lm\u0131\u015f ve bu unvan\u0131 kullanan ilk T\u00fcrk h\u00fck\u00fcmdar\u0131 olmu\u015ftur.' },
        { q:'A\u015fa\u011f\u0131dakilerden hangisi Karahanl\u0131lar D\u00f6nemi\'nde yaz\u0131lan eserlerden biri **de\u011fildir**?',
          c:['Kutadgu Bilig','Divan\u00fc L\u00fcgati\'t-T\u00fcrk','Atabet\u00fc\'l Hakay\u0131k','Siyasetname'],
          d:3, a:'Siyasetname, B\u00fcy\u00fck Sel\u00e7uklu veziri Nizam\u00fclm\u00fclk taraf\u0131ndan yaz\u0131lm\u0131\u015ft\u0131r. Di\u011fer \u00fc\u00e7\u00fc Karahanl\u0131 d\u00f6nemi T\u00fcrk\u00e7e eserleridir.' },
        { q:'B\u00fcy\u00fck Sel\u00e7uklu Devleti\'nin kurulu\u015funu resmen sa\u011flayan sava\u015f a\u015fa\u011f\u0131dakilerden hangisidir?',
          c:['Pasinler Sava\u015f\u0131','Dandanakan Sava\u015f\u0131','Malazgirt Sava\u015f\u0131','Katvan Sava\u015f\u0131'],
          d:1, a:'1040\'taki Dandanakan Sava\u015f\u0131 ile Sel\u00e7uklular Gaznelileri yenmi\u015f ve B\u00fcy\u00fck Sel\u00e7uklu Devleti resmen kurulmu\u015ftur.' },
        { q:'Sel\u00e7uklular\u0131n Bizans ile yapt\u0131\u011f\u0131 ilk b\u00fcy\u00fck sava\u015f hangisidir?',
          c:['Pasinler Sava\u015f\u0131','Malazgirt Sava\u015f\u0131','Miryokefalon Sava\u015f\u0131','Yass\u0131\u00e7emen Sava\u015f\u0131'],
          d:0, a:'1048\'deki Pasinler Sava\u015f\u0131, Sel\u00e7uklular\u0131n Bizans ile yapt\u0131\u011f\u0131 ilk b\u00fcy\u00fck sava\u015ft\u0131r.' },
        { q:'Meml\u00fck Devleti\'nde h\u00fck\u00fcmdarl\u0131\u011f\u0131n babadan o\u011fula ge\u00e7memesi a\u015fa\u011f\u0131dakilerden hangisine yol a\u00e7m\u0131\u015ft\u0131r?',
          c:['Devletin uzun \u00f6m\u00fcrl\u00fc olmas\u0131na','S\u00fcrekli i\u00e7 m\u00fccadele ya\u015fanmas\u0131na','Merkez\u00ee otoritenin g\u00fc\u00e7lenmesine','Ticaretin geli\u015fmesine'],
          d:1, a:'Meml\u00fcklerde en g\u00fc\u00e7l\u00fc komutan\u0131n sultan olmas\u0131 ilkesi, hanedan gelene\u011fi olu\u015fmas\u0131n\u0131 engellemi\u015f ve s\u00fcrekli i\u00e7 m\u00fccadeleye yol a\u00e7m\u0131\u015ft\u0131r.' },
        { q:'Mo\u011follar\u0131n Suriye ve M\u0131s\u0131r y\u00f6n\u00fcndeki ilerleyi\u015fini durduran 1260 tarihli sava\u015f hangisidir?',
          c:['K\u00f6seda\u011f Sava\u015f\u0131','Yass\u0131\u00e7emen Sava\u015f\u0131','Ayn Calut Sava\u015f\u0131','Katvan Sava\u015f\u0131'],
          d:2, a:'Meml\u00fckler, 1260 Ayn Calut Sava\u015f\u0131\'nda Mo\u011follar\u0131 yenerek onlar\u0131n bat\u0131ya do\u011fru ilerleyi\u015fini durdurmu\u015ftur.' },
        { q:'Talas Sava\u015f\u0131\'n\u0131n sonu\u00e7lar\u0131 aras\u0131nda a\u015fa\u011f\u0131dakilerden hangisi yer **almaz**?',
          c:['T\u00fcrk-Arap yak\u0131nla\u015fmas\u0131n\u0131n ba\u015flamas\u0131','K\u00e2\u011f\u0131d\u0131n \u00c7in d\u0131\u015f\u0131na yay\u0131lmas\u0131','Orta Asya\'n\u0131n \u00c7in egemenli\u011fine girmesi','T\u00fcrklerin \u0130slamiyet\'i kabul s\u00fcrecinin h\u0131zlanmas\u0131'],
          d:2, a:'Talas Sava\u015f\u0131\'n\u0131 Abbasiler kazand\u0131\u011f\u0131 i\u00e7in Orta Asya \u00c7in egemenli\u011fine girmemi\u015f, aksine \u00c7in\'in b\u00f6lgedeki n\u00fcfuzu k\u0131r\u0131lm\u0131\u015ft\u0131r.' },
        { q:'\u0130slam d\u00fcnyas\u0131n\u0131n ilk d\u00fczenli ve devlet destekli medreseleri olan Nizamiye Medreseleri hangi devlet d\u00f6neminde kurulmu\u015ftur?',
          c:['Karahanl\u0131lar','Gazneliler','B\u00fcy\u00fck Sel\u00e7uklu','T\u00fcrkiye Sel\u00e7uklu'],
          d:2, a:'Nizamiye Medreseleri, B\u00fcy\u00fck Sel\u00e7uklu veziri Nizam\u00fclm\u00fclk taraf\u0131ndan Melik\u015fah d\u00f6neminde kurulmu\u015ftur.' },
        { q:'A\u015fa\u011f\u0131daki eser-yazar e\u015fle\u015ftirmelerinden hangisi **yanl\u0131\u015ft\u0131r**?',
          c:['Divan\u00fc L\u00fcgati\'t-T\u00fcrk \u2013 Ka\u015fgarl\u0131 Mahmud','Divan-\u0131 Hikmet \u2013 Ahmet Yesevi','Atabet\u00fc\'l Hakay\u0131k \u2013 Yusuf Has Hacib','Siyasetname \u2013 Nizam\u00fclm\u00fclk'],
          d:2, a:'Atabet\u00fc\'l Hakay\u0131k, Edip Ahmet Y\u00fckneki\'ye aittir. Yusuf Has Hacib ise Kutadgu Bilig\'in yazar\u0131d\u0131r.' }
      ]}
    ]},

  /* ========= 4 ========= */
  { id:'ilk-turk-islam-kultur', ad:'T\u00fcrk-\u0130slam Devletlerinde K\u00fclt\u00fcr ve Medeniyet', soru:'1 soru', durum:'hazir',
    ozet:'\u0130kta, atabeylik, medrese ve T\u00fcrk-\u0130slam bilginleri. \u0130sim-alan e\u015fle\u015ftirmesi do\u011frudan sorulur.',
    bloklar:[
      { t:'tablo', b:'Kurumlar ve kavramlar', h:['Kavram','Anlam\u0131'], r:[
        ['**\u0130kta sistemi**','Topra\u011f\u0131n **gelirinin** hizmet kar\u015f\u0131l\u0131\u011f\u0131 g\u00f6revliye verilmesi. **M\u00fclkiyet devlette kal\u0131r.** Osmanl\u0131 **t\u0131mar** sisteminin temelidir.'],
        ['**Atabeylik**','\u015eehzadelerin e\u011fitiminden sorumlu devlet adam\u0131. Merkez zay\u0131flay\u0131nca **ba\u011f\u0131ms\u0131z beylikler** kurdular.'],
        ['**Divan-\u0131 Saltanat**','B\u00fcy\u00fck Sel\u00e7uklu\'da devlet i\u015flerinin g\u00f6r\u00fc\u015f\u00fcld\u00fc\u011f\u00fc merkez divan. Alt divanlar: \u0130stifa (maliye), \u0130n\u015fa (yaz\u0131\u015fma), Arz (ordu), \u0130\u015fraf (denetim).'],
        ['**Nizamiye Medreseleri**','**Nizam\u00fclm\u00fclk** taraf\u0131ndan kuruldu. \u0130slam d\u00fcnyas\u0131n\u0131n **ilk d\u00fczenli, devlet destekli, burslu** medreseleri.'],
        ['**Gulam sistemi**','Saray i\u00e7in yeti\u015ftirilen askerler; **Osmanl\u0131 dev\u015firme sisteminin \u00f6nc\u00fcs\u00fc**.'],
        ['**Ahilik**','Anadolu\'da esnaf ve sanatk\u00e2r te\u015fkilat\u0131. Kurucusu **Ahi Evran**.'],
        ['**Ribat**','Kervan yollar\u0131 \u00fczerindeki korunakl\u0131 konaklama yap\u0131s\u0131; **kervansaray\u0131n \u00f6nc\u00fcs\u00fc**.']
      ]},
      { t:'tablo', b:'T\u00fcrk-\u0130slam bilginleri \u2014 isim ve alan', h:['Bilgin','Alan / Eser'], r:[
        ['**Farabi**','Felsefe ve mant\u0131k \u2014 **"Muallim-i Sani" (\u0130kinci \u00d6\u011fretmen)**'],
        ['**\u0130bn-i Sina**','T\u0131p \u2014 ***El-Kanun fi\'t-T\u0131b***; Bat\u0131\'da Avicenna ad\u0131yla y\u00fczy\u0131llarca okutuldu'],
        ['**Biruni**','Astronomi ve co\u011frafya \u2014 D\u00fcnya\'n\u0131n \u00e7ap\u0131n\u0131 hesaplad\u0131'],
        ['**Harezmi**','Matematik \u2014 **cebirin kurucusu**; "algoritma" ad\u0131ndan t\u00fcredi'],
        ['**\u00d6mer Hayyam**','Matematik ve astronomi \u2014 **Celali Takvimi**; *Rubailer*'],
        ['**Gazali**','Din ve felsefe \u2014 *\u0130hyau Ulumi\'d-Din*; Nizamiye\'de ders verdi, Bat\u0131nilikle m\u00fccadele etti'],
        ['**Ulu\u011f Bey**','Astronomi \u2014 Semerkant Rasathanesi (Timurlular d\u00f6nemi)']
      ]},
      { t:'kod', b:'Haf\u0131za kodu', x:'**\u0130kta \u2192 t\u0131mar \u00b7 Gulam \u2192 dev\u015firme \u00b7 Atabey \u2192 lala \u00b7 Ribat \u2192 kervansaray.** Sel\u00e7uklu\'daki her kurumun Osmanl\u0131\'da bir kar\u015f\u0131l\u0131\u011f\u0131 vard\u0131r; soru "hangisinin temelini olu\u015fturur" diye gelir.' },
      { t:'tuzak', i:[
        '**\u0130kta\'da topra\u011f\u0131n m\u00fclkiyeti devlete aittir**; g\u00f6revliye verilen yaln\u0131zca **gelirin kullan\u0131m hakk\u0131**d\u0131r. Avrupa feodalitesinden temel fark\u0131 budur.',
        '**Nizamiye Medreseleri\'ni Nizam\u00fclm\u00fclk kurdu**, Melik\u015fah de\u011fil. Melik\u015fah d\u00f6neminde kurulmu\u015ftur ama kurucu vezirdir.',
        '**\u0130bn-i Sina t\u0131p, Biruni astronomi, Harezmi matematik, Farabi felsefe.** \u0130sim-alan e\u015fle\u015ftirmesi do\u011frudan sorulur; Farabi t\u0131p\u00e7\u0131 de\u011fildir.',
        '**T\u00fcrk-\u0130slam mimarisinde** kervansaray, k\u00fclliye, ta\u00e7kap\u0131, \u00e7ini ve \u00e7ift minare \u00f6ne \u00e7\u0131kar.',
        '**Sel\u00e7uklularda T\u00fcrk\u00e7e resm\u00ee dil de\u011fildir.** T\u00fcrk\u00e7eyi resm\u00ee dil yapan tek devlet Karahanl\u0131lar\'d\u0131r.',
        '**Atabeyler merkez\u00ee otorite zay\u0131flay\u0131nca ba\u011f\u0131ms\u0131zla\u015fm\u0131\u015ft\u0131r**; bu, B\u00fcy\u00fck Sel\u00e7uklu\'nun da\u011f\u0131lma sebeplerinden biridir.'
      ]},
      { t:'test', s:[
        { q:'Sel\u00e7uklularda topra\u011f\u0131n gelirinin hizmet kar\u015f\u0131l\u0131\u011f\u0131nda g\u00f6revlilere verilmesi esas\u0131na dayanan ve Osmanl\u0131 t\u0131mar sisteminin temelini olu\u015fturan uygulama hangisidir?',
          c:['Vak\u0131f','\u0130kta','M\u00fclk','\u00d6\u015f\u00fcr'], d:1,
          a:'\u0130kta sisteminde topra\u011f\u0131n m\u00fclkiyeti devlette kal\u0131r, gelirinin bir k\u0131sm\u0131 hizmet kar\u015f\u0131l\u0131\u011f\u0131 g\u00f6revliye b\u0131rak\u0131l\u0131r.' },
        { q:'A\u015fa\u011f\u0131da verilen T\u00fcrk-\u0130slam bilginlerinden hangisinin \u00e7al\u0131\u015ft\u0131\u011f\u0131 alan **yanl\u0131\u015f** verilmi\u015ftir?',
          c:['\u0130bn-i Sina \u2013 T\u0131p','Biruni \u2013 Astronomi','Farabi \u2013 T\u0131p','Harezmi \u2013 Matematik'], d:2,
          a:'Farabi felsefe ve mant\u0131k alan\u0131nda \u00e7al\u0131\u015fm\u0131\u015f, "Muallim-i Sani" olarak an\u0131lm\u0131\u015ft\u0131r. T\u0131p alan\u0131n\u0131n \u00f6nde gelen ismi \u0130bn-i Sina\'d\u0131r.' },
        { q:'*El-Kanun fi\'t-T\u0131b* adl\u0131 eseriyle Avrupa \u00fcniversitelerinde y\u00fczy\u0131llarca ders kitab\u0131 olarak okutulan T\u00fcrk-\u0130slam bilgini kimdir?',
          c:['Farabi','Biruni','\u0130bn-i Sina','Gazali'], d:2,
          a:'\u0130bn-i Sina\'n\u0131n t\u0131p ansiklopedisi niteli\u011findeki bu eseri, Bat\u0131\'da Avicenna ad\u0131yla uzun s\u00fcre temel kaynak olarak kullan\u0131lm\u0131\u015ft\u0131r.' },
        { q:'\u0130kta sisteminin Avrupa\'daki feodalite d\u00fczeninden en \u00f6nemli fark\u0131 a\u015fa\u011f\u0131dakilerden hangisidir?',
          c:['\u0130kta sahibinin asker beslememesi','Topra\u011f\u0131n m\u00fclkiyetinin devlette kalmas\u0131','\u0130ktan\u0131n yaln\u0131z \u015fehirlerde uygulanmas\u0131','\u0130kta sahibinin vergi vermemesi'],
          d:1, a:'\u0130ktada topra\u011f\u0131n m\u00fclkiyeti devletindir ve g\u00f6revliye yaln\u0131z gelirin kullan\u0131m hakk\u0131 verilir; feodalitede ise toprak derebeyinin m\u00fclk\u00fcd\u00fcr.' },
        { q:'\u015eehzadelerin e\u011fitiminden sorumlu olan ve merkez\u00ee otorite zay\u0131flay\u0131nca ba\u011f\u0131ms\u0131z beylikler kuran g\u00f6revlilere ne ad verilir?',
          c:['Atabey','S\u00fcba\u015f\u0131','Muhtesip','\u015e\u0131hne'], d:0,
          a:'Atabeyler \u015fehzadelerin e\u011fitiminden sorumluydu; merkez\u00ee otoritenin zay\u0131flamas\u0131yla bulunduklar\u0131 b\u00f6lgelerde ba\u011f\u0131ms\u0131z beylikler kurdular.' },
        { q:'Celali Takvimi\'ni haz\u0131rlayan T\u00fcrk-\u0130slam bilgini kimdir?',
          c:['Ulu\u011f Bey','\u00d6mer Hayyam','Biruni','Ali Ku\u015f\u00e7u'], d:1,
          a:'\u00d6mer Hayyam, Melik\u015fah d\u00f6neminde bir heyetle birlikte g\u00fcne\u015f y\u0131l\u0131 esasl\u0131 Celali Takvimi\'ni haz\u0131rlam\u0131\u015ft\u0131r.' },
        { q:'Anadolu\'da esnaf ve sanatk\u00e2rlar\u0131 \u00f6rg\u00fctleyen, kurucusu Ahi Evran olan te\u015fkilat hangisidir?',
          c:['Lonca','Ahilik','Vak\u0131f','F\u00fct\u00fcvvet'], d:1,
          a:'Ahilik, Ahi Evran taraf\u0131ndan kurulan ve esnaf\u0131 hem meslek\u00ee hem ahlaki a\u00e7\u0131dan d\u00fczenleyen te\u015fkilatt\u0131r.' },
        { q:'B\u00fcy\u00fck Sel\u00e7uklu Devleti\'nde saray i\u00e7in yeti\u015ftirilen ve Osmanl\u0131 dev\u015firme sisteminin \u00f6nc\u00fcs\u00fc say\u0131lan uygulama hangisidir?',
          c:['\u0130kta','Gulam','Atabeylik','Ahilik'], d:1,
          a:'Gulam sisteminde saray i\u00e7in asker ve y\u00f6netici yeti\u015ftirilirdi; Osmanl\u0131\'daki dev\u015firme ve Enderun bunun devam\u0131 say\u0131l\u0131r.' },
        { q:'Nizamiye Medreseleri ile ilgili a\u015fa\u011f\u0131dakilerden hangisi **yanl\u0131\u015ft\u0131r**?',
          c:['Nizam\u00fclm\u00fclk taraf\u0131ndan kurulmu\u015ftur.','\u0130slam d\u00fcnyas\u0131n\u0131n ilk d\u00fczenli medreseleridir.','\u00d6\u011frencilere burs verilmi\u015ftir.','Yaln\u0131z asker\u00ee e\u011fitim verilmi\u015ftir.'],
          d:3, a:'Nizamiye Medreseleri\'nde din\u00ee ilimlerin yan\u0131 s\u0131ra matematik, astronomi ve felsefe okutulmu\u015f; \u00f6\u011frencilere burs ve bar\u0131nma sa\u011flanm\u0131\u015ft\u0131r.' },
        { q:'Kervan yollar\u0131 \u00fczerinde kurulan, t\u00fcccarlar\u0131n g\u00fcvenle konaklad\u0131\u011f\u0131 ve kervansaraylar\u0131n \u00f6nc\u00fcs\u00fc say\u0131lan yap\u0131lara ne ad verilir?',
          c:['Ribat','K\u00fclliye','\u0130maret','Bedesten'], d:0,
          a:'Ribatlar s\u0131n\u0131r boylar\u0131nda ve kervan yollar\u0131nda kurulan korunakl\u0131 yap\u0131lard\u0131r; kervansaraylar\u0131n \u00f6nc\u00fcs\u00fcd\u00fcr.' },
        { q:'"Algoritma" kavram\u0131n\u0131n ad\u0131ndan t\u00fcredi\u011fi, cebirin kurucusu say\u0131lan bilgin kimdir?',
          c:['Biruni','Harezmi','Farabi','Gazali'], d:1,
          a:'Harezmi, cebir alan\u0131ndaki \u00e7al\u0131\u015fmalar\u0131yla tan\u0131n\u0131r ve "algoritma" s\u00f6zc\u00fc\u011f\u00fc onun ad\u0131ndan t\u00fcremi\u015ftir.' },
        { q:'B\u00fcy\u00fck Sel\u00e7uklu Devleti\'nde maliye i\u015flerinden sorumlu divan a\u015fa\u011f\u0131dakilerden hangisidir?',
          c:['Divan-\u0131 \u0130n\u015fa','Divan-\u0131 \u0130stifa','Divan-\u0131 Arz','Divan-\u0131 \u0130\u015fraf'], d:1,

      { t:'kod', b:'Haf\u0131za kodu', x:'**Malazgirt a\u00e7t\u0131 (1071), Miryokefalon kilitledi (1176), K\u00f6seda\u011f da\u011f\u0131tt\u0131 (1243).** \u00dc\u00e7 tarih Anadolu\'nun kaderini \u00f6zetler. Beyliklerde ilk akla gelmesi gereken: **Karesi = Osmanl\u0131\'ya kat\u0131lan ilk**, **Karaman = T\u00fcrk\u00e7e resm\u00ee dil**, **\u00c7aka = ilk donanma**.' },
      { t:'tuzak', i:[
        '**Malazgirt Anadolu\'nun kap\u0131s\u0131n\u0131 a\u00e7t\u0131, Miryokefalon kapatt\u0131.** "Anadolu kesin T\u00fcrk yurdu oldu" ifadesi **Miryokefalon** i\u00e7indir.',

        '**Anadolu Sel\u00e7uklu\'da devlet sigortas\u0131 uygulamas\u0131** vard\u0131r \u2014 \u00e7\u0131km\u0131\u015f sorularda "ticareti geli\u015ftirmek i\u00e7in ne yap\u0131ld\u0131" bi\u00e7iminde sorulur.'

      { t:'test', s:[

          a:'1176 Miryokefalon Sava\u015f\u0131\'ndan sonra Bizans\'\u0131n Anadolu\'yu geri alma umudu bitmi\u015ftir. Malazgirt (1071) ise Anadolu\'nun kap\u0131lar\u0131n\u0131 a\u00e7an sava\u015ft\u0131r.' },
        { q:'A\u015fa\u011f\u0131da verilen T\u00fcrk beylikleri ile ba\u015fkentleri aras\u0131nda yap\u0131lan e\u015fle\u015ftirmelerden hangisi **yanl\u0131\u015ft\u0131r**?',

        { q:'Osmanl\u0131 Devleti\'ne kat\u0131lan ilk T\u00fcrk beyli\u011fi hangisidir ve bu kat\u0131l\u0131m hangi bak\u0131mdan \u00f6nemlidir?',

          d:1, a:'Karesio\u011fullar\u0131 Osmanl\u0131\'ya kat\u0131lan ilk beyliktir; donanmas\u0131 sayesinde Osmanl\u0131 denizcili\u011fe ba\u015flam\u0131\u015f ve Rumeli\'ye ge\u00e7i\u015f kolayla\u015fm\u0131\u015ft\u0131r.' },

          d:1, a:'1243 K\u00f6seda\u011f Sava\u015f\u0131 sonras\u0131nda T\u00fcrkiye Sel\u00e7uklu Devleti Mo\u011fol egemenli\u011fine girmi\u015f ve Anadolu\'da beylikler d\u00f6nemi ba\u015flam\u0131\u015ft\u0131r.' },
        { q:'T\u00fcrkiye Sel\u00e7uklu Devleti\'nin en parlak d\u00f6nemini ya\u015fad\u0131\u011f\u0131, Alanya\'n\u0131n al\u0131nd\u0131\u011f\u0131 ve tersane kuruldu\u011fu h\u00fck\u00fcmdar d\u00f6nemi hangisidir?',
          c:['I. K\u0131l\u0131\u00e7arslan','II. K\u0131l\u0131\u00e7arslan','I. Alaeddin Keykubat','II. G\u0131yaseddin Keyh\u00fcsrev'],
          d:2, a:'I. Alaeddin Keykubat d\u00f6neminde Alanya al\u0131nm\u0131\u015f, tersane kurulmu\u015f, Su\u011fdak Seferi yap\u0131lm\u0131\u015f ve Yass\u0131\u00e7emen Sava\u015f\u0131 kazan\u0131lm\u0131\u015ft\u0131r.' },
        { q:'Anadolu\'da kurulan ilk T\u00fcrk beyli\u011fi a\u015fa\u011f\u0131dakilerden hangisidir?',
          c:['Dani\u015fmentliler','Saltuklular','Artuklular','Meng\u00fccekliler'], d:1,
